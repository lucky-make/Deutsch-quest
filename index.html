<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeutschQuest — Staffel 1: Ein Jahr in Köln</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b24; --panel2:#1d2430; --ink:#e9ecf2; --mut:#98a2b3;
    --gold:#ffce00; --red:#e0433e; --green:#59d07b; --blue:#5aa7ff;
    --rad:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{max-width:760px; margin:0 auto; padding:14px 14px 60px;}
  header.top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 2px 12px;}
  .logo{font-weight:800; font-size:20px; letter-spacing:.3px;}
  .logo b{color:var(--gold)} .logo i{color:var(--red); font-style:normal}
  .chip{background:var(--panel2); border:1px solid #2a3342; border-radius:999px; padding:3px 10px; font-size:13px; color:var(--mut)}
  .chip b{color:var(--ink)}
  .spacer{flex:1}
  .panel{background:var(--panel); border:1px solid #232c3a; border-radius:var(--rad); padding:18px;}
  .panel + .panel{margin-top:14px}
  h1{font-size:22px; margin:0 0 6px} h2{font-size:18px; margin:0 0 10px}
  .mut{color:var(--mut)} .small{font-size:13px}
  button{font:inherit; color:var(--ink); background:var(--panel2); border:1px solid #2c3648;
    border-radius:12px; padding:12px 16px; cursor:pointer; touch-action:manipulation;}
  button:active{transform:scale(.98)}
  button.primary{background:linear-gradient(180deg,#ffd83d,#f5b800); color:#20180a; border:none; font-weight:700;}
  button.big{width:100%; font-size:17px; padding:15px;}
  button.ghost{background:transparent}
  button.opt{display:block; width:100%; text-align:left; margin:8px 0; padding:13px 14px;}
  button.opt .k{color:var(--mut); font-size:12px; margin-right:8px; border:1px solid #33405a; border-radius:6px; padding:0 6px;}
  button.opt.correct{border-color:var(--green); background:#17301f}
  button.opt.wrong{border-color:var(--red); background:#33191a}
  .row{display:flex; gap:10px; flex-wrap:wrap} .row>*{flex:1; min-width:140px}
  .de{font-size:26px; font-weight:800; margin:6px 0;}
  .en{color:var(--mut); font-size:17px;}
  input[type=text]{font:inherit; width:100%; padding:13px; border-radius:12px; border:1px solid #2c3648; background:#0b0e13; color:var(--ink);}
  .pbar{height:8px; background:#232c3a; border-radius:99px; overflow:hidden; margin:8px 0 14px;}
  .pbar>div{height:100%; background:linear-gradient(90deg,var(--gold),#ff9d00); width:0%; transition:width .3s;}
  .pips{letter-spacing:2px; color:var(--gold); font-size:12px}
  .fogbadge{display:inline-block; background:#20304a; color:#bcd6ff; border-radius:8px; padding:2px 8px; font-size:12px; margin-left:6px;}
  .revbadge{display:inline-block; background:#3a2430; color:#ffb3d1; border-radius:8px; padding:2px 8px; font-size:12px; margin-left:6px;}
  .tag{display:inline-block; background:#242e3e; color:var(--mut); border-radius:8px; padding:2px 8px; font-size:12px; margin-right:6px;}
  .verdict{font-size:20px; font-weight:800; margin-bottom:6px}
  .verdict.good{color:var(--green)} .verdict.bad{color:var(--red)} .verdict.meh{color:var(--gold)}
  .tiles{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; min-height:52px; padding:10px; background:#0b0e13; border:1px dashed #2c3648; border-radius:12px;}
  .tiles button{padding:9px 12px; font-size:17px;}
  .tilebank{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
  .tilebank button{padding:9px 12px; font-size:17px; background:#20293a;}
  .timerbar{height:6px; background:#232c3a; border-radius:99px; overflow:hidden; margin:10px 0;}
  .timerbar>div{height:100%; background:var(--blue); width:100%;}
  .xpfloat{position:fixed; left:50%; top:38%; transform:translateX(-50%); font-size:34px; font-weight:900; color:var(--gold);
    pointer-events:none; animation:rise 1.1s ease-out forwards; text-shadow:0 2px 12px #000;}
  @keyframes rise{from{opacity:0; transform:translate(-50%,10px)} 20%{opacity:1} to{opacity:0; transform:translate(-50%,-70px)}}
  .confetti{position:fixed; top:-20px; font-size:20px; pointer-events:none; animation:fall 1.4s linear forwards; z-index:50;}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg); opacity:.9}}
  .lawlist li{margin:10px 0;}
  .deckrow{display:flex; gap:8px; align-items:baseline; padding:7px 4px; border-bottom:1px solid #1f2734; flex-wrap:wrap;}
  .deckrow .d{font-weight:700} .deckrow .e{color:var(--mut); font-size:14px; flex:1}
  .due{color:var(--green); font-size:12px; white-space:nowrap}
  .bars div{display:flex; align-items:center; gap:8px; margin:4px 0; font-size:13px;}
  .bars .b{height:10px; background:var(--gold); border-radius:4px; min-width:2px;}
  kbd{background:#232c3a; border:1px solid #33405a; border-radius:5px; padding:0 5px; font-size:12px;}
  .imgcard{display:flex; justify-content:center; margin:10px 0}
  .imgcard svg{width:150px; height:150px; background:#0b0e13; border-radius:16px; border:1px solid #232c3a; padding:8px}
  .imgcard.small svg{width:84px; height:84px}
  .epnum{display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:34px; border-radius:10px;
    background:var(--gold); color:#20180a; font-weight:900; font-size:17px; margin-right:10px;}
  .eprow{display:flex; align-items:center; gap:10px; padding:9px 6px; border-bottom:1px solid #1f2734; cursor:pointer; border-radius:8px;}
  .eprow:hover{background:#1a212c}
  .eprow.locked{opacity:.45; cursor:default}
  .eprow .st{width:26px; text-align:center}
  .story{font-size:16px; line-height:1.65; background:#10151d; border-left:4px solid var(--gold); border-radius:0 10px 10px 0; padding:14px 16px; margin:12px 0;}
  .lvlchip{background:#24304a; color:#bcd6ff; border-radius:8px; padding:1px 8px; font-size:12px; font-weight:700;}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none}
  button:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .session-progress{margin-bottom:12px}
  .exercise-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .instructions{margin:14px 0 18px;padding:14px 0;border-top:1px solid #2a3342;border-bottom:1px solid #2a3342}
  .instructions p{margin:0 0 8px}
  .instruction-en,.instruction-de{font-size:16px;font-weight:600;line-height:1.55}
  .instruction-de.secondary{color:var(--mut);font-size:14px;font-weight:400}
  .instruction-hint{color:#bcd6ff}
  .command-bridge{margin:10px 0;color:var(--mut)}
  .command-bridge b{color:#bcd6ff;font-weight:600}
  .english-help{margin-top:12px}
  .english-help summary{width:fit-content;max-width:100%;padding:10px 12px;border:1px solid #334564;border-radius:10px;background:#1c293c;color:#c7dfff;font-size:14px;cursor:pointer}
  .english-help[open] summary{border-color:var(--blue)}
  .help-copy{background:#101925;border-radius:10px;padding:14px;margin-top:8px;font-size:14px;line-height:1.6}
  .help-copy p:last-child{margin-bottom:0}
  .reference{margin:12px 0;font-size:14px}
  .reference summary{cursor:pointer;color:#bcd6ff;padding:6px 0}
  .reference>div{padding:8px 0;line-height:1.6}
  .answer-field{margin:16px 0 12px}
  .answer-field label{display:block;margin-bottom:6px}
  textarea{display:block;font:inherit;width:100%;min-height:112px;resize:vertical;padding:13px;border-radius:12px;border:1px solid #2c3648;background:#0b0e13;color:var(--ink)}
  .error-message{color:#ffa9a5;margin-top:6px}
  .task-cue{color:var(--ink);font-size:20px;margin-bottom:12px}
  .production-situation{border-left:3px solid var(--blue);background:#111d2b;border-radius:0 10px 10px 0;padding:14px 16px;margin:12px 0}
  .production-situation p{font-size:18px;line-height:1.6;margin:6px 0 0}
  .cue-toggle{padding:8px 10px;min-height:40px;color:#bcd6ff}
  .production-goals{margin:18px 0 12px;padding:12px;border:1px solid #334564;border-radius:12px}
  .production-goals legend{font-size:14px;padding:0 6px;color:#bcd6ff}
  .production-goals label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px;cursor:pointer}
  .production-goals input{flex:0 0 auto;width:20px;height:20px;margin:1px 0;accent-color:var(--gold)}
  .model-answer,.user-response{overflow-wrap:anywhere}
  .scaffold-panel h2{margin-top:6px}
  .scaffold-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
  .scaffold-step{padding:12px 10px;border:1px solid #2a3342;border-radius:10px;color:var(--mut);background:#111720}
  .scaffold-step b{display:block;margin-bottom:5px;color:var(--ink)}
  .scaffold-step.active{border-color:var(--gold);background:#282518;color:#e4dbba}
  .scaffold-step.active b{color:var(--gold)}
  .button-note{display:block;font-size:12px;color:var(--mut);margin-top:4px;font-weight:400}
  .command-glossary{margin:18px 0}
  .command-glossary>div{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid #2a3342;padding:11px 0}
  .command-glossary dt{font-weight:650;min-width:145px}
  .command-glossary dd{flex:1;min-width:115px;margin:0;color:var(--mut)}
  @media(max-width:520px){
    .scaffold-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .exercise-meta{align-items:flex-start}
    .production-situation{padding:12px}
    .command-glossary dt{min-width:120px}
  }
</style>
</head>
<body>
<div id="app"></div>

/* ------------------------------ EPISODES (the running narrative) ------------------------------ */
const EPS = [
 {n:1, title:"Ankunft", lvl:"A1",
  intro:`22:47, Köln Hauptbahnhof. Rain, one suitcase, zero German. The info desk speaks fast — too fast — but a woman behind you slows down: "Willkommen in Köln!" Your first year starts right now, with your first five sentences.`,
  outro:`First words survived, tram stop found. In the tram, an older woman with a knitting bag smiles: "Sie sind wohl neu hier? Ich bin Frau Schneider." She presses a little key chain into your hand — "Fürs Glück." Tomorrow: the paperwork.`},
 {n:2, title:"Die Anmeldung", lvl:"A1",
  intro:`Bürgeramt, Wartenummer 47 — you are 48. Behind the glass: Herr Weber, speaking beamterliches Deutsch. "Vorname? Nachname? Geburtsdatum?" The Anmeldung is the key to everything: bank, job, phone contract. Forms don't scare you. Much.`,
  outro:`Stamp. Done. "Anmeldebescheinigung," says Herr Weber, almost smiling. Your first official German document lands in your bag. But in the hallway Frau Schneider catches you with a worried face: "Haben Sie Ihre Küche schon gesehen? Kommen Sie schnell!"`},
 {n:3, title:"Brot & Pfand", lvl:"A1",
  intro:`The kitchen is empty except a humming fridge. "Eine Küche ohne Brot ist nur ein Raum," says Frau Schneider and hands you a jute bag: supermarket Chlodwigplatz. Pfand bottles, "Ich hätte gern …", and prices ending in ,99. Survival shopping begins.`,
  outro:`17,48 € at the checkout, paid in coins like a pro, "Ich hätte gern" three times without trembling. Deniz, the cashier with the band shirt, switches to German for you: "Bis morgen, Nachbar!" Then he points at your empty fridge — and at the flat ad on the notice board.`},
 {n:4, title:"Die Wohnung", lvl:"A1",
  intro:`The ad says "2 Zimmer, Altbau, 650 € warm". Besichtigung today. Frau Schneider coaches you on the stairs: "Sag die Miete, nicht der Miet!" At the door: Herr Krüger with a folder — and fourteen other applicants behind you.`,
  outro:`Two days later, an envelope: "Hiermit möchten wir Ihnen die Wohnung anbieten." Keys in your hand, Frau Schneider arrives with cake: "Einweihungsparty! Bring Freunde mit!" Friends? You've been here six weeks …`},
 {n:5, title:"Fieber", lvl:"A2",
  intro:`The Einweihungsparty was last night — this morning your head pounds and your throat burns. 38,9 °C. On the phone, the practice of Dr. Klein: "Sprechstunde ist um acht." You must describe your body in German. Deep breath.`,
  outro:`"Virus," says Dr. Klein, "Bettruhe, viel trinken." Prescription in hand, pharmacy next door — the pharmacist packs you a care package like a grandma. Deniz writes: "Krank? Ich bringe Suppe und die Notizen aus dem Sprachkurs." Maybe you do have friends here now.`},
 {n:6, title:"Der Job", lvl:"A2",
  intro:`Deniz's "notes" turn out to be a job ad: logistics, part-time, compatible with your Sprachkurs. "Bewirb dich!" Now you sit before the laptop: a Lebenslauf, in German. How was "I have been working since 2023" again?`,
  outro:`"Sie haben die Stelle!" Friday, 10:00, the handshake still warm on your hand. The boss adds: "Montag geht's los." On the tram home you notice you're rehearsing small talk with colleagues — in German. Without translating first.`},
 {n:7, title:"Bahnsteig 3", lvl:"A2",
  intro:`Monday, 7:12, KVB-Chaos: Stellwerkstörung Ebertplatz. Your first workday, and the tram sits like a brick. The platform announcement mumbles "Schienenersatzverkehr". Understand this — or learn to ask faster than the train leaves.`,
  outro:`8:02, breathless, at the hall gate — the boss just nods: "Passiert." Deniz grins and hands you a Kaffee: "Willkommen in der deutschen Pünktlichkeit." After work you buy a ticket without asking anyone. Small victories.`},
 {n:8, title:"Briefe & Fristen", lvl:"B1",
  intro:`First salary! And with it, a stack of letters: Rundfunkbeitrag, a Steuererklärung reminder, bank form: "Bitte überweisen Sie den Betrag bis zum 15." German bureaucracy writes its own language. Time to learn to read it.`,
  outro:`Account standing, Dauerauftrag set, Frist kept — Herr Weber would be proud. You file the Bescheid in your "important" folder (a shoebox, but still). On top of it: a letter from the Sprachkurs. "Ihre Ergebnisse: bestanden. Niveau B1 beginnt."`},
 {n:9, title:"Die Party", lvl:"B1",
  intro:`B1! To celebrate, Miriam from the Sprachkurs invites you: Saturday, birthday, "bring nichts außer dir selbst". But German party culture has rules: arrive on time? Gifts? Small talk with strangers? You make a plan — and a list of questions.`,
  outro:`The party was great — you talked with Miriam's grandma for an hour. About cake. And weather. Sunday morning, a message from Deniz: "Hey, ernstes Thema. Können wir reden?" His voice sounds different than usual …`},
 {n:10, title:"Notfall", lvl:"B1",
  intro:`Deniz's serious topic: his mother is in hospital in Ankara, he must fly — today. And then: your phone is gone. Stolen or lost, with all numbers, 2FA, passwords. Crisis mode: report, block, reset — in German, right now.`,
  outro:`SIM blocked, Anzeige filed, passwords reset, Deniz at the gate with your borrowed power bank: "Danke, dass du da warst." On the way home it pours — and for the first time you laugh about it. An umbrella? You own one now. A year ago you couldn't even say "Regenschirm".`},
 {n:11, title:"Meinung & Medien", lvl:"B2",
  intro:`Autumn. In the B1+ course a debate starts: news, comments, "Hast du das gelesen?" Miriam shares an article — half plausible, half strange. Time to learn how Germans argue: opinion, doubt, contradiction — politely, but clearly.`,
  outro:`Your forum comment — three paragraphs, Konjunktiv I included — gets 14 likes and one reply: "Sehr gut formuliert!" from the course teacher. You screenshot it and send it home with the caption: "Dein Kind kann jetzt streiten. Auf Deutsch."`},
 {n:12, title:"Bleibst du?", lvl:"B2",
  intro:`One year since Köln Hbf. On the table: a contract extension, an info evening for the "Leben in Deutschland" test — and Frau Schneider's question over cake: "Bleibst du eigentlich?" You notice: you no longer translate the answer in your head.`,
  outro:`You stay. Contract signed, test registered, and on the fridge a photo strip: tram chaos, cake crumbs, get-well cards, party photos. From the person who arrived at 22:47 with zero German — to the person who now tells this story in German. STAFFEL 1 — ENDE. (Your cards keep coming back, promised. Memory loves company.)`}
];

function freshState(){
  return {xp:0, sound:true, speech:true, streak:{last:"",count:0}, items:{}, prog:{ep:1,done:{}},

function restoreProgress(raw){
  if(!raw || typeof raw!=="object" || Array.isArray(raw)) throw new Error("Invalid progress");
  const state=freshState();
  const number=(value,fallback=0)=>typeof value==="number"&&Number.isFinite(value)&&value>=0?value:fallback;
  state.xp=number(raw.xp);
  for(const key of ["sound","speech"]) if(typeof raw[key]==="boolean") state[key]=raw[key];
  state.prog.ep=Math.min(EPS.length,Math.max(1,Math.floor(number(raw.prog&&raw.prog.ep,1))));
  for(const [ep,score] of Object.entries(raw.prog&&raw.prog.done||{})){
    if(EPS.some(e=>String(e.n)===ep)&&typeof score==="number"&&Number.isFinite(score)) state.prog.done[ep]=Math.max(0,Math.min(100,score));
  }
  if(raw.streak){
    state.streak.last=typeof raw.streak.last==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(raw.streak.last)?raw.streak.last:"";
    state.streak.count=number(raw.streak.count);
  }
  for(const key of Object.keys(state.stats)) state.stats[key]=number(raw.stats&&raw.stats[key]);
  for(const [id,it] of Object.entries(raw.items||{})){
    if(!it||typeof it!=="object"||["__proto__","constructor","prototype"].includes(id)) continue;
    state.items[id]={box:Math.min(6,Math.floor(number(it.box))),due:number(it.due),reps:number(it.reps),lapses:number(it.lapses),last:number(it.last)};
  }
  return state;
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){ return String(s).toLowerCase().replace(/\(.*?\)/g," ").replace(/[…]/g," ")
  .replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
  .replace(/[.!?,;:]+$/,"").replace(/\s+/g," ").trim(); }
function acceptSet(card){ const set=new Set([norm(card.de)]);
  const m=norm(card.de).match(/^(der|die|das)\s+(.+)$/); if(m) set.add(m[2]); return set; }
function fmtDue(ts){ const d=ts-Date.now(); if(d<=0) return ui("due now","jetzt fällig");
  const min=Math.round(d/60000); if(min<60) return "in "+min+" min";
  const h=Math.round(min/60); if(h<24) return "in "+h+ui(" h"," Std."); return "in "+Math.round(h/24)+ui(" d"," Tagen"); }
function rankOf(xp){ let r=RANKS[0]; for(const t of RANKS) if(xp>=t[0]) r=t; return r; }
function nextRank(xp){ for(const t of RANKS) if(xp<t[0]) return t; return null; }
function epOf(n){ return EPS.find(e=>e.n===n); }
function unlocked(n){ return n<=S.prog.ep; }

/* The episode being played determines scaffolding. Mixed review uses learner progress,

function cefrLevel(ep){
  if(ep==null && G && G.level) return G.level;
  return (epOf(ep==null?S.prog.ep:ep)||EPS[0]).lvl;

function commandAccepts(card,text){ return [card.en].concat(card.aliases).some(answer=>normProduction(answer)===normProduction(text)); }
function normProduction(text){
  // Ignore typography, not meaning or word order. No fuzzy substring/keyword passes.
  return String(text).normalize("NFC").toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/[.,!?;:…„“”"'’«»()/]/g," ").replace(/\s+/g," ").trim();
}

function tone(f,t0,dur,type,g){ const c=ac(); if(!c)return; type=type||"sine"; g=g||0.14;
  const o=c.createOscillator(), ga=c.createGain(); o.type=type; o.frequency.value=f;
  ga.gain.setValueAtTime(g,c.currentTime+t0); ga.gain.exponentialRampToValueAtTime(0.001,c.currentTime+t0+dur);
  o.connect(ga); ga.connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.03); }
function sfxGood(){ tone(660,0,.12); tone(880,.1,.2); }

let deVoice=null;
function pickVoice(){ if(!("speechSynthesis" in window)) return;
  const vs=window.speechSynthesis.getVoices()||[]; deVoice=vs.find(v=>/^de([-_]|$)/i.test(v.lang))||null; }
if("speechSynthesis" in window){ pickVoice(); window.speechSynthesis.onvoiceschanged=pickVoice; }

/* ------------------------------ SCHEDULER (laws 1+2) ------------------------------ */
function itemOf(id){ return S.items[id]||null; }
function fogOf(id){ const it=itemOf(id); if(!it) return null;
  const iv=BOX_MIN[it.box]*60000||600000; return (Date.now()-it.last)/iv; }
function gradeCard(id,g){ const it=S.items[id]||(S.items[id]={box:0,due:0,reps:0,lapses:0,last:0});
  it.reps++; it.last=Date.now();
  if(g<=1){ it.lapses++; it.box=0; it.due=Date.now()+45000; return true; }
  it.box=Math.min(6,it.box+1); it.due=Date.now()+BOX_MIN[it.box]*60000; return false; }
function dueList(){ const now=Date.now(); return CARDS.filter(c=>{ const it=itemOf(c.id); return it&&it.due<=now; }); }

/* ------------------------------ SESSION BUILDER (laws 2+3 + cross-episode review) ------------------------------ */
function reviewPool(n,excludeEp,excludeIds=[]){
  const now=Date.now(), excluded=new Set(excludeIds);
  const pool=CARDS.filter(c=>{ const it=itemOf(c.id);
    return it && it.due<=now && !excluded.has(c.id) && (excludeEp==null || c.ep!==excludeEp); });
  pool.sort((a,b)=>{ const ia=itemOf(a.id), ib=itemOf(b.id);
    return (ib.lapses-ia.lapses)||(ia.due-ib.due); });
  return pool.slice(0,n).map(c=>c.id);
}
function interleaveKinds(ids){ const pool=shuffle(ids), out=[];
  while(pool.length){ let i=pool.findIndex(id=>!out.length||MAP[id].kind!==MAP[out[out.length-1]].kind);
    if(i<0)i=0; out.push(pool.splice(i,1)[0]); } return out; }
function practiceOrder(cards){
  const priority=c=>{ const it=itemOf(c.id);
    if(it&&it.due<=Date.now()&&it.lapses) return 4000+Math.min(it.lapses,100);
    if(!it) return 3000;
    if(it.due<=Date.now()) return 2000+(6-it.box)*10;
    return 1000+(6-it.box)*10;
  };
  return shuffle(cards).sort((a,b)=>priority(b)-priority(a));
}
function buildCommandQueue(n=6,lesson=false){
  const pool=COMMANDS.filter(c=>{const it=itemOf(c.id); return !lesson||!it||it.box<3||it.due<=Date.now();});
  return practiceOrder(pool).slice(0,n).map(c=>c.id);
}
function buildProductionQueue(){ return practiceOrder(PRODUCTION.filter(c=>unlocked(c.ep))).slice(0,8).map(c=>c.id); }
function buildEpisodeQueue(ep){
  const level=cefrLevel(ep);
  // Reserve production slots before sampling regular cards: they cannot disappear
  // due to random mini-game selection or a large review backlog.
  const production=practiceOrder(PRODUCTION.filter(c=>c.ep===ep)).slice(0,PRODUCTION_QUOTA[level]).map(c=>c.id);
  const commands=buildCommandQueue(level==="A1"?2:level==="A2"?1:0,true);
  const reserved=production.concat(commands);
  const rev=reviewPool(4,ep,reserved);
  const fill=practiceOrder(DECK.filter(c=>c.ep===ep)).map(c=>c.id);
  let ids=reserved.concat(rev,fill.slice(0,12-reserved.length-rev.length));
  if(ids.length<12){ const extra=dueList().filter(c=>!ids.includes(c.id)).slice(0,12-ids.length).map(c=>c.id); ids=ids.concat(extra); }
  return {ids:interleaveKinds(ids),nRev:rev.length,reviewIds:rev,nProduction:production.length,nCommands:commands.length};
}
function buildReviewQueue(){ return interleaveKinds(reviewPool(12,null)); }
function buildProfQueue(){
  return practiceOrder(DECK.filter(c=>c.kind==="grammar"&&unlocked(c.ep))).slice(0,8).map(c=>c.id);
}
function mgOptions(card){
  switch(card.kind){
    case "production": return ["production"];
    case "command": return ["command"];
    case "word": return (card.img?["recall","img","choice","img"]:["recall","choice","recall"]).concat(voiceOK()?["audio"]:[]);
    case "chunk": return ["recall","builder","choice"];
    case "sentence": return ["builder","recall","builder"];
    case "grammar": return ["teach","choicecorrect","teach"];
    case "error": return ["hunt","hunt","choicecorrect"];
  } return ["choice"];
}

function finish(grade,detailHTML,correctText){

  let base=XP_BASE[c.mg]||10;

  if(c.hinted) base=Math.max(4,base-4);
  const fogBonus=grade>=2&&c.fog!=null&&c.fog>=0.6&&c.fog<=1.3;
  if(grade>=2){ G.combo++; G.best=Math.max(G.best,G.combo); } else G.combo=0;
  const mult=1+Math.min(G.combo,10)*0.1;
  const xp=Math.round(base*mult*(fogBonus?1.5:1));
  if(grade>=2){ G.correct++; if(fogBonus){ G.fogHits++; S.stats.fog++; } }
  G.total++; S.stats.answers++; if(grade>=2) S.stats.correct++;
  if(c.isRev) S.stats.reviews++;
  if(c.mg==="production"){
    G.production++; S.stats.production++;
    if(c.productionMatched){ G.productionMatched++; S.stats.productionMatched++; }
    else if(grade>=2){ G.productionSelfRated++; S.stats.productionSelfRated++; }
  }
  S.xp+=xp; G.xp+=xp; S.stats.bestCombo=Math.max(S.stats.bestCombo,G.best);
  const lapsed=gradeCard(c.id,grade);
  if(lapsed&&(G.repeats[c.id]||0)<2){ G.repeats[c.id]=(G.repeats[c.id]||0)+1; G.queue.push(c.id); }
  save();
  if(grade>=3){ sfxGood(); if(G.combo>=3){ sfxCombo(G.combo); confetti(10+G.combo); } }
  else if(grade===2) sfxGood(); else sfxBad();
  floatXP(xp);
  const it=itemOf(c.id);
  let verdict=grade>=3?["good",ui("🎯 Retrieved it — clean!","🎯 Sicher abgerufen!")]:grade===2?["meh",ui("👍 Got it — keep practising","👍 Geschafft — übe weiter")]:["bad",ui("🧱 More practice — this will come back.","🧱 Weiter üben — diese Karte kommt wieder.")];
  if(c.mg==="production"&&grade>=2) verdict=c.productionMatched
    ?["good",ui("🎯 German response recognised!","🎯 Deutsche Antwort erkannt!")]
    :["meh",ui("👍 Self-assessed: meaning conveyed","👍 Selbsteinschätzung: Ziel erreicht")];
  const answer=correctText||(c.mg==="teach"?c.card.ex:c.card.fix)||c.card.de;
  G.phase="feedback";
  const reference=c.mg==="command"?'<div class="en" lang="en">'+esc(c.card.en)+'</div>':
    englishReference(c.card.en,ui('English meaning / topic','Bedeutung / Thema auf Englisch'));
  app.innerHTML=topbar()+progress()+'<div class="panel feedback-panel" lang="'+ui('en','de')+'">'+
    '<div class="verdict '+verdict[0]+'" role="status">'+verdict[1]+'</div>'+
    (c.mg==="production"?'<div class="small mut">'+ui('One possible answer — not the only valid wording','Ein Antwortbeispiel — andere Formulierungen sind möglich')+'</div>':'')+
    (c.card.img?'<div class="imgcard small">'+svg(c.card.img)+'</div>':'')+
    '<div class="de model-answer" lang="de" style="font-size:22px">'+esc(answer)+'</div>'+reference+(detailHTML||'')+
    englishReference(c.card.note||c.card.why,ui('Explanation in English','Erklärung auf Englisch'))+
    '<div class="small mut" style="margin-top:10px">+'+xp+' XP'+(fogBonus?' · 🌫️ ×1.5':'')+(c.peeked?' · 👀 '+ui('model viewed: half XP','Muster angesehen: halbe XP'):'')+
    ' · '+ui('next review','Nächste Wiederholung')+': <b>'+fmtDue(it.due)+'</b> (Box '+it.box+'/6)</div>'+
    instructionHTML('feedback')+'<button class="primary big" data-act="next" data-key="0">'+ui('Next','Weiter')+' <kbd>↵</kbd></button></div>';
}

  '<li><b>2 · Space it until you almost forget (8:00)</b> — Leitner boxes 0–6 (now → 10 min → 1 d → 3 d → 7 d → 21 d → 60 d) + fog meter: cards at 60–130 % fog queue first and pay ×1.5.</li>'+
  '<li><b>3 · Interleaving (9:03)</b> — Episodes mix vocab, chunks, sentences, grammar and error hunts; kinds and mini-games alternate whenever the queue allows. Fehler-Jagd makes you choose WHICH rule applies first.</li>'+
  '<li><b>4 · Explain with the source closed (10:20)</b> — Professor-Modus: 45 s, out loud, plain language, honest self-rating. Peeking halves XP, because peeking is review, not retrieval.</li>'+
  '<li><b>5 · Build chunks, not facts</b> — Nouns carry their article, phrase frames are whole cards, Satzbau assembles sentences; one episode even teaches why (Ep. 2).</li>'+
  '</ul><h2>The review law (your addition)</h2><ul class="lawlist">'+
  '<li>Every lapse drops to box 0 and re-enters: immediately in the same session (max 2×), then as 🔁 <b>Wiederholung</b> slots inside <i>later episodes</i> (4 slots per session, lapses first), and anytime via the 🔁 Wiederholung mode.</li></ul>'+
  '<h2>Instruction scaffolding → independence</h2><ul class="lawlist"><li>A1: full English + German. A2: short English hint + German. B1: German with optional “What does this mean?”. B2: German by default, with English help only on request. Help explains the task, never the answer, and costs no XP.</li><li>Eleven classroom commands have their own spaced reviews. A1 practises two per lesson; A2 practises one while needed. Choices give way to recall at box 2, with confident commands counted from box 3.</li><li>Free production is guaranteed: A1 1, A2 3, B1 4, B2 5 tasks in a 12-card lesson. English thought cues fade to German situations at B1, with an explicit cue-language switch and a dedicated thought-to-German mode. Curated variants are checked offline; other wording and spoken responses use honest self-assessment, not pretend automatic grading.</li></ul>'+
  '<h2>The narrative</h2><div class="small mut">12 episodes, one year in Köln, A1 → B2, essentials-only (VHS-Lernportal style): Ankunft, Anmeldung, Supermarkt, Wohnung, Fieber, Job, Bahnsteig, Briefe, Party, Notfall, Medien, Bleibst du? Episodes unlock in order; replay anytime.</div>'+
  '<div style="margin-top:12px"><button data-act="go" data-go="home">← back</button></div></div>';
}
function screenDeck(){
  let html=topbar()+'<div class="panel"><h1>Deck ('+CARDS.length+' cards · 12 episodes)</h1>'+
    '<div class="small mut">● = scheduler box (0–6). All content is everyday/essentials German.</div>';
  EPS.forEach(e=>{
    html+='<h2 style="margin-top:14px">Ep. '+e.n+' · '+e.title+' <span class="lvlchip">'+e.lvl+'</span></h2>';
    CARDS.filter(c=>c.ep===e.n&&c.kind!=="command").forEach(c=>{
      const it=itemOf(c.id);
      html+='<div class="deckrow"><span class="pips">'+(it?"●".repeat(it.box)+"○".repeat(6-it.box):"○○○○○○")+'</span>'+
        (c.img?'<span style="width:22px">'+svg(c.img).replace('<svg ','<svg style="width:20px;height:20px;vertical-align:middle" ')+'</span>':'')+
        '<span class="d">'+c.de+'</span><span class="e">'+esc(c.en||c.promptEn||"")+'</span>'+
        '<span class="due">'+(it?fmtDue(it.due):"new")+'</span></div>';
    });
  });
  html+='<p class="small mut">'+COMMANDS.length+' classroom commands have a separate glossary and reviews.</p><button data-act="go" data-go="commands">🧭 German instruction training</button><div style="margin-top:12px"><button data-act="go" data-go="home">← back</button></div></div>';
  app.innerHTML=html;
}
function screenStats(){
  const acc=S.stats.answers?Math.round(100*S.stats.correct/S.stats.answers):0;
  const boxes=[0,1,2,3,4,5,6].map(b=>CARDS.filter(c=>{const it=itemOf(c.id);return it&&it.box===b;}).length);
  const max=Math.max(1,...boxes);
  const days=[0,1,2,3,4,5,6].map(d=>{ const from=Date.now()+d*86400000-86400000, to=Date.now()+(d+1)*86400000-86400000;
    return dueList().filter(c=>{const it=itemOf(c.id); return d===0?true:(it.due>from&&it.due<=to);}).length; });
  const dmax=Math.max(1,...days);
  let eps="";
  EPS.forEach(e=>{ const cards=CARDS.filter(c=>c.ep===e.n&&c.kind!=="command");
    const known=cards.filter(c=>{const it=itemOf(c.id);return it&&it.box>=1;}).length;
    eps+='<div><span style="width:110px">Ep. '+e.n+' '+e.title.slice(0,10)+'</span><div class="b" style="width:'+(known/cards.length*160)+'px"></div><span>'+known+'/'+cards.length+'</span></div>'; });
  app.innerHTML=topbar()+'<div class="panel"><h1>Stats</h1>'+
  '<div class="row"><div class="panel"><b style="font-size:22px">'+S.xp+'</b><div class="small mut">total XP</div></div>'+
  '<div class="panel"><b style="font-size:22px">'+acc+'%</b><div class="small mut">lifetime accuracy</div></div>'+
  '<div class="panel"><b style="font-size:22px">'+S.stats.reviews+'</b><div class="small mut">🔁 reviews answered</div></div>'+
  '<div class="panel"><b style="font-size:22px">'+S.streak.count+'</b><div class="small mut">day streak</div></div></div>'+
  '<h2 style="margin-top:14px">Independent German</h2><p class="small mut">💬 '+S.stats.production+' production attempts · '+S.stats.productionMatched+' known matches · '+S.stats.productionSelfRated+' self-assessed successes. Self-assessment is not automatic grammar or pronunciation grading.</p><p class="small mut">🧭 '+commandMastery()+'/11 classroom commands confident (box ≥ 3).</p>'+
  '<h2 style="margin-top:14px">Episode progress (cards in box ≥ 1)</h2><div class="bars">'+eps+'</div>'+
  '<h2 style="margin-top:14px">Scheduler boxes</h2><div class="bars">'+boxes.map((n,i)=>'<div><span style="width:70px">box '+i+'</span><div class="b" style="width:'+(n/max*180)+'px"></div><span>'+n+'</span></div>').join("")+'</div>'+
  '<h2 style="margin-top:14px">Review forecast (next 7 days)</h2><div class="bars">'+days.map((n,i)=>'<div><span style="width:70px">'+(i===0?"today":"+"+i+"d")+'</span><div class="b" style="width:'+(n/dmax*180)+'px; background:var(--blue)"></div><span>'+n+'</span></div>').join("")+'</div>'+
  '<div class="row" style="margin-top:14px"><button data-act="export">⬇ export progress</button><button data-act="import">⬆ import progress</button></div>'+
  '<div class="row" style="margin-top:10px"><button data-act="reset">🗑 reset everything</button><button data-act="go" data-go="home">← back</button></div>'+
  '<input type="file" id="imp" accept=".json" style="display:none"></div>';
  $("#imp").addEventListener("change",function(ev){
    const f=ev.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=function(){ try{ S=restoreProgress(JSON.parse(r.result)); save(); screenStats(); }catch(e){ alert("Bad file"); } };
    r.readAsText(f); });
}

/* ------------------------------ ACTIONS ------------------------------ */
let resetArmed=false;
app.addEventListener("click",function(e){
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const act=b.dataset.act, c=G?G.cur:null;
  if(act==="go"){
    const screen=({home:screenHome,stats:screenStats,method:screenMethod,deck:screenDeck,commands:screenCommands,production:screenProduction})[b.dataset.go];
    if(screen){stopSession();screen();} return;
  }
  if(act==="quit"){ screenHome(); return; }
  if(act==="ep-intro"){ const n=+b.dataset.ep; if(unlocked(n)&&epOf(n)){stopSession();screenIntro(n);} return; }
  if(act==="ep-start"){ const n=+b.dataset.ep; if(!unlocked(n)||!epOf(n)) return;
    const q=buildEpisodeQueue(n);
    startSession(q.ids,"Ep. "+n+" · "+epOf(n).title,null,{ep:n,reviewIds:q.reviewIds}); return;
  }
  if(act==="play-review"){ const ids=buildReviewQueue();
    if(!ids.length){ alert(ui("Nothing due — your memory is fresh. Come back when the fog rolls in 🌫️","Nichts fällig — dein Wissen ist noch frisch. Komm später wieder 🌫️")); return; }
    startSession(ids,"🔁 Wiederholung",null,{mode:"review"}); return;
  }
  if(act==="play-prof"){ startSession(buildProfQueue(),"🎓 Erklär-Training","teach",{mode:"prof"}); return; }
  if(act==="play-commands"){ startSession(buildCommandQueue(),"🧭 Anweisungs-Training","command",{mode:"commands"}); return; }
  if(act==="play-production"){ startSession(buildProductionQueue(),"💬 Selbst formulieren","production",{mode:"production",englishThought:b.dataset.cue==="en"}); return; }
  if(act==="toggle-sound"){ S.sound=!S.sound; save(); sfxClick(); screenHome(); return; }
  if(act==="toggle-speech"){ S.speech=!S.speech; save(); pickVoice(); screenHome(); return; }
  if(act==="export"){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a"); const url=URL.createObjectURL(blob); a.href=url; a.download="deutschquest-progress.json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000); return;
  }
  if(act==="import"){ $("#imp").click(); return; }
  if(act==="reset"){
    if(!resetArmed){ resetArmed=true; b.textContent="⚠ really? tap again";
      setTimeout(()=>{resetArmed=false; if(document.body.contains(b)) b.textContent="🗑 reset everything";},3000); return; }
    const sound=S.sound,speech=S.speech; S=freshState(); S.sound=sound; S.speech=speech;
    save(); resetArmed=false; screenHome(); return;
  }
  if(!G) return;
  if(act==="next"){ if(G.phase==="feedback"){G.i++;nextCard();} return; }
  if(act==="teach-rate"&&G.phase==="rate"){
    let grade=+b.dataset.g; if(![0,2,3].includes(grade)) return;
    if(c.peeked) grade=Math.min(grade,2);
    finish(grade,'',c.card.ex); return;
  }
  if(act==="production-rate"&&G.phase==="production-review"){
    const grade=+b.dataset.g;
    if(![0,2].includes(grade)) return;
    if(grade===2&&!Array.from(document.querySelectorAll('.production-goal')).every(input=>input.checked)) return;
    finish(grade,c.productionAnswer?typedDetail(c.productionAnswer):'<p class="small mut">'+ui('Spoken response · self-assessed','Gesprochene Antwort · selbst bewertet')+'</p>',c.card.de); return;
  }
  if(G.phase!=="answer") return;
  if(act==="say"){ speak(c.card.de); return; }
  if(act==="check-recall"){ const val=requireAnswer(); if(val!=null) checkTyped(val); return; }
  if(act==="check-recallrev"){
    const val=requireAnswer(); if(val==null) return;
    const typed=norm(val);
    const ok=typed.length>2&&norm(c.card.en).split(/[;,]/).some(v=>{ const words=norm(v).split(' ').filter(w=>w.length>3);
      return words.length&&words.every(w=>typed.includes(w)); });
    finish(ok?3:1,typedDetail(val,'en'),c.card.de); return;
  }
  if(act==="check-production"){ checkProduction(); return; }
  if(act==="production-spoken"){ checkProduction(true); return; }
  if(act==="production-cue"){
    c.englishCue=!c.englishCue;
    const prompt=$("#production-situation"); prompt.textContent=c.englishCue?c.card.promptEn:c.card.promptDe; prompt.lang=c.englishCue?'en':'de';
    b.textContent=cueButtonLabel(c); b.setAttribute('aria-pressed',String(c.englishCue)); return;
  }
  if(act==="check-command"){
    const val=requireAnswer(); if(val==null) return;
    finish(commandAccepts(c.card,val)?3:0,typedDetail(val,'en'),c.card.de); return;
  }
  if(act==="command-choice"){
    finish(+b.dataset.i===c.ci?2:0,'',c.card.de); return;
  }
  if(act==="choice"){
    const i=+b.dataset.i, ok=i===c.ci, correct=c.opts[c.ci], session=G;
    G.phase="checking";
    document.querySelectorAll('[data-act="choice"]').forEach((el,j)=>{el.disabled=true;if(j===c.ci)el.classList.add('correct');else if(j===i)el.classList.add('wrong');});
    G.pending=setTimeout(()=>{if(G===session&&G.cur===c) finish(ok?(c.mg==="choicecorrect"?3:2):0,'',correct);},450);
    return;
  }
  if(act==="tile"){
    const i=+b.dataset.i; if(!c.bank[i]||c.bank[i].used) return;
    c.bank[i].used=true; c.placed.push(i); sfxClick(); renderBuilder(); return;
  }
  if(act==="untile"){ const i=+b.dataset.i; c.bank[i].used=false; c.placed=c.placed.filter(x=>x!==i); sfxClick(); renderBuilder(); return; }
  if(act==="hint-builder"){
    const target=c.card.de.split(' '), p=Math.min(c.placed.length,target.length-1);
    c.bank.forEach(t=>{t.used=false;}); c.placed=[];
    for(let i=0;i<=p;i++){ const bi=c.bank.findIndex(t=>!t.used&&t.w===target[i]); if(bi<0)break; c.bank[bi].used=true; c.placed.push(bi); }
    c.hinted=true; sfxClick(); renderBuilder(); return;
  }
  if(act==="check-builder"){
    const got=c.placed.map(i=>c.bank[i].w).join(' '), ok=norm(got)===norm(c.card.de);
    finish(ok?(c.hinted?2:3):0,ok?'':typedDetail(got),c.card.de);
    if(ok) confetti(8); return;
  }
  if(act==="teach-stop"){ teachRate(); return; }
  if(act==="teach-peek"){ c.peeked=true; teachRate(); return; }
  if(act==="hunt-type"){ presentHuntFix(ERR_TYPES[+b.dataset.i]); return; }
  if(act==="hunt-fix"){
    const fixOK=+b.dataset.i===c.ci;
    finish((c.huntTypeOK?2:0)+(fixOK?1:0),'<div class="small mut">'+ui('Error type','Fehlerart')+': <b>'+errorTypeLabel(c.card.errType)+'</b></div>',c.card.fix); return;
  }
});
app.addEventListener("change",function(e){
  if(!G||G.phase!=="production-review"||!e.target.matches('.production-goal')) return;
  const button=document.querySelector('[data-act="production-rate"][data-g="2"]');
  button.disabled=!Array.from(document.querySelectorAll('.production-goal')).every(input=>input.checked);
});
document.addEventListener("keydown",function(e){
  if(!G||e.isComposing||e.repeat) return;
  const ae=document.activeElement;
  const typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.isContentEditable);
  if(typing){
    if(G.phase==="answer"&&ae.id==="ans"&&e.key==="Enter"&&(ae.tagName==="INPUT"||e.ctrlKey||e.metaKey)){
      const button=document.querySelector('[data-act="check-recall"],[data-act="check-recallrev"],[data-act="check-production"],[data-act="check-command"]');
      if(button){e.preventDefault();button.click();}
    }
    return; // Digits in an answer must never activate option shortcuts.
  }
  // Keep native Enter/Space behaviour for disclosure widgets and buttons.
  if(ae&&["BUTTON","SUMMARY","A","SELECT"].includes(ae.tagName)) return;
  if($("#english-help")&&$("#english-help").open) return;
  if(G.phase==="feedback"&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault(); const b=document.querySelector('[data-act="next"]'); if(b)b.click(); return;
  }
  if(G.phase==="rate"){
    const k=parseInt(e.key,10); if(k>=1&&k<=3){const b=document.querySelector('[data-key="'+k+'"]');if(b)b.click();} return;
  }
  if(G.phase!=="answer") return;
  if(G.cur.mg==="teach"&&e.key===" "){e.preventDefault();teachRate();return;}
  const k=parseInt(e.key,10);
  if(k>=1&&k<=9){const b=document.querySelector('[data-key="'+k+'"]');if(b)b.click();}
});

/* ------------------------------ GO ------------------------------ */
screenHome();
</script>
