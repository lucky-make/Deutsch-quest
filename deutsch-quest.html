(They mean it here.)`,itemIds:["die-bestaetigung","die-post","abholen"]}]}],xa={episode:Rt,cast:jt,items:Ct,scenes:$t},Pa=Object.freeze(Object.defineProperty({__proto__:null,cast:jt,default:xa,episode:Rt,items:Ct,scenes:$t},Symbol.toStringTag,{value:"Module"})),Ut={id:"a2e10",arcId:"A2",cefrLevel:"A2",title:"Der Frühjahrsputz",titleEn:"The spring cleaning",blurb:"Ein Zettel von der Hausverwaltung: Kontrollgang am Freitag. Tobias, zwei Eimer und ein Staubsauger mit Charakter — und dein erster weil-Satz im wilden Leben.",order:14,sceneIds:["a2e10s1","a2e10s2","a2e10s3"]},Ot=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"}],Vt=[{id:"der-fruehjahrsputz",type:"word",german:"der Frühjahrsputz",meaning:"the spring cleaning",image:"sonnenuntergang",audio:"tts",introducedInScene:"a2e10s1",tags:["home","culture"],cefrLevel:"A2",note:"der, Plural: die Frühjahrsputze — eine deutsche Institution"},{id:"der-staubsauger",type:"word",german:"der Staubsauger",meaning:"the vacuum cleaner",image:"staubsauger",audio:"tts",introducedInScene:"a2e10s1",tags:["home","objects"],cefrLevel:"A2",note:"der, Plural: die Staubsauger — saugt den Staub"},{id:"der-eimer",type:"word",german:"der Eimer",meaning:"the bucket",image:"eimer",audio:"tts",introducedInScene:"a2e10s1",tags:["home","objects"],cefrLevel:"A2",note:"der, Plural: die Eimer — einer für Wasser, einer für Mut"},{id:"der-staub",type:"word",german:"der Staub",meaning:"the dust",image:"staubsauger",audio:"tts",introducedInScene:"a2e10s1",tags:["home"],cefrLevel:"A2",note:"der ( Singular ) — Staub wischen; „Staub schlucken“ geht auch"},{id:"wischen",type:"word",german:"wischen",meaning:"to wipe / mop",image:"eimer",audio:"tts",introducedInScene:"a2e10s1",tags:["home","actions"],cefrLevel:"A2",note:"wischen — abwischen, aufwischen, durchwischen"},{id:"gruendlich",type:"word",german:"gründlich",meaning:"thorough(ly)",image:"prüfen",audio:"tts",introducedInScene:"a2e10s1",tags:["home","opinion"],cefrLevel:"A2",note:"Adjektiv/Adverb — gründlich putzen = wirklich ALLES"},{id:"ordentlich",type:"word",german:"ordentlich",meaning:"tidy / neat / properly",image:"prüfen",audio:"tts",introducedInScene:"a2e10s2",tags:["home","opinion"],cefrLevel:"A2",note:"Adjektiv/Adverb — ordentlich sein; ordentlich viel Arbeit"},{id:"die-fensterbank",type:"word",german:"die Fensterbank",meaning:"the windowsill",image:"fenster",audio:"tts",introducedInScene:"a2e10s2",tags:["home"],cefrLevel:"A2",note:"die, Plural: die Fensterbänke — Staub liebt sie"},{id:"die-buerste",type:"word",german:"die Bürste",meaning:"the brush",image:"staubsauger",audio:"tts",introducedInScene:"a2e10s2",tags:["home","objects"],cefrLevel:"A2",note:"die, Plural: die Bürsten"},{id:"der-schmutz",type:"word",german:"der Schmutz",meaning:"the dirt",image:"werkzeug",audio:"tts",introducedInScene:"a2e10s2",tags:["home"],cefrLevel:"A2",note:"der ( Singular ) — schmutzig = dirty"},{id:"das-chaos",type:"word",german:"das Chaos",meaning:"the chaos / mess",image:"entscheidung",audio:"tts",introducedInScene:"a2e10s2",tags:["home"],cefrLevel:"A2",note:"das ( Singular ) — kreatives Chaos ist auch ein Chaos"},{id:"weil-die-kontrolle",type:"grammar_pattern",german:"Ich putze so gründlich, ___ die Kontrolle am Freitag kommt.",meaning:"I'm cleaning so thoroughly because the inspection is on Friday.",image:"ziel",audio:"tts",introducedInScene:"a2e10s2",tags:["grammar","home"],cefrLevel:"A2",cloze:"weil",speak:"Ich putze so gründlich, weil die Kontrolle am Freitag kommt.",note:"weil + Verb am Ende: „…weil die Kontrolle kommt.“"},{id:"die-kontrolle",type:"word",german:"die Kontrolle",meaning:"the inspection / check",image:"prüfen",audio:"tts",introducedInScene:"a2e10s3",tags:["admin","home"],cefrLevel:"A2",note:"die, Plural: die Kontrollen — Kontrollgang = Rundgang zur Kontrolle"},{id:"sauber",type:"word",german:"sauber",meaning:"clean",image:"eimer",audio:"tts",introducedInScene:"a2e10s3",tags:["home","opinion"],cefrLevel:"A2",note:"Adjektiv — sauber!; putzen = to clean"},{id:"die-belohnung",type:"word",german:"die Belohnung",meaning:"the reward",image:"geschenk",audio:"tts",introducedInScene:"a2e10s3",tags:["feelings","home"],cefrLevel:"A2",note:"die, Plural: die Belohnungen — sich etwas zur Belohnung kaufen"},{id:"der-hausflur",type:"word",german:"der Hausflur",meaning:"the stairwell / hallway (of a building)",image:"treppenhaus",audio:"tts",introducedInScene:"a2e10s3",tags:["home","neighbors"],cefrLevel:"A2",note:"der, Plural: die Hausflure — im Flur kehren alle mit"},{id:"die-kaffeepause",type:"word",german:"die Kaffeepause",meaning:"the coffee break",image:"kaffee",audio:"tts",introducedInScene:"a2e10s3",tags:["food","time"],cefrLevel:"A2",note:"die, Plural: die Kaffeepausen — wichtigster Putz-Abschnitt"}],Zt=[{id:"a2e10s1",episodeId:"a2e10",title:"Der Zettel",titleEn:"The note",place:"Wohnung, Tür, dann Küche",bg:"wohnung",contextTags:["home","neighbors","problem"],requiredItems:["die-wohnung","die-treppe"],introducedItems:["der-fruehjahrsputz","der-staubsauger","der-eimer","der-staub","wischen","gruendlich"],beats:[{type:"narration",text:"Ein Zettel an der Haustür, Durchschläge für alle: „Kontrollgang der Hausverwaltung: Freitag, 10 Uhr. Bitte stellen Sie sicher, dass die Wohnungen zugänglich sind.“ Tobias liest ihn vor wie eine Kriegserklärung."},{type:"line",speaker:"tobias",text:"Kontrollgang. Das ist wie ein Zuhörer-Test, nur für Wohnungen. …Und ehrlich, Sam: Deine Bude ist… kreativ. Deswegen: Frühjahrsputz, die volle Dröhnung. Ich bring Staubsauger und Eimer — und meine Oma-Techniken.",translation:"Inspection walk. It's like a listening test, just for flats. …And honestly, Sam: your place is… creative. So: spring cleaning, the full works. I'll bring the vacuum and a bucket — and my grandma's techniques."},{type:"meet",itemIds:["der-fruehjahrsputz","der-staubsauger","der-eimer"]},{type:"meet",itemIds:["der-staub","wischen","gruendlich"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias rollt die Ärmel hoch.",options:[{label:"Team Putz. Ich mache Bad und Küche, du den Rest.",line:"Team Putz! Ich nehme Bad und Küche, du den Rest. …„Deal. Aber der Staubsauger ist launisch — red ruhig mit ihm.“"},{label:"Wie gründlich ist „gründlich“? In Minuten, bitte.",line:"Wie gründlich ist 'gründlich'? In Minuten, bitte. …Tobias: „Bis es glänzt. Zeit ist eine Illusion.“"}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Zettel der Hausverwaltung",text:`MITTEILUNG AN ALLE MIETER

Am Freitag, den 12., findet zwischen
9:00 und 12:00 Uhr der jährliche
Kontrollgang statt.

Bitte garantieren Sie Zugang zu allen Räumen.
Beschwerden (z. B. Feuchtigkeit, kaputte Fenster)
bitte schriftlich an der Tür hinterlassen.

Die Hausverwaltung`,translation:`NOTICE TO ALL TENANTS

On Friday the 12th, between 9 and 12 am,
the annual inspection will take place.

Please guarantee access to all rooms.
Complaints (e.g. damp, broken windows)
please leave in writing at the door.

The property management`}]},{id:"a2e10s2",episodeId:"a2e10",title:"Der Staubsauger streikt",titleEn:"The vacuum goes on strike",place:"Wohnung, alle Zimmer gleichzeitig",bg:"wohnung",contextTags:["home","friends","problem"],requiredItems:["der-lappen","der-zettel"],introducedItems:["ordentlich","die-fensterbank","die-buerste","der-schmutz","das-chaos","weil-die-kontrolle"],beats:[{type:"narration",text:"Der Staubsauger von Tobias' Oma heißt „Brunhilde“, ist 34 Jahre alt und hat einen eigenen Willen. Brunhilde startet. Brunhilde hört auf. Brunhilde startet wieder. Klassik."},{type:"line",speaker:"tobias",text:"Brunhilde ist kein Gerät, das ist eine Beziehung. …Du musst sie umarmen, wenn sie startet. …SO. Sie läuft. …Und jetzt: System. Erst oben, dann unten. Erst trocken, dann nass. Fensterbank VOR Boden, sonst wischt du doppelt.",translation:"Brunhilde isn't a machine, she's a relationship. …You have to hug her when she starts. …THERE. She's running. …And now: system. Top first, then bottom. Dry first, then wet. Windowsill BEFORE floor, otherwise you wipe twice."},{type:"meet",itemIds:["ordentlich","die-fensterbank","die-buerste"]},{type:"meet",itemIds:["der-schmutz","das-chaos","weil-die-kontrolle"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias findet hinter deinem Schrank eine Tasse aus dem ersten Monat. Inhalt: Wissenschaft.",options:[{label:"Weg damit. Ich putze gründlich, weil die Kontrolle am Freitag kommt.",line:"Weg damit! Ich putze gründlich, weil die Kontrolle am Freitag kommt. …„Und weil deine Tasse jetzt Archäologie ist.“"},{label:"Die Tasse bleibt. Sie ist Zeitzeuge. Aber draußen.",line:"Die Tasse bleibt — sie ist Zeitzeuge. Aber draußen. Auf dem Flur. Als Mahnmal."}]},{type:"line",speaker:"tobias",text:"Zwischenstand: Fensterbank sauber, Bürste voll, Schmutz im Eimer, Chaos halbiert. …Und dein Deutsch? „Ordentlich“, würde meine Oma sagen. Das ist ein Kompliment der höchsten Kategorie.",translation:"Status: windowsill clean, brush full, dirt in the bucket, chaos halved. …And your German? 'Ordentlich' (orderly), my grandma would say. That's the highest category of compliment."},{type:"check",count:2,mode:"listen"}]},{id:"a2e10s3",episodeId:"a2e10",title:"Der Kontrollgang",titleEn:"The inspection",place:"Wohnung, Freitag 10:05",bg:"wohnung",contextTags:["home","admin","neighbors"],requiredItems:["die-kanne","der-kuchen"],introducedItems:["die-kontrolle","sauber","die-belohnung","der-hausflur","die-kaffeepause"],beats:[{type:"narration",text:"Freitag. Die Wohnung glänzt so sehr, dass du deine Spiegelung grüßt. Die Hausverwaltung kommt mit Klemmbrett. Frau Brügge kommt mit — natürlich —, quasi als Aufsichtsrat."},{type:"line",speaker:"frau-bruegge",text:"Na. …Hm. …Fensterbank: sauber. Bad: sauber. Flur: gewischt. …Junger Mann, wenn alle Mieter so putzen würden, wären wir beide arbeitslos — ich und die Hausverwaltung. …Sehr ordentlich.",translation:"Well. …Hm. …Windowsill: clean. Bathroom: clean. Hallway: mopped. …Young man, if all tenants cleaned like this, we'd both be unemployed — me and the property management. …Very orderly."},{type:"meet",itemIds:["die-kontrolle","sauber","die-belohnung"]},{type:"meet",itemIds:["der-hausflur","die-kaffeepause"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Frau Brügge klopft an die Heizung. „Kaputt. Soll ich den Hausmeister schicken?“",options:[{label:"Ja, bitte. Und danke für die Kontrolle!",line:"Ja, bitte schicken Sie den Hausmeister. Und danke für die Kontrolle! …Sie notiert: „zu freundlich“. Auch gut."},{label:"Nein, danke — Tobias und ich probieren es erst selbst.",line:"Nein, danke — Tobias und ich probieren es erst selbst. …Frau Brügge: „Mit WERKZEUG, nicht mit Ideen.“ Verstanden?"}]},{type:"line",speaker:"tobias",text:"Sie ist weg. Die Kontrolle ist bestanden. …Und jetzt, bitte sehr: Kaffeepause. Die ist nach jedem Putztag Pflicht — sagt meine Oma, und die hat Recht, das weißt du ja inzwischen.",translation:"She's gone. Inspection passed. …And now, please: coffee break. It's mandatory after every cleaning day — grandma says so, and she's right, you know that by now."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Frau Brügges Notiz (am Klemmbrett zurückgelassen)",text:`Für Sam —

Tipp 1: Flur jeden Samstag kehren.
Gemeinschaft, nicht Strafe.

Tipp 2: Ein Eimer Wasser, ein Schuss Essig.
Mehr braucht Glas nicht.

Tipp 3: Wer gründlich putzt, darf
pünktlich Feierabend machen.

— E. Brügge
(der Heizmeister kommt am Dienstag,
 klingelt NICHT laut)`,translation:`For Sam —

Tip 1: Sweep the hallway every Saturday.
Community, not punishment.

Tip 2: One bucket of water, a dash of vinegar.
That's all glass needs.

Tip 3: Those who clean thoroughly
deserve to finish on time.

— E. Brügge
(the heating man comes on Tuesday,
 doesn't ring loudly)`}]}],Wa={episode:Ut,cast:Ot,items:Vt,scenes:Zt},Ka=Object.freeze(Object.defineProperty({__proto__:null,cast:Ot,default:Wa,episode:Ut,items:Vt,scenes:Zt},Symbol.toStringTag,{value:"Module"})),Jt={id:"a2e11",arcId:"A2",cefrLevel:"A2",title:"Der erste Schnee",titleEn:"The first snow",blurb:"Leipzig wird weiß, dein Fahrrad wird schwer, und das Schild am Haus sagt Räumpflicht. Schnee, Schaufel, Streugut — und der Satz, der dein Leben regelt: „Man muss.“",order:15,sceneIds:["a2e11s1","a2e11s2","a2e11s3"]},qt=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"deniz",name:"Deniz",role:"Nachbar"}],Yt=[{id:"der-schnee",type:"word",german:"der Schnee",meaning:"the snow",image:"schnee",audio:"tts",introducedInScene:"a2e11s1",tags:["weather","nature"],cefrLevel:"A2",note:"der ( Singular ) — es schneit = it's snowing"},{id:"der-winter",type:"word",german:"der Winter",meaning:"the winter",image:"schnee",audio:"tts",introducedInScene:"a2e11s1",tags:["weather","time"],cefrLevel:"A2",note:"der, Plural: die Winter — im Winter; nächster Winter"},{id:"frieren",type:"word",german:"frieren",meaning:"to be / feel cold",image:"wetter",audio:"tts",introducedInScene:"a2e11s1",tags:["weather","feelings"],cefrLevel:"A2",note:"frieren — ich friere; KEIN Mensch friert gern"},{id:"die-wettervorhersage",type:"word",german:"die Wettervorhersage",meaning:"the weather forecast",image:"kalender",audio:"tts",introducedInScene:"a2e11s1",tags:["weather","media"],cefrLevel:"A2",note:"die, Plural: die Wettervorhersagen — heute: 90% Schnee"},{id:"die-muetze",type:"word",german:"die Mütze",meaning:"the (beanie) cap",image:"muetze",audio:"tts",introducedInScene:"a2e11s1",tags:["clothes","weather"],cefrLevel:"A2",note:"die, Plural: die Mützen — Deckmütze fürs Ohr"},{id:"der-schal",type:"word",german:"der Schal",meaning:"the scarf",image:"schal",audio:"tts",introducedInScene:"a2e11s1",tags:["clothes"],cefrLevel:"A2",note:"der, Plural: die Schals — aus Wolle, um den Hals"},{id:"raeumen",type:"word",german:"räumen",meaning:"to clear (snow); to vacate",image:"schaufel",audio:"tts",introducedInScene:"a2e11s2",tags:["weather","actions"],cefrLevel:"A2",note:"räumen — Schnee räumen; die Wohnung räumen"},{id:"die-schaufel",type:"word",german:"die Schaufel",meaning:"the shovel",image:"schaufel",audio:"tts",introducedInScene:"a2e11s2",tags:["tools","weather"],cefrLevel:"A2",note:"die, Plural: die Schaufeln — im Keller, neben Brunhilde"},{id:"streuen",type:"word",german:"streuen",meaning:"to scatter / grit (salt)",image:"schaufel",audio:"tts",introducedInScene:"a2e11s2",tags:["weather","actions"],cefrLevel:"A2",note:"streuen — Salz streuen gegen Glatteis"},{id:"die-raeumpflicht",type:"word",german:"die Räumpflicht",meaning:"the (legal) duty to clear snow",image:"formular",audio:"tts",introducedInScene:"a2e11s2",tags:["rules","weather","home"],cefrLevel:"A2",note:"die, Plural: die Räumpflichten — 7–20 Uhr, Sonntags später"},{id:"glatt",type:"word",german:"glatt",meaning:"smooth / slippery (icy)",image:"reifen",audio:"tts",introducedInScene:"a2e11s2",tags:["weather","danger"],cefrLevel:"A2",note:"Adjektiv — es ist glatt!; Glatteis = black ice"},{id:"der-handschuh",type:"word",german:"der Handschuh",meaning:"the glove",image:"jacke",audio:"tts",introducedInScene:"a2e11s2",tags:["clothes"],cefrLevel:"A2",note:"der, Plural: die Handschuhe — Hand + Schuh. Deutsch."},{id:"man-muss",type:"grammar_pattern",german:"Ab 7 Uhr ___ man den Bürgersteig räumen.",meaning:"From 7 am you have to clear the pavement.",image:"ziel",audio:"tts",introducedInScene:"a2e11s2",tags:["grammar","rules"],cefrLevel:"A2",cloze:"muss",speak:"Ab 7 Uhr muss man den Bürgersteig räumen.",note:"man muss … = impersonal obligation; nobody escapes"},{id:"der-teich",type:"word",german:"der Teich",meaning:"the pond",image:"wasser",audio:"tts",introducedInScene:"a2e11s3",tags:["nature"],cefrLevel:"A2",note:"der, Plural: die Teiche — zugefroren = frozen over"},{id:"die-waermflasche",type:"word",german:"die Wärmflasche",meaning:"the hot-water bottle",image:"thermos",audio:"tts",introducedInScene:"a2e11s3",tags:["health","home"],cefrLevel:"A2",note:"die, Plural: die Wärmflaschen — Wärme + Flasche"},{id:"der-gluehwein",type:"word",german:"der Glühwein",meaning:"the mulled wine",image:"getränk",audio:"tts",introducedInScene:"a2e11s3",tags:["food","winter"],cefrLevel:"A2",note:"der, Plural: die Glühweine — auf dem Weihnachtsmarkt"},{id:"die-schneeflocke",type:"word",german:"die Schneeflocke",meaning:"the snowflake",image:"schnee",audio:"tts",introducedInScene:"a2e11s3",tags:["weather","nature"],cefrLevel:"A2",note:"die, Plural: die Schneeflocken — keine gleicht der anderen"},{id:"der-atem",type:"word",german:"der Atem",meaning:"the breath",image:"ruhe",audio:"tts",introducedInScene:"a2e11s3",tags:["health","nature"],cefrLevel:"A2",note:"der ( Singular ) — der Atem sieht man bei Kälte!"}],Qt=[{id:"a2e11s1",episodeId:"a2e11",title:"Weißes Leipzig",titleEn:"White Leipzig",place:"Wohnungsfenster, dann Straße",bg:"wohnung",contextTags:["weather","friends","city"],requiredItems:["das-wetter","die-woche"],introducedItems:["der-schnee","der-winter","frieren","die-wettervorhersage","die-muetze","der-schal"],beats:[{type:"narration",text:"Du wachst auf, und die Welt ist stumm und weiß. Erster Schnee deines Lebens in Deutschland. Draußen hängt die Wettervorhersage vor dem Fenster wie eine Ankündigung: 90 %, minus vier Grad, auch morgen."},{type:"line",speaker:"tobias",text:"(schreit von unten hoch) SAM! SCHNEE! …Das ist DEIN erster Winter! Wir müssen raus, bevor er plattgetreten wird! Mütze, Schal, alles — oben ohne friert man hier nicht, da friert man GEISTIG.",translation:"(shouting up from below) SAM! SNOW! …This is YOUR first winter! We have to go out before it gets trampled flat! Cap, scarf, everything — you don't just freeze up here, you freeze SPIRITUALLY."},{type:"meet",itemIds:["der-schnee","der-winter","die-wettervorhersage"]},{type:"meet",itemIds:["frieren","die-muetze","der-schal"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Draußen: minus vier. Deine Nase hat schon aufgegeben.",options:[{label:"Ich friere. Aber glücklich. Womit macht man Schneemänner?",line:"Ich friere. Aber glücklich! Womit baut man hier Schneemänner — Karotte haben wir, Kassler auch."},{label:"Der Schnee ist so… still. Ist Leipzig immer so leise?",line:"Der Schnee ist so still! Ist Leipzig immer so leise? …Tobias: „Nur beim ersten Schnee. Danach rutschen wir alle laut.“"}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Wetterwarnung (Amtliche Information)",text:`AMTLICHE WARNVORHERSAGE
Leipzig und Umgebung

Warnung vor SCHNEEFALL:
5–10 cm Neuschnee bis zum Abend.

Straßen und Wege werden glatt.
Bitte fahren Sie langsam.

Räumpflicht: 7:00–20:00 Uhr
(Sonntags ab 9:00 Uhr)

— Deutscher Wetterdienst`,translation:`OFFICIAL WARNING
Leipzig and surroundings

Warning of SNOWFALL:
5–10 cm of fresh snow by evening.

Roads and paths will become slippery.
Please drive slowly.

Duty to clear snow: 7 am – 8 pm
(Sundays from 9 am)

— German Weather Service`}]},{id:"a2e11s2",episodeId:"a2e11",title:"Räumpflicht",titleEn:"Snow duty",place:"Bürgersteig, Lindenauer Straße",bg:"strasse",contextTags:["weather","home","neighbors"],requiredItems:["das-fahrrad","vorsicht"],introducedItems:["raeumen","die-schaufel","streuen","die-raeumpflicht","glatt","der-handschuh","man-muss"],beats:[{type:"narration",text:"Das Schild im Hausflur hat kein Mitleid: „Räumpflicht 7–20 Uhr. Mieter räumen den Gehweg vor dem Haus.“ Frau Brügge händigt dir eine Schaufel aus wie ein Schwert bei einer Ritterernennung."},{type:"line",speaker:"frau-bruegge",text:"Schaufel. Salz. Handschuhe. …Und jetzt die wichtigste Lektion des Winters: Ab 7 Uhr muss man den Gehweg räumen — man MUSS. Nicht „sollte“. Nicht „könnte“. Muss. Der erste Fußgänger um 7:01 ist immer ein Anwalt.",translation:"Shovel. Salt. Gloves. …And now the most important lesson of winter: from 7 am you MUST clear the pavement — must. Not 'should'. Not 'could'. Must. The first pedestrian at 7:01 is always a lawyer."},{type:"meet",itemIds:["raeumen","die-schaufel","man-muss"]},{type:"meet",itemIds:["streuen","die-raeumpflicht","der-handschuh"]},{type:"meet",itemIds:["glatt"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Gehweg ist zur Hälfte frei. Deniz kommt mit einem Thermoskanne-Trio vorbei.",options:[{label:"Ich streue noch Salz. Sicherheit vor Gemütlichkeit.",line:"Ich streue erst Salz, dann Pause. Sicherheit vor Gemütlichkeit — sagt mein Rückgrat, nicht mein Rücken."},{label:"Pause! Tobias bringt Glühwein — äh, „Tee“.",line:"Pause! Tobias bringt drei Becher „Tee“ mit, der verdächtig nach Zimt und achtzehn Prozent riecht."}]},{type:"line",speaker:"deniz",text:"Siehst du gut aus, Sam. Fast wie ein echter Leipziger: eine Schaufel in der Hand und ein Gesicht wie an Heiligabend. …Und jetzt gucken: glatt? Fast glatt? Salz drüber, fertig. DAS ist Deutschland in drei Schritten.",translation:"You look good, Sam. Almost like a real Leipziger: a shovel in hand and a face like it's Christmas Eve. …And now look: slippery? Almost slippery? Salt on it, done. THAT is Germany in three steps."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Etikett am Streusalz-Eimer",text:`STREUSALZ — HAUS LINDENAU

Räumpflicht: 7–20 Uhr (So ab 9).
Erst räumen, DANN streuen. Sonst: Suppe.

Sparsam streuen. Salz ist kein Deko.
Glatt ist kein Zustand. Glatt ist eine Aufforderung
zum Gehen. Langsam gehen.

Handschohe vergessen? Kellerschrank, links.
(Links ist immer der Kellerschrank.)`,translation:`GRITTING SALT — LINDENAU HOUSE

Duty to clear: 7 am–8 pm (Sundays from 9).
Clear first, THEN spread. Otherwise: soup.

Spread sparingly. Salt isn't decoration.
Slippery isn't a condition. Slippery is an invitation
to walk. Slowly.

Forgot gloves? Basement cupboard, left.
(Left is always the basement cupboard.)`,itemIds:["die-raeumpflicht","streuen","glatt"]}]},{id:"a2e11s3",episodeId:"a2e11",title:"Der gefrorene Teich",titleEn:"The frozen pond",place:"Clara-Zetkin-Park, gegen Abend",bg:"park",contextTags:["weather","friends","nature"],requiredItems:["gemuetlich","die-luft"],introducedItems:["der-teich","die-waermflasche","der-gluehwein","die-schneeflocke","der-atem"],beats:[{type:"narration",text:"Abends im Park: Der Teich ist zugefroren, ein Kind schiebt eine Wärmflasche in einer Strickmütze über das Eis (warum? niemand fragt), und euer Atem hängt als kleine Wolken in der Luft."},{type:"line",speaker:"tobias",text:"Schau: unser Atem! Bei Kälte sieht man, dass man lebt. …Und da: Schneeflocken im Laternenlicht. Jede anders. Wie meine Excuses am Montagmorgen, aber schöner.",translation:"Look: our breath! In the cold you can see that you're alive. …And there: snowflakes in the lamplight. Every one different. Like my excuses on Monday mornings, but prettier."},{type:"meet",itemIds:["der-teich","die-waermflasche","der-atem"]},{type:"meet",itemIds:["die-schneeflocke","der-gluehwein"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias hält zwei Becher. „Glühwein oder Kindpunsch?“",options:[{label:"Glühwein. Man muss ja irgendwie warm bleiben.",line:"Glühwein, bitte. Man muss ja irgendwie warm bleiben — das ist meine offizielle Begründung und ich stehe dazu."},{label:"Tee für mich. Ich schiebe morgen wieder Schnee.",line:"Tee für mich — ich muss morgen wieder Schnee schieben. Der Atem vom Training ist schon hart genug."}]},{type:"line",speaker:"deniz",text:"Sam, dein erster Schnee. …Weißt du noch, dein erster Tag? Da war Sommer, Koffer, Gleis sieben. Und jetzt: Schnee, Pflicht, Glühwein. …Du hast jetzt alle Jahreszeiten auf Deutsch gelebt. Glückwunsch.",translation:"Sam, your first snow. …Remember your first day? Summer then, suitcase, platform seven. And now: snow, duty, mulled wine. …You've now lived every season in German. Congratulations."},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Der Park wird dunkel, die Laterne malt Kreise in den Schnee. Auf dem Heimweg rutscht einer aus, lacht, steht auf, lauter. Frieren tut keiner mehr. Der erste Winter ist halb geschafft — und du hast gelernt, was alle Leipziger wissen: Salz streuen, tief atmen, weitergehen."}]}],_a={episode:Jt,cast:qt,items:Yt,scenes:Qt},Fa=Object.freeze(Object.defineProperty({__proto__:null,cast:qt,default:_a,episode:Jt,items:Yt,scenes:Qt},Symbol.toStringTag,{value:"Module"})),Xt={id:"a2e12",arcId:"A2",cefrLevel:"A2",title:"Heiligabend bei Brügge",titleEn:"Christmas Eve at Brügge's",blurb:"Frau Brügge lädt zum Heiligabend ein: Kartoffelsalat mit Würstchen, Kerzen, Weihnachtsmusik — und das erste Geschenk, das dir jemand in Deutschland persönlich packt.",order:16,sceneIds:["a2e12s1","a2e12s2","a2e12s3"]},en=[{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"luise",name:"Luise",role:"Café-Besitzerin"}],tn=[{id:"der-heiligabend",type:"word",german:"der Heiligabend",meaning:"Christmas Eve (24 Dec)",image:"fest",audio:"tts",introducedInScene:"a2e12s1",tags:["celebration","time"],cefrLevel:"A2",note:"der, Plural: die Heiligabende — in Deutschland: DAS Fest"},{id:"der-kranz",type:"word",german:"der Kranz",meaning:"the wreath",image:"fest",audio:"tts",introducedInScene:"a2e12s1",tags:["celebration","home"],cefrLevel:"A2",note:"der, Plural: die Kränze — Adventskranz: vier Kerzen"},{id:"der-kartoffelsalat",type:"word",german:"der Kartoffelsalat",meaning:"the potato salad",image:"salat",audio:"tts",introducedInScene:"a2e12s1",tags:["food","celebration"],cefrLevel:"A2",note:"der, Plural: die Kartoffelsalate — Heiligabend-Klassiker Nr. 1"},{id:"deshalb",type:"grammar_pattern",german:"Es ist Heiligabend, ___ bin ich zu Hause.",meaning:"It's Christmas Eve, so I'm at home.",image:"ziel",audio:"tts",introducedInScene:"a2e12s1",tags:["grammar"],cefrLevel:"A2",cloze:"deshalb",speak:"Es ist Heiligabend, deshalb bin ich zu Hause.",note:"deshalb = deshalb — Verb auf Position 1 danach!"},{id:"die-bescherung",type:"word",german:"die Bescherung",meaning:"the (traditional) present-giving",image:"geschenk",audio:"tts",introducedInScene:"a2e12s1",tags:["celebration","family"],cefrLevel:"A2",note:"die, Plural: die Bescherungen — abends am Baum"},{id:"die-tradition",type:"word",german:"die Tradition",meaning:"the tradition",image:"heimat",audio:"tts",introducedInScene:"a2e12s1",tags:["celebration","culture"],cefrLevel:"A2",note:"die, Plural: die Traditionen — jede Familie hat ihre eigene"},{id:"das-wuerstchen",type:"word",german:"das Würstchen",meaning:"the (small) sausage",image:"bratwurst",audio:"tts",introducedInScene:"a2e12s2",tags:["food","celebration"],cefrLevel:"A2",note:"das, Plural: die Würstchen — Wiener oder Bockwurst, im Salat-Fluidum"},{id:"plaudern",type:"word",german:"plaudern",meaning:"to chat",image:"gespräch",audio:"tts",introducedInScene:"a2e12s2",tags:["people","friends"],cefrLevel:"A2",note:"plaudern — gemütlich reden, ohne Thema"},{id:"die-familie",type:"word",german:"die Familie",meaning:"the family",image:"team",audio:"tts",introducedInScene:"a2e12s2",tags:["people","family"],cefrLevel:"A2",note:"die, Plural: die Familien — Familienfeier, Familienrezept"},{id:"der-teller",type:"word",german:"der Teller",meaning:"the plate",image:"teller",audio:"tts",introducedInScene:"a2e12s2",tags:["kitchen","food"],cefrLevel:"A2",note:"der, Plural: die Teller — einen Teller auffüllen"},{id:"anzuenden",type:"word",german:"anzünden",meaning:"to light / set alight",image:"kerze",audio:"tts",introducedInScene:"a2e12s2",tags:["celebration","actions"],cefrLevel:"A2",note:"trennbar: ich zünde an — Kerzen anzünden"},{id:"die-musik",type:"word",german:"die Musik",meaning:"the music",image:"konzert",audio:"tts",introducedInScene:"a2e12s2",tags:["music","celebration"],cefrLevel:"A2",note:"die ( Singular ) — Musik hören, Musik machen"},{id:"sich-bedanken",type:"chunk",german:"Ich möchte mich bedanken.",meaning:"I'd like to say thank you.",image:"gespräch",audio:"tts",introducedInScene:"a2e12s3",tags:["politeness","celebration"],cefrLevel:"A2",speak:"Ich möchte mich bedanken.",note:"sich bedanken BEI jemandem FÜR etwas"},{id:"die-schachtel",type:"word",german:"die Schachtel",meaning:"the (small) box",image:"paket",audio:"tts",introducedInScene:"a2e12s3",tags:["objects","celebration"],cefrLevel:"A2",note:"die, Plural: die Schachteln — Geschenkschachtel"},{id:"die-handarbeit",type:"word",german:"die Handarbeit",meaning:"the handicraft / handwork",image:"geschenk",audio:"tts",introducedInScene:"a2e12s3",tags:["hobby","gifts"],cefrLevel:"A2",note:"die, Plural: die Handarbeiten — stricken, häkeln, nähen"},{id:"die-socke",type:"word",german:"die Socke",meaning:"the sock",image:"schuhe",audio:"tts",introducedInScene:"a2e12s3",tags:["clothes","gifts"],cefrLevel:"A2",note:"die, Plural: die Socken — gestrickte Socken: das höchste Geschenk"},{id:"besinnlich",type:"word",german:"besinnlich",meaning:"contemplative / festive-calm",image:"ruhe",audio:"tts",introducedInScene:"a2e12s3",tags:["feelings","celebration"],cefrLevel:"A2",note:"Adjektiv — „eine besinnliche Zeit“ = Weihnachtssprache"},{id:"singen",type:"word",german:"singen",meaning:"to sing",image:"mic",audio:"tts",introducedInScene:"a2e12s3",tags:["music","celebration"],cefrLevel:"A2",note:"singen — sang — gesungen; Lieder singen"}],nn=[{id:"a2e12s1",episodeId:"a2e12",title:"Die Einladung",titleEn:"The invitation",place:"Treppenhaus & Wohnung von Frau Brügge",bg:"treppenhaus",contextTags:["celebration","neighbors","family"],requiredItems:["das-abendessen","die-woche"],introducedItems:["der-heiligabend","der-kranz","der-kartoffelsalat","deshalb","die-bescherung","die-tradition"],beats:[{type:"narration",text:"Ein Zettel in Füllfeder: „Heiligabend, 17 Uhr, bei mir. Kartoffelsalat & Würstchen — Familienrezept. Kommst du & Tobias. Brügge.“ Luise ruft an, um zu fragen, ob sie Wein bringen soll. Sie fragt nicht, sie ANKÜNDIGT es."},{type:"line",speaker:"frau-bruegge",text:"Heiligabend ohne Menschen ist wie Kartoffelsalat ohne Kartoffeln. Deshalb: Du kommst. …Bei uns ist Bescherung am Abend — Geschenke, Baum, Musik. Das ist Tradition. Du bist jetzt Teil der Tradition. Willst du was erwidern? Nein? Gut.",translation:"Christmas Eve without people is like potato salad without potatoes. So: you're coming. …At ours, presents happen in the evening — gifts, tree, music. That's tradition. You're now part of the tradition. Want to object? No? Good."},{type:"meet",itemIds:["der-heiligabend","die-bescherung","die-tradition"]},{type:"meet",itemIds:["der-kartoffelsalat","der-kranz","deshalb"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias grinst: „Sie hat dich adoptiert. Frag nicht, es gibt kein Zurück. Was bringst du mit?“",options:[{label:"Meine Großmutter-Rezept-Karte. Ich backe Mohnkuchen.",line:"Ich bringe meine Großmutter-Rezept-Karte mit — ich backe Mohnkuchen. Zimt nicht sparen, du weißt ja."},{label:"Blumen. Und eine Postkarte vom Zoo als Deckblatt-Gag.",line:"Blumen. Und als Deckblatt die Zoo-Postkarte. …Tobias: „Sie wird sie einrahmen. Zwischen Mietverträgen.“"}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Frau Brügges Einkaufszettel (am Kühlschrank)",text:`HEILIGABEND — EINKAUF

Kartoffeln (festkochend!)  2 kg
Würstchen                  6 Stück
Gurken, Zwiebeln, Mayo
Eier, Essig, Senf

TANNENZWEIGE für den Kranz: 4
Kerzen: NOCH VIER. (Zählen, Brügge!)

Guests: Sam (bringt Kuchen),
Tobias (bringt Wein? Nein, Saft),
Luise (bringt Wein, besteht darauf).

Deshalb schön sein. Auch wenn's schwerfällt. 😉`,translation:`CHRISTMAS EVE — SHOPPING

Potatoes (firm!)           2 kg
Sausages                   6 pieces
cucumbers, onions, mayo
eggs, vinegar, mustard

FIR BRANCHES for the wreath: 4
Candles: FOUR LEFT. (Count, Brügge!)

Guests: Sam (brings cake),
Tobias (brings wine? no, juice),
Luise (brings wine, insists).

Therefore: be nice. Even if it's hard. 😉`}]},{id:"a2e12s2",episodeId:"a2e12",title:"Küche, Kerzen, Kartoffelsalat",titleEn:"Kitchen, candles, potato salad",place:"Frau Brügges Küche, 4. OG",bg:"wohnung",contextTags:["food","celebration","neighbors"],requiredItems:["das-brot","die-kartoffel"],introducedItems:["das-wuerstchen","plaudern","die-familie","der-teller","anzuenden","die-musik"],beats:[{type:"narration",text:"Die Küche duftet nach Kartoffeln, Essig und Zwiebeln. Weihnachtsmusik läuft leise vom alten Radio, Tobias rührt die Mayo, Luise plaudert mit Frau Brügge über das Jahr — und du bekommst den Ehrenplatz: Teller-Turm-Wache."},{type:"line",speaker:"frau-bruegge",text:"Kartoffelsalat ist KEIN Rezept, das ist Beziehungspflege. …Salat in die Schüssel, Würstchen oben drauf, fertig. Und JA, ich probiere jährlich neue Varianten. Und JA, die Familie protestiert. Beides gehört dazu.",translation:"Potato salad is NOT a recipe, it's relationship maintenance. …Salad in the bowl, sausages on top, done. And YES, I try new variants every year. And YES, the family protests. Both are part of it."},{type:"meet",itemIds:["das-wuerstchen","der-teller","anzuenden"]},{type:"meet",itemIds:["plaudern","die-familie","die-musik"]},{type:"line",speaker:"luise",text:"Sam, Prost auf dein erstes deutsches Weihnachtsfest. …Ach: Kerzen! Vier Stück, einer pro Adventssonntag. Zünd sie an — und ja, du darfst dir was wünschen. Aber leise, sonst kommt die Brügge-Sozialbehörde.",translation:"Sam, cheers to your first German Christmas. …Oh: candles! Four, one per Advent Sunday. Light them — and yes, you may make a wish. But quietly, or the Brügge social services will come."},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Du zündest die vierte Kerze an.",options:[{label:"(leise) Danke, Leipzig. Für Gleis 7, das es nicht gibt.",line:"(leise) Danke, Leipzig. Für Gleis 7, das es nicht gibt — und für alles andere, das es gibt."},{label:"(leise) Nächstes Jahr: Der Salat schmeckt nach MEINEM Rezept.",line:"(leise) Nächstes Jahr: Der Salat schmeckt nach MEINEM Rezept. …Du hörst Tobias kichern. Er hat es gehört."}]},{type:"check",count:2,mode:"listen"}]},{id:"a2e12s3",episodeId:"a2e12",title:"Die Bescherung",titleEn:"The presents",place:"Wohnzimmer, am Baum",bg:"wohnung",contextTags:["celebration","neighbors","feelings"],requiredItems:["das-geschenk","die-kanne"],introducedItems:["sich-bedanken","die-schachtel","die-handarbeit","die-socke","besinnlich","singen"],beats:[{type:"narration",text:"Das Wohnzimmer: Kerzenlicht, ein Baum mit echten Kerzen (Feuerlöscher steht dekorativ daneben), drei Geschenke unter dem Baum — eins hat deinen Namen, in Füllfeder, mit Punkt."},{type:"line",speaker:"frau-bruegge",text:"So. Erst singen? …Nein? Ok. Dann die Bescherung. …Aufmachen! …Das ist Handarbeit — die Socken. Ich stricke seit vierzig Jahren, das passt dir, ich hab's gemessen. …Und jetzt schau in die Schachtel, die zweite. Unten drin.",translation:"Right. Sing first? …No? OK. Then the presents. …Open them! …That's handicraft — the socks. I've been knitting for forty years; they'll fit, I measured. …And now look in the box, the second one. At the bottom."},{type:"meet",itemIds:["die-handarbeit","die-socke","die-schachtel"]},{type:"line",speaker:"luise",text:"Zweite Schachtel. …Eine kleine Kaffeekanne?! Du hast dir KAFFEEKANNEN gewünscht?! …Sam. Das ist kein Geschenk, das ist ein Porträt von dir. …Frau Brügge: „Von allen. Kaffee verbindet hier alle.“",translation:"Second box. …A little coffee pot?! You wished for COFFEE POTS?! …Sam. That's not a present, that's a portrait of you. …Frau Brügge: 'Of everyone. Coffee connects everybody here.'"},{type:"meet",itemIds:["sich-bedanken","besinnlich","singen"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Frau Brügge schaut dich an. Bedank dich — richtig.",options:[{label:"Ich möchte mich bedanken — bei Ihnen, für dieses ganze Jahr.",line:"Ich möchte mich bedanken. Bei Ihnen, für dieses ganze Jahr — vom ersten Zettel an der Tür bis heute Abend."},{label:"Danke für die Socken. Und dafür, dass Sie mir eine Familie leihen.",line:"Danke für die Socken — und dafür, dass Sie mir heute eine Familie leihen. …Frau Brügge: „Leihen? Nein. Behalten.“"}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Dankeskarte (Entwurf, Start Typing, Delete, Start)",text:`»Liebe Frau Brügge,

ich möchte mich bedanken. Für Heiligabend,
für die Socken (sie passen — natürlich passen sie),
für eine Bescherung, die besinnlich war
und nicht stressig.

Ich habe Ihnen nichts dafür gekauft.
Ich backe dafür. Jeden ersten Sonntag.
Das ist ein Versprechen und ein Rezept.

— Sam«`,translation:`'Dear Ms Brügge,

I want to say thank you. For Christmas Eve,
for the socks (they fit — of course they fit),
for an evening of presents that was contemplative
and not stressful.

I didn't buy you anything for it.
Instead I'll bake. Every first Sunday.
That's a promise and a recipe.

— Sam'`,itemIds:["sich-bedanken","die-socke","besinnlich"]},{type:"narration",text:"Dann singt ihr doch — „Stille Nacht“, zweistimmig, mit Tobias als-mobilem-Stimmungsproblem und Luise als Rhythmusabteilung. Draußen schneit es nicht, aber es riecht nach Schnee und Kerzen und Kaffee. Besinnlich ist das richtige Wort. Du hast es gelernt, und du hast es verstanden."}]}],Ha={episode:Xt,cast:en,items:tn,scenes:nn},Na=Object.freeze(Object.defineProperty({__proto__:null,cast:en,default:Ha,episode:Xt,items:tn,scenes:nn},Symbol.toStringTag,{value:"Module"})),rn={id:"a2e13",arcId:"A2",cefrLevel:"A2",title:"Die erste Party",titleEn:"The first party",blurb:"Sam lädt zum ersten Mal selbst ein: Wohnung, Musik, Bowle, Gästeliste. Alles kann schiefgehen — außer dem-plan, und der heißt: einfach machen.",order:17,sceneIds:["a2e13s1","a2e13s2","a2e13s3"]},an=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"mei",name:"Mei",role:"Kollegin im Café"},{id:"deniz",name:"Deniz",role:"Nachbar"},{id:"luise",name:"Luise",role:"Café-Besitzerin"}],sn=[{id:"die-planung",type:"word",german:"die Planung",meaning:"the planning",image:"kalender",audio:"tts",introducedInScene:"a2e13s1",tags:["admin","party"],cefrLevel:"A2",note:"die, Plural: die Planungen — planen; „ ohne Planung läuft nichts“"},{id:"die-gaesteliste",type:"word",german:"die Gästeliste",meaning:"the guest list",image:"liste",audio:"tts",introducedInScene:"a2e13s1",tags:["party","people"],cefrLevel:"A2",note:"die, Plural: die Gästelisten — wer kommt, wer kommt nicht"},{id:"entweder-oder",type:"grammar_pattern",german:"___ Samstag oder Sonntag?",meaning:"Either Saturday or Sunday?",image:"entscheidung",audio:"tts",introducedInScene:"a2e13s1",tags:["grammar","party"],cefrLevel:"A2",cloze:"Entweder",speak:"Entweder Samstag oder Sonntag?",note:"entweder … oder — nur eine Option, klare Wahl"},{id:"der-snack",type:"word",german:"der Snack",meaning:"the snack",image:"popcorn",audio:"tts",introducedInScene:"a2e13s1",tags:["food","party"],cefrLevel:"A2",note:"der, Plural: die Snacks — Niemand isst nur Chips. Lüg nicht."},{id:"die-getraenke",type:"word",german:"die Getränke",meaning:"the drinks (plural)",image:"getränk",audio:"tts",introducedInScene:"a2e13s1",tags:["food","party"],cefrLevel:"A2",note:"Plural: die Getränke — kalt stellen VOR der Party"},{id:"der-einkaufszettel",type:"word",german:"der Einkaufszettel",meaning:"the shopping list",image:"liste",audio:"tts",introducedInScene:"a2e13s1",tags:["shopping","party"],cefrLevel:"A2",note:"der, Plural: die Einkaufszettel — hilft, hilft, hilft"},{id:"dekorieren",type:"word",german:"dekorieren",meaning:"to decorate",image:"blumen",audio:"tts",introducedInScene:"a2e13s2",tags:["party","home"],cefrLevel:"A2",note:"dekorieren — das Wohnzimmer, den Tisch, alles"},{id:"die-auswahl",type:"word",german:"die Auswahl",meaning:"the selection / choice",image:"entscheidung",audio:"tts",introducedInScene:"a2e13s2",tags:["party","opinion"],cefrLevel:"A2",note:"die, Plural: die Auswahlen — eine große Auswahl an …"},{id:"die-runde",type:"word",german:"die Runde",meaning:"the round / circle (of people)",image:"team",audio:"tts",introducedInScene:"a2e13s2",tags:["party","people"],cefrLevel:"A2",note:"die, Plural: die Runden — eine Runde drehen; eine Runde geben"},{id:"die-bowle",type:"word",german:"die Bowle",meaning:"the punch (big bowl)",image:"getränk",audio:"tts",introducedInScene:"a2e13s2",tags:["food","party"],cefrLevel:"A2",note:"die, Plural: die Bowlen — Erdbeer-Minze-Bowle von Luise"},{id:"der-sitzsack",type:"word",german:"der Sitzsack",meaning:"the beanbag",image:"stuhl",audio:"tts",introducedInScene:"a2e13s2",tags:["home","party"],cefrLevel:"A2",note:"der, Plural: die Sitzsäcke — Tobias' contribution, schwer wie ein Mensch"},{id:"die-beleuchtung",type:"word",german:"die Beleuchtung",meaning:"the lighting",image:"lampe",audio:"tts",introducedInScene:"a2e13s2",tags:["home","party"],cefrLevel:"A2",note:"die, Plural: die Beleuchtungen — warmes Licht = halbe Party"},{id:"die-begruessung",type:"word",german:"die Begrüßung",meaning:"the greeting / welcome",image:"gespräch",audio:"tts",introducedInScene:"a2e13s3",tags:["politeness","party"],cefrLevel:"A2",note:"die, Plural: die Begrüßungen — jemanden begrüßen"},{id:"der-smalltalk",type:"word",german:"der Smalltalk",meaning:"small talk",image:"gespräch",audio:"tts",introducedInScene:"a2e13s3",tags:["people","party"],cefrLevel:"A2",note:"der ( Singular ) — Smalltalk machen: Wetter, Wohnungen, Wörter"},{id:"der-lacher",type:"word",german:"der Lacher",meaning:"the laugh / gag",image:"person",audio:"tts",introducedInScene:"a2e13s3",tags:["feelings","party"],cefrLevel:"A2",note:"der, Plural: die Lacher — ein Lacher ist garantiert"},{id:"die-stille",type:"word",german:"die Stille",meaning:"the silence",image:"ruhe",audio:"tts",introducedInScene:"a2e13s3",tags:["feelings","party"],cefrLevel:"A2",note:"die ( Singular ) — nach der Party: eine freundliche Stille"},{id:"der-abschied",type:"word",german:"der Abschied",meaning:"the farewell",image:"person",audio:"tts",introducedInScene:"a2e13s3",tags:["people","party"],cefrLevel:"A2",note:"der, Plural: die Abschiede — sich verabschieden VON"},{id:"servieren",type:"word",german:"servieren",meaning:"to serve",image:"teller",audio:"tts",introducedInScene:"a2e13s3",tags:["food","party"],cefrLevel:"A2",note:"servieren — Snacks, Getränke, Komplimente"}],on=[{id:"a2e13s1",episodeId:"a2e13",title:"Die Gästeliste",titleEn:"The guest list",place:"Wohnung, Küchentisch, mit Papier",bg:"wohnung",contextTags:["party","friends","home"],requiredItems:["danke-fuer-die-einladung","das-geschenk"],introducedItems:["die-planung","die-gaesteliste","entweder-oder","der-snack","die-getraenke","der-einkaufszettel"],beats:[{type:"narration",text:"Ein Jahr in Leipzig, und du hast noch nie selbst eingeladen. Das ändert sich: Samstag, deine Wohnung, „einfach so, zum Kennenlernen voneinander“ — Tobias' Vorschlag, dein Zettel, deine Nervosität."},{type:"line",speaker:"tobias",text:"Regel eins der Planung: Die Gästeliste entscheidet alles. …Sieben Leute, kleine Wohnung — perfekt. Groß genug für Musik, klein genug für Gespräche. …Und jetzt: Einkaufszettel. Was servierst du?",translation:"Rule one of planning: the guest list decides everything. …Seven people, small flat — perfect. Big enough for music, small enough for conversations. …And now: shopping list. What are you serving?"},{type:"meet",itemIds:["die-planung","die-gaesteliste","der-einkaufszettel"]},{type:"meet",itemIds:["der-snack","die-getraenke","entweder-oder"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Termin-Frage aus der Gruppe: „Entweder Samstag oder Sonntag?“",options:[{label:"Samstag! Sonntags sind alle müde und getragen vom Gewissen.",line:"Samstag! Sonntags sind alle müde und moralisch belastet. …Tobias: „Poetisch. Und richtig.“"},{label:"Samstag. Und ich schicke heute noch die Einladung, sonst wird nichts.",line:"Samstag. Und ich schicke die Einladung HEUTE noch, sonst passiert es nie."}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Dein Einkaufszettel (Entwurf 3)",text:`PARTY SAMSTAG — EINKAUF

Snacks:
— Chips (2 Sorten, wegen Lina)
— Weintrauben (Luise isst die)
— Nüsse (Deniz' Vater sagt, die sind gesund)

Getränke:
— Apfelschorle 4 Flaschen
— Wasser ADE, 6 Flaschen
— SAFT für Tobias (er fährt Rad)

Taschentücher. Warum? Sicherheit.`,translation:`PARTY SATURDAY — SHOPPING

Snacks:
— crisps (2 kinds, because of Lina)
— grapes (Luise eats them)
— nuts (Deniz's father says they're healthy)

Drinks:
— apple spritzer, 4 bottles
— still water, 6 bottles
— JUICE for Tobias (he cycles)

Tissues. Why? Safety.`}]},{id:"a2e13s2",episodeId:"a2e13",title:"Vorbereitung mit Panik",titleEn:"Preparation with panic",place:"Wohnung, Samstagnachmittag",bg:"wohnung",contextTags:["party","home","friends"],requiredItems:["die-musik","wischen"],introducedItems:["dekorieren","die-auswahl","die-runde","die-bowle","der-sitzsack","die-beleuchtung"],beats:[{type:"narration",text:"Vier Stunden vor Start: Tobias schlept einen Sitzsack die vierte Etage hoch („mein Beitrag“), Mei kuratiert die Musikauswahl wie ein Museum, und Luise bringt eine Bowle, die groß genug für ein Schwimmbad ist."},{type:"line",speaker:"mei",text:"Die Auswahl: drei Stunden Deutsch-Pop, zwei Stunden spanische Traurigkeit für Sara, und am Ende Jazz, wenn alle müde sind. …Musik ist wie Sprache: Du musst fühlen, wer zuhören will. …Und: DEINE Wohnung, DEINE Musik. Regeln.",translation:"The selection: three hours of German pop, two hours of Spanish sadness for Sara, and jazz at the end when everyone's tired. …Music is like language: you have to feel who wants to listen. …And: YOUR flat, YOUR music. Rules."},{type:"meet",itemIds:["die-auswahl","der-sitzsack"]},{type:"line",speaker:"luise",text:"Die Bowle: Erdbeeren, Minze, Apfelschorle, ein Hauch Sommer im Dezember. …Du servierst sie mit Löffel, nicht mit Strohhalm — wir sind hier nicht im Wilden Westen. …Und jetzt: Runde drehen, Kerzen, Licht. Warme Beleuchtung. Sofort.",translation:"The punch: strawberries, mint, apple spritzer, a hint of summer in December. …You serve it with a ladle, not a straw — this isn't the Wild West. …And now: do a round, candles, light. Warm lighting. Immediately."},{type:"meet",itemIds:["die-bowle","die-beleuchtung"]},{type:"meet",itemIds:["dekorieren","die-runde"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Wischmopp in der Hand, 40 Minuten vor den ersten Gästen. Luise: „Perfektionist.“",options:[{label:"Ich wische nochmal die Ecke. Gäste schauen UNTEN.",line:"Ich wische nochmal die Ecke. Gäste schauen nach UNTEN, nicht nach oben. Erfahrung aus dem Frühjahrsputz."},{label:"Fertig! Ab jetzt: Musik laut, Fenster auf, Panik aus.",line:"Fertig! Ab jetzt Musik laut, Fenster auf, Panik aus. …Luise: „So klingt ein Gastgeber. Behalt das.“"}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Bowle-Rezept (Luise diktiert, Sam schreibt)",text:`ERDBEER-MINZE-BOWLE (Partygröße)

2 Schälchen Erdbeeren, viertelt
1 Bund Minze, zupfen (nicht schneiden!)
2 Flaschen Apfelschorle · 1 Flasche Mineral
Eis: VIEL. Becher: mehr als du denkst.

Auswahl der Gäste respektieren:
wasser daneben stellen. Immer.
Beleuchtung dimmen kurz vor Ankunft der ersten.

»Servieren mit Löffel. Strohhalme sind Deko.«`,translation:`STRAWBERRY-MINT PUNCH (party size)

2 baskets of strawberries, quartered
1 bunch of mint, plucked (not cut!)
2 bottles apple spritzer · 1 bottle sparkling water
Ice: PLENTY. Cups: more than you think.

Respect the guests' choice:
put water next to it. Always.
Dim the lighting shortly before the first ones arrive.

'Serve with a ladle. Straws are decoration.'`,itemIds:["die-bowle","die-auswahl","die-beleuchtung"]}]},{id:"a2e13s3",episodeId:"a2e13",title:"Klingeln, Lachen, Stille",titleEn:"Ring, laugh, silence",place:"Wohnung, Samstagabend bis Sonntagfrüh",bg:"wohnung",contextTags:["party","friends","feelings"],requiredItems:["der-gast","muede"],introducedItems:["die-begruessung","der-smalltalk","der-lacher","die-stille","der-abschied","servieren"],beats:[{type:"narration",text:"18:59: Die Klingel. Frau Brügge kommt mit einer Kerze, Lina (auf zwei Stunden) mit selbstgemalten Platzkarten, Deniz mit Nüssen, Sara mit spanischem Käse, Mei mit einer Playlist und Luise mit Wein und Lautstärke."},{type:"line",speaker:"mei",text:"Deine Begrüßung, dein Lachen, deine Party. …Und weißt du, was gut aussieht? Alle reden mit allen. …Smalltalk auf Deutsch, Bowle in der Hand, sieben Leute in einer Wohnung — das IST Integration, Sam. Sag das niemandem, der es nervig findet.",translation:"Your greeting, your laugh, your party. …And you know what looks good? Everyone talking to everyone. …Small talk in German, punch in hand, seven people in one flat — that IS integration, Sam. Don't tell anyone who finds that annoying."},{type:"meet",itemIds:["die-begruessung","der-smalltalk","der-lacher"]},{type:"line",speaker:"frau-bruegge",text:"(mit leerem Teller) Der Kartoffelsalat ist heute weg, hm? …Junger Mann: Du hast heute acht Menschen gefüttert, unterhalten und müde gemacht. …Das ist mehr, als manche Vereine in einem Jahr schaffen.",translation:"(with an empty plate) The potato salad is gone today, hm? …Young man: today you fed, entertained and tired out eight people. …That's more than some clubs manage in a year."},{type:"meet",itemIds:["die-stille","der-abschied","servieren"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mitternacht minus zwei Stunden. Die letzte Runde geht. Verabschiede deine Gäste.",options:[{label:"Danke, dass ihr da wart. Nächste Party gibt es im Frühling.",line:"Danke, dass ihr da wart. Die nächste Party gibt es im Frühling — mit Garten, versprochen."},{label:"Bleibt noch auf einen Tee? Die Stille ist auch schön.",line:"Bleibt noch jemand auf einen Tee? Die Stille danach ist auch schön. …Bleiben alle. Natürlich."}]},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Später: Teller in der Spüle, Stühle schief, der Sitzsack erobert die ganze Ecke. Die Stille ist freundlich, nicht leer. Auf deinem Zettel steht unter „PARTY“ ein Häkchen — und daneben, neu: „nächste Mal: mehr Stühle.“ Deine erste Party auf Deutsch ist Geschichte. Die Stadt hat es gemerkt."}]}],Ga={episode:rn,cast:an,items:sn,scenes:on},Ra=Object.freeze(Object.defineProperty({__proto__:null,cast:an,default:Ga,episode:rn,items:sn,scenes:on},Symbol.toStringTag,{value:"Module"})),dn={id:"a2e2",arcId:"A2",cefrLevel:"A2",title:"Der Probetag im Café",titleEn:"The trial day at the café",blurb:"Luise sucht Verstärkung. Lebenslauf, Schürze, Kasse — dein erster deutscher Arbeitstag.",order:6,sceneIds:["a2e2s1","a2e2s2","a2e2s3"]},ln=[{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"kunde",name:"Herr Sandig",role:"Stammkunde"}],cn=[{id:"die-stelle",type:"word",german:"die Stelle",meaning:"the job / position",image:"stelle",audio:"tts",introducedInScene:"a2e2s1",tags:["work","job"],cefrLevel:"A2",note:"die, Plural: die Stellen"},{id:"ich-bewerbe-mich",type:"grammar_pattern",german:"Ich bewerbe mich als ___.",meaning:"I'm applying as ___.",audio:"tts",introducedInScene:"a2e2s1",tags:["work","job","career"],cefrLevel:"A2",cloze:"Kellner",alt:["Kellnerin","Servicekraft","Barista"],speak:"Ich bewerbe mich als Kellner.",note:"sich bewerben als + Beruf (ohne Artikel)"},{id:"der-lebenslauf",type:"word",german:"der Lebenslauf",meaning:"the CV / résumé",image:"lebenslauf",audio:"tts",introducedInScene:"a2e2s1",tags:["work","job","paperwork"],cefrLevel:"A2",note:"der, Plural: die Lebensläufe — wörtlich: der Lebens-Lauf"},{id:"die-erfahrung",type:"word",german:"die Erfahrung",meaning:"the experience",image:"idee",audio:"tts",introducedInScene:"a2e2s1",tags:["work","job"],cefrLevel:"A2",note:"die, Plural: die Erfahrungen"},{id:"ich-lerne-schnell",type:"sentence",german:"Ich lerne schnell.",meaning:"I learn fast.",audio:"tts",introducedInScene:"a2e2s1",tags:["work","job"],cefrLevel:"A2",note:"Der ehrlichste Satz in jedem Vorstellungsgespräch."},{id:"der-probetag",type:"word",german:"der Probetag",meaning:"the trial day",image:"kalender",audio:"tts",introducedInScene:"a2e2s1",tags:["work","job"],cefrLevel:"A2",note:"der, Plural: die Probetage"},{id:"die-schuerze",type:"word",german:"die Schürze",meaning:"the apron",image:"schürze",audio:"tts",introducedInScene:"a2e2s2",tags:["work","cafe"],cefrLevel:"A2",note:"die, Plural: die Schürzen"},{id:"die-kasse",type:"word",german:"die Kasse",meaning:"the cash register / till",image:"kasse",audio:"tts",introducedInScene:"a2e2s2",tags:["work","cafe","money"],cefrLevel:"A2",note:"die, Plural: die Kassen"},{id:"der-kunde",type:"word",german:"der Kunde",meaning:"the customer",image:"kunde",audio:"tts",introducedInScene:"a2e2s2",tags:["work","cafe"],cefrLevel:"A2",note:"der, Plural: die Kunden; weiblich: die Kundin"},{id:"was-darf-es-sein",type:"sentence",german:"Was darf es sein?",meaning:"What would you like? (service standard)",audio:"tts",introducedInScene:"a2e2s2",tags:["work","cafe","request"],cefrLevel:"A2",note:"Höfliche Standardfrage — hinter jeder Theke Deutschlands"},{id:"die-tasse",type:"word",german:"die Tasse",meaning:"the cup",image:"kaffee",audio:"tts",introducedInScene:"a2e2s2",tags:["cafe","objects"],cefrLevel:"A2",note:"die, Plural: die Tassen"},{id:"gleich-fertig",type:"chunk",german:"Gleich fertig!",meaning:"Almost done!",audio:"tts",introducedInScene:"a2e2s2",tags:["work","cafe"],cefrLevel:"A2"},{id:"der-vertrag",type:"word",german:"der Vertrag",meaning:"the contract",image:"vertrag",audio:"tts",introducedInScene:"a2e2s3",tags:["work","paperwork"],cefrLevel:"A2",note:"der, Plural: die Verträge"},{id:"die-stunde",type:"word",german:"die Stunde",meaning:"the hour",image:"urehr",audio:"tts",introducedInScene:"a2e2s3",tags:["work","time","money"],cefrLevel:"A2",note:'die, Plural: die Stunden — „zwölf Euro die Stunde"'},{id:"der-lohn",type:"word",german:"der Lohn",meaning:"the wage / pay",image:"münzen",audio:"tts",introducedInScene:"a2e2s3",tags:["work","money"],cefrLevel:"A2",note:"der (meist Singular)"},{id:"die-unterschrift",type:"word",german:"die Unterschrift",meaning:"the signature",image:"unterschrift",audio:"tts",introducedInScene:"a2e2s3",tags:["work","paperwork"],cefrLevel:"A2",note:"die, Plural: die Unterschriften"},{id:"der-feierabend",type:"word",german:"der Feierabend",meaning:"the end of the working day",image:"sonnenuntergang",audio:"tts",introducedInScene:"a2e2s3",tags:["work","time"],cefrLevel:"A2",note:"der — ein deutsches Urlaubsgefühl in einem Wort"},{id:"herzlich-willkommen-im-team",type:"chunk",german:"Herzlich willkommen im Team!",meaning:"A warm welcome to the team!",audio:"tts",introducedInScene:"a2e2s3",tags:["work","friends"],cefrLevel:"A2"}],hn=[{id:"a2e2s1",episodeId:"a2e2",title:"Bewerben bei Luise",titleEn:"Applying with Luise",place:"Café Luise, Nachmittag",bg:"cafe",contextTags:["work","job","cafe"],requiredItems:["der-kaffee"],introducedItems:["die-stelle","ich-bewerbe-mich","der-lebenslauf","die-erfahrung","ich-lerne-schnell","der-probetag"],beats:[{type:"narration",text:"Ein Zettel im Fenster von Café Luise: „Suche Hilfe hinter der Theke. Sprechen: nötig. Lächeln: nötig. Perfektion: überbewertet.“"},{type:"meet",itemIds:["die-stelle","ich-bewerbe-mich","der-lebenslauf"]},{type:"line",speaker:"luise",text:"Du? Na super. Ich brauche jemanden ab morgen. Hast du schon mal in der Gastronomie gearbeitet?",translation:"You? Great. I need someone from tomorrow. Have you ever worked in hospitality?"},{type:"meet",itemIds:["die-erfahrung","ich-lerne-schnell","der-probetag"]},{type:"choice",prompt:"Verkaufe dich. Mit Wahrheit.",options:[{label:"Ich lerne schnell. Und Kaffee mag ich.",line:"Ich lerne schnell. Und Kaffee mag ich sehr."},{label:"Ehrlich: wenig Erfahrung. Aber Lust.",line:"Ehrlich gesagt: wenig Erfahrung. Aber Lust."}]},{type:"line",speaker:"luise",text:"Lust ist der Anfang von Erfahrung. …Mach einen Probetag. Morgen, acht Uhr. Schürze gibt's hier.",translation:"Desire is the start of experience. …Do a trial day. Tomorrow, eight a.m. Apron's provided here."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Stellenanzeige (Aushang, angeschaut von 14 Leuten)",text:`CAFÉ LUISE SUCHT VERSTÄRKUNG

Teilzeit, ab sofort, Kaffee inklusive.

Du bringst mit:
— einen Lebenslauf (Ehrlichkeit zählt mehr als Erfahrung)
— Lust auf frühe Stunden und laute Gäste
— die Fähigkeit, schnell zu lernen

Probetag: angefragt = gefunden.

»Wir stellen nicht den besten Kaffee an.
 Wir stellen die besten Leute ein.«`,translation:`CAFÉ LUISE IS LOOKING FOR BACKUP

Part-time, immediately, coffee included.

You bring:
— a CV (honesty counts more than experience)
— appetite for early hours and loud guests
— the ability to learn fast

Trial day: asked = found.

'We don't hire the best coffee.
We hire the best people.'`,itemIds:["die-stelle","der-lebenslauf","der-probetag"]},{type:"narration",text:"Du gehst mit einem Mittwoch-Termin und einem kleinen Pulsrasen nach Hause. Bewerbung: abgehakt."}]},{id:"a2e2s2",episodeId:"a2e2",title:"Hinter der Theke",titleEn:"Behind the counter",place:"Café Luise, 8:00 Uhr",bg:"cafe",contextTags:["work","cafe","service"],requiredItems:["ich-haette-gern","der-kaffee"],introducedItems:["die-schuerze","die-kasse","der-kunde","was-darf-es-sein","die-tasse","gleich-fertig"],beats:[{type:"line",speaker:"luise",text:"Guten Morgen, Probekraft! Schürze schnüren, Hände waschen, Maschine an. …Und lächeln kostet hier nichts.",translation:"Good morning, trial staff! Tie your apron, wash your hands, machine on. …And smiling costs nothing here."},{type:"meet",itemIds:["die-schuerze","die-kasse","die-tasse"]},{type:"meet",itemIds:["der-kunde","was-darf-es-sein","gleich-fertig"]},{type:"line",speaker:"kunde",text:"Ich hätte gern einen Kaffee mit Milch und ein Wasser.",translation:"I'd like a coffee with milk and a water."},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Dein erster Kunde steht da.",options:[{label:"Was darf es sein? …Oh — schon gesagt.",line:"Was darf es sein? …Oh — haben Sie schon gesagt."},{label:"Gleich fertig! Ein Kaffee mit Milch und ein Wasser.",line:"Gleich fertig! Ein Kaffee mit Milch und ein Wasser."}]},{type:"line",speaker:"kunde",text:"Stark, das Tempo! Du machst das ja wie ein Profi.",translation:"Nice pace! You're doing this like a pro."},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Um elf Uhr drängelt sich eine ganze Mittagspause durch die Tür. Die Kasse klickt. Luise beobachtet dich über den Milchschaum und nickt langsam."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Schichtplan – Café Luise (Probewoche)",text:`MO 7:00 Luise+Sam   (Kasse: Luise)
DI 7:00 Sam allein? fast. Mei ab 9.
MI 7:00 Sam         (Lieferung ca. 7:30)
DO frei             (Deutschkurs!)
FR 7:00 Sam+Luise   (Kuchentag)
SA 8:00 Sam+Mei     (Stress-Familienfrühstück)

sagt „Was darf es sein?“ — auch bei Stress.
BESONDERS bei Stress.`,translation:`MON 7:00 Luise+Sam  (till: Luise)
TUE 7:00 Sam alone? almost. Mei from 9.
WED 7:00 Sam        (delivery ~7:30)
THU off             (German course!)
FRI 7:00 Sam+Luise  (cake day)
SAT 8:00 Sam+Mei    (stressful family breakfasts)

tin"},{id:"apotheker",name:"Herr Özdemir",role:"Apotheker"},{id:"luise",name:"Luise",role:"Café-Besitzerin"}],mn=[{id:"die-praxis",type:"word",german:"die Praxis",meaning:"the doctor's practice / office",image:"praxis",audio:"tts",introducedInScene:"a2e3s1",tags:["health","doctor"],cefrLevel:"A2",note:"die, Plural: die Praxen"},{id:"der-husten",type:"word",german:"der Husten",meaning:"the cough",image:"thermos",audio:"tts",introducedInScene:"a2e3s1",tags:["health","sick"],cefrLevel:"A2"},{id:"das-fieber",type:"word",german:"das Fieber",meaning:"the fever",image:"thermos",audio:"tts",introducedInScene:"a2e3s1",tags:["health","sick"],cefrLevel:"A2"},{id:"krank",type:"word",german:"krank",meaning:"sick / ill",image:"thermos",audio:"tts",introducedInScene:"a2e3s1",tags:["health","sick"],cefrLevel:"A2",note:"Adjektiv — „Ich bin krank.“ Genau so einfach."},{id:"ich-fuehle-mich-nicht-gut",type:"sentence",german:"Ich fühle mich nicht gut.",meaning:"I don't feel well.",audio:"tts",introducedInScene:"a2e3s1",tags:["health","sick"],cefrLevel:"A2"},{id:"die-untersuchung",type:"word",german:"die Untersuchung",meaning:"the examination",image:"stethoskop",audio:"tts",introducedInScene:"a2e3s1",tags:["health","doctor"],cefrLevel:"A2",note:"die, Plural: die Untersuchungen"},{id:"die-apotheke",type:"word",german:"die Apotheke",meaning:"the pharmacy",image:"apotheke",audio:"tts",introducedInScene:"a2e3s2",tags:["health","pharmacy"],cefrLevel:"A2",note:"die, Plural: die Apotheken — rotes A, nicht grünes Kreuz"},{id:"das-medikament",type:"word",german:"das Medikament",meaning:"the medication",image:"pille",audio:"tts",introducedInScene:"a2e3s2",tags:["health","pharmacy"],cefrLevel:"A2",note:"das, Plural: die Medikamente — umgangssprachlich: die Tabletten"},{id:"das-rezept",type:"word",german:"das Rezept",meaning:"the prescription (and: the recipe)",image:"formular",audio:"tts",introducedInScene:"a2e3s2",tags:["health","pharmacy"],cefrLevel:"A2",note:"das, Plural: die Rezepte — doppelt v tion, and you stay in bed for two days."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Patientenbogen (Praxis Dr. Kern)",text:`Name: ………………………………

oliteness","questions"],cefrLevel:"A2",note:'unter Freunden: „Kannst du mir helfen?"'},{id:"das-werkzeug",type:"word",german:"das Werkzeug",meaning:"the tools",image:"werkzeug",audio:"tts",introducedInScene:"a2e4s2",tags:["repair","objects"],cefrLevel:"A2",note:"das ( Sammelbegriff )"},{id:"reparieren",type:"chunk",german:"Ich repariere das.",meaning:"I'll repair that.",audio:"tts",introducedInScene:"a2e4s2",tags:["repair"],cefrLevel:"A2"},{id:"ist-es-fertig",type:"chunk",german:"Ist es fertig?",meaning:"Is it done?",audio:"tts",introducedInScene:"a2e4s2",tags:["repair","questions"],cefrLevel:"A2"},{id:"zum-glueck",type:"chunk",german:"Zum Glück!",meaning:"Luckily! / Thank goodness!",audio:"tts",introducedInScene:"a2e4s2",tags:["smalltalk"],cefrLevel:"A2"},{id:"danke-fuer-deine-hilfe",type:"sentence",german:"Danke für deine Hilfe!",meaning:"Thanks for your help!",audio:"tts",introducedInScene:"a2e4s2",tags:["politeness","friends"],cefrLevel:"A2"},{id:"der-steg",type:"word",german:"der Steg",meaning:"the (wooden) jetty / boardwalk",image:"wasser",audio:"tts",introducedInScene:"a2e4s3",tags:["leisure","friends"],cefrLevel:"A2",note:"der, Plural: die Stege — am See, über dem Moor"},{id:"die-fahrt",type:"word",german:"die Fahrt",meaning:"the ride / journey",image:"tram",audio:"tts",introducedInScene:"a2e4s3",tags:["transport","leisure"],cefrLevel:"A2",note:"die, Plural: die Fahrten — gute Fahrt!"},{id:"der-see",type:"word",german:"der See",meaning:"the lake",image:"wasser",audio:"tts",introducedInScene:"a2e4s3",tags:["nature","leisure"],cefrLevel:"A2",note:"der, Plural: die Seen — Leipzig hat viele: Cospudener See, Auensee"},{id:"die-luft",type:"word",german:"die Luft",meaning:"the air",image:"wetter",audio:"tts",introducedInScene:"a2e4s3",tags:["nature"],cefrLevel:"A2",note:"die ( Singular ) — Luft in den Reifen; an der frischen Luft"},{id:"sich-ausruhen",type:"chunk",german:"Ich ruhe mich ein bisschen aus.",meaning:"I'm resting a bit.",image:"ruhe",audio:"tts",introducedInScene:"a2e4s3",tags:["health","leisure"],cefrLevel:"A2",speak:"Ich ruhe mich ein bisschen aus.",note:"sich ausruhen — reflexiv, wie sich freuen"},{id:"froh",type:"word",german:"froh",meaning:"glad",image:"sonnenuntergang",audio:"tts",introducedInScene:"a2e4s3",tags:["feelings"],cefrLevel:"A2",note:"froh sein über + Akkusativ — etwas stärker als glücklich? Nein: anders. Einfach froh."}],wn=[{id:"a2e4s1",episodeId:"a2e4",title:"Platter Reifen",titleEn:"Flat tire",place:"Elsterflutbecken, Radweg",bg:"park",contextTags:["bike","transport","problem"],requiredItems:[],introducedItems:["das-fahrrad","der-reifen","kaputt","die-werkstatt","mein-fahrrad-ist-kaputt","koennen-sie-mir-helfen"],beats:[{type:"narration",text:"Freier Tag, Fahrt an der Elster entlang. Dann: ein Geräusch wie ein genervtes Publikum. Der Hinterreifen liegt flach wie ein Pfannkuchen."},{type:"meet",itemIds:["das-fahrrad","der-reifen","kaputt"]},{type:"line",speaker:"tobias",text:"Sam? Was machst du denn hier am Radweg rum? …Oh. Der Reifen ist ja komplett kaputt.",translation:"Sam? What are you doing hanging around the bike path? …Oh. The tire is completely flat."},{type:"meet",itemIds:["die-werkstatt","mein-fahrrad-ist-kaputt","koennen-sie-mir-helfen"]},{type:"choice",prompt:"Tobias schaut unbeschwert.",options:[{label:"Mein Fahrrad ist kaputt. Hilfe!",line:"Mein Fahrrad ist kaputt. Hilfe!"},{label:"Ich schiebe es zur Werkstatt. …Irgendwohin.",line:"Ich schiebe es zur Werkstatt. …Irgendwohin."}]},{type:"line",speaker:"tobias",text:"Warte — ich ruf Jonas an. Der ist Handwerker und hat eine Werkstatt im Hinterhof. Kommt gleich!",translation:"Wait — I'll call Jonas. He's a craftsman with a workshop in the back yard. He's coming!"},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"SMS-Kette: Tobias ↔ Jonas",text:`TOBIAS: Sam liegt am Radweg. Reifen tot.

omes from behind, and at the jetty there's water, sun, and people who don't want anything repaired. My favourite people."},{type:"line",speaker:"tobias",text:"Und jetzt: ausruhen. Ihr wisst, das ist mein Talent. Ich ruhe mich aus wie andere Sport treiben.",translation:"And now: resting. You know that's my talent. I relax the way other people do sports."},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Ihr sitzt am Steg, die Räder liegen im Gras, irgendwo spielt jemand Gitarre. Vor vier Wochen bist du an Gleis 7 gestanden und hast nichts verstanden. Heute verstehst du sogar Jonas' Werkstatt-Witze. Meistens. Die Luft riecht nach Wasser und Sommer — und du bist einfach froh."}]}],Oa={episode:fn,cast:bn,items:kn,scenes:wn},Va=Object.freeze(Object.defineProperty({__proto__:null,cast:bn,default:Oa,episode:fn,items:kn,scenes:wn},Symbol.toStringTag,{value:"Module"})),yn={id:"a2e5",arcId:"A2",cefrLevel:"A2",title:"Der erste Lohn",titleEn:"The first wage",blurb:"Erstes Geld, erstes Konto, erster Dauerauftrag. Deutschland bürokratisch zu lieben beginnt beim Banktermin.",order:9,sceneIds:["a2e5s1","a2e5s2","a2e5s3"]},vn=[{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"bankfrau",name:"Frau Weißenfels",role:"Bankangestellte"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"}],Sn=[{id:"das-geld",type:"word",german:"das Geld",meaning:"the money",image:"münzen",audio:"tts",introducedInScene:"a2e5s1",tags:["money","bank"],cefrLevel:"A2",note:"das ( Singular ) — Plural selten: die Gelder"},{id:"die-bank",type:"word",german:"die Bank",meaning:"the bank (also: the bench!)",image:"bank",audio:"tts",introducedInScene:"a2e5s1",tags:["bank","money","city"],cefrLevel:"A2",note:"die, Plural: die Banken — die Bank = auch die Sitzbank. Kontext entscheidet."},{id:"das-konto",type:"word",german:"das Konto",meaning:"the (bank) account",image:"bank",audio:"tts",introducedInScene:"a2e5s1",tags:["bank","money"],cefrLevel:"A2",note:"das, Plural: die Konten"},{id:"die-bankkarte",type:"word",german:"die Bankkarte",meaning:"the bank card",image:"geld",audio:"tts",introducedInScene:"a2e5s1",tags:["bank","money"],cefrLevel:"A2",note:"die, Plural: die Bankkarten"},{id:"der-lohn-ist-da",type:"sentence",german:"Der Lohn ist da!",meaning:"The wage has arrived!",image:"münzen",audio:"tts",introducedInScene:"a2e5s1",tags:["money","work"],cefrLevel:"A2",parentId:"der-lohn"},{id:"geld-abheben",type:"chunk",german:"Ich möchte Geld abheben.",meaning:"I'd like to withdraw money.",image:"bank",audio:"tts",introducedInScene:"a2e5s1",tags:["bank","money","request"],cefrLevel:"A2",note:"abheben = ab + heben, trennbar"},{id:"konto-eroeffnen",type:"grammar_pattern",german:"Ich möchte ein Konto ___.",meaning:"I'd like to open an account.",image:"bank",audio:"tts",introducedInScene:"a2e5s2",tags:["bank","money","request"],cefrLevel:"A2",cloze:"eröffnen",speak:"Ich möchte ein Konto eröffnen.",note:"möchte + Infinitiv am Satzende"},{id:"die-geheimzahl",type:"word",german:"die Geheimzahl",meaning:"the PIN",image:"prüfen",audio:"tts",introducedInScene:"a2e5s2",tags:["bank","money"],cefrLevel:"A2",note:"die, Plural: die Geheimzahlen — geheim = secret"},{id:"ueberweisen",type:"chunk",german:"Ich überweise die Miete.",meaning:"I'm transferring the rent.",image:"münzen",audio:"tts",introducedInScene:"a2e5s2",tags:["bank","money"],cefrLevel:"A2",note:"überweisen — Geld geht von Konto zu Konto"},{id:"der-dauerauftrag",type:"word",german:"der Dauerauftrag",meaning:"the standing order",image:"kalender",audio:"tts",introducedInScene:"a2e5s2",tags:["bank","money","admin"],cefrLevel:"A2",note:"der, Plural: die Daueraufträge — die Miete zahlt sich jetzt selbst"},{id:"der-kontostand",type:"word",german:"der Kontostand",meaning:"the account balance",image:"prüfen",audio:"tts",introducedInScene:"a2e5s2",tags:["bank","money"],cefrLevel:"A2",note:"der, Plural: die Kontostände"},{id:"die-bankverbindung",type:"word",german:"die Bankverbindung",meaning:"the bank details",image:"formular",audio:"tts",introducedInScene:"a2e5s2",tags:["bank","paperwork"],cefrLevel:"A2",note:"die, Plural: die Bankverbindungen — IBAN & Co."},{id:"die-ueberweisung",type:"word",german:"die Überweisung",meaning:"the bank transfer",image:"brief",audio:"tts",introducedInScene:"a2e5s3",tags:["bank","money"],cefrLevel:"A2",note:"die, Plural: die Überweisungen"},{id:"puenktlich",type:"word",german:"pünktlich",meaning:"punctual / on time",image:"urehr",audio:"tts",introducedInScene:"a2e5s3",tags:["time","smalltalk"],cefrLevel:"A2",note:"Adjektiv — in Deutschland fast ein Kompliment"},{id:"erledigt",type:"chunk",german:"Erledigt!",meaning:"Done! / Sorted!",audio:"tts",introducedInScene:"a2e5s3",tags:["smalltalk"],cefrLevel:"A2",note:"Das befriedigendste deutsche Wort nach „Feierabend“"},{id:"auf-das-konto",type:"sentence",german:"Das Geld kommt direkt auf mein Konto.",meaning:"The money goes straight into my account.",image:"bank",audio:"tts",introducedInScene:"a2e5s3",tags:["bank","money"],cefrLevel:"A2"},{id:"selbstaendig",type:"chunk",german:"Ich bin jetzt selbstständig.",meaning:"I'm financially independent now. / I'm self-employed.",image:"geld",audio:"tts",introducedInScene:"a2e5s3",tags:["money","work"],cefrLevel:"A2",note:"auch: selbstständig = self-employed. Kontext!"}],In=[{id:"a2e5s1",episodeId:"a2e5",title:"Erster Lohn",titleEn:"First wage",place:"Café Luise, nach der Schicht",bg:"cafe",contextTags:["work","money","bank"],requiredItems:["der-lohn","die-bestaetigung"],introducedItems:["das-geld","die-bank","das-konto","die-bankkarte","der-lohn-ist-da","geld-abheben"],beats:[{type:"narration",text:"Zwei Wochen Probetag, zwölf Schichten, ein namenloses Blatt Papier: Deine erste Lohnabrechnung. Luise legt einen Umschlag auf die Theke, so altmodisch, dass er schon wieder cool ist."},{type:"line",speaker:"luise",text:"Dein erster Lohn. Bar, bis du ein Konto hast. Und Sam: Banktermin machen. Bar bezahlen ist 1998.",translation:"Your first wage. Cash, until you have an account. And Sam: make a bank appointment. Paying cash is 1998."},{type:"meet",itemIds:["der-lohn-ist-da","das-geld","die-bank"]},{type:"meet",itemIds:["das-konto","die-bankkarte","geld-abheben"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Luise wartet auf eine Reaktion.",options:[{label:"Danke! Ich möchte morgen ein Konto eröffnen.",line:"Danke! Ich möchte morgen ein Konto eröffnen."},{label:"Kann ich hier erst mal Geld abheben? …Scherz.",line:"Kann ich hier erst mal Geld abheben? …Nur Scherz."}]},{type:"line",speaker:"luise",text:"Morgen ist Mittwoch. Mittwochvormittag sind die Banken leer. Geh um neun, sag, ich hab dich geschickt. …Bringt nichts, aber klingt gut.",translation:"Tomorrow's Wednesday. Wednesday morning the banks are empty. Go at nine, say I sent you. …Won't help, but sounds good."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Deine erste Gehaltsabrechnung",text:`Café Luise — Abrechnung Oktober

Very important. Urgent. Thank you.'`,itemIds:["das-paeckchen","der-inhalt","die-zollangelegenheit"]}]},{id:"a2e6s3",episodeId:"a2e6",title:"Tee, Strickjacke, Marmelade",titleEn:"Tea, cardigan, jam",place:"Küchentisch, Auspackaktion",bg:"wohnung",contextTags:["home","feelings","food"],requiredItems:["das-paket","der-inhalt"],introducedItems:["der-tee-aus-der-heimat","ich-freue-mich-riesig","danke-vielmals","das-andenken","vermissen"],beats:[{type:"narration",text:"Wohnung, Küchentisch. Tobias ist gekommen, offiziell „aus Neugier“, inoffiziell wegen der Süßigkeiten. Du schneidest das Klebeband auf."},{type:"meet",itemIds:["der-tee-aus-der-heimat","das-andenken","ich-freue-mich-riesig"]},{type:"line",speaker:"tobias",text:"Ohhh. Eine Strickjacke! …Handgestrickt?! Sam. Deine Mutter ist ein Schatz. Und die Marmelade — die ist in drei Tagen weg, das sage ich jetzt schon.",translation:"Ohhh. A knitted cardigan! …Hand-knitted?! Sam. Your mum is a treasure. And that jam — it'll be gone in three days, I'm telling you now."},{type:"meet",itemIds:["danke-vielmals","vermissen"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Dein Handy vibriert: Nachricht von Mum. „Und? Alles angekommen?“",options:[{label:"Ich freue mich riesig! Danke vielmals!",line:"Ich freue mich riesig! Danke vielmals, Mum!"},{label:"Alles da. Ich habe euch vermisst.",line:"Alles da. Ich habe euch vermisst."}]},{type:"line",speaker:"mutter",text:"❤️ Süß. Und trink ordentlichen Tee, nicht immer diesen Kaffee. …Wie ist die Strickjacke?",translation:"❤️ Sweet. And drink proper tea, not always that coffee. …How's the cardigan?"},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"tobias",text:"Sag ihr, die Strickjacke ist dein neues Leipzig-Outfit. …Und gib mir noch Marmelade. Nur ein Löffel. …Zwei.",translation:"Tell her the cardigan is your new Leipzig outfit. …And give me some jam. Just one spoonful. …Two."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Zettel im Paket (Mutterhandschrift)",text:`Mein Sam,

der Tee ist von Oma. Die Jacke von mir.
Die Marmelade ist ein Experiment — sag ehrlich.

Wir vermissen dich. Aber: Leipzig
hat dir schon einen Tisch gegeben,
das sieht man auf dem Foto.

Iss warm. Ruf an. Danke vielmals fürs
Fotoschicken. — Mutter`,translation:`My Sam,

the tea is from Grandma. The cardigan from me.
The jam is an experiment — be honest.

We miss you. But: Leipzig
has already given you a table,
you can see it in the photo.

Eat warm. Call. Many thanks for
sending the photos. — Mother`,itemIds:["vermissen","danke-vielmals","das-andenken"]},{type:"narration",text:"Abends: Tee aus der Heimat, frische Strickjacke, ein Foto von zu Hause als Lesezeichen im Kochbuch. Leipzig fühlt sich heute nicht weniger wie Leipzig an — und zu Hause nicht weiter weg."}]}],qa={episode:zn,cast:An,items:Ln,scenes:Tn},Ya=Object.freeze(Object.defineProperty({__proto__:null,cast:An,default:qa,episode:zn,items:Ln,scenes:Tn},Symbol.toStringTag,{value:"Module"})),Mn={id:"a2e7",arcId:"A2",cefrLevel:"A2",title:"Die Versicherung",titleEn:"The insurance",blurb:"Ein Wasserrohr im Treppenhaus, ein gestohlenes Fahrrad, ein Telefonat mit Geduldsprobe. Deutschland schützt alles — schriftlich.",order:11,sceneIds:["a2e7s1","a2e7s2","a2e7s3"]},Dn=[{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"klemm",name:"Frau Klemm",role:"Versicherungs hotline"},{id:"polizist",name:"Kommissar Renn",role:"Polizei"},{id:"tobias",name:"Tobias",role:"Freund"}],Bn=[{id:"die-versicherung",type:"word",german:"die Versicherung",meaning:"the insurance",image:"kaution",audio:"tts",introducedInScene:"a2e7s1",tags:["insurance","admin","money"],cefrLevel:"A2",note:"die, Plural: die Versicherungen — in Deutschland gerne mehrere"},{id:"die-haftpflichtversicherung",type:"word",german:"die Haftpflichtversicherung",meaning:"the liability insurance",image:"vertrag",audio:"tts",introducedInScene:"a2e7s1",tags:["insurance","admin"],cefrLevel:"A2",note:"die — die wichtigste: zahlt, wenn du anderen Schaden machst"},{id:"der-schaden",type:"word",german:"der Schaden",meaning:"the damage",image:"werkzeug",audio:"tts",introducedInScene:"a2e7s1",tags:["insurance","problem"],cefrLevel:"A2",note:"der, Plural: die Schäden — „Schaden haben“ ist hier wörtlich"},{id:"monatlich",type:"word",german:"monatlich",meaning:"monthly",image:"kalender",audio:"tts",introducedInScene:"a2e7s1",tags:["money","time"],cefrLevel:"A2",note:"täglich – wöchentlich – monatlich – jährlich"},{id:"der-beitrag",type:"word",german:"der Beitrag",meaning:"the premium / contribution",image:"münzen",audio:"tts",introducedInScene:"a2e7s1",tags:["insurance","money"],cefrLevel:"A2",note:"der, Plural: die Beiträge — monatlich, automatisch"},{id:"die-police",type:"word",german:"die Police",meaning:"the (insurance) policy",image:"formular",audio:"tts",introducedInScene:"a2e7s1",tags:["insurance","paperwork"],cefrLevel:"A2",note:"die, Plural: die Policen — nicht die Polizei!"},{id:"melden",type:"chunk",german:"Ich möchte einen Schaden melden.",meaning:"I'd like to report a claim.",image:"telefon",audio:"tts",introducedInScene:"a2e7s2",tags:["insurance","request"],cefrLevel:"A2",note:"Der Satz, der jede Hotline startet"},{id:"telefonisch",type:"word",german:"telefonisch",meaning:"by phone / over the phone",image:"telefon",audio:"tts",introducedInScene:"a2e7s2",tags:["phone"],cefrLevel:"A2"},{id:"die-vorgangsnummer",type:"word",german:"die Vorgangsnummer",meaning:"the reference / case number",image:"formular",audio:"tts",introducedInScene:"a2e7s2",tags:["insurance","paperwork"],cefrLevel:"A2",note:"die, Plural: die Vorgangsnummern — immer aufschreiben"},{id:"zustaendig",type:"word",german:"zuständig",meaning:"responsible (for)",image:"prüfen",audio:"tts",introducedInScene:"a2e7s2",tags:["admin"],cefrLevel:"A2",note:"„Ich bin nicht zuständig“ — der deutsche Nationsport"},{id:"die-liegt-auf",type:"grammar_pattern",german:"Der Beleg liegt ___ dem Schreibtisch.",meaning:"The receipt is lying on the desk.",image:"beleg",audio:"tts",introducedInScene:"a2e7s2",tags:["grammar","paperwork"],cefrLevel:"A2",cloze:"auf",speak:"Der Beleg liegt auf dem Schreibtisch.",note:"Wo? → Dativ (auf DEM Tisch). Wohin? → Akkusativ (auf DEN Tisch)"},{id:"der-selbstbehalt",type:"word",german:"der Selbstbehalt",meaning:"the deductible",image:"münzen",audio:"tts",introducedInScene:"a2e7s2",tags:["insurance","money"],cefrLevel:"A2",note:"der, Plural: die Selbstbehalte — dein Anteil am Schaden"},{id:"der-diebstahl",type:
