ktiv I / indirekte Rede: sei, habe, könne — Distanz zum Gesagten"}],Kr=[{id:"b2e7s1",episodeId:"b2e7",title:"Das Jahresgespräch",titleEn:"The annual review",place:"Café Kontor, Besprechungsecke",bg:"buero",contextTags:["work","money","meeting"],requiredItems:["das-gehalt","die-stelle"],introducedItems:["das-jahresgespraech","die-leistung","begruenden","der-marktwert","konkret","die-argumentation"],beats:[{type:"narration",text:"Café Kontor, dienstags, vor Öffnung. Frau Liebig hat zwei Kaffees gestellt und einen Terminbogen. Titel: „Jahresgespräch“. Dein Stichzettel hat drei Wörter: Leistung. Zahlen. Konkret."},{type:"meet",itemIds:["das-jahresgespraech","die-leistung","konkret"]},{type:"line",speaker:"personal",text:"Sam. Ihr erstes Jahr. Sie haben den Anbau geleitet, das Zertifikat gemacht, und meine Stammgäste fragen nach Ihnen, nicht nach mir. …Was möchten Sie besprechen?",translation:"Sam. Your first year. You led the extension, got the certificate, and my regulars ask for you, not for me. …What would you like to discuss?"},{type:"meet",itemIds:["begruenden","der-marktwert","die-argumentation"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Jetzt. Der Satz. Ruhig atmen.",options:[{label:"Meiner Meinung nach rechtfertigt meine Leistung dieses Gehalt nicht mehr.",line:"Meiner Meinung nach rechtfertigt meine Leistung das aktuelle Gehalt nicht mehr."},{label:"Ich möchte konkret über Gehalt sprechen.",line:"Ich möchte konkret über mein Gehalt sprechen — mit Zahlen und Begründung."}]},{type:"line",speaker:"personal",text:"Gut. Dann konkret: Können Sie das begründen? …Und bitte mit Argumentation, nicht mit Bauchgefühl. Bauchgefühl hat Wochenende.",translation:"Good. Then concretely: can you justify that? …And with argumentation, please, not gut feeling. Gut feeling has weekends off."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Dein Stichzettel (handgeschrieben)",text:`VERHANDLUNG — REIHENFOLGE

1. Leistung: Anbau (pünktlich, im Budget),
   Frühschichten, B2-Zertifikat.
2. Marktwert: vergleichbare Stellen 14–15 €/h.
3. Wunsch: 14,50 €/h, ab nächstem Monat.
4. Gegenleistung anbieten: Wochenende leiten.
5. Schriftlich festhalten. IMMER.

(Nicht sagen: „vielleicht“, „Sorry“, „nur“.)`,translation:`NEGOTIATION — ORDER OF PLAY

1. Performance: extension (on time, on budget),
   early shifts, B2 certificate.
2. Market value: comparable positions €14–15/h.
3. Ask: €14.50/h, from next month.
4. Offer consideration in return: run weekends.
5. Put it in writing. ALWAYS.

(Don't say: 'maybe', 'sorry', 'just'.)`,itemIds:["die-leistung","der-marktwert","die-argumentation"]}]},{id:"b2e7s2",episodeId:"b2e7",title:"Zahlen nennen",titleEn:"Naming numbers",place:"Café Kontor, weiter",bg:"buero",contextTags:["work","money","meeting"],requiredItems:["das-jahresgespraech","das-budget"],introducedItems:["die-gehaltserhoehung","der-tarifvertrag","die-gegenleistung","die-probezeit","schriftlich","festhalten"],beats:[{type:"narration",text:"Frau Liebig kippt ihren Kaffee um, rettet ihn, und sagt dann den Satz, der alles entscheidet: „Nennen Sie eine Zahl.“"},{type:"meet",itemIds:["die-gehaltserhoehung","der-tarifvertrag","die-gegenleistung"]},{type:"line",speaker:"personal",text:"Tarifvertrag gilt bei uns nicht — wir sind klein. Also: Meine Orientierung ist der Markt, nicht das Bauchgefühl. …Sie sagen was, ich sage was, dann trinken wir Kaffee.",translation:"Collective agreements don't apply here — we're small. So: my reference is the market, not gut feeling. …You say a number, I say a number, then we drink coffee."},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Deine Zahl.",options:[{label:"Vierzehn fünfzig — und ich übernehme die Wochenendleitung.",line:"Vierzehn fünfzig die Stunde — und als Gegenleistung übernehme ich die Wochenendleitung."},{label:"Zwölf. …Nein, warten. Vierzehn fünfzig.",line:"Zwölf. …Nein, warten Sie. Vierzehn fünfzig. Das war kein Verhandlungsstart, das war ein Atemzug."}]},{type:"line",speaker:"personal",text:"Vierzehn. Und die Wochenendleitung gehört dazu — Probezeit dafür: drei Monate. Dann dreizehn achtzig, danach vierzehn fünfzig. …Oder?",translation:"Fourteen. And the weekend management comes with it — probation for that: three months. Then €13.80, then €14.50. …Or?"},{type:"meet",itemIds:["die-probezeit","schriftlich","festhalten"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"personal",text:"Sie schweigen so professionell, dass ich fast mehr biete. …Also gut: vierzehn fünfzig ab Januar, Wochenendleitung sofort, alles schriftlich. Damit wären wir einig — wäre, wenn Sie jetzt nichts sagen.",translation:"You're staying silent so professionally I almost offer more. …Fine: €14.50 from January, weekend management immediately, all in writing. That would make us agreed — if you didn't say anything now."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"E-Mail von Frau Liebig (gleicher Abend)",text:`Betreff: Anpassung Arbeitsvertrag

Hallo Sam,

wie besprochen: Stundenlohn 14,50 € ab 01.01.,
Wochenendleitung ab sofort, Probezeit 3 Monate.
Den geänderten Vertrag hängt diese Mail an —
bitte drucken, unterschreiben, vorbeibringen.

Danke für das gute Jahr. Das war keine Floskel.

Frau Liebig`,translation:`Re: Employment contract adjustment

Hi Sam,

as discussed: hourly wage €14.50 from Jan 1,
weekend management effective immediately, 3-month probation.
The amended contract is attached —
please print, sign, drop by.

Thanks for a good year. That was not a formality.

Ms Liebig`,itemIds:["die-gehaltserhoehung","schriftlich","die-probezeit"]}]},{id:"b2e7s3",episodeId:"b2e7",title:"Die Einigung",titleEn:"The agreement",place:"Café Kontor, Theke, unterschrieben",bg:"cafe",contextTags:["work","money","friends"],requiredItems:["das-jahresgespraech"],introducedItems:["der-bericht","laut-dem-bericht","die-anpassung","unterzeichnen","die-einigung","sie-sagte-sei"],beats:[{type:"narration",text:"Der geänderte Vertrag liegt auf der Theke. Mei liest über deine Schulter und macht Geräusche wie eine Kaffeemaschine vor Aufregung."},{type:"meet",itemIds:["die-anpassung","unterzeichnen","die-einigung"]},{type:"line",speaker:"mei",text:"„…wird die Gehaltsanpassung wirksam zum ersten Januar.“ …Sam. Du hast verhandelt. Auf Deutsch. Mit Zahlen und allem. Was hat Frau Liebig gesagt, EXAKT?",translation:"'…the salary adjustment takes effect on the first of January.' …Sam. You negotiated. In German. With numbers and everything. What did Ms Liebig say, EXACTLY?"},{type:"choice",prompt:"Indirekte Rede, live. Was hast du Mei berichtet?",options:[{label:"Sie sagte, die Anpassung sei fair — und meinte es.",line:"Sie sagte, die Anpassung sei fair. Und ich glaube, sie meinte es."},{label:"Sie meinte, der Bericht sei gut ausgefallen.",line:"Sie meinte, mein Jahresbericht sei gut ausgefallen. …Der war von ihr selbst."}]},{type:"meet",itemIds:["sie-sagte-sei","der-bericht","laut-dem-bericht"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"mei",text:"„Sie sagte, die Anpassung sei fair.“ …Hörst du dich an? Konjunktiv I, mitten im Café. Du redest jetzt wie ein Gesetzestext mit Milchschaum.",translation:"'She said the adjustment was fair.' …Do you hear yourself? Subjunctive, in the middle of a café. You now talk like a legal text with milk foam."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"narration",text:"Du unterschreibst mit deinem besten Kugelschreiber. Luise, die zufällig Kaffee trinkt, nickt langsam und stolz. Laut dem Bericht — ihrem eigenen — war ihr Tipp: „größere Stelle, Teilzeit, Kurs.“ Er war gut. Aber dein Mut war besser."},{type:"reading",title:"Kurzmeldung (Betriebs-Mitteilungsbrett)",text:`MITTEILUNG

Nach einvernehmlicher Einigung übernimmt Sam
ab sofort die Wochenendleitung des Café Kontor.

Laut dem aktuellen Bericht der Geschäftsführung
ist die Gehaltsanpassung zum 01.01. wirksam.

Wir gratulieren — und bitten um weiteres Verständnis,
wenn am Samstag wieder alle Kaffee gleichzeitig wollen.`,translation:`NOTICE

By mutual agreement, Sam takes over weekend
management of Café Kontor effective immediately.

According to the current report of the management,
the salary adjustment is effective from Jan 1.

Congratulations — and please keep being understanding
when everyone wants coffee at the same time on Saturdays.`,itemIds:["die-einigung","die-anpassung","laut-dem-bericht"]},{type:"narration",text:"Ein Jahr nach deiner ersten Schicht: mehr Euro, mehr Verantwortung, derselbe Kaffee. Der Unterschied sitzt nicht im Gehalt. Er sitzt in dem Satz, den du laut gesagt hast."}]}],eo={episode:xr,cast:Pr,items:Wr,scenes:Kr},to=Object.freeze(Object.defineProperty({__proto__:null,cast:Pr,default:eo,episode:xr,items:Wr,scenes:Kr},Symbol.toStringTag,{value:"Module"})),_r={id:"b2e8",arcId:"B2",cefrLevel:"B2",title:"Die Kolumne",titleEn:"The column",blurb:"Eine Redaktion ruft an: „Schreiben Sie über Ankommen.“ Nominalstil, Redaktionsschluss, Leserbriefe — du schreibst dich in die Stadt.",order:20,sceneIds:["b2e8s1","b2e8s2","b2e8s3"]},Fr=[{id:"strassburg",name:"Frau Straßburg",role:"Redakteurin, Leipziger Rundschau"},{id:"mei",name:"Mei",role:"Lektorin wider Willen"},{id:"deniz",name:"Deniz",role:"Nachbar"}],Hr=[{id:"die-kolumne",type:"word",german:"die Kolumne",meaning:"the column (newspaper)",image:"brief",audio:"tts",introducedInScene:"b2e8s1",tags:["media","writing"],cefrLevel:"B2",note:"die, Plural: die Kolumnen — regelmäßiger Text mit eigener Stimme"},{id:"die-redaktion",type:"word",german:"die Redaktion",meaning:"the editorial office / editors",image:"firma",audio:"tts",introducedInScene:"b2e8s1",tags:["media","work"],cefrLevel:"B2",note:"die, Plural: die Redaktionen"},{id:"die-anfrage",type:"word",german:"die Anfrage",meaning:"the inquiry / request",image:"brief",audio:"tts",introducedInScene:"b2e8s1",tags:["media","work"],cefrLevel:"B2",note:"die, Plural: die Anfragen"},{id:"veroeffentlichen",type:"chunk",german:"Der Text wird veröffentlicht.",meaning:"The text will be published.",image:"brief",audio:"tts",introducedInScene:"b2e8s1",tags:["media","writing"],cefrLevel:"B2",note:"veröffentlichen + Passiv — dein zweites Passiv-Abenteuer"},{id:"woechentlich",type:"word",german:"wöchentlich",meaning:"weekly",image:"kalender",audio:"tts",introducedInScene:"b2e8s1",tags:["media","time"],cefrLevel:"B2"},{id:"der-leser",type:"word",german:"der Leser",meaning:"the reader (m)",image:"person",audio:"tts",introducedInScene:"b2e8s1",tags:["media","people"],cefrLevel:"B2",note:"der, Plural: die Leser; weiblich: die Leserin"},{id:"das-manuskript",type:"word",german:"das Manuskript",meaning:"the manuscript",image:"lebenslauf",audio:"tts",introducedInScene:"b2e8s2",tags:["writing","media"],cefrLevel:"B2",note:"das, Plural: die Manuskripte"},{id:"kuerzen",type:"chunk",german:"Wir müssen den Text kürzen.",meaning:"We have to shorten the text.",image:"formular",audio:"tts",introducedInScene:"b2e8s2",tags:["writing"],cefrLevel:"B2",note:"kürzen — der editText-Sport: weglassen, weglassen, weglassen"},{id:"die-rueckmeldung",type:"word",german:"die Rückmeldung",meaning:"the feedback",image:"gespräch",audio:"tts",introducedInScene:"b2e8s2",tags:["writing","work"],cefrLevel:"B2",note:"die, Plural: die Rückmeldungen — Bitte um Rückmeldung bis …"},{id:"der-redaktionsschluss",type:"word",german:"der Redaktionsschluss",meaning:"the editorial deadline",image:"frist",audio:"tts",introducedInScene:"b2e8s2",tags:["media","time"],cefrLevel:"B2",note:"der, Plural: die Redaktionsschlüsse — heiliger als jede Frist"},{id:"praezise",type:"word",german:"präzise",meaning:"precise",image:"prüfen",audio:"tts",introducedInScene:"b2e8s2",tags:["opinion","writing"],cefrLevel:"B2"},{id:"die-rubrik",type:"word",german:"die Rubrik",meaning:"the (paper's) section / rubric",image:"konzept",audio:"tts",introducedInScene:"b2e8s2",tags:["media"],cefrLevel:"B2",note:"die, Plural: die Rubriken"},{id:"nach-pruefung-der",type:"grammar_pattern",german:"Nach ___ der Unterlagen melden wir uns.",meaning:"After reviewing the documents, we'll get back to you.",image:"formular",audio:"tts",introducedInScene:"b2e8s2",tags:["grammar","writing"],cefrLevel:"B2",cloze:"Prüfung",alt:["Durchsicht"],speak:"Nach Prüfung der Unterlagen melden wir uns.",note:"Nominalstil: Verb → Nomen (prüfen → die Prüfung) — typisch amtlich/geschäftlich"},{id:"die-veroeffentlichung",type:"word",german:"die Veröffentlichung",meaning:"the publication",image:"brief",audio:"tts",introducedInScene:"b2e8s3",tags:["media","writing"],cefrLevel:"B2",note:"die, Plural: die Veröffentlichungen"},{id:"die-resonanz",type:"word",german:"die Resonanz",meaning:"the response / resonance",image:"laut",audio:"tts",introducedInScene:"b2e8s3",tags:["media","feelings"],cefrLevel:"B2",note:"die ( Singular ) — große Resonanz = viele Antworten"},{id:"beruehrend",type:"word",german:"berührend",meaning:"moving / touching",image:"person",audio:"tts",introducedInScene:"b2e8s3",tags:["opinion","feelings"],cefrLevel:"B2",note:"Partizip I als Adjektiv: etwas berührt → ein berührender Text"},{id:"die-spalte",type:"word",german:"die Spalte",meaning:"the column (print) / column of a table",image:"konzept",audio:"tts",introducedInScene:"b2e8s3",tags:["media"],cefrLevel:"B2",note:"die, Plural: die Spalten"},{id:"die-resonanz-uebertraf",type:"grammar_pattern",german:"Die Resonanz ___ alles Erwartete.",meaning:"The response exceeded everything expected.",image:"laut",audio:"tts",introducedInScene:"b2e8s3",tags:["grammar","writing"],cefrLevel:"B2",cloze:"übertraf",alt:["uebertraf"],speak:"Die Resonanz übertraf alles Erwartete.",note:"Präteritum fürs Erzählen: übertraf — Zeitungssprache liebt es"},{id:"es-hat-sich-ausgezahlt",type:"chunk",german:"Es hat sich ausgezahlt.",meaning:"It paid off.",image:"geld",audio:"tts",introducedInScene:"b2e8s3",tags:["opinion","reflection"],cefrLevel:"B2",note:"sich auszahlen — am Ende zählt der Lohn, auch der unbezahlte"}],Nr=[{id:"b2e8s1",episodeId:"b2e8",title:"Die Redaktion ruft",titleEn:"The paper calls",place:"Café Kontor, Feierabend-Telefonat",bg:"cafe",contextTags:["media","work","writing"],requiredItems:["die-nachbarschaft","die-rede"],introducedItems:["die-kolumne","die-redaktion","die-anfrage","veroeffentlichen","woechentlich","der-leser"],beats:[{type:"narration",text:"Das Handy klingelt während du Milchschaum aufschäumst. Leipziger Rundschau. Eine Redakteurin mit der Stimme von jemandem, der hundert Absagen pro Tag verschickt — heute klingt sie anders."},{type:"line",speaker:"strassburg",text:"Frau Straßburg, Leipziger Rundschau. Wir suchen eine Stimme für unsere neue Rubrik „Angekommen“ — Geschichten von Leuten, die neu hier sind. Jemand hat mir von Ihrer Rede auf dem Hoffest erzählt. …Wöchentlich, fünfhundert Wörter. Interesse?",translation:"Ms Straßburg, Leipziger Rundschau. We're looking for a voice for our new column 'Arrived' — stories from people who are new here. Someone told me about your speech at the courtyard festival. …Weekly, five hundred words. Interested?"},{type:"meet",itemIds:["die-kolumne","die-redaktion","die-anfrage"]},{type:"meet",itemIds:["veroeffentlichen","woechentlich","der-leser"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Fünfhundert Wörter. Wöchentlich. Deine Geschichte.",options:[{label:"Ja. Ich schreibe — und wenn's nur ein Entwurf wird.",line:"Ja, ich schreibe. Und wenn der erste Entwurf schrecklich wird, wird der zweite eben gut."},{label:"Darf ich eine Woche Bedenkzeit…? …Nein. Ja. Sofort.",line:"Darf ich eine Woche Bedenkzeit haben? …Nein, lassen Sie das. Ja. Ich bin dabei."}]},{type:"line",speaker:"strassburg",text:"Ausgezeichnet. Erster Redaktionsschluss: Freitag, zwölf Uhr. …Und Herr — Sam: Schreiben Sie so, wie Sie auf dem Hof gesprochen haben. Nicht wie ein Formular.",translation:"Excellent. First deadline: Friday, noon. …And Sam: write the way you spoke in that courtyard. Not like a form."},{type:"check",count:2,mode:"listen"}]},{id:"b2e8s2",episodeId:"b2e8",title:"Fünfhundert Wörter",titleEn:"Five hundred words",place:"Wohnung, Küche, Donnerstag nach Mitternacht",bg:"wohnung",contextTags:["writing","media","friends"],requiredItems:["die-kolumne","die-meinung"],introducedItems:["das-manuskript","kuerzen","die-rueckmeldung","der-redaktionsschluss","praezise","die-rubrik"],beats:[{type:"narration",text:"Entwurf eins: achthundertvierzig Wörter, drei Metaphern zu viele, eine Banane, die aus der Heimat stammt und Leipzigerin werden will. Mei liest und lacht an den richtigen Stellen."},{type:"meet",itemIds:["das-manuskript","die-rubrik","praezise"]},{type:"line",speaker:"mei",text:"Es ist gut. Zu lang, aber gut. …Kürzen heißt nicht weniger sagen — es heißt, das Wesentliche lauter sagen. Und: Formulierungen wie „nach Prüfung der Unterlagen“ lassen wir zu Hause. Das ist Amtsdeutsch, das hier ist Leben.",translation:"It's good. Too long, but good. …Cutting doesn't mean saying less — it means saying what matters louder. And: phrases like 'after reviewing the documents' stay at home. That's officialese, this is life."},{type:"meet",itemIds:["kuerzen","die-rueckmeldung","der-redaktionsschluss"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Anfang. Was steht zuerst?",options:[{label:"„Ich kam mit einem Koffer an — und ohne Wörter.“",line:"„Ich kam mit einem Koffer an — und ohne Wörter.“ Danach die Banane."},{label:"„Nach Prüfung meiner ersten Leipziger Woche war mein Fazit: Gleis 7 existiert nicht.“",line:"„Nach Prüfung meiner ersten Leipziger Woche war mein Fazit: Gleis 7 existiert nicht.“ …Okay, das ist tatsächlich lustig."}]},{type:"line",speaker:"mei",text:"Beides! Der Koffer, dann der Amtswitz als Kontrast. …Und jetzt: Redaktionsschluss ist freitags zwölf. Es ist Donnerstag, drei Uhr nachts. Wir haben neun Stunden und Kaffee.",translation:"Both! The suitcase, then the officialese joke as contrast. …And now: deadline is Friday noon. It's Thursday, 3 a.m. We have nine hours and coffee."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"E-Mail der Redaktion (Rückmeldung)",text:`Hallo Herr Jones,

nach Prüfung Ihres Manuskripts sind wir begeistert.
Ihre Kolumne läuft ab Sonntag in der Rubrik „Angekommen“.
Kleine Bitte: die Banane behalten, die Metapher
„wie ein nasser Bahnhof“ streichen.

Rückmeldung erbeten bis Freitag, 10 Uhr.
Redaktionsschluss bleibt 12 Uhr.

Herzlich, Straßburg`,translation:`Hi Mr Jones,

after reviewing your manuscript we're thrilled.
Your column runs from Sunday in the 'Arrived' section.
One small request: keep the banana, cut the metaphor
'like a wet train station'.

Please respond by Friday, 10 a.m.
Deadline stays 12 noon.

Warmly, Straßburg`,itemIds:["das-manuskript","die-rueckmeldung","der-redaktionsschluss"]}]},{id:"b2e8s3",episodeId:"b2e8",title:"Sonntag, Seite 3",titleEn:"Sunday, page three",place:"Bäckerei Wenzel, Sonntagmorgen",bg:"cafe",contextTags:["media","celebration","friends"],requiredItems:["die-kolumne","die-vermieterin"],introducedItems:["die-veroeffentlichung","die-resonanz","beruehrend","die-spalte","die-resonanz-uebertraf","es-hat-sich-ausgezahlt"],beats:[{type:"narration",text:"Sonntag, halb acht. In der Bäckerei Wenzel liegt die Zeitung, in der Zeitung liegt Seite drei, auf Seite drei liegt deine Spalte. Neben einem Bild vom Rathaus. Dein Name. Gedruckt. Auf Deutsch."},{type:"meet",itemIds:["die-veroeffentlichung","die-spalte","die-resonanz"]},{type:"line",speaker:"strassburg",text:"Guten Morgen. Ich rufe wegen der Resonanz. …Herr Jones, die Resonanz übertraf alles Erwartete. Vierzig Leserbriefe bis Montagfrüh — für eine erste Kolumne sind das Zahlen, die wir sonst nur bei Vereinsauflösungen haben.",translation:"Good morning. I'm calling about the response. …Mr Jones, the response exceeded all expectations. Forty letters to the editor by Monday morning — for a first column, those are numbers we usually only get for club dissolutions."},{type:"meet",itemIds:["die-resonanz-uebertraf","beruehrend","es-hat-sich-ausgezahlt"]},{type:"check",count:2,mode:"mixed"},{type:"reading",title:"Leserbrief (einer von vierzig)",text:`Sehr geehrter Herr Jones,

Ihre Kolumne hat mich berührt. Ich bin 1968 hier
angekommen — mit zwei Koffern und ohne Gleiswissen.
Sie haben beschrieben, was ich nie gefunden habe:
die Wörter dafür.

Weiter so. Und kommen Sie zum Kaffeekränzchen,
Dienstag, Vereinsheim. Wir haben auch Bananen.

Mit freundlichen Grüßen
Ruth B., 84, Plagwitz`,translation:`Dear Mr Jones,

your column moved me. I arrived here in 1968 —
with two suitcases and no platform knowledge.
You described what I never managed to find:
the words for it.

Keep going. And come to our coffee get-together,
Tuesday, clubhouse. We have bananas too.

Kind regards,
Ruth B., 84, Plagwitz`,itemIds:["beruehrend","die-veroeffentlichung","die-resonanz"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"deniz",text:"Sam! Seite drei! Im Laden kaufen jetzt alle die Zeitung, die vorher nur das Wetter gelesen haben. …Frau Brügge hat ihre Ausgabe laminiert. LAMINIERT, Sam.",translation:"Sam! Page three! Now everyone in the building buys the paper who before only read the weather. …Frau Brügge laminated her copy. LAMINATED, Sam."},{type:"check",count:2,mode:"recall"},{type:"narration",text:"Du bestellst ein Brötchen, und Frau Wenzel legt still eine Zeitung dazu. Es hat sich ausgezahlt: die Silben von Milo, die Panflöten-Hotline, die Nächte mit Mei. Alles steht jetzt gedruckt zwischen zwei Schlagzeilen — und es ist noch der Anfang."}]}],no={episode:_r,cast:Fr,items:Hr,scenes:Nr},io=Object.freeze(Object.defineProperty({__proto__:null,cast:Fr,default:no,episode:_r,items:Hr,scenes:Nr},Symbol.toStringTag,{value:"Module"})),Gr={id:"b2e9",arcId:"B2",cefrLevel:"B2",title:"Die Lesung",titleEn:"The reading",blurb:"Die Rundschau lädt ein: „Angekommen“ live. Ein Saal, ein Mikrofon, fünfzehn Minuten — und der Unterschied zwischen dem geschriebenen und dem gesprochenen Wort.",order:21,sceneIds:["b2e9s1","b2e9s2","b2e9s3"]},Rr=[{id:"strassburg",name:"Frau Straßburg",role:"Redakteurin, Leipziger Rundschau"},{id:"mei",name:"Mei",role:"Freundin, Lektorin wider Willen"},{id:"deniz",name:"Deniz",role:"Nachbar"}],jr=[{id:"die-lesung",type:"word",german:"die Lesung",meaning:"the (public) reading",image:"mic",audio:"tts",introducedInScene:"b2e9s1",tags:["media","culture","events"],cefrLevel:"B2",note:"die, Plural: die Lesungen — aus etwas vortragen"},{id:"das-publikum",type:"word",german:"das Publikum",meaning:"the audience",image:"team",audio:"tts",introducedInScene:"b2e9s1",tags:["media","people"],cefrLevel:"B2",note:"das, Plural: die Publika — selten im Singular zu sehen"},{id:"der-saal",type:"word",german:"der Saal",meaning:"the hall",image:"haus",audio:"tts",introducedInScene:"b2e9s1",tags:["culture","city"],cefrLevel:"B2",note:"der, Plural: die Säle — im Saal, nicht: im Saale (veraltet)"},{id:"die-angst",type:"word",german:"die Angst",meaning:"the fear",image:"person",audio:"tts",introducedInScene:"b2e9s1",tags:["feelings"],cefrLevel:"B2",note:"die, Plural: die Ängste — Angst vor + Dativ"},{id:"die-nervositaet",type:"word",german:"die Nervosität",meaning:"the nervousness",image:"urehr",audio:"tts",introducedInScene:"b2e9s1",tags:["feelings"],cefrLevel:"B2",note:"die ( Singular ) — nervös; Nervosität ist Energie ohne Plan"},{id:"laut-vorlesen",type:"chunk",german:"Laut vorlesen!",meaning:"Read it out loud!",image:"laut",audio:"tts",introducedInScene:"b2e9s1",tags:["learning","media"],cefrLevel:"B2",speak:"Laut vorlesen!",note:"vorlesen (trennbar) — der beste Test für jeden Text"},{id:"die-probe",type:"word",german:"die Probe",meaning:"the rehearsal / test",image:"kalender",audio:"tts",introducedInScene:"b2e9s2",tags:["culture","events"],cefrLevel:"B2",note:"die, Plural: die Proben — Generalprobe = dress rehearsal"},{id:"die-betonung",type:"word",german:"die Betonung",meaning:"the stress / emphasis (in speech)",image:"laut",audio:"tts",introducedInScene:"b2e9s2",tags:["language","media"],cefrLevel:"B2",note:"die, Plural: die Betonungen — betonen; Sprechrhythmus"},{id:"der-absatz",type:"word",german:"der Absatz",meaning:"the paragraph (also: shoe heel; sales)",image:"konzept",audio:"tts",introducedInScene:"b2e9s2",tags:["writing","media"],cefrLevel:"B2",note:"der, Plural: die Absätze — drei Bedeutungen, ein Wort"},{id:"atmen",type:"word",german:"atmen",meaning:"to breathe",image:"ruhe",audio:"tts",introducedInScene:"b2e9s2",tags:["health","feelings"],cefrLevel:"B2",note:"atmen — atmete — geatmet; das hörbare h!"},{id:"tief-durchatmen",type:"chunk",german:"Tief durchatmen.",meaning:"Take a deep breath.",image:"thermos",audio:"tts",introducedInScene:"b2e9s2",tags:["feelings","health"],cefrLevel:"B2",speak:"Tief durchatmen.",note:"durchatmen — der Satz vor jedem Auftritt"},{id:"das-gesprochene-wort",type:"grammar_pattern",german:"Das ___ Wort bleibt länger im Raum.",meaning:"The spoken word stays longer in the room.",image:"gespräch",audio:"tts",introducedInScene:"b2e9s2",tags:["grammar","media"],cefrLevel:"B2",cloze:"gesprochene",speak:"Das gesprochene Wort bleibt länger im Raum.",note:"Partizip II als Adjektiv: das gesprochene, das geschriebene Wort"},{id:"der-beifall",type:"word",german:"der Beifall",meaning:"the applause",image:"fest",audio:"tts",introducedInScene:"b2e9s3",tags:["culture","events"],cefrLevel:"B2",note:"der ( Singular ) — Beifall klatschen"},{id:"die-stimmung",type:"word",german:"die Stimmung",meaning:"the mood / atmosphere",image:"sonnenuntergang",audio:"tts",introducedInScene:"b2e9s3",tags:["feelings","events"],cefrLevel:"B2",note:"die, Plural: die Stimmungen — gute Stimmung ist ansteckend"},{id:"die-fragerunde",type:"word",german:"die Fragerunde",meaning:"the Q&A session",image:"gespräch",audio:"tts",introducedInScene:"b2e9s3",tags:["events","media"],cefrLevel:"B2",note:"die, Plural: die Fragerunden — der wahre final boss"},{id:"die-leserin",type:"word",german:"die Leserin",meaning:"the (female) reader",image:"person",audio:"tts",introducedInScene:"b2e9s3",tags:["media","people"],cefrLevel:"B2",note:"die, Plural: die Leserinnen — Leser und Leserinnen"},{id:"erleichtert",type:"word",german:"erleichtert",meaning:"relieved",image:"ruhe",audio:"tts",introducedInScene:"b2e9s3",tags:["feelings"],cefrLevel:"B2",note:"Partizip als Adjektiv — erleichtert aufatmen"},{id:"der-widerhall",type:"word",german:"der Widerhall",meaning:"the echo / resonance",image:"laut",audio:"tts",introducedInScene:"b2e9s3",tags:["media","feelings"],cefrLevel:"B2",note:"der ( Singular ) — findet Widerhall = bewegt Menschen"}],Cr=[{id:"b2e9s1",episodeId:"b2e9",title:"Die Einladung",titleEn:"The invitation",place:"Café Kontor, Theke, Telefon klingelt",bg:"cafe",contextTags:["media","work","feelings"],requiredItems:["die-kolumne","die-rubrik"],introducedItems:["die-lesung","das-publikum","der-saal","die-angst","die-nervositaet","laut-vorlesen"],beats:[{type:"narration",text:"Dienstag, elf Uhr. Das Telefon klingelt zwischen zwei Milchschaum-Wolken. Frau Straßburg, die Stimme hinter jeder Einladung mit Konsequenzen: „Herr Jones. Wie wäre es, wenn Ihre Kolumne mal Töne kriegt?“"},{type:"line",speaker:"strassburg",text:"Literaturhaus, nächste Woche Donnerstag. „Angekommen — live“. Vier Autorinnen und Autoren, jeder liest fünfzehn Minuten. …Sie sind die vierte Stimme. Kleiner Saal, siebzig Stühle, großes Publikum — relativ gesehen an Ihrem Lebenswerk gemessen, das bislang aus einer Kolumne besteht.",translation:"Literaturhaus, next Thursday. 'Angekommen — live'. Four authors, each reading for fifteen minutes. …You're the fourth voice. Small hall, seventy chairs, big audience — relatively speaking, measured against your life's work, which so far consists of one column."},{type:"meet",itemIds:["die-lesung","der-saal","das-publikum"]},{type:"line",speaker:"strassburg",text:"Ein Rat, kostenfrei: Lesen Sie LAUT vor. Zu Hause, laut. Der Text ist gut geschrieben — aber das gesprochene Wort ist eine andere Sportart. …Und: Nervosität ist okay. Angst wäre okay. Absagen wäre das Einzige, was nicht okay ist.",translation:"One tip, free of charge: read out loud. At home, loud. The text is well written — but the spoken word is a different sport. …And: nervousness is okay. Fear would be okay. Cancelling would be the only thing that's not okay."},{type:"meet",itemIds:["die-angst","die-nervositaet","laut-vorlesen"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mei steht neben dir und hat alles gehört.",options:[{label:"Ich mache das. Mei, du bist meine Generalregisseurin.",line:"Ich mache das. Mei, du bist ab jetzt meine Generalregisseurin. …„Ich verkaufe hier Kaffee. …Aber ja.“"},{label:"Siebzig Stühle? Können wir dreißig davon entfernen?",line:"Siebzig Stühle? Können wir dreißig davon entfernen lassen? …„Nein. Aber du kannst nach hinten sprechen.“"}]},{type:"check",count:2,mode:"recall"},{type:"line",speaker:"mei",text:"Sam. Vor zwei Jahren konntest du „Ersatzkaffeekannendeckel“ nicht aussprechen. Jetzt liest du auf einer Bühne. …Wir üben. Morgen. Meine Wohnung. Bring Tee mit und Ehrlichkeit, beide in großen Mengen.",translation:"Sam. Two years ago you couldn't pronounce 'Ersatzkaffeekannendeckel'. Now you're reading on a stage. …We're practising. Tomorrow. My flat. Bring tea and honesty, both in large quantities."}]},{id:"b2e9s2",episodeId:"b2e9",title:"Die Generalprobe",titleEn:"The dress rehearsal",place:"Meis Wohnung, Küchenstuhl als Bühne",bg:"wohnung",contextTags:["media","friends","learning"],requiredItems:["die-stimme","langsam"],introducedItems:["die-probe","die-betonung","der-absatz","atmen","tief-durchatmen","das-gesprochene-wort"],beats:[{type:"narration",text:"Küchenstuhl, Publikum: ein Kaktus („er ist weniger verurteilend als Menschen“). Mei sitzt mit Stift und der Härte einer Redakteurin, die ihre Kolumne auch gelesen hat — dreimal."},{type:"line",speaker:"mei",text:"Nochmal. Aber: langsamer. Du liest wie jemand, der die Polizei kommen hört. …Der Text ist ruhig, dein Tempo ist Panik. …Und: Betonung! „Ich kam mit einem Koffer an“ — nicht: „ich KAM mit einem Koffer an.“ Erzähl es, lies es nicht.",translation:"Again. But: slower. You're reading like someone hearing the police arrive. …The text is calm, your tempo is panic. …And: stress! 'Ich kam mit einem Koffer an' — not: 'ich KAM mit einem Koffer an.' Tell it, don't read it."},{type:"meet",itemIds:["die-probe","die-betonung"]},{type:"line",speaker:"mei",text:"Der dritte Absatz ist dein bester. Weißt du warum? …Weil du dort aufhörst, Wörter zu lesen, und anfängst, Erinnerungen zu erzählen. …Und da: mach eine Pause. Eine echte. Tief durchatmen. Das Publikum darf warten. Es zahlt ja Eintritt.",translation:"The third paragraph is your best. Know why? …Because there you stop reading words and start telling memories. …And there: take a pause. A real one. Take a deep breath. The audience may wait. They're paying for tickets after all."},{type:"meet",itemIds:["der-absatz","atmen","tief-durchatmen"]},{type:"meet",itemIds:["das-gesprochene-wort"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mei: „Letzte Frage: Was machst du, wenn du den Text vergisst?“",options:[{label:"Ich erzähle weiter. Der Text ist ja nur der Faden.",line:"Ich erzähle einfach weiter. Der Text ist nur der Faden — die Geschichte sitzt in mir, nicht auf dem Papier."},{label:"Ich sage: „Wo war ich?“ — und das ganze Publikum rettet mich.",line:"Ich sage: 'Wo war ich?' — und das ganze Publikum rettet mich. …Deutsche Variante: „Ich mache eine künstlerische Pause.“"}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Meis Regieanweisungen (am Rand)",text:`S. 1: Langsam anfangen. Ganz langsam. Publikum belohnen.
S. 2: Betonung auf „Koffer“ — nicht auf „kam“.
S. 3: Absatz-Ende = Pause. EINE SEKUNDE. Zählen!
S. 4: Hier tief durchatmen. Sichtbar. Das ist okay.
S. 5: „Banane“ lächeln. Du darfst.

»Das gesprochene Wort vergisst man nicht,
wenn es atmet.«`,translation:`P. 1: Start slowly. Very slowly. Reward the audience.
P. 2: Stress on 'suitcase' — not on 'came'.
P. 3: end of paragraph = pause. ONE SECOND. Count it!
P. 4: breathe deeply here. Visibly. That's okay.
P. 5: smile at 'banana'. You're allowed.

'The spoken word isn't forgotten
when it breathes.'`,itemIds:["die-betonung","der-absatz","tief-durchatmen"]},{type:"narration",text:"Um Mitternacht liest du zum letzten Mal — und der Kaktus kriegt die beste Fassung. Der Text bleibt derselbe. Aber die Stimme heute klingt, als hätte sie das alles selbst erlebt. Hat sie."}]},{id:"b2e9s3",episodeId:"b2e9",title:"Siebzig Stühle",titleEn:"Seventy chairs",place:"Literaturhaus, kleiner Saal",bg:"buehne",contextTags:["media","culture","feelings"],requiredItems:["die-kolumne","die-meinung"],introducedItems:["der-beifall","die-stimmung","die-fragerunde","die-leserin","erleichtert","der-widerhall"],beats:[{type:"narration"},{type:"meet",itemIds:["die-stimmung"]},{type:"line",speaker:"strassburg",text:"Siebzig Stühle, siebzig besetzt. …Sam. Ganz ruhig: Du liest nicht für siebzig Menschen. Du liest für den einen, der wie du irgendwann mit einem Koffer ankam. Es gibt immer einen. …Die Bühne ist deine.",translation:"Seventy chairs, seventy occupied. …Sam. Calmly: you're not reading for seventy people. You're reading for the one who arrived with a suitcase like you did, once. There's always one. …The stage is yours."},{type:"narration",text:"Das Mikrofon knackt. „…Ich kam mit einem Koffer an — und ohne Wörter.“ Im Saal wird es still. Nicht unangenehm still: Zuhause-still. Du erzählst die Banane, die Leipzigerin werden wollte. Du erzählst den Mann mit dem Plastiksack. Die dritte Pause ist echt."},{type:"line",speaker:"mei",text:"(hinten, flüstert) …Er macht Pausen wie ein Profi. Siebzig Menschen hören einem Mann zu, der vor drei Jahren „Ersatzkaffeekannendeckel“ nicht sagen konnte. Ich muss kurz. Was. Haben.",translation:"(back row, whispering) …He's pausing like a pro. Seventy people are listening to a man who three years ago couldn't say 'Ersatzkaffeekannendeckel'. I need a moment. I'm. Fine."},{type:"meet",itemIds:["der-beifall","der-widerhall","erleichtert"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"strassburg",text:"Fragerunde. Erste Frage, eine Leserin, vorne: „Herr Jones, wann hören Sie auf, eine Kolumne zu schreiben — und wann fangen Sie an, ein Buch zu schreiben?“ …(Publikum: zustimmendes Rauschen)",translation:"Q&A. First question, a reader, front row: 'Mr Jones, when will you stop writing a column — and when will you start writing a book?' …(audience: approving murmur)"},{type:"meet",itemIds:["die-fragerunde","die-leserin"]},{type:"choice",prompt:"Ein Buch. An dieser Frage hängt der ganze Abend.",options:[{label:"Ich habe gerade angefangen. Heute Abend. Kapitel eins.",line:"Ich habe gerade angefangen — heute Abend. Kapitel eins: „Der Mann mit dem Plastiksack.“"},{label:"Wenn meine Deutschlehrerin — der Scheduler — es zulässt.",line:"Wenn mein Deutschlehrer — mein Wiederholungskalender — es zulässt. Der ist streng. …(Lachen im Saal)"}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Programmheft „Angekommen — live“",text:`LITERATURHAUS LEIPZIG

Lesungen & Gespräch · Eintritt 8 €

1. Miriam Osei — „Grün nach Rot“
2. Pawel Nowicki — „Die Wartezeit“
3. Ruth Berndl — „Endstation Westwerk“
4. Sam Jones — „Angekommen“ (Kolumne)

Im Anschluss: Fragerunde mit dem Publikum.

»Vier Ankünfte, eine Stadt.
 Vier Sprachen, eine Bühne.«`,translation:`LITERATURE HOUSE LEIPZIG

Readings & conversation · tickets €8

1. Miriam Osei — 'Green after red'

3. Ruth Berndl — 'Terminus Westwerk'
4. Sam Jones — 'Arrived' (column)

Afterwards: Q&A with the audience.

'Four arrivals, one city.
 Four languages, one stage.'`},{type:"narration",text:"Nach der Lesung: Flur, kalter Sekt, warme Gesichter. Eine Leserin Mitte sechzig schüttelt deine Hand und sagt nur: „1968. Zwei Koffer. Weitermachen.“ Du nickst. Das Wort hängt nach wie ein Widerhall — und du trägst es nach Hause, erleichtert und ein Buch schwerer."}]}],ro={episode:Gr,cast:Rr,items:jr,scenes:Cr},ao=Object.freeze(Object.defineProperty({__proto__:null,cast:Rr,default:ro,episode:Gr,items:jr,scenes:Cr},Symbol.toStringTag,{value:"Module"})),ye={A1:1,A2:2,B1:3,B2:4};function so(a){const e=[],t=[],n=[],r=[],s=new Map;for(const[c,b]of Object.entries(a)){if(!b?.episode||!Array.isArray(b.scenes)||!Array.isArray(b.items)){e.push(`${c}: missing episode/scenes/items arrays`);continue}t.push(b.episode),n.push(...b.scenes),r.push(...b.items);for(const B of b.cast??[])s.set(B.id,{name:B.name,role:B.role})}const d=new Map;for(const c of r){const b=d.get(c.id);b?e.push(`duplicate item id: ${c.id} (${b.german} / ${c.german})`):d.set(c.id,c)}const h=new Map;for(const c of r){const b=h.get(c.german);b&&b!==c.id?e.push(`duplicate german "${c.german}" in ${b} and ${c.id}`):h.set(c.german,c.id)}const p=new Map;for(const c of t)p.has(c.id)&&e.push(`duplicate episode id: ${c.id}`),p.set(c.id,c);const f=new Map;for(const c of n)f.has(c.id)&&e.push(`duplicate scene id: ${c.id}`),f.set(c.id,c);for(const c of n){const b=p.get(c.episodeId);b?b.sceneIds.includes(c.id)||e.push(`scene ${c.id} missing from episode ${b.id}.sceneIds`):e.push(`scene ${c.id}: unknown episodeId ${c.episodeId}`);for(const M of c.introducedItems){const _=d.get(M);_?_.introducedInScene!==c.id&&e.push(`scene ${c.id}: item ${M} says introducedInScene=${_.introducedInScene}`):e.push(`scene ${c.id}: introducedItems references unknown item ${M}`)}for(const M of c.requiredItems){const _=d.get(M);if(!_)e.push(`scene ${c.id}: requiredItems references unknown item ${M}`);else{const Y=_.introducedInScene;f.get(Y)||e.push(`scene ${c.id}: required item ${M} introduce
