(Under the note, small: 'The light will come.')`,itemIds:["fruehstueck","langsam","gewoehnungssache"]},{type:"narration",text:"Sonnenlicht auf dem Blümchentischtuch. Dein erster Monat. Der Wecker ist jetzt dein Kollege."}]}],za={episode:At,cast:Lt,items:Tt,scenes:Mt},Aa=Object.freeze(Object.defineProperty({__proto__:null,cast:Lt,default:za,episode:At,items:Tt,scenes:Mt},Symbol.toStringTag,{value:"Module"})),Dt={id:"a1e7",arcId:"A1",cefrLevel:"A1",title:"Der Supermarkt",titleEn:"The supermarket",blurb:"Pfund oder Kilo? Pfand ja oder nein? Du lernst einkaufen wie ein Mensch mit Einkaufsliste — und bekommst dein Pfand zurück.",order:7,sceneIds:["a1e7s1","a1e7s2","a1e7s3"]},Bt=[{id:"kassiererin",name:"Frau Bergmann",role:"Kassiererin"},{id:"tobias",name:"Tobias",role:"Nachbar, Freund"}],Et=[{id:"der-supermarkt",type:"word",german:"der Supermarkt",meaning:"the supermarket",image:"laden",audio:"tts",introducedInScene:"a1e7s1",tags:["shopping","food","city"],cefrLevel:"A1",note:"der, Plural: die Supermärkte"},{id:"die-stofftasche",type:"word",german:"die Stofftasche",meaning:"the (cloth) tote bag",image:"tüte",audio:"tts",introducedInScene:"a1e7s1",tags:["shopping","objects"],cefrLevel:"A1",note:"die, Plural: die Stofftaschen — in Deutschland pflichtbewusst dabei"},{id:"das-kilo",type:"word",german:"das Kilo",meaning:"the kilo",image:"gemuese",audio:"tts",introducedInScene:"a1e7s1",tags:["shopping","food"],cefrLevel:"A1",note:"das, Plural: die Kilos — kurz für das Kilogramm"},{id:"das-pfund",type:"word",german:"das Pfund",meaning:"the pound (500 g — still used for food!)",image:"gemuese",audio:"tts",introducedInScene:"a1e7s1",tags:["shopping","food"],cefrLevel:"A1",note:"das, Plural: die Pfunde — „ein Pfund Butter“ sagt man immer noch"},{id:"die-pfandflasche",type:"word",german:"die Pfandflasche",meaning:"the deposit bottle",image:"getränk",audio:"tts",introducedInScene:"a1e7s1",tags:["shopping","money","objects"],cefrLevel:"A1",note:"die, Plural: die Pfandflaschen — Pfand = deposit. 8 bis 25 Cent!"},{id:"das-obst",type:"word",german:"das Obst",meaning:"the fruit",image:"apfel",audio:"tts",introducedInScene:"a1e7s1",tags:["food","shopping"],cefrLevel:"A1",note:"das ( Sammelbegriff ) — Gemüse weißt du schon"},{id:"die-kassiererin",type:"word",german:"die Kassiererin",meaning:"the cashier (f)",image:"kasse",audio:"tts",introducedInScene:"a1e7s2",tags:["shopping","people"],cefrLevel:"A1",note:"die, Plural: die Kassiererinnen; männlich: der Kassierer"},{id:"bar-oder-mit-karte",type:"chunk",german:"Bar oder mit Karte?",meaning:"Cash or by card?",image:"geld",audio:"tts",introducedInScene:"a1e7s2",tags:["shopping","money","questions"],cefrLevel:"A1",note:"Die Standardfrage an jeder Kasse"},{id:"die-quittung",type:"word",german:"die Quittung",meaning:"the receipt",image:"beleg",audio:"tts",introducedInScene:"a1e7s2",tags:["shopping","money","paperwork"],cefrLevel:"A1",note:"die, Plural: die Quittungen — „Quittung, bitte?“"},{id:"das-wechselgeld",type:"word",german:"das Wechselgeld",meaning:"the (small) change",image:"münzen",audio:"tts",introducedInScene:"a1e7s2",tags:["money","shopping"],cefrLevel:"A1",note:"das ( Singular ) — Geld zurück beim Bezahlen"},{id:"das-macht-zusammen",type:"grammar_pattern",german:"Das macht zusammen ___, bitte.",meaning:"That comes to ___ altogether, please.",image:"kasse",audio:"tts",introducedInScene:"a1e7s2",tags:["shopping","money"],cefrLevel:"A1",cloze:"zwölf Euro achtzig",alt:["12,80"],speak:"Das macht zusammen zwölf Euro achtzig, bitte.",note:"Die Kasse spricht: Preis + „bitte“"},{id:"die-süßigkeiten",type:"word",german:"die Süßigkeiten",meaning:"the sweets / candy",image:"kuchen",audio:"tts",introducedInScene:"a1e7s2",tags:["food","shopping"],cefrLevel:"A1",note:"Pluralwort — Kassenzone-Klassiker"},{id:"der-pfandautomat",type:"word",german:"der Pfandautomat",meaning:"the deposit-bottle machine",image:"kasse",audio:"tts",introducedInScene:"a1e7s3",tags:["shopping","money"],cefrLevel:"A1",note:"der, Plural: die Pfandautomaten — Deutschlands zufriedenstellendste Maschine"},{id:"die-flasche",type:"word",german:"die Flasche",meaning:"the bottle",image:"getränk",audio:"tts",introducedInScene:"a1e7s3",tags:["objects","shopping"],cefrLevel:"A1",note:"die, Plural: die Flaschen"},{id:"zurückgeben",type:"chunk",german:"Ich gebe die Flaschen zurück.",meaning:"I'm returning the bottles.",image:"getränk",audio:"tts",introducedInScene:"a1e7s3",tags:["shopping"],cefrLevel:"A1",note:"zurückgeben = zurück + geben, trennbar"},{id:"das-guthaben",type:"word",german:"das Guthaben",meaning:"the credit / balance (from returns)",image:"geld",audio:"tts",introducedInScene:"a1e7s3",tags:["money","shopping"],cefrLevel:"A1",note:"das, Plural: die Guthaben — Bon aus dem Automaten an der Kasse einlösen"},{id:"die-ersparnis",type:"word",german:"die Ersparnis",meaning:"the saving(s)",image:"münzen",audio:"tts",introducedInScene:"a1e7s3",tags:["money"],cefrLevel:"A1",note:"die, Plural: die Ersparnisse — sparen = to save"},{id:"das-abendbrot",type:"word",german:"das Abendbrot",meaning:"the supper (bread-based evening meal)",image:"brot",audio:"tts",introducedInScene:"a1e7s3",tags:["food","routine"],cefrLevel:"A1",note:"das, Plural: die Abendbrote — kulturell, nicht nur kulinarisch"}],xt=[{id:"a1e7s1",episodeId:"a1e7",title:"Einkaufsliste",titleEn:"Shopping list",place:"Supermarkt an der Jahnallee",bg:"laden",contextTags:["shopping","food","money"],requiredItems:["das-brot","der-apfel"],introducedItems:["der-supermarkt","die-stofftasche","das-kilo","das-pfund","die-pfandflasche","das-obst"],beats:[{type:"narration",text:"Donnerstagabend. Deine Einkaufsliste: Brot, Butter, Obst, Kartoffeln, und genau nichts davon findest du, wo du es erwartest. Supermärkte sind Labyrinthe mit Absicht."},{type:"meet",itemIds:["der-supermarkt","die-stofftasche","das-obst"]},{type:"line",speaker:"tobias",text:"Nimm die Stofftasche mit. Tüten kosten hier Geld — und die Deutschen reden dich über die Stofftasche glücklich.",translation:"Bring the tote bag. Bags cost money here — and Germans will talk to you about tote bags happily."},{type:"meet",itemIds:["das-kilo","das-pfund","die-pfandflasche"]},{type:"reading",title:"Angebot der Woche",text:`ANGEBOT DER WOCHE

Butter (250 g) — 1,79 €

Butter (250 g) — €1.79

Mineral water with deposit €0.25`,itemIds:["das-kilo","das-pfund","die-pfandflasche"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Eine ältere Dame fragt dich, was ein Pfund wiegt. Du weißt es jetzt.",options:[{label:"Ein Pfund sind fünfhundert Gramm.",line:"Ein Pfund sind fünfhundert Gramm!"},{label:"Keine Ahnung. Aber ich kann ein Kilo.",line:"Keine Ahnung. Aber ein Kilo kann ich."}]},{type:"check",count:2,mode:"recall"}]},{id:"a1e7s2",episodeId:"a1e7",title:"An der Kasse",titleEn:"At the checkout",place:"Kasse 3",bg:"laden",contextTags:["shopping","money","service"],requiredItems:["die-stofftasche"],introducedItems:["die-kassiererin","bar-oder-mit-karte","die-quittung","das-wechselgeld","das-macht-zusammen","die-süßigkeiten"],beats:[{type:"narration",text:"Die Schlange läuft. Dir läuft sie auch — das Laufband wartet nicht auf Lob. Du räumst wie im Videospiel, die Stofftasche breit daneben."},{type:"meet",itemIds:["die-kassiererin","bar-oder-mit-karte","die-süßigkeiten"]},{type:"line",speaker:"kassiererin",text:"Papierkram hinten lassen? …So. Das macht zusammen zwölf Euro achtzig, bitte.",translation:"Receipt in the trolley? …Right. That comes to twelve euros eighty, please."},{type:"meet",itemIds:["das-macht-zusammen","die-quittung","das-wechselgeld"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"kassiererin",text:"Bar oder mit Karte? …Mit Karte, danke. Quittung? — Quittung immer, sagt mein Buchhalterherz.",translation:"Cash or card? …By card, thanks. Receipt? — Always a receipt, says my accountant heart."},{type:"choice",prompt:"Du zahlst mit zwanzig Euro.",options:[{label:"Stimmt so!",line:"Stimmt so! Behalten Sie das Wechselgeld."},{label:"Quittung, bitte!",line:"Quittung, bitte! …Und dann stimmt es so."}]},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Beep. Bon. Stofftasche voll. Du hast die Kasse überlebt, ohne das Wort „ähh“ mehr als sechsmal zu benutzen."}]},{id:"a1e7s3",episodeId:"a1e7",title:"Pfandzeit",titleEn:"Deposit time",place:"Pfandautomat, hinter dem Eingang",bg:"laden",contextTags:["shopping","money"],requiredItems:["die-pfandflasche","das-wasser"],introducedItems:["der-pfandautomat","zurückgeben","das-guthaben","die-ersparnis","das-abendbrot","die-flasche"],beats:[{type:"narration",text:"Unter einer Treppe steht Deutschlands ehrlichster Automat. Du hast sechs leere Flaschen im Korb — gesammelt wie Trophäen."},{type:"meet",itemIds:["der-pfandautomat","zurückgeben","die-flasche"]},{type:"reading",title:"Am Automaten",text:`Pfandautomat

One-way bottle/can: €0.25
Please insert bottles one at a time.
Redeem the voucher at the checkout.`,itemIds:["der-pfandautomat","das-guthaben"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Automat spuckt einen Bon aus: 1,13 €. Was ist das?",options:[{label:"Mein Guthaben — einlösen an der Kasse!",line:"Mein Guthaben! Das löse ich gleich an der Kasse ein."},{label:"Eine Rechnung. …Für die Flaschen?",line:"Eine Rechnung? …Für die Flaschen? Sie haben doch gearbeitet."}]},{type:"meet",itemIds:["das-guthaben","die-ersparnis","das-abendbrot"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"tobias",text:"Und? Wie fühlt sich dein erstes Pfand an? …So. Willkommen im Club. Damit kaufen wir Abendbrot. Essen, das man verdient hat.",translation:"So? How does your first deposit feel? …Right. Welcome to the club. That buys us supper. Food you've earned."},{type:"check",count:2,mode:"recall"},{type:"narration",text:"Brötchen, Käse, die Äpfel aus dem Angebot. Abendbrot auf dem Küchentisch, Ersparnis im Kopf. Deutschland hat Systeme. Manche davon liebt man."}]}],La={episode:Dt,cast:Bt,items:Et,scenes:xt},Ta=Object.freeze(Object.defineProperty({__proto__:null,cast:Bt,default:La,episode:Dt,items:Et,scenes:xt},Symbol.toStringTag,{value:"Module"})),Pt={id:"a1e8",arcId:"A1",cefrLevel:"A1",title:"Der erste Sonntag",titleEn:"The first Sunday",blurb:"Sonntag, 22 Grad, kein Termin. Tobias erklärt dir das Wichtigste Wort für Leipzig: Picknick. Rosental, Wiese, Enten — und dein erstes „Lass uns …“.",order:8,sceneIds:["a1e8s1","a1e8s2","a1e8s3"]},Wt=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"}],Kt=[{id:"die-wiese",type:"word",german:"die Wiese",meaning:"the meadow / grass field",image:"blumen",audio:"tts",introducedInScene:"a1e8s1",tags:["nature","leisure"],cefrLevel:"A1",note:"die, Plural: die Wiesen — grün und im Sommer voll"},{id:"die-decke",type:"word",german:"die Decke",meaning:"the blanket / ceiling",image:"decke",audio:"tts",introducedInScene:"a1e8s1",tags:["leisure","home"],cefrLevel:"A1",note:"die, Plural: die Decken — auch die Zimmerdecke!"},{id:"das-picknick",type:"word",german:"das Picknick",meaning:"the picnic",image:"korb",audio:"tts",introducedInScene:"a1e8s1",tags:["food","leisure"],cefrLevel:"A1",note:"das, Plural: die Picknicke — Picknick machen"},{id:"der-himmel",type:"word",german:"der Himmel",meaning:"the sky",image:"wetter",audio:"tts",introducedInScene:"a1e8s1",tags:["nature","weather"],cefrLevel:"A1",note:"der ( Singular ) — blauer Himmel = gutes Wetter"},{id:"die-vorfreude",type:"word",german:"die Vorfreude",meaning:"the anticipation",image:"geschenk",audio:"tts",introducedInScene:"a1e8s1",tags:["feelings","leisure"],cefrLevel:"A1",note:"die ( Singular ) — „Vorfreude ist die schönste Freude“"},{id:"lass-uns-spazieren",type:"grammar_pattern",german:"Lass uns ___ gehen!",meaning:"Let's go for a walk!",image:"ziel",audio:"tts",introducedInScene:"a1e8s1",tags:["grammar","leisure"],cefrLevel:"A1",cloze:"spazieren",speak:"Lass uns spazieren gehen!",note:"Lass uns + Verb — Vorschläge machen auf A1-Niveau"},{id:"die-ente",type:"word",german:"die Ente",meaning:"the duck",image:"ente",audio:"tts",introducedInScene:"a1e8s2",tags:["nature","animals"],cefrLevel:"A1",note:"die, Plural: die Enten — im Park sehr mutig"},{id:"das-eis",type:"word",german:"das Eis",meaning:"the ice cream",image:"eis",audio:"tts",introducedInScene:"a1e8s2",tags:["food","leisure"],cefrLevel:"A1",note:"das ( Singular ) — auch: der Eisbecher; „ein Eis“ geht immer"},{id:"der-drachen",type:"word",german:"der Drachen",meaning:"the kite (also: dragon)",image:"drachen",audio:"tts",introducedInScene:"a1e8s2",tags:["leisure","nature"],cefrLevel:"A1",note:"der, Plural: die Drachen — einen Drachen steigen lassen"},{id:"die-wolke",type:"word",german:"die Wolke",meaning:"the cloud",image:"wetter",audio:"tts",introducedInScene:"a1e8s2",tags:["weather","nature"],cefrLevel:"A1",note:"die, Plural: die Wolken — wolkenlos = perfekt"},{id:"gemuetlich",type:"word",german:"gemütlich",meaning:"cozy / comfortable / unhurried",image:"ruhe",audio:"tts",introducedInScene:"a1e8s2",tags:["feelings","opinion"],cefrLevel:"A1",note:"Adjektiv — DAS deutsche Gefühlswort"},{id:"die-limo",type:"word",german:"die Limo",meaning:"the soft drink (colloquial)",image:"getränk",audio:"tts",introducedInScene:"a1e8s2",tags:["food"],cefrLevel:"A1",note:"die, Plural: die Limos — kurz für Limonade"},{id:"der-heimweg",type:"word",german:"der Heimweg",meaning:"the way home",image:"strasse",audio:"tts",introducedInScene:"a1e8s3",tags:["city","time"],cefrLevel:"A1",note:"der, Plural: die Heimwege — auf dem Heimweg"},{id:"die-kirsche",type:"word",german:"die Kirsche",meaning:"the cherry",image:"apfel",audio:"tts",introducedInScene:"a1e8s3",tags:["food"],cefrLevel:"A1",note:"die, Plural: die Kirschen — im Sommer günstig"},{id:"der-sonnenuntergang",type:"word",german:"der Sonnenuntergang",meaning:"the sunset",image:"sonnenuntergang",audio:"tts",introducedInScene:"a1e8s3",tags:["nature","time"],cefrLevel:"A1",note:"der, Plural: die Sonnenuntergänge"},{id:"die-laterne",type:"word",german:"die Laterne",meaning:"the (street) lantern",image:"lampe",audio:"tts",introducedInScene:"a1e8s3",tags:["city"],cefrLevel:"A1",note:"die, Plural: die Laternen — abends angehen"},{id:"der-mond",type:"word",german:"der Mond",meaning:"the moon",image:"zukunft",audio:"tts",introducedInScene:"a1e8s3",tags:["nature"],cefrLevel:"A1",note:"der ( Singular ) — voller Mond"},{id:"zufrieden",type:"word",german:"zufrieden",meaning:"satisfied / content",image:"person",audio:"tts",introducedInScene:"a1e8s3",tags:["feelings"],cefrLevel:"A1",note:"zufrieden SEIN MIT + Dativ"}],_t=[{id:"a1e8s1",episodeId:"a1e8",title:"Der Plan",titleEn:"The plan",place:"Wohnung, Sonntagmorgen",bg:"wohnung",contextTags:["friends","leisure","weather"],requiredItems:["der-sonntag","das-wetter"],introducedItems:["die-wiese","die-decke","das-picknick","der-himmel","die-vorfreude","lass-uns-spazieren"],beats:[{type:"narration",text:"Sonntagmorgen. Die Sonne steht im Zimmer, und dein Handy bleibt still. Kein Termin. Kein Amt. Tobias klopft mit einem Rucksack und dem Gesicht eines Menschen mit Plan."},{type:"line",speaker:"tobias",text:"Guten Morgen, Sonne! Das Wetter ist perfekt — 24 Grad, eine kleine Wolke, mehr nicht. Wir machen Picknick. Rosental. Ich habe Decke, Brot, Limo. Du bringst dich selbst mit — das reicht.",translation:"Good morning, sunshine! The weather is perfect — 24 degrees, one small cloud, that's it. We're having a picnic. Rosental park. I've got a blanket, bread, lemonade. You just bring yourself — that's enough."},{type:"meet",itemIds:["die-wiese","die-decke","das-picknick"]},{type:"line",speaker:"tobias",text:"Siehst du den Himmel? Ganz blau. Und weißt du, was ich am besten finde? Die Vorfreude. Sonntag ist erfunden worden, damit Menschen Picknick machen. Glaub mir, ich war dabei.",translation:"See the sky? Completely blue. And you know what I like best? The anticipation. Sunday was invented so that people have picnics. Trust me, I was there."},{type:"meet",itemIds:["der-himmel","die-vorfreude","lass-uns-spazieren"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias wartet an der Tür.",options:[{label:"Lass uns spazieren gehen! Ich bin dabei.",line:"Lass uns spazieren gehen! Ich bin dabei — und ich bringe Kirschen mit."},{label:"Ein Picknick? Ich habe noch nie eins gemacht.",line:"Ein Picknick? Ich habe noch nie eins gemacht. …Zeit für die erste Vorfreude deines Lebens."}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Wetterbericht für Leipzig",text:`Wetterbericht — Sonntag

Leipzig: 24 Grad, sonnig.
Am Nachmittag ein paar Wolken,
kein Regen. Wind schwach, 2–3.

Perfekt für einen Ausflug:
Rosental, Auensee, Park.

Sonnencreme nicht vergessen!`,translation:`Weather report — Sunday

Leipzig: 24 degrees, sunny.
A few clouds in the afternoon,
no rain. Wind light, 2–3.

Perfect for an outing:
Rosental, Auensee, park.

Don't forget sunscreen!`}]},{id:"a1e8s2",episodeId:"a1e8",title:"Picknick im Rosental",titleEn:"Picnic in the Rosental",place:"Rosental, große Wiese",bg:"park",contextTags:["friends","food","nature"],requiredItems:["das-brot","lecker"],introducedItems:["die-ente","das-eis","der-drachen","die-wolke","gemuetlich","die-limo"],beats:[{type:"narration",text:"Die Wiese ist ein grünes Meer: Familien, Hunde, ein Mann mit einem Drachen und viel zu viel Zuversicht. Ihr breitet die Decke direkt unter einer alten Kastanie aus."},{type:"line",speaker:"tobias",text:"So. Decke glatt, Brot auf, Limo kalt. …Und da vorne: Enten. Vorsicht, die sind hier frech. Die eine da, mit dem Gesicht — die hat mir letzten Sommer das Brot gestohlen. Ich vergesse nie.",translation:"Right. Blanket smooth, bread out, lemonade cold. …And over there: ducks. Careful, they're cheeky here. That one, with that face — she stole my bread last summer. I never forget."},{type:"meet",itemIds:["die-ente","das-eis","die-limo"]},{type:"meet",itemIds:["der-drachen","die-wolke","gemuetlich"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Drachen-Mann kämpft. Der Drachen gewinnt.",options:[{label:"Soll ich ihm helfen? Ich renne schnell.",line:"Soll ich ihm helfen? Ich renne schnell. …Tobias: „Nein. Das muss er selbst. Für seinen Stolz.“"},{label:"Lass ihn. Wir sind gemütlich, er ist Sportler.",line:"Lass ihn. Wir sind gemütlich, er ist Sportler. Zwei Welten auf einer Wiese."}]},{type:"line",speaker:"tobias",text:"Genau so fühlt sich Deutsch an, wenn es endlich klappt: wie ein Picknick. Man sitzt, die Wolken ziehen, ein Eis schmilzt — und nichts ist dringend. …Außer der Ente. Nichts ist frecher als die Ente.",translation:"That's exactly what German feels like when it finally works: like a picnic. You sit, the clouds drift, an ice cream melts — and nothing is urgent. …Except the duck. Nothing is cheekier than the duck."},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Du isst Brot mit Butter, Tobias erzählt von einem Drachen-Unfall mit Lehrer (Drachen: unschuldig), und die Ente patrouillert in drei Metern Entfernung. Die Zeit geht langsam. Es ist gut so."}]},{id:"a1e8s3",episodeId:"a1e8",title:"Der Heimweg",titleEn:"The way home",place:"Zetizerring, später Nachmittag",bg:"strasse",contextTags:["friends","city","feelings"],requiredItems:["der-kaffee","langsam"],introducedItems:["der-heimweg","die-kirsche","der-sonnenuntergang","die-laterne","der-mond","zufrieden"],beats:[{type:"narration",text:"Der Heimweg führt an einer Kioskbude vorbei (Kirschen, „2 Euro die Tüte“), und dann wird es plötzlich golden: Der Sonnenuntergang setzt die ganze Straße in Warmwasserfarben."},{type:"meet",itemIds:["der-heimweg","die-kirsche","der-sonnenuntergang"]},{type:"line",speaker:"tobias",text:"Kirschen? Hier. Zwei Euro. …Und jetzt sieh mal: Die Laternen gehen an, der Mond kommt hoch, und du lächelst wie ein Mensch, der angekommen ist. Zufrieden, nicht wahr?",translation:"Cherries? Here. Two euros. …And now look: the lanterns come on, the moon rises, and you're smiling like someone who ate too much. Content, right?"},{type:"meet",itemIds:["die-laterne","der-mond","zufrieden"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias: „Und? Wie war dein erster deutscher Sonntag?“",options:[{label:"Sehr gemütlich. Ich bin zufrieden.",line:"Sehr gemütlich. Ich bin zufrieden. …Und ein bisschen müde. Picknick ist anstrengender als gedacht."},{label:"Ich habe neue Wörter gelernt: Ente, Wiese, Vorfreude.",line:"Ich habe neue Wörter gelernt: Ente, Wiese, Vorfreude. …Die Ente kann ich nicht mehr vergessen."}]},{type:"line",speaker:"tobias",text:"Vorfreude. Das ist das Wort für die Woche. Nächsten Sonntag: Auensee. Ich bring den Drachen mit — diesmal mit Anleitung.",translation:"Anticipation. That's the word for the week. Next Sunday: Auensee lake. I'll bring the kite — this time with instructions."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Tobias' SMS (19:42)",text:`»Sonnenuntergang: 8/10. Laterne: an.
Kirschen: deine Schuld, ich hab zu viele gegessen.

Heimweg-Vorschlag: die lange Runde.
Zufrieden-Zählen: wie viele Laternen wir passieren,
bis wir nichts mehr sagen müssen.

Ich bin bei 4. Dein Rekord?«`,translation:`'Sunset: 8/10. Lantern: on.
Cherries: your fault, I ate too many.

Way-home suggestion: the long route.

I'm at 4. Your record?'`,itemIds:["der-heimweg","zufrieden","der-sonnenuntergang"]},{type:"narration",text:"Zu Hause wäschst du die Kirschen und legst sie in eine Schale, einfach, um sie anzusehen. Draußen ist der Mond jetzt richtig da. Dein erster deutscher Sonntag hat ein Ende — und ein Gefühl dahinter: zufrieden."}]}],Ma={episode:Pt,cast:Wt,items:Kt,scenes:_t},Da=Object.freeze(Object.defineProperty({__proto__:null,cast:Wt,default:Ma,episode:Pt,items:Kt,scenes:_t},Symbol.toStringTag,{value:"Module"})),Ft={id:"a1e9",arcId:"A1",cefrLevel:"A1",title:"Der Wochenmarkt",titleEn:"The weekly market",blurb:"Samstag, acht Uhr, Marktplatz: Herr Kranich ruft Preise, die Waage wackelt, und du kaufst zum ersten Mal wie ein echter Leipziger ein — ohne Regal, mit Rede.",order:9,sceneIds:["a1e9s1","a1e9s2","a1e9s3"]},Ht=[{id:"kranich",name:"Herr Kranich",role:"Verkäufer am Wochenmarkt"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"tobias",name:"Tobias",role:"Nachbar, Student"}],Nt=[{id:"der-markt",type:"word",german:"der Markt",meaning:"the market",image:"laden",audio:"tts",introducedInScene:"a1e9s1",tags:["shopping","city","food"],cefrLevel:"A1",note:"der, Plural: die Märkte — Wochenmarkt = Wochenmarkt"},{id:"der-verkaeufer",type:"word",german:"der Verkäufer",meaning:"the seller / vendor",image:"person",audio:"tts",introducedInScene:"a1e9s1",tags:["people","shopping"],cefrLevel:"A1",note:"der, Plural: die Verkäufer; weiblich: die Verkäuferin"},{id:"probieren",type:"chunk",german:"Darf ich probieren?",meaning:"May I try a piece?",image:"kuchen",audio:"tts",introducedInScene:"a1e9s1",tags:["shopping","questions"],cefrLevel:"A1",speak:"Darf ich probieren?",note:"probieren — am Markt fast immer: ja!"},{id:"der-preisschild",type:"word",german:"das Preisschild",meaning:"the price tag / sign",image:"formular",audio:"tts",introducedInScene:"a1e9s1",tags:["shopping","money"],cefrLevel:"A1",note:"das, Plural: die Preisschilder — hilft beim Lesen!"},{id:"ein-bisschen-mehr",type:"grammar_pattern",german:"___ mehr, bitte.",meaning:"A little more, please.",image:"tüte",audio:"tts",introducedInScene:"a1e9s1",tags:["grammar","shopping"],cefrLevel:"A1",cloze:"Ein bisschen",speak:"Ein bisschen mehr, bitte.",note:"ein bisschen + Komparativ — höflich nachlegen"},{id:"die-menge",type:"word",german:"die Menge",meaning:"the amount / quantity",image:"beleg",audio:"tts",introducedInScene:"a1e9s1",tags:["shopping"],cefrLevel:"A1",note:"die, Plural: die Mengen — auch: eine Menge Leute"},{id:"die-kraeuter",type:"word",german:"die Kräuter",meaning:"the herbs (plural)",image:"blumen",audio:"tts",introducedInScene:"a1e9s2",tags:["food","cooking"],cefrLevel:"A1",note:"Plural: die Kräuter — Petersilie, Basilikum, Schnittlauch"},{id:"der-strauss",type:"word",german:"der Strauß",meaning:"the bouquet (of flowers)",image:"geschenk",audio:"tts",introducedInScene:"a1e9s2",tags:["shopping","gifts"],cefrLevel:"A1",note:"der, Plural: die Sträuße — ein Strauß Blumen"},{id:"die-waage",type:"word",german:"die Waage",meaning:"the scale",image:"beleg",audio:"tts",introducedInScene:"a1e9s2",tags:["shopping"],cefrLevel:"A1",note:"die, Plural: die Waagen — auf die Waage legen"},{id:"reif",type:"word",german:"reif",meaning:"ripe",image:"sonnenuntergang",audio:"tts",introducedInScene:"a1e9s2",tags:["food"],cefrLevel:"A1",note:"Adjektiv — „Der ist schon reif“ = heute essen"},{id:"der-geruch",type:"word",german:"der Geruch",meaning:"the smell / scent",image:"tee",audio:"tts",introducedInScene:"a1e9s2",tags:["nature","food"],cefrLevel:"A1",note:"der, Plural: die Gerüche — der Geruch von Erdbeeren"},{id:"der-einkauf",type:"word",german:"der Einkauf",meaning:"the shopping / purchase",image:"tüte",audio:"tts",introducedInScene:"a1e9s2",tags:["shopping"],cefrLevel:"A1",note:"der, Plural: die Einkäufe — den Einkauf erledigen"},{id:"das-kochbuch",type:"word",german:"das Kochbuch",meaning:"the cookbook",image:"buch",audio:"tts",introducedInScene:"a1e9s3",tags:["cooking","learning"],cefrLevel:"A1",note:"das, Plural: die Kochbücher — von Oma geerbt"},{id:"die-zwiebel",type:"word",german:"die Zwiebel",meaning:"the onion",image:"gemuese",audio:"tts",introducedInScene:"a1e9s3",tags:["food","cooking"],cefrLevel:"A1",note:"die, Plural: die Zwiebeln — bring Tränen"},{id:"der-topf",type:"word",german:"der Topf",meaning:"the pot",image:"suppe",audio:"tts",introducedInScene:"a1e9s3",tags:["cooking","kitchen"],cefrLevel:"A1",note:"der, Plural: die Töpfe — einen Topf aufsetzen"},{id:"schneiden",type:"word",german:"schneiden",meaning:"to cut",image:"werkzeug",audio:"tts",introducedInScene:"a1e9s3",tags:["cooking"],cefrLevel:"A1",note:"starkes Verb: schneiden — schnitt — geschnitten"},{id:"die-mahlzeit",type:"word",german:"die Mahlzeit",meaning:"the meal",image:"tisch",audio:"tts",introducedInScene:"a1e9s3",tags:["food"],cefrLevel:"A1",note:"die, Plural: die Mahlzeiten — auch Gruß um 12 Uhr!"},{id:"gutbuergerlich",type:"word",german:"gutbürgerlich",meaning:"hearty / traditional home-style",image:"salat",audio:"tts",introducedInScene:"a1e9s3",tags:["food","opinion"],cefrLevel:"A1",note:"Adjektiv — gutbürgerliche Küche = richtiges Essen"}],Gt=[{id:"a1e9s1",episodeId:"a1e9",title:"Zwischen den Ständen",titleEn:"Between the stalls",place:"Marktplatz, Samstag 8:30",bg:"markt",contextTags:["shopping","food","city"],requiredItems:["das-gemuese","wie-viel-kostet"],introducedItems:["der-markt","der-verkaeufer","probieren","der-preisschild","ein-bisschen-mehr","die-menge"],beats:[{type:"narration",text:"Samstag, acht Uhr dreißig. Der Marktplatz riecht nach Erdbeeren und Kaffee. Herr Kranich ruft Preise wie Poesie: „Tomaten! Rote Tomaten! Süßer als Sonntag!“"},{type:"line",speaker:"kranich",text:"Na, jung! Du schaust wie einer, der noch nie auf einem Markt war. …Stimmt's? Kein Problem: Hier regiert nicht das Regal — hier redet man. Zeig auf, frag, probier. Und die Menge? Bestimmst du.",translation:"Hey, young one! You look like someone who's never been to a market. …Right? No problem: shelves don't rule here — talking does. Point, ask, taste. And the amount? You decide."},{type:"meet",itemIds:["der-markt","der-verkaeufer","die-menge"]},{type:"meet",itemIds:["probieren","der-preisschild","ein-bisschen-mehr"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Herr Kranich hält eine Tomate an dein Ohr. Warum? Unklar.",options:[{label:"Darf ich probieren?",line:"Darf ich probieren? …„Darfst du! Dafür darfst du auch zuhören: Die Tomate sagt nichts. Das ist gut — reif und diskret.“"},{label:"Wie viel kostet die Tüte?",line:"Wie viel kostet die Tüte? …„Zwei fünfzig, und weil du fragst statt schiebst: drei Euro die zwei.“"}]},{type:"line",speaker:"kranich",text:"Und jetzt du: „Ein bisschen mehr, bitte.“ Sag's laut. …Perfekt! So klingt ein Kunde, der wiederkommt.",translation:"And now you: 'A little more, please.' Say it loud. …Perfect! That's what a customer who comes back sounds like."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Schild am Stand von Herrn Kranich",text:`MARKT AM SAMSTAG — Angebote

Tomaten (rot, laut)      2,50 €/Pfund
Erdbeeren (heute, reif)  3,00 €/Schale
Kräuter-Töpfe            1,50 €/Topf
Kartoffeln               1,20 €/Pfund

»Wer fragt, kauft gut.
 Wer probiert, kauft besser.
 Wer wiederkommt, kauft am besten.«

— Familie Kranich, seit 1987`,translation:`SATURDAY MARKET — offers

Tomatoes (red, loud)     €2.50/pound
Strawberries (today, ripe) €3.00/basket
Herb pots                €1.50/pot
Potatoes                 €1.20/pound

'Who asks, buys well.
 Who tastes, buys better.
 Who comes back, buys best.'

— Kranich family, since 1987`}]},{id:"a1e9s2",episodeId:"a1e9",title:"Blumen und Kräuter",titleEn:"Flowers and herbs",place:"Blumenstand, zwei Reihen weiter",bg:"markt",contextTags:["shopping","gifts"],requiredItems:["das-obst","die-blumen"],introducedItems:["die-kraeuter","der-strauss","die-waage","reif","der-geruch","der-einkauf"],beats:[{type:"narration",text:"Zwei Reihen weiter: Blumen, Kräutertöpfe, und eine Waage, die älter aussieht als der Markt. Frau Brügge steht genau da und wartet offensichtlich auf dich."},{type:"line",speaker:"frau-bruegge",text:"Sam! Gut. Du hilfst mir tragen. …Ein Strauß für die Nachbarin — sie hatte Geburtstag, und ich bin spät dran. Nehmt ihr den mit den gelben? …Danke. Und du: nimm Kräuter. Frische Kräuter machen aus Studentenessen richtiges Essen.",translation:"Sam! Good. You'll help me carry. …A bouquet for the neighbour — it was her birthday and I'm late. Get her the one with the yellow ones? …Thanks. And you: take herbs. Fresh herbs turn student food into real food."},{type:"meet",itemIds:["der-strauss","die-kraeuter","der-einkauf"]},{type:"line",speaker:"frau-bruegge",text:"Die Erdbeeren hier — sieh mal, riech mal. Der Geruch! So riecht kein Supermarkt. Und: schon reif. Die isst du heute, nicht nächste Woche. Auf die Waage damit — aber nicht zu viele, wir sind nicht aus Gold.",translation:"The strawberries here — look, smell. The scent! No supermarket smells like this. And: already ripe. You eat those today, not next week. On the scale with them — but not too many, we're not made of gold."},{type:"meet",itemIds:["die-waage","reif","der-geruch"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Frau Brügge hält zwei Kräutertöpfe bereit.",options:[{label:"Basilikum — für Tomaten. Und Petersilie.",line:"Basilikum — für die Tomaten. Und Petersilie. …„Gut gewählt. Du kochst also doch mal was Vernünftiges.“"},{label:"Was empfehlen Sie für jemanden, der Tomatensuppe aus der Tüte isst?",line:"Was empfehlen Sie für jemanden, der Tomatensuppe aus der Tüte isst? …„Alles. Fang mit allen an.“"}]},{type:"line",speaker:"frau-bruegge",text:"So. Dein erster richtiger Einkauf auf einem Markt. Merk dir das Gefühl — das ist Deutschland, bevor es Kassenbons gab.",translation:"There. Your first real shopping trip at a market. Remember the feeling — that's Germany before there were receipts."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Frau Brügges Einkaufszettel",text:`MARKT — NICHT VERGESSEN:

Kräuter (Basilikum, Petersilie — SAM nimmt)
Strauß gelb (Nachbarin, Geburtstag, spät dran)
Erdbeeren: NUR wenn reif. Riechen lassen!

Auf die Waage, genau schauen, nett grüßen.
Der Einkauf ist kein Sport.
Er ist ein Gespräch.`,translation:`MARKET — DON'T FORGET:

Herbs (basil, parsley — SAM carries)
Yellow bouquet (neighbour, birthday, running late)
Strawberries: ONLY if ripe. Make them smell them!

On the scale, look carefully, greet nicely.
Shopping isn't a sport.
It's a conversation.`,itemIds:["die-kraeuter","der-einkauf","die-waage"]}]},{id:"a1e9s3",episodeId:"a1e9",title:"Erstmals gekocht",titleEn:"Cooked for the first time",place:"Wohnung, Küchentisch, 18:00",bg:"wohnung",contextTags:["food","home","friends"],requiredItems:["die-kartoffel","die-butter"],introducedItems:["das-kochbuch","die-zwiebel","der-topf","schneiden","die-mahlzeit","gutbuergerlich"],beats:[{type:"narration",text:"Abends: dein Küchentisch als Marktplatz-Ausläufer. Omas altes Kochbuch liegt offen (Seite 12: Kartoffelsuppe), die Zwiebeln warten schon. Tobias kommt als 'Qualitätskontrolle' vorbei."},{type:"meet",itemIds:["das-kochbuch","die-zwiebel","der-topf"]},{type:"line",speaker:"tobias",text:"Kartoffelsuppe! Respekt. …So, erst: Zwiebeln schneiden. Tränen sind normal, das ist kein Drama, das ist Aromaaufwand. Dann in den Topf, mit Butter. …Deine Suppe wird gutbürgerlich — das ist ein Kompliment, merk dir das Wort.",translation:"Potato soup! Respect. …First: chop the onions. Tears are normal, that's not drama, that's flavour work. Then into the pot, with butter. …Your soup will be proper home-style — that's a compliment, remember that word."},{type:"meet",itemIds:["schneiden","die-mahlzeit","gutbuergerlich"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Das Kochbuch sagt: „mit Muskatnuss abschmecken.“ Du hast keine Muskatnuss.",options:[{label:"Ohne. Das Kochbuch kennt meine Küche nicht.",line:"Ohne Muskat. Das Kochbuch kennt meine Küche nicht. …Sie ist neu hier. Wie ich."},{label:"Ich ruf Frau Brügge an. Die hat ALLES.",line:"Ich ruf Frau Brügge an. Die hat alles — inklusive Meinungen zur richtigen Menge Muskat."}]},{type:"line",speaker:"tobias",text:"Sieh dir das an: Ein Topf, Marktgemüse, ein Mensch, der vor vier Wochen „Gleis“ nicht aussprechen konnte. …Das ist deine erste richtige Mahlzeit, oder? Dann: Guten Appetit, Mitschneider.",translation:"Look at that: one pot, market vegetables, a person who four weeks ago couldn't pronounce 'Gleis'. …This is your first proper meal, right? Then: bon appétit, fellow chopper."},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Die Suppe dampft. Sie schmeckt wie der Markt klingt. Du schreibst auf einen Zettel: „Kartoffelsuppe: geschafft.“ — Der Zettel geht an die Pinnwand, gleich neben den ersten. Die Küche riecht nach Zwiebeln und Erfolg."}]}],Ba={episode:Ft,cast:Ht,items:Nt,scenes:Gt},Ea=Object.freeze(Object.defineProperty({__proto__:null,cast:Ht,default:Ba,episode:Ft,items:Nt,scenes:Gt},Symbol.toStringTag,{value:"Module"})),Rt={id:"a2e1",arcId:"A2",cefrLevel:"A2",title:"Beim Bürgeramt",titleEn:"At the citizens' office",blurb:"Nummer ziehen, Formular, Stempel. Deutschlands Lieblingssport: Verwaltung — heute mit dir als Spieler.",order:5,sceneIds:["a2e1s1","a2e1s2","a2e1s3"]},jt=[{id:"herr-bauer",name:"Herr Bauer",role:"Sachbearbeiter"},{id:"durchsage-amt",name:"Durchsage",role:"Nummernanzeige"}],Ct=[{id:"das-buergeramt",type:"word",german:"das Bürgeramt",meaning:"the citizens' office",image:"amt",audio:"tts",introducedInScene:"a2e1s1",tags:["admin","paperwork"],cefrLevel:"A2",note:"das, Plural: die Bürgerämter — dort wohnst du jetzt mittwochs"},{id:"der-pass",type:"word",german:"der Pass",meaning:"the passport",image:"pass",audio:"tts",introducedInScene:"a2e1s1",tags:["admin","paperwork"],cefrLevel:"A2",note:"der, Plural: die Pässe"},{id:"das-formular",type:"word",german:"das Formular",meaning:"the form",image:"formular",audio:"tts",introducedInScene:"a2e1s1",tags:["admin","paperwork"],cefrLevel:"A2",note:"das, Plural: die Formulare"},{id:"die-anmeldung",type:"word",german:"die Anmeldung",meaning:"the registration (of your address)",image:"formular",audio:"tts",introducedInScene:"a2e1s1",tags:["admin","paperwork"],cefrLevel:"A2",note:"die — innerhalb von 14 Tagen Pflicht. Willkommen."},{id:"ich-habe-einen-termin",type:"sentence",german:"Ich habe einen Termin um zehn.",meaning:"I have an appointment at ten.",audio:"tts",introducedInScene:"a2e1s1",tags:["admin","paperwork"],cefrLevel:"A2",parentId:"der-termin"},{id:"der-schalter",type:"word",german:"der Schalter",meaning:"the counter / service window",image:"amt",audio:"tts",introducedInScene:"a2e1s1",tags:["admin","city"],cefrLevel:"A2",note:"der, Plural: die Schalter"},{id:"die-adresse",type:"word",german:"die Adresse",meaning:"the address",image:"brief",audio:"tts",introducedInScene:"a2e1s2",tags:["admin","paperwork"],cefrLevel:"A2"},{id:"das-datum",type:"word",german:"das Datum",meaning:"the date",image:"kalender",audio:"tts",introducedInScene:"a2e1s2",tags:["admin","paperwork"],cefrLevel:"A2",note:"das, Plural: die Daten"},{id:"unterschreiben",type:"chunk",german:"Hier unterschreiben, bitte.",meaning:"Please sign here.",audio:"tts",introducedInScene:"a2e1s2",tags:["admin","paperwork","request"],cefrLevel:"A2",note:"unterschreiben = unterschreiben. Du wirst diesen Satz lieben."},{id:"der-beruf",type:"word",german:"der Beruf",meaning:"the profession / occupation",image:"stelle",audio:"tts",introducedInScene:"a2e1s2",tags:["admin","work"],cefrLevel:"A2",note:"der, Plural: die Berufe"},{id:"wo-wohnen-sie",type:"sentence",german:"Wo wohnen Sie?",meaning:"Where do you live? (formal)",audio:"tts",introducedInScene:"a2e1s2",tags:["admin","questions"],cefrLevel:"A2",note:"Sie-Form — im Amt immer."},{id:"der-stempel",type:"word",german:"der Stempel",meaning:"the stamp",image:"unterschrift",audio:"tts",introducedInScene:"a2e1s2",tags:["admin","paperwork"],cefrLevel:"A2",note:"der, Plural: die Stempel — klingt wie Erfüllung"},{id:"die-bestaetigung",type:"word",german:"die Bestätigung",meaning:"the confirmation",image:"formular",audio:"tts",introducedInScene:"a2e1s3",tags:["admin","paperwork"],cefrLevel:"A2",note:"die, Plural: die Bestätigungen"},{id:"der-brief",type:"word",german:"der Brief",meaning:"the letter",image:"brief",audio:"tts",introducedInScene:"a2e1s3",tags:["admin","paperwork"],cefrLevel:"A2",note:"der, Plural: die Briefe"},{id:"die-post",type:"word",german:"die Post",meaning:"the mail / post office",image:"brief",audio:"tts",introducedInScene:"a2e1s3",tags:["admin","city"],cefrLevel:"A2"},{id:"abholen",type:"chunk",german:"Ich hole den Brief ab.",meaning:"I'll pick up the letter.",audio:"tts",introducedInScene:"a2e1s3",tags:["admin","paperwork"],cefrLevel:"A2",note:"abholen = ab + holen, trennbar"},{id:"in-zwei-wochen",type:"chunk",german:"In zwei Wochen.",meaning:"In two weeks.",audio:"tts",introducedInScene:"a2e1s3",tags:["admin","time"],cefrLevel:"A2"},{id:"alles-klar",type:"chunk",german:"Alles klar!",meaning:"All clear! / Got it!",audio:"tts",introducedInScene:"a2e1s3",tags:["smalltalk","politeness"],cefrLevel:"A2"}],$t=[{id:"a2e1s1",episodeId:"a2e1",title:"Nummer 34",titleEn:"Number 34",place:"Bürgeramt, Wartebereich",bg:"amt",contextTags:["admin","paperwork","phone"],requiredItems:["der-termin"],introducedItems:["das-buergeramt","der-pass","das-formular","die-anmeldung","ich-habe-einen-termin","der-schalter"],beats:[{type:"narration",text:"Kunststoffstühle in Reihen, eine Zahlenanzeige, der Geruch von Kaffee aus einem Automaten. Du bist früh da. Das ist richtig so."},{type:"meet",itemIds:["das-buergeramt","der-pass","das-formular"]},{type:"line",speaker:"durchsage-amt",text:"Nummer dreiunddreißig, bitte an Schalter vier.",translation:"Number thirty-three, please go to counter four."},{type:"meet",itemIds:["die-anmeldung","ich-habe-einen-termin","der-schalter"]},{type:"line",speaker:"herr-bauer",text:"Guten Morgen. So, Sie sind also die Nummer vierunddreißig. Anmeldung? Dann her mit dem Pass.",translation:"Good morning. So you're number thirty-four. Registration? Then hand over the passport."},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Herr Bauer tippt. Dein Pass wandert über den Schalter.",options:[{label:"Ich habe einen Termin um zehn.",line:"Ich habe einen Termin um zehn."},{label:"Ist das das richtige Formular?",line:"Ist das das richtige Formular?"}]},{type:"line",speaker:"herr-bauer",text:"Termin hin oder her — Hauptsache, Sie sind da. Das Formular füllen wir gemeinsam aus.",translation:"Appointment or not — main thing is you're here. We'll fill out the form together."},{type:"check",count:2,mode:"recall"}]},{id:"a2e1s2",episodeId:"a2e1",title:"Herr Bauer fragt",titleEn:"Herr Bauer asks",place:"Bürgeramt, Schalter 4",bg:"amt",contextTags:["admin","paperwork","identity"],requiredItems:["die-wohnung"],introducedItems:["die-adresse","das-datum","unterschreiben","der-beruf","wo-wohnen-sie","der-stempel"],beats:[{type:"line",speaker:"herr-bauer",text:"So. Wo wohnen Sie?",translation:"Right. Where do you live?"},{type:"meet",itemIds:["wo-wohnen-sie","die-adresse","das-datum"]},{type:"choice",prompt:"Antworte.",options:[{label:"In der Bärbelstraße 12.",line:"In der Bärbelstraße 12, zweite Etage."},{label:"Meine Adresse ist neu. Ich schreib sie auf.",line:"Meine Adresse ist neu. Ich schreibe sie auf."}]},{type:"line",speaker:"herr-bauer",text:"Bärbelstraße 12 … gut. Und Ihr Beruf? …„Noch unklar“? Ich schreibe: „Suchend“. Da sind Sie in Leipzig in guter Gesellschaft.",translation:"Bärbelstraße 12 … good. And your profession? …'Still unclear'? I'll write: 'searching'. You're in good company in Leipzig."},{type:"meet",itemIds:["der-beruf","unterschreiben","der-stempel"]},{type:"check",count:2,mode:"mixed"},{type:"narration",text:"Er dreht das Formular zu dir und zeigt mit dem Finger. Eine Zeile, ein Kasten, dein Name."},{type:"line",speaker:"herr-bauer",text:"Hier unterschreiben, bitte. …Und jetzt das Wichtigste:",translation:"Please sign here. …And now the most important part:"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Formular: Anmeldung der Wohnung",text:`Stadt Leipzig — Bürgeramt

1. Name: ……………………………
2. Datum des Einzugs: ……………
3. Adresse: …………………………
4. Beruf: ……………………………
5. Unterschrift: ……………………

Bitte in DRUCKBUCHSTABEN.
Wörter, die du nicht kennst:
nachfragen. Die Sachbearbeiterin kennt sie alle.`,translation:`City of Leipzig — Citizens' Office

1. Name: ……………
2. Date of moving in: ………
3. Address: ………
4. Occupation: ………
5. Signature: ………

Please write in BLOCK CAPITALS.
Words you don't know:
just ask. The clerk knows them all.`,itemIds:["die-adresse","das-datum","unterschreiben"]},{type:"narration",text:"Der Stempel kracht auf das Papier wie ein Gongschlag. Es ist vollbracht."}]},{id:"a2e1s3",episodeId:"a2e1",title:"Die Bestätigung",titleEn:"The confirmation",place:"Bürgeramt, Ausgang & Straße",bg:"strasse",contextTags:["admin","paperwork"],requiredItems:["das-formular"],introducedItems:["die-bestaetigung","der-brief","die-post","abholen","in-zwei-wochen","alles-klar"],beats:[{type:"line",speaker:"herr-bauer",text:"Die Bestätigung kommt per Post in zwei Wochen. Sie brauchen sie fürs Bankkonto, für den Vertrag, für alles.",translation:"The confirmation comes by post in two weeks. You'll need it for the bank account, the contract, everything."},{type:"meet",itemIds:["die-bestaetigung","der-brief","die-post"]},{type:"meet",itemIds:["abholen","in-zwei-wochen","alles-klar"]},{type:"choice",prompt:"Letzte Frage von Herrn Bauer.",options:[{label:"Alles klar. Danke schön!",line:"Alles klar. Danke schön!"},{label:"Und wenn der Brief nicht kommt?",line:"Und wenn der Brief nicht kommt?"}]},{type:"line",speaker:"herr-bauer",text:"Dann rufen Sie an. …Oder Sie kommen wieder. — Nächste Person, bitte!",translation:"Then call. …Or come back again. — Next person, please!"},{type:"check",count:2,mode:"mixed"},{type:"narration",text:"Draußen: Sonne über dem Ring. Du bist offiziell ein Mensch mit Adresse. Zwei Wochen später liegt der Brief tatsächlich im Briefkasten — du holst ihn ab wie einen Schatz."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Merkblatt: Ihre Bestätigung",text:`Sie haben sich erfolgreich angemeldet.

Alles klar? Dann: schönen Tag noch.
