"word",german:"der Diebstahl",meaning:"the theft",image:"reifen",audio:"tts",introducedInScene:"a2e7s3",tags:["crime","insurance"],cefrLevel:"A2",note:"der ( Singular ) — stehlen / gestohlen / der Dieb"},{id:"gestohlen",type:"word",german:"gestohlen",meaning:"stolen",image:"schlüssel",audio:"tts",introducedInScene:"a2e7s3",tags:["crime"],cefrLevel:"A2"},{id:"die-anzeige",type:"word",german:"die Anzeige",meaning:"the (police) report — also: the advert",image:"brief",audio:"tts",introducedInScene:"a2e7s3",tags:["crime","admin"],cefrLevel:"A2",note:"die, Plural: die Anzeigen — „Anzeige erstatten“ = file a report"},{id:"die-kette",type:"word",german:"die Kette",meaning:"the chain (bike lock)",image:"reifen",audio:"tts",introducedInScene:"a2e7s3",tags:["bike","objects"],cefrLevel:"A2",note:"die, Plural: die Ketten — Fahrraddiebstahl ist Volkssport, Kette ist Pflicht"},{id:"abschließen",type:"chunk",german:"Ich schließe das Fahrrad immer ab.",meaning:"I always lock the bike.",image:"schlüssel",audio:"tts",introducedInScene:"a2e7s3",tags:["bike"],cefrLevel:"A2",note:"abschließen = to lock — auch: einen Vertrag abschließen"},{id:"die-entschaedigung",type:"word",german:"die Entschädigung",meaning:"the compensation",image:"geld",audio:"tts",introducedInScene:"a2e7s3",tags:["insurance","money"],cefrLevel:"A2",note:"die, Plural: die Entschädigungen"}],En=[{id:"a2e7s1",episodeId:"a2e7",title:"Rohrbruch",titleEn:"Burst pipe",place:"Treppenhaus & Wohnung",bg:"treppenhaus",contextTags:["insurance","home","problem"],requiredItems:["das-formular"],introducedItems:["die-versicherung","die-haftpflichtversicherung","der-schaden","monatlich","der-beitrag","die-police"],beats:[{type:"narration",text:"Sonntagmorgen, ein Geräusch wie ein verärgerter Wasserfall im Treppenhaus. Ein Rohr im dritten Stock hat aufgegeben. Frau Brügge steht mit Handtüchern und Tapfbarkeit im Flur."},{type:"line",speaker:"frau-bruegge",text:"Bleib ruhig, das Wasser zahlt nicht mit. …Aber weißt du, was jetzt interessant wird? Versicherungen. Hast du eine Haftpflichtversicherung?",translation:"Stay calm, the water isn't paying up. …But you know what gets interesting now? Insurance. Do you have liability insurance?"},{type:"meet",itemIds:["die-versicherung","die-haftpflichtversicherung","der-schaden"]},{type:"line",speaker:"frau-bruegge",text:"Haftpflicht zahlt, wenn DU anderen Schaden machst. Deine Sachen schützt die Hausratversicherung — die ist hier meine. Dein Beitrag: ein paar Euro, monatlich.",translation:"Liability pays when YOU damage others. Your own things are covered by household insurance — that one's mine. Your premium: a few euros, monthly."},{type:"meet",itemIds:["monatlich","der-beitrag","die-police"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Frau Brügge: „Hast du deine Police irgendwo?“",options:[{label:"Ich suche sie und rufe dann an.",line:"Ich suche sie und rufe dann sofort an."},{label:"Versicherung? …Ich hab… ich melde mich.",line:"Versicherung? …Ich habe … ich melde mich gleich."}]},{type:"line",speaker:"frau-bruegge",text:"Gut. Und falls du keine hast: Jetzt ist der beste Moment, danach. …Deutschland-Regel.",translation:"Good. And if you don't have one: now is the best moment, afterwards. …Germany rule."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"E-Mail: Ihre Versicherungspolice",text:`Sehr geehrte Damen und Herren,
Ihre Haftpflichtversicherung (Police Nr. 4471-KJ)
Beitrag: 4,90 € monatlich
Deckung: Personen- und Sachschäden bis 5 Mio. €
Schäden bitte sofort melden — telefonisch oder in der App.
Ihre AllRisk Versicherung`,translation:`Dear Sir or Madam,
Your liability insurance (policy no. 4471-KJ)
Premium: €4.90 monthly
Cover: personal and property damage up to €5m
Please report claims immediately — by phone or in the app.
Your AllRisk Insurance`,itemIds:["die-police","der-beitrag","monatlich"]}]},{id:"a2e7s2",episodeId:"a2e7",title:"Die Hotline",titleEn:"The hotline",place:"Wohnung, Warteschleife",bg:"wohnung",contextTags:["insurance","phone","paperwork"],requiredItems:["die-versicherung","die-kasse"],introducedItems:["melden","telefonisch","die-vorgangsnummer","zustaendig","die-liegt-auf","der-selbstbehalt"],beats:[{type:"narration",text:"Warteschleifenmusik, Version „Panflöte im Aufzug“. Nach elf Minuten: eine menschliche Stimme. Du hast Belege, Geduld und eine erste Theorie über deutsche Panflöten."},{type:"meet",itemIds:["melden","telefonisch","die-vorgangsnummer"]},{type:"line",speaker:"klemm",text:"Versicherung AllRisk, Frau Klemm. Was kann ich für Sie tun? …Ah, Sie möchten einen Schaden melden. Gut. Haben Sie Ihre Police bereit?",translation:"AllRisk Insurance, Ms Klemm. What can I do for you? …Ah, you'd like to report a claim. Good. Do you have your policy ready?"},{type:"choice",prompt:"Wo ist der Beleg hin? Du hast ihn gestern auf den Schreibtisch gelegt.",options:[{label:"Der Beleg liegt auf dem Schreibtisch.",line:"Moment — der Beleg liegt auf dem Schreibtisch."},{label:"Der Beleg liegt in dem Schreibtisch?? Nein — auf dem!",line:"Der Beleg liegt in dem Schreibtisch?? Nein — AUF dem Schreibtisch!"}]},{type:"meet",itemIds:["die-liegt-auf","zustaendig","der-selbstbehalt"]},{type:"line",speaker:"klemm",text:"Danke. Der Schaden ist gedeckt, ein kleiner Selbstbehalt von fünfzig Euro bleibt bei Ihnen. Ich schicke die Vorgangsnummer per E-Mail. …Sie sind sehr vorbereitet, das hört man nicht oft.",translation:"Thank you. The claim is covered, a small deductible of fifty euros stays with you. I'll send the reference number by email. …You're very well prepared, one doesn't hear that often."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"SMS von der Versicherung",text:`AllRisk: Vorgangsnummer 2026-K-88123.
Schaden gemeldet: 14:32 Uhr.
Bearbeitung in 5–7 Werktagen.
Rückfragen: telefonisch Mo–Fr 8–18 Uhr.`,translation:`AllRisk: reference number 2026-K-88123.
Claim reported: 2:32 pm.
Processing in 5–7 working days.
Questions: by phone Mon–Fri 8am–6pm.`,itemIds:["die-vorgangsnummer","telefonisch"]}]},{id:"a2e7s3",episodeId:"a2e7",title:"Gestohlen!",titleEn:"Stolen!",place:"Polizeiwache Mitte",bg:"amt",contextTags:["insurance","bike","problem"],requiredItems:["das-fahrrad","der-schaden"],introducedItems:["der-diebstahl","gestohlen","die-anzeige","die-kette","abschließen","die-entschaedigung"],beats:[{type:"narration",text:"Zwei Wochen später. Dein Fahrrad war vor dem Café angeschlossen — mit der guten Kette, ehrlich. Jetzt ist da nur noch ein abgeschnittenes Stück Kette. Tobias' Blick sagt alles."},{type:"line",speaker:"tobias",text:"Abgeschnitten. …Das war professionell. Komm, wir machen Anzeige. Und dann Versicherung — du hast doch jetzt eine.",translation:"Cut. …That was professional. Come on, we'll file a report. And then insurance — you have one now after all."},{type:"meet",itemIds:["der-diebstahl","gestohlen","die-anzeige"]},{type:"line",speaker:"polizist",text:"Fahrraddiebstahl. Klasse zwei der Volksbeliebtheit. …Wann und wo? — Gut. Hier: Anzeigeerstätting, unterschreiben. Sie bekommen eine Kopie für die Versicherung.",translation:"Bicycle theft. Second most popular national pastime. …When and where? — Good. Here: crime report, sign. You'll get a copy for the insurance."},{type:"meet",itemIds:["die-kette","abschließen","die-entschaedigung"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Kommissar: „War das Rad gut gesichert?“",options:[{label:"Ich schließe es immer ab. Mit Kette.",line:"Ich schließe es immer ab — mit einer richtigen Kette."},{label:"Es war… angeschlossen. Technisch gesehen.",line:"Es war … angeschlossen. Technisch gesehen. Mit einem Seil."}]},{type:"line",speaker:"polizist",text:"Dann stehen Ihre Chancen gut. Die Versicherung prüft, ob es eine Entschädigung gibt. …Und kaufen Sie sich eine neue Kette. Und ein neues Rad. Leipzig braucht Sie auf zwei Rädern.",translation:"Then your chances are good. The insurance will check whether there's compensation. …And buy yourself a new chain. And a new bike. Leipzig needs you on two wheels."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Zehn Tage später: Entschädigung genehmigt, abzüglich Selbstbehalt. Neues Fahrrad, neue Kette, altes Misstrauen — diesmal mit Papieren."}]}],Qa={episode:Mn,cast:Dn,items:Bn,scenes:En},Xa=Object.freeze(Object.defineProperty({__proto__:null,cast:Dn,default:Qa,episode:Mn,items:Bn,scenes:En},Symbol.toStringTag,{value:"Module"})),xn={id:"a2e8",arcId:"A2",cefrLevel:"A2",title:"Der Führerschein",titleEn:"The driving licence",blurb:"Große Stellen brauchen große Fahrten: Sam meldet sich bei der Fahrschule an. Herr Ott, die Theorie, die Vorfahrt — und ein erstes „musste“ im Präteritum.",order:12,sceneIds:["a2e8s1","a2e8s2","a2e8s3"]},Pn=[{id:"ott",name:"Herr Ott",role:"Fahrlehrer"},{id:"tobias",name:"Tobias",role:"Nachbar, Student"}],Wn=[{id:"der-fuehrerschein",type:"word",german:"der Führerschein",meaning:"the driving licence",image:"pass",audio:"tts",introducedInScene:"a2e8s1",tags:["documents","car"],cefrLevel:"A2",note:"der, Plural: die Führerscheine — umgangssprachlich: der Lappen"},{id:"die-fahrschule",type:"word",german:"die Fahrschule",meaning:"the driving school",image:"auto",audio:"tts",introducedInScene:"a2e8s1",tags:["car","learning"],cefrLevel:"A2",note:"die, Plural: die Fahrschulen — in Deutschland fast ein Ritus"},{id:"der-fahrlehrer",type:"word",german:"der Fahrlehrer",meaning:"the driving instructor",image:"person",audio:"tts",introducedInScene:"a2e8s1",tags:["people","car"],cefrLevel:"A2",note:"der, Plural: die Fahrlehrer; weiblich: die Fahrlehrerin"},{id:"die-fahrstunde",type:"word",german:"die Fahrstunde",meaning:"the driving lesson",image:"kalender",audio:"tts",introducedInScene:"a2e8s1",tags:["car","time"],cefrLevel:"A2",note:"die, Plural: die Fahrstunden — pro Stück teuer, im Kopf unbezahlbar"},{id:"die-gebuehr",type:"word",german:"die Gebühr",meaning:"the fee",image:"münzen",audio:"tts",introducedInScene:"a2e8s1",tags:["money","admin"],cefrLevel:"A2",note:"die, Plural: die Gebühren — Ämter lieben Gebühren"},{id:"der-sehtest",type:"word",german:"der Sehtest",meaning:"the eye test",image:"prüfen",audio:"tts",introducedInScene:"a2e8s1",tags:["health","admin"],cefrLevel:"A2",note:"der, Plural: die Sehtests — Nachweis für die Anmeldung"},{id:"die-theorie",type:"word",german:"die Theorie",meaning:"the theory",image:"buch",audio:"tts",introducedInScene:"a2e8s2",tags:["learning","car"],cefrLevel:"A2",note:"die ( Singular ) — erst die Theorie, dann die Praxis"},{id:"die-vorfahrt",type:"word",german:"die Vorfahrt",meaning:"the right of way",image:"haltestelle",audio:"tts",introducedInScene:"a2e8s2",tags:["car","rules"],cefrLevel:"A2",note:"die ( Singular ) — „Vorfahrt gewähren“ = warten"},{id:"der-rueckspiegel",type:"word",german:"der Rückspiegel",meaning:"the rear-view mirror",image:"auto",audio:"tts",introducedInScene:"a2e8s2",tags:["car"],cefrLevel:"A2",note:"der, Plural: die Rückspiegel — Schulterblick!"},{id:"die-ampel",type:"word",german:"die Ampel",meaning:"the traffic light",image:"ampel",audio:"tts",introducedInScene:"a2e8s2",tags:["car","city"],cefrLevel:"A2",note:"die, Plural: die Ampeln — bei Grün: Gas geben"},{id:"vorsicht",type:"word",german:"vorsicht",meaning:"careful / watch out",image:"laut",audio:"tts",introducedInScene:"a2e8s2",tags:["car","safety"],cefrLevel:"A2",note:"„Vorsicht!“ — das meistgebrauchte Wort der Fahrschule"},{id:"ich-musste-konzentrieren",type:"grammar_pattern",german:"Ich ___ mich total konzentrieren.",meaning:"I had to concentrate completely.",image:"ziel",audio:"tts",introducedInScene:"a2e8s2",tags:["grammar","car"],cefrLevel:"A2",cloze:"musste",speak:"Ich musste mich total konzentrieren.",note:"Modalverben im Präteritum: musste, konnte, wollte, durfte"},{id:"das-gaspedal",type:"word",german:"das Gaspedal",meaning:"the accelerator (pedal)",image:"auto",audio:"tts",introducedInScene:"a2e8s3",tags:["car"],cefrLevel:"A2",note:"das, Plural: die Gaspedale — sanft antreten"},{id:"die-bremse",type:"word",german:"die Bremse",meaning:"the brake",image:"werkzeug",audio:"tts",introducedInScene:"a2e8s3",tags:["car","safety"],cefrLevel:"A2",note:"die, Plural: die Bremsen — bremsen (Verb)"},{id:"der-lappen",type:"word",german:"der Lappen",meaning:"the licence (colloq.); the cloth",image:"pass",audio:"tts",introducedInScene:"a2e8s3",tags:["car","colloquial"],cefrLevel:"A2",note:"der, Plural: die Lappen — „den Lappen machen“ = Führerschein machen"},{id:"das-fahrgefuehl",type:"word",german:"das Fahrgefühl",meaning:"the feeling of driving",image:"sonnenuntergang",audio:"tts",introducedInScene:"a2e8s3",tags:["car","feelings"],cefrLevel:"A2",note:"das ( Singular ) — Werbung liebt dieses Wort"},{id:"lenken",type:"word",german:"lenken",meaning:"to steer",image:"entscheidung",audio:"tts",introducedInScene:"a2e8s3",tags:["car"],cefrLevel:"A2",note:"lenken — auch: die Aufmerksamkeit lenken"},{id:"endlich",type:"word",german:"endlich",meaning:"finally / at last",image:"zukunft",audio:"tts",introducedInScene:"a2e8s3",tags:["time","feelings"],cefrLevel:"A2",note:"Adverb — „Endlich!“ = Seufzer + Freude"}],Kn=[{id:"a2e8s1",episodeId:"a2e8",title:"Die Anmeldung",titleEn:"Signing up",place:"Fahrschule Ott, Lindenauer Straße",bg:"buero",contextTags:["car","admin","learning"],requiredItems:["die-anmeldung","den-ausweis-vorzeigen"],introducedItems:["der-fuehrerschein","die-fahrschule","der-fahrlehrer","die-fahrstunde","die-gebuehr","der-sehtest"],beats:[{type:"narration",text:"Die Café-Lieferungen werden größer, der Einkaufs-Rucksack schwerer — Zeit für den deutschen Weg zu allem: der Führerschein. Fahrschule Ott, Hinterhaus, ein Schreibtisch aus 1987."},{type:"line",speaker:"ott",text:"Herr Ott. Fahrschule. …Du willst den Lappen machen? Gut. Dann erstmal: Ausweis her, Sehtest-Nachweis, Foto — und eine Unterschrift, die du hinterher bereuen wirst, aber erst nach der ersten Fahrstunde.",translation:"Mr Ott. Driving school. …You want to get your licence? Good. First: ID, eye-test certificate, photo — and a signature you'll regret, but only after the first lesson."},{type:"meet",itemIds:["der-fuehrerschein","die-fahrschule","der-fahrlehrer"]},{type:"line",speaker:"ott",text:"Die Gebühren: Grundbeitrag, dann pro Fahrstunde. …Und ja, das ist viel Geld. Deswegen bestehen meine Schüler schneller. Motivation über Preis.",translation:"The fees: base amount, then per lesson. …And yes, that's a lot of money. That's why my students pass faster. Motivation through pricing."},{type:"meet",itemIds:["die-fahrstunde","die-gebuehr","der-sehtest"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Herr Ott: „Warum jetzt? Du fährst doch schon Rad wie ein Verrückter.“",options:[{label:"Größere Lieferungen. Und ich will endlich autonom sein.",line:"Größere Lieferungen. Und ich will endlich autonom sein — Rad, Bahn, egal wohin."},{label:"Das Auto im Dresdner Regen sah praktisch aus.",line:"Ich muss zugeben: Das Auto im Dresdner Regen sah praktisch aus. Nur der Preis sieht rot aus."}]},{type:"check",count:2,mode:"recall"},{type:"line",speaker:"ott",text:"Erste Theorie: Dienstag, 18 Uhr. Erste Fahrstunde: Donnerstag. …Und jetzt raus hier, ich hab noch einen Schüler, der glaubt, Vorfahrt sei ein Vorschlag.",translation:"First theory class: Tuesday, 6 pm. First driving lesson: Thursday. …Now out, I've got another student who thinks right of way is a suggestion."}]},{id:"a2e8s2",episodeId:"a2e8",title:"Die Theorie",titleEn:"The theory",place:"Fahrschule, Klassenraum",bg:"buero",contextTags:["car","learning","rules"],requiredItems:["das-fahrrad","die-versicherung"],introducedItems:["die-theorie","die-vorfahrt","der-rueckspiegel","die-ampel","vorsicht","ich-musste-konzentrieren"],beats:[{type:"narration",text:"Dienstagabend: Du, Tobias (aus Solidarität, mit Energydrink), fünf Sechzehnjährige und ein Beamer. An der Tafel: eine Kreuzung, vier Pfeile, null Gnade."},{type:"line",speaker:"ott",text:"Theorie. Frage eins: Wer hat Vorfahrt? …Nicht raten! Rechte Hand? Rechte Straße? …Genau. „Vorfahrt gewähren“ heißt: du wartest. Auch wenn du es eilig hast. BESONDERS wenn du es eilig hast.",translation:"Theory. Question one: who has right of way? …Don't guess! Right hand? Right street? …Exactly. 'Yield' means: you wait. Even if you're in a hurry. ESPECIALLY if you're in a hurry."},{type:"meet",itemIds:["die-theorie","die-vorfahrt","die-ampel"]},{type:"line",speaker:"ott",text:"Frage vier: Du fährst Auto, vor dir ein Radfahrer. Was tun? …Richtig: Überholen mit Abstand. Ihr Radfahrer seid hier übrigens gute Kunden — Versicherung fragt auch nach dem. Aber heute sind wir Auto.",translation:"Question four: you're driving a car, cyclist ahead. What do you do? …Right: overtake with distance. You cyclists are good customers here, by the way — insurance asks about that too. But today we're car people."},{type:"meet",itemIds:["der-rueckspiegel","vorsicht","ich-musste-konzentrieren"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias flüstert: „Und? Kopf voll?“",options:[{label:"Ich musste mich total konzentrieren. Aber es logisch!",line:"Ich musste mich total konzentrieren. Aber es ist logisch! …Nur „Vorfahrt gewähren“ klingt wie eine höfliche Drohung."},{label:"Einfacher als die Bahn-App. Ernsthaft.",line:"Einfacher als die Bahn-App. Ernsthaft. Bei der Deutschen Bahn brauchst du Vorfahrt, Glück und einen Plan."}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Theorie-Fragebogen (Auszug)",text:`Fahrschule Ott — Übungsbogen 7

Frage 12: Sie nähern sich dieser Kreuzung.
Wer muss warten?
  a) Sie   b) derblaue Wagen   c) niemand
Antwort: b — rechts vor links.

Frage 15: Bei ROT an der Ampel…
  a) vorsichtig weiterfahren
  b) anhalten und warten
  c) hupen
Antwort: b. Immer b. Ja, auch nachts.

Fehlerpunkte merken sich. Leider.`,translation:`Driving school Ott — practice sheet 7

Question 12: You approach this intersection.
Who has to wait?
  a) you   b) the blue car   c) nobody
Answer: b — priority to the right.

Question 15: At a RED light…
  a) drive on carefully
  b) stop and wait
  c) honk
Answer: b. Always b. Yes, at night too.

Penalty points have memory. Unfortunately.`}]},{id:"a2e8s3",episodeId:"a2e8",title:"Die erste Fahrt",titleEn:"The first drive",place:"Lindenau, Hinterhof-Ausfahrt, dann Straße",bg:"strasse",contextTags:["car","learning","friends"],requiredItems:["kaputt","die-fahrt"],introducedItems:["das-gaspedal","die-bremse","der-lappen","das-fahrgefuehl","lenken","endlich"],beats:[{type:"narration",text:"Donnerstag, 17 Uhr. Ein silberner Golf mit doppelter Pedalerie. Herr Ott setzt sich rechts, wie ein Mensch, der das schon tausend Mal getan hat und es trotzdem ernst nimmt."},{type:"line",speaker:"ott",text:"So. Links: Kupplung, rechts: Bremse, ganz rechts: Gaspedal. Dein Job heute: lenken, fahren, atmen. …Und merken: Das Auto macht, was DU willst. Nicht was du fürchtest.",translation:"OK. Left: clutch, middle: brake, far right: accelerator. Your job today: steer, drive, breathe. …And remember: the car does what YOU want. Not what you fear."},{type:"meet",itemIds:["das-gaspedal","die-bremse","lenken"]},{type:"line",speaker:"ott",text:"Sanft. SANFT. …Gut. So. Rückspiegel! Schulterblick! …Vorsicht, Fußgänger! …Und: Kupplung kommen lassen wie ein schüchterner Mensch auf einer Party: langsam, langsam, Kontakt.",translation:"Gently. GENTLY. …Good. There. Rear mirror! Shoulder check! …Careful, pedestrian! …And: release the clutch like a shy person at a party: slowly, slowly, contact."},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Die Straße ist frei. Herr Ott nickt.",options:[{label:"Gaspedal. Ganz sanft. …Wir fahren!",line:"Gaspedal, ganz sanft. …WIR FAHREN! Das ist offiziell mein bestes Gaspedal-Erlebnis."},{label:"Erst Rückspiegel. Dann Schulterblick. DANN Gas.",line:"Erst Rückspiegel, dann Schulterblick, DANN Gas. …„Na, du lernst. So kriegen wir beide alt.“"}]},{type:"meet",itemIds:["das-fahrgefuehl","der-lappen","endlich"]},{type:"line",speaker:"ott",text:"Das, mein Freund, ist das Fahrgefühl. …In drei Monaten machst du die Prüfung. Danach heißt du: Herr Jones mit Lappen. …Und dann, Achtung, kommt die Ironie: Du suchst einen Parkplatz. Für immer.",translation:"That, my friend, is the feeling of driving. …In three months you'll take the test. After that you'll be: Mr Jones with a licence. …And then, careful, here comes the irony: you'll look for a parking spot. Forever."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Merkkarte: Erste Fahrt",text:`VOR DEM START:
Sitz · Spiegel · Gurt. („SSG“ — Ott merkt sich's)

LINKS Kupplung · MITTE Bremse · RECHTS Gaspedal

Sanft anfahren. Früher bremsen. Später parken.

»Der Lappen kostet Geld.
 Das Fahrgefühl kostet Nerven.
 Beides lohnt sich.«`,translation:`BEFORE STARTING:
Seat · mirrors · belt. ('SSG' — Ott's mnemonic)

LEFT clutch · MIDDLE brake · RIGHT accelerator

Pull away gently. Brake early. Park later.

'The licence costs money.
The feeling of driving costs nerves.
Both are worth it.'`,itemIds:["das-gaspedal","die-bremse","der-lappen"]},{type:"narration",text:"Der Motor aus. Deine Hände zittern ein bisschen — vor Stolz, nicht vor Angst. Tobias winkt vom Radweg. Du fährst mit dem Auto langsam an ihm vorbei und winkst wie ein König. Endlich."}]}],es={episode:xn,cast:Pn,items:Wn,scenes:Kn},ts=Object.freeze(Object.defineProperty({__proto__:null,cast:Pn,default:es,episode:xn,items:Wn,scenes:Kn},Symbol.toStringTag,{value:"Module"})),_n={id:"a2e9",arcId:"A2",cefrLevel:"A2",title:"Der Stromwechsel",titleEn:"Switching power providers",blurb:"Eine Abschlagsrechnung mit Herzinfarkt-Potenzial. Tobias, ein Vergleichsportal, ein Brief mit Frist — und am Ende: Ökostrom, günstiger als vorher.",order:13,sceneIds:["a2e9s1","a2e9s2","a2e9s3"]},Fn=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"luise",name:"Luise",role:"Café-Besitzerin"}],Hn=[{id:"der-strom",type:"word",german:"der Strom",meaning:"the electricity (also: current)",image:"stecker",audio:"tts",introducedInScene:"a2e9s1",tags:["home","utilities"],cefrLevel:"A2",note:"der ( Singular ) — der Strom fällt aus = blackout"},{id:"die-abschlagszahlung",type:"word",german:"die Abschlagszahlung",meaning:"the advance payment (instalment)",image:"geld",audio:"tts",introducedInScene:"a2e9s1",tags:["money","utilities"],cefrLevel:"A2",note:"die, Plural: die Abschlagszahlungen — monatlich, voraus"},{id:"der-verbrauch",type:"word",german:"der Verbrauch",meaning:"the consumption",image:"urehr",audio:"tts",introducedInScene:"a2e9s1",tags:["utilities","money"],cefrLevel:"A2",note:"der ( Singular ) — Stromverbrauch, Wasserverbrauch"},{id:"teuer",type:"word",german:"teuer",meaning:"expensive",image:"kasse",audio:"tts",introducedInScene:"a2e9s1",tags:["money","opinion"],cefrLevel:"A2",note:"Adjektiv — teuer, teurer, am teuersten"},{id:"die-jahresabrechnung",type:"word",german:"die Jahresabrechnung",meaning:"the annual statement",image:"kalender",audio:"tts",introducedInScene:"a2e9s1",tags:["money","utilities","paperwork"],cefrLevel:"A2",note:"die, Plural: die Jahresabrechnungen — steht immer ein Betrag drauf, nie ein guter"},{id:"die-nachzahlung",type:"word",german:"die Nachzahlung",meaning:"the back payment (owed balance)",image:"brief",audio:"tts",introducedInScene:"a2e9s1",tags:["money","utilities"],cefrLevel:"A2",note:"die, Plural: die Nachzahlungen — das Gegenteil von Guthaben"},{id:"der-tarif",type:"word",german:"der Tarif",meaning:"the (price) plan / rate",image:"konzept",audio:"tts",introducedInScene:"a2e9s2",tags:["money","utilities"],cefrLevel:"A2",note:"der, Plural: die Tarife — auch beim Handy und bei der Bahn"},{id:"der-anbieter",type:"word",german:"der Anbieter",meaning:"the provider",image:"firma",audio:"tts",introducedInScene:"a2e9s2",tags:["utilities","money"],cefrLevel:"A2",note:"der, Plural: die Anbieter — es gibt zu viele"},{id:"vergleichen",type:"word",german:"vergleichen",meaning:"to compare",image:"prüfen",audio:"tts",introducedInScene:"a2e9s2",tags:["shopping","money"],cefrLevel:"A2",note:"vergleichen — verglich — verglichen; der Vergleich"},{id:"der-oekostrom",type:"word",german:"der Ökostrom",meaning:"green electricity",image:"sonnenuntergang",audio:"tts",introducedInScene:"a2e9s2",tags:["utilities","environment"],cefrLevel:"A2",note:"der ( Singular ) — aus Wind, Sonne, Wasser"},{id:"guenstiger-als",type:"grammar_pattern",german:"Der neue Tarif ist ___ als der alte.",meaning:"The new plan is cheaper than the old one.",image:"münzen",audio:"tts",introducedInScene:"a2e9s2",tags:["grammar","money"],cefrLevel:"A2",cloze:"günstiger",speak:"Der neue Tarif ist günstiger als der alte.",note:"Komparativ + als — billiger, schneller, besser …"},{id:"der-durchschnitt",type:"word",german:"der Durchschnitt",meaning:"the average",image:"budget",audio:"tts",introducedInScene:"a2e9s2",tags:["money","statistics"],cefrLevel:"A2",note:"der, Plural: die Durchschnitte — im Durchschnitt = on average"},{id:"die-kuendigung",type:"word",german:"die Kündigung",meaning:"the cancellation / notice (of contract)",image:"brief",audio:"tts",introducedInScene:"a2e9s3",tags:["paperwork","utilities"],cefrLevel:"A2",note:"die, Plural: die Kündigungen — kündigen (Verb)"},{id:"die-abmeldung",type:"word",german:"die Abmeldung",meaning:"the deregistration",image:"formular",audio:"tts",introducedInScene:"a2e9s3",tags:["paperwork","admin"],cefrLevel:"A2",note:"die, Plural: die Abmeldungen — Gegenteil: die Anmeldung"},{id:"klimafreundlich",type:"word",german:"klimafreundlich",meaning:"climate-friendly",image:"wetter",audio:"tts",introducedInScene:"a2e9s3",tags:["environment","opinion"],cefrLevel:"A2",note:"Adjektiv — Klima + freundlich, sagt sich so schön"},{id:"wechseln",type:"word",german:"wechseln",meaning:"to switch / change",image:"entscheidung",audio:"tts",introducedInScene:"a2e9s3",tags:["utilities","actions"],cefrLevel:"A2",note:"wechseln — den Anbieter, die Währung, die Stelle"},{id:"sparen",type:"word",german:"sparen",meaning:"to save (money)",image:"geld",audio:"tts",introducedInScene:"a2e9s3",tags:["money"],cefrLevel:"A2",note:"sparen + mit/wegen — Geld sparen = Volkssport"},{id:"die-einsparung",type:"word",german:"die Einsparung",meaning:"the saving(s)",image:"budget",audio:"tts",introducedInScene:"a2e9s3",tags:["money"],cefrLevel:"A2",note:"die, Plural: die Einsparungen — das Ergebnis vom Sparen"}],Nn=[{id:"a2e9s1",episodeId:"a2e9",title:"Die Abschlagsrechnung",titleEn:"The instalment notice",place:"Wohnung, Briefkasten, dann Küchentisch",bg:"wohnung",contextTags:["money","home","problem"],requiredItems:["ueberweisen","die-kasse"],introducedItems:["der-strom","die-abschlagszahlung","der-verbrauch","teuer","die-jahresabrechnung","die-nachzahlung"],beats:[{type:"narration",text:"Ein Umschlag. Stromwerk. Innen: Zahlen. Viele. Die Jahresabrechnung steht vor der Tür — und neben ihr eine Nachzahlung, die aussieht wie ein kleiner Urlaubsantrag."},{type:"line",speaker:"tobias",text:"Willkommen im Club. …Erster Strom, zweite Überraschung. Dein Verbrauch war höher als der Abschlag gedacht hat. Deswegen: Nachzahlung. Willst du sie überweisen oder in Raten? …Beides ist legal, beides tut weh.",translation:"Welcome to the club. …First electricity bill, second surprise. Your consumption was higher than the advance payment assumed. Hence: back payment. Want to transfer it or pay in instalments? …Both are legal, both hurt."},{type:"meet",itemIds:["der-strom","der-verbrauch","die-nachzahlung"]},{type:"meet",itemIds:["die-abschlagszahlung","die-jahresabrechnung","teuer"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias dreht den Stift in der Hand. „Also?“",options:[{label:"Ich überweise alles. Und dann: nie wieder dieser Tarif.",line:"Ich überweise alles. Und dann: nie wieder dieser Tarif. …„So redet man, bevor man einen Vergleich macht.“"},{label:"Raten. Mein Konto ist auch nur ein Mensch.",line:"Raten. Mein Konto ist auch nur ein Mensch und braucht Schonung."}]},{type:"line",speaker:"frau-bruegge",text:"(kommt zufällig mit einem Koffer vorbei) Strom? SOFORT wechseln. Ich bin seit zwanzig Jahren bei jedem Anbieter gewesen — alle haben ein Gesicht wie dieser Umschlag. …Aber wechselt mit Frist, nicht mit Wut.",translation:"(happens by with a suitcase) Electricity? Switch IMMEDIATELY. I've been with every provider in twenty years — they all have a face like this envelope. …But switch with a deadline, not with anger."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Stromwerk — Jahresabrechnung (Auszug)",text:`Stromwerk GmbH
Jahresabrechnung 01.08.2025–31.07.2026

Verbrauch:        2.486 kWh
Abschlag:         71,00 €/Monat
Jahresbetrag:     852,00 €
Ist-Kosten:       918,40 €

Nachzahlung:      66,40 €
Bitte bis 20.09. überweisen.

Wir danken für Ihr Vertrauen.
(Der Betrag auch.)`,translation:`Stromwerk GmbH
Annual statement 1 Aug 2025–31 Jul 2026

Consumption:      2,486 kWh
Instalment:       €71.00/month
Annual amount:    €852.00
Actual costs:     €918.40

Back payment:     €66.40
Please transfer by 20 Sep.

Thank you for your trust.
(The amount does too.)`}]},{id:"a2e9s2",episodeId:"a2e9",title:"Der Vergleich",titleEn:"The comparison",place:"Wohnung, Laptop, zwei Tassen Kaffee",bg:"wohnung",contextTags:["money","home","friends"],requiredItems:["die-versicherung","die-postleitzahl"],introducedItems:["der-tarif","der-anbieter","vergleichen","der-oekostrom","guenstiger-als","der-durchschnitt"],beats:[{type:"narration",text:"Ein Vergleichsportal lädt. Tobias übernimmt die Maus, du die Postleitzahl, und zusammen jagt ihr Tarife wie früher Karten in einem Sammelalbum."},{type:"line",speaker:"tobias",text:"Postleitzahl, Verbrauch, fertig. …Da: Elf Anbieter, elf Tarife. …Nur Geduld — wir vergleichen Preis, Laufzeit und, ja, ob der Ökostrom wirklich grün ist oder nur grün trägt.",translation:"Postcode, consumption, done. …There: eleven providers, eleven plans. …Patience — we're comparing price, term and, yes, whether the green power is actually green or just wearing green."},{type:"meet",itemIds:["der-tarif","der-anbieter","vergleichen"]},{type:"line",speaker:"tobias",text:"Schau: Sonnenwerk. Ökostrom, echter. Und der Tarif ist günstiger als dein alter. Nicht der billigste — aber im Durchschnitt zahlen wir bei so was hinten drauf mehr, nicht weniger.",translation:"Look: Sonnenwerk. Real green power. And the plan is cheaper than your old one. Not the cheapest — but on average you pay more at the back end with those, not less."},{type:"meet",itemIds:["der-oekostrom","guenstiger-als","der-durchschnitt"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Cursor blinkt über „Jetzt wechseln“.",options:[{label:"Klick. Und nie wieder Angst vor dem Briefkasten.",line:"Klick. Und nie wieder Angst vor dem Briefkasten. …„Vor dem Strombriefkasten. Der andere bleibt gefährlich.“"},{label:"Warte — läuft das ohne die Versicherung? …Nein, falsches Dokument. Klick.",line:"Warte — läuft das ohne die Versicherung? …Nein, falsches Dokument, das ist ja die Haftpflicht. Klick."}]},{type:"line",speaker:"tobias",text:"Bestätigung kommt per Mail. Die Kündigung macht der neue Anbieter — das ist der einzige Service in Deutschland, der wirklich etwas kündigt.",translation:"Confirmation comes by email. The new provider handles the cancellation — that's the only service in Germany that actually cancels something."},{type:"check",count:2,mode:"listen"}]},{id:"a2e9s3",episodeId:"a2e9",title:"Kündigen und wechseln",titleEn:"Cancelling and switching",place:"Wohnung, Drucker, dann Café Luise",bg:"wohnung",contextTags:["money","paperwork","friends"],requiredItems:["ueberweisen","die-anmeldung"],introducedItems:["die-kuendigung","die-abmeldung","klimafreundlich","wechseln","sparen","die-einsparung"],beats:[{type:"narration",text:"Der Drucker summt: Kündigung beim alten Stromwerk, einmal bitte. Luise liest mit, auf dem Weg vorbei zum Lager, und hat genau eine Meinung. Natürlich."},{type:"line",speaker:"luise",text:"Eine Kündigung mit Absender und Datum? Junge, das ist Poesie. …Ich wechsle seit Jahren nichts mehr — zu viel Papier. Aber du: Junge, das ist Klimafreundlichkeit UND Geldsparen. Beides zusammen. Fast unanständig.",translation:"A cancellation with sender and date? Kid, that's poetry. …I haven't switched anything in years — too much paperwork. But you: kid, that's climate-friendliness AND saving money. Both together. Almost indecent."},{type:"meet",itemIds:["die-kuendigung","die-abmeldung","klimafreundlich"]},{type:"meet",itemIds:["wechseln","sparen","die-einsparung"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Brief liegt fertig vor dir. Letzte Zeile: „Mit freundlichen Grüßen“.",options:[{label:"Ich schicke ihn. Und der Strom wechselt bald die Seite.",line:"Ich schicke ihn. Und der Strom wechselt bald die Seite — von grau auf grün."},{label:"Erst Nachzahlung überweisen, dann Kündigung. In dieser Reihenfolge.",line:"Erst Nachzahlung überweisen, dann Kündigung. In dieser Reihenfolge — so verabschiedet man sich ordentlich."}]},{type:"line",speaker:"luise",text:"Und jetzt erzähl mir nichts: Du bist vor einem Jahr hier angekommen und kündigst jetzt auf Deutsch Energiekonzerne. …Ich hab Eierlikör da. Wir stoßen an. Auf die Einsparung!",translation:"And don't tell me otherwise: you arrived here a year ago and now you're cancelling energy companies in German. …I have egg liqueur. Let's toast. To the savings!"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Kündigung (Textvorlage, ausgefüllt)",text:`Stromwerk GmbH

Kündigung meines Stromliefervertrags,
Kundennummer 88-4402, zum nächstmöglichen
Termin. Bitte um schriftliche Bestätigung.

Ich wechsle zu einem klimafreundlichen Anbieter.
Ich spare dabei Geld. Beides geht.

Mit freundlichen Grüßen
Sam Jones

(P.S. Die Nachzahlung ist überwiesen.
 Ordnung muss sein. Brügge-Regel 7.)`,translation:`Stromwerk GmbH

Cancellation of my electricity supply contract,
customer no. 88-4402, at the earliest possible
date. Please confirm in writing.

I'm switching to a climate-friendly provider.
I'm saving money in the process. Both are possible.

Kind regards,
Sam Jones

(P.S. The back payment has been transferred.
Order must be. Brügge rule 7.)`,itemIds:["die-kuendigung","sparen","klimafreundlich"]},{type:"narration",text:"Der Brief geht raus, die Nachzahlung geht raus, und ab nächstem Monat fließt dein Strom aus Wind. Auf der Pinnwand landet ein neuer Zettel: „Strom: gewechselt. Einsparung: 84 €/Jahr.“ Tobias zeichnet daneben eine kleine Sonne."}]}],ns={episode:_n,cast:Fn,items:Hn,scenes:Nn},is=Object.freeze(Object.defineProperty({__proto__:null,cast:Fn,default:ns,episode:_n,items:Hn,scenes:Nn},Symbol.toStringTag,{value:"Module"})),Gn={id:"b1e1",arcId:"B1",cefrLevel:"B1",title:"Lärm und Nachbarn",titleEn:"Noise and neighbours",blurb:"Bässe um zwei Uhr nachts. Zum ersten Mal musst du in Deutschland einen Konflikt ansprechen — und lösen.",order:9,sceneIds:["b1e1s1","b1e1s2","b1e1s3"]},Rn=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"}],jn=[{id:"der-laerm",type:"word",german:"der Lärm",meaning:"the noise (annoying kind)",image:"laut",audio:"tts",introducedInScene:"b1e1s1",tags:["neighbors","conflict"],cefrLevel:"B1",note:"der ( Singular ) — Lärm nervt, Geräusche sind neutral"},{id:"laut",type:"word",german:"laut",meaning:"loud",image:"laut",audio:"tts",introducedInScene:"b1e1s1",tags:["neighbors","conflict"],cefrLevel:"B1",note:"Adjektiv — gesteigert: lauter, am lautesten"},{id:"die-party",type:"word",german:"die Party",meaning:"the party",image:"fest",audio:"tts",introducedInScene:"b1e1s1",tags:["neighbors","conflict"],cefrLevel:"B1",note:"die, Plural: die Partys — deutsche Schreibung!"},{id:"es-ist-zwei-uhr",type:"sentence",german:"Es ist zwei Uhr nachts.",meaning:"It's two o'clock at night.",audio:"tts",introducedInScene:"b1e1s1",tags:["conflict","time"],cefrLevel:"B1"},{id:"koennen-wir-darueber-reden",type:"sentence",german:"Können wir kurz darüber reden?",meaning:"Can we talk about this briefly?",audio:"tts",introducedInScene:"b1e1s1",tags:["conflict","politeness"],cefrLevel:"B1",note:"Der seriöseste Konfliktöffner im Deutschen"},{id:"die-ruecksicht",type:"word",german:"die Rücksicht",meaning:"the consideration (for others)",image:"ruhe",audio:"tts",introducedInScene:"b1e1s1",tags:["neighbors","conflict"],cefrLevel:"B1",note:'die (meist Singular) — „Rücksicht nehmen"'},{id:"die-ruhe",type:"word",german:"die Ruhe",meaning:"the quiet / peace",image:"ruhe",audio:"tts",introducedInScene:"b1e1s2",tags:["neighbors","conflict"],cefrLevel:"B1",note:'die ( Singular ) — „Ruhe, bitte!"'},{id:"der-kompromiss",type:"word",german:"der Kompromiss",meaning:"the compromise",image:"gespräch",audio:"tts",introducedInScene:"b1e1s2",tags:["conflict","neighbors"],cefrLevel:"B1",note:"der, Plural: die Kompromisse"},{id:"einverstanden",type:"chunk",german:"Ich bin einverstanden.",meaning:"I agree.",audio:"tts",introducedInScene:"b1e1s2",tags:["conflict","opinion"],cefrLevel:"B1"},{id:"es-tut-mir-leid",type:"chunk",german:"Es tut mir leid.",meaning:"I'm sorry.",audio:"tts",introducedInScene:"b1e1s2",tags:["conflict","politeness"],cefrLevel:"B1",note:"echt gemeint im Deutschen ein Verhältniswort: leid tun"},{id:"die-uhrzeit",type:"word",german:"die Uhrzeit",meaning:"the time (of day)",image:"urehr",audio:"tts",introducedInScene:"b1e1s2",tags:["conflict","time"],cefrLevel:"B1",note:"die, Plural: die Uhrzeiten"},{id:"ab-jetzt",type:"chunk",german:"Ab jetzt!",meaning:"From now on!",audio:"tts",introducedInScene:"b1e1s2",tags:["conflict","smalltalk"],cefrLevel:"B1"},{id:"das-grillfest",type:"word",german:"das Grillfest",meaning:"the barbecue party",image:"grill",audio:"tts",introducedInScene:"b1e1s3",tags:["neighbors","friends","food"],cefrLevel:"B1",note:"das, Plural: die Grillfeste"},{id:"der-grill",type:"word",german:"der Grill",meaning:"the grill / barbecue",image:"grill",audio:"tts",introducedInScene:"b1e1s3",tags:["friends","food"],cefrLevel:"B1"},{id:"bist-du-dabei",type:"sentence",german:"Bist du dabei?",meaning:"Are you in?",audio:"tts",introducedInScene:"b1e1s3",tags:["friends","invitation"],cefrLevel:"B1"},{id:"das-wochenende",type:"word",german:"das Wochenende",meaning:"the weekend",image:"kalender",audio:"tts",introducedInScene:"b1e1s3",tags:["friends","time"],cefrLevel:"B1",note:"das, Plural: die Wochenenden"},{id:"wir-kochen-zusammen",type:"chunk",german:"Wir kochen zusammen.",meaning:"We'll cook together.",audio:"tts",introducedInScene:"b1e1s3",tags:["friends","food"],cefrLevel:"B1"},{id:"die-einladung",type:"word",german:"die Einladung",meaning:"the invitation",image:"geschenk",audio:"tts",introducedInScene:"b1e1s3",tags:["friends","neighbors"],cefrLevel:"B1",note:"die, Plural: die Einladungen"}],Cn=[{id:"b1e1s1",episodeId:"b1e1",title:"Musik nachts",titleEn:"Music at night",place:"Wohnung, 2:04 Uhr",bg:"wohnung",contextTags:["neighbors","conflict","home"],requiredItems:[],introducedItems:["der-laerm","laut","die-party","es-ist-zwei-uhr","koennen-wir-darueber-reden","die-ruecksicht"],beats:[{type:"narration",text:"Zwei Uhr nachts. Die Wand pulsiert. Eine Etage über dir findet offenbar eine Party statt, und du bist ausnahmsweise nicht eingeladen. Früher hättest du wütend gegoogelt: ‚Germany noise law english'."},{type:"meet",itemIds:["der-laerm","laut","die-party"]},{type:"narration",text:"Heute gehst du einfach eine Treppe hoch. Worte, die du hast."},{type:"meet",itemIds:["es-ist-zwei-uhr","koennen-wir-darueber-reden","die-ruecksicht"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"tobias",text:"Sam?! …Oh. Oh nein. Es ist zwei Uhr nachts, oder? Komm rein, sorry — wir machen's aus.",translation:"Sam?! …Oh. Oh no. It's two a.m., right? Come in, sorry — we'll turn it off."},{type:"choice",prompt:"Tobias sieht ehrlich beschämt aus. Wie sprichst du es an?",options:[{label:"Können wir kurz darüber reden? Es ist ein bisschen laut.",line:"Tobias — können wir kurz darüber reden? Es ist ein bisschen laut."},{label:"Es ist okay! Nur … der Lärm. Ich muss früh raus.",line:"Es ist okay! Nur … der Lärm. Ich muss früh raus."}]},{type:"line",speaker:"tobias",text:"Nein, du hast völlig recht. Rücksicht — wir hatten einfach keine dran gedacht. Das war das letzte Mal so.",translation:"No, you're completely right. Consideration — we just weren't thinking. That was the last time like this."},{type:"check",count:2,mode:"recall"},{type:"narration",text:"Der Bass verstummt. Irgendwo singt jemand sehr leise weiter. Du gehst die Treppe runter und fühlst dich seltsam erwachsen."}]},{id:"b1e1s2",episodeId:"b1e1",title:"Das klare Wort",titleEn:"The clear word",place:"Treppenhaus, nächster Morgen",bg:"treppenhaus",contextTags:["conflict","apology","neighbors"],requiredItems:["der-laerm","koennen-wir-darueber-reden"],introducedItems:["die-ruhe","der-kompromiss","einverstanden","es-tut-mir-leid","die-uhrzeit","ab-jetzt"],beats:[{type:"narration",text:"Nächster Morgen. Tobias wartet auf dem Treppenabsatz mit zwei Brötchentüten und einem Gesicht wie ein Hund, der eine Socke gefressen hat."},{type:"meet",itemIds:["die-ruhe","die-uhrzeit","es-tut-mir-leid"]},{type:"line",speaker:"tobias",text:"Es tut mir leid. Nochmal. Die Uhrzeit war wirklich … jenseits von allem.",translation:"I'm sorry. Again. The time really was … beyond everything."},{type:"meet",itemIds:["der-kompromiss","einverstanden","ab-jetzt"]},{type:"choice",prompt:"Er macht einen Vorschlag: Party ja, Lärm nein.",options:[{label:"Ich bin einverstanden. Ab jetzt: Nachts Ruhe.",line:"Ich bin einverstanden. Ab jetzt: nachts Ruhe."},{label:"Kompromiss: Feiern ja — aber mit Kopfhörern.",line:"Kompromiss: Feiern ja — aber mit Kopfhörern."}]},{type:"line",speaker:"tobias",text:"Abgemacht. Ruhe ab elf, versprochen. …Und dafür gibt's Brötchen. Friedensbrötchen.",translation:"Deal. Quiet from eleven, promised. …And for that: rolls. Peace rolls."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Hausordnung (Auszug, laminiert)",text:`RUHEZEITEN: 22:00 – 6:00 Uhr

Auch an Wochenenden. Auch an Feiertagen.
Besonders an Feiertagen.

Nach 22 Uhr gilt: leise reden, Musik über Kopfhörer,
Kartoffeln nicht mehr klopfen. (Ja, das war nötig.)

Wer sich nicht einverstanden fühlt:
reden. Das hilft erfahrungsgemäß am besten.`,translation:`QUIET HOURS: 10 pm – 6 am

Weekends too. Holidays too.
Especially on holidays.

After 10 pm: talk quietly, music through headphones,
no more knocking potatoes. (Yes, that was necessary.)

Whoever doesn't feel okay with this:
talk. Experience shows that works best.`,itemIds:["die-ruhe","einverstanden","es-tut-mir-leid"]},{type:"narration",text:"Ihr steht zwischen drittem und zweitem Stock und esst Brötchen. Konflikt gelöst, deutscher Stil: klar benannt, sauber beendet, dann Essen."}]},{id:"b1e1s3",episodeId:"b1e1",title:"Grillen als Frieden",titleEn:"Barbecue as peace",place:"Clara-Zetkin-Park",bg:"park",contextTags:["neighbors","friends","food"],requiredItems:["es-tut-mir-leid"],introducedItems:["das-grillfest","der-grill","bist-du-dabei","das-wochenende","wir-kochen-zusammen","die-einladung"],beats:[{type:"line",speaker:"tobias",text:"Also: Unser Grillfest ist eine offizielle Einladung. Dieses Wochenende, Clara-Park. Bist du dabei?",translation:"So: our barbecue is an official invitation. This weekend, Clara Park. Are you in?"},{type:"meet",itemIds:["die-einladung","das-wochenende","bist-du-dabei"]},{type:"meet",itemIds:["das-grillfest","der-grill","wir-kochen-zusammen"]},{type:"choice",prompt:"Der Grill qualmt schon von weitem.",options:[{label:"Ich bin dabei! Wir kochen zusammen.",line:"Ich bin dabei! Wir kochen zusammen."},{label:"Dabei! Aber ich bring Salat mit, nicht Fleisch.",line:"Dabei! Aber ich bring Salat mit, kein Fleisch."}]},{type:"line",speaker:"tobias",text:"Salat ist auch Fleisch, wenn man richtig grillt. …Scherz! Bring den Salat, der war letztes Mal super.",translation:"Salad is also meat if you grill it right. …Joke! Bring the salad, it was great last time."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Einladung: Grillfest (Deniz, via Treppenhaus)",text:`WOCHENENDE. HOF. GRILL.

Anlass: Ruhe ist wieder hergestellt,
Lärm-Diplomatie erfolgreich — deswegen: feiern.

Sam bringt: nichts außer sich. (Steht so.)
Andere bringen: Fleisch, Salat, Musik.
Wir kochen zusammen. Bedeutung: ALLE fassen an.

Bist du dabei? Diese Frage ist rhetorisch.
Ab 17 Uhr. Regen = Flur. Ende.`,translation:`WEEKEND. COURTYARD. BARBECUE.

Occasion: quiet has been restored,
noise diplomacy successful — hence: celebrate.

Sam brings: nothing but himself. (It says so.)
Others bring: meat, salad, music.
We cook together. Meaning: EVERYONE helps.

Are you in? This question is rhetorical.
From 5 pm. Rain = hallway. End.`,itemIds:["das-grillfest","bist-du-dabei","die-einladung"]},{type:"narration",text:"Sonnenuntergang im Park, Rauch, Lachen, ein riesiger Koffer aus Konfliktpotenzial, abgebaut zu Freundschaft. So funktioniert Nachbarschaft."}]}],rs={episode:Gn,cast:Rn,items:jn,scenes:Cn},as=Object.freeze(Object.defineProperty({__proto__:null,cast:Rn,default:rs,episode:Gn,items:jn,scenes:Cn},Symbol.toStringTag,{value:"Module"})),$n={id:"b1e10",arcId:"B1",cefrLevel:"B1",title:"Siebzig",titleEn:"Seventy",blurb:"Frau Brügge wird 70. Eine Überraschungsparty mit Wenn-Sätzen, einer Torte mit 70 Kerzen — und einer Rede, die länger wird als geplant.",order:18,sceneIds:["b1e10s1","b1e10s2","b1e10s3"]},Un=[{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"deniz",name:"Deniz",role:"Nachbar"},{id:"luise",name:"Luise",role:"Café-Besitzerin"}],On=[{id:"der-geburtstag",type:"word",german:"der Geburtstag",meaning:"the birthday",image:"fest",audio:"tts",introducedInScene:"b1e10s1",tags:["celebration","time"],cefrLevel:"B1",note:"der, Plural: die Geburtstage — in Deutschland: selbst schmeißen"},{id:"die-ueberraschung",type:"word",german:"die Überraschung",meaning:"the surprise",image:"geschenk",audio:"tts",introducedInScene:"b1e10s1",tags:["celebration","feelings"],cefrLevel:"B1",note:"die, Plural: die Überraschungen — Überraschungsparty (f)"},{id:"der-wunsch",type:"word",german:"der Wunsch",meaning:"the wish",image:"idee",audio:"tts",introducedInScene:"b1e10s1",tags:["celebration","feelings"],cefrLevel:"B1",note:"der, Plural: die Wünsche — sich etwas wünschen"},{id:"die-kerze",type:"word",german:"die Kerze",meaning:"the candle",image:"kerze",audio:"tts",introducedInScene:"b1e10s1",tags:["celebration","home"],cefrLevel:"B1",note:"die, Plural: die Kerzen — 70 Stück: Feuerwehr einladen"},{id:"heimlich",type:"word",german:"heimlich",meaning:"secret(ly)",image:"schloss",audio:"tts",introducedInScene:"b1e10s1",tags:["celebration"],cefrLevel:"B1",note:"Adjektiv/Adverb — heimlich Planen, öffentlich feiern"},{id:"wenn-du-zeit-hast",type:"grammar_pattern",german:"___ du Zeit hast, komm um vier vorbei.",meaning:"If you have time, come by at four.",image:"kalender",audio:"tts",introducedInScene:"b1e10s1",tags:["grammar","celebration"],cefrLevel:"B1",cloze:"Wenn",speak:"Wenn du Zeit hast, komm um vier vorbei.",note:"Wenn-Satz: Bedingung vorne, Verb an Position 2 hinten"},{id:"backen",type:"word",german:"backen",meaning:"to bake",image:"kuchen",audio:"tts",introducedInScene:"b1e10s2",tags:["cooking","celebration"],cefrLevel:"B1",note:"stark: backen — backte/buk — gebacken"},{id:"die-torte",type:"word",german:"die Torte",meaning:"the (layer) cake",image:"kuchen",audio:"tts",introducedInScene:"b1e10s2",tags:["food","celebration"],cefrLevel:"B1",note:"die, Plural: die Torten — mehr Ebenen als Kuchen"},{id:"der-lieblingskuchen",type:"word",german:"der Lieblingskuchen",meaning:"the favourite cake",image:"heimat",audio:"tts",introducedInScene:"b1e10s2",tags:["food","celebration"],cefrLevel:"B1",note:"der, Plural: die Lieblingskuchen — Lieblings- geht mit allem"},{id:"die-deko",type:"word",german:"die Deko",meaning:"the decorations (colloq.)",image:"blumen",audio:"tts",introducedInScene:"b1e10s2",tags:["celebration"],cefrLevel:"B1",note:"die ( Singular ) — kurz für Dekoration"},{id:"aufraeumen",type:"word",german:"aufräumen",meaning:"to tidy up",image:"stuhl",audio:"tts",introducedInScene:"b1e10s2",tags:["home","actions"],cefrLevel:"B1",note:"trennbar: ich räume auf — erst aufräumen, dann feiern"},{id:"die-tischdecke",type:"word",german:"die Tischdecke",meaning:"the tablecloth",image:"tisch",audio:"tts",introducedInScene:"b1e10s2",tags:["home","celebration"],cefrLevel:"B1",note:"die, Plural: die Tischdecken — bei Frau Brügge: mit Blümchen"},{id:"das-alter",type:"word",german:"das Alter",meaning:"the age",image:"urehr",audio:"tts",introducedInScene:"b1e10s3",tags:["time","people"],cefrLevel:"B1",note:"das, Plural: die Alter — „In deinem Alter…“"},{id:"herzlichen-glueckwunsch",type:"chunk",german:"Herzlichen Glückwunsch zum Geburtstag!",meaning:"Happy birthday! (congratulations)",image:"geschenk",audio:"tts",introducedInScene:"b1e10s3",tags:["politeness","celebration"],cefrLevel:"B1",speak:"Herzlichen Glückwunsch zum Geburtstag!",note:"die offizielle Version von „Alles Gute!“"},{id:"anstossen",type:"word",german:"anstoßen",meaning:"to clink glasses / toast",image:"getränk",audio:"tts",introducedInScene:"b1e10s3",tags:["celebration","politeness"],cefrLevel:"B1",note:"trennbar: wir stoßen an — Blickkontakt! Sonst 7 Jahre Pech"},{id:"geruehrt",type:"word",german:"gerührt",meaning:"moved / touched (emotionally)",image:"person",audio:"tts",introducedInScene:"b1e10s3",tags:["feelings"],cefrLevel:"B1",note:"Partizip als Adjektiv — gerührt, nicht erschüttert"},{id:"die-lebensfreude",type:"word",german:"die Lebensfreude",meaning:"the joy of life",image:"sonnenuntergang",audio:"tts",introducedInScene:"b1e10s3",tags:["feelings","celebration"],cefrLevel:"B1",note:"die ( Singular ) — Frau Brügge: Vorbild"},{id:"die-umarmung",type:"word",german:"die Umarmung",meaning:"the hug",image:"team",audio:"tts",introducedInScene:"b1e10s3",tags:["feelings","friends"],cefrLevel:"B1",note:"die, Plural: die Umarmungen — umarmen"}],Vn=[{id:"b1e10s1",episodeId:"b1e10",title:"Der heimliche Plan",titleEn:"The secret plan",place:"Treppenhaus, Flüsterniveau",bg:"treppenhaus",contextTags:["neighbors","celebration","friends"],requiredItems:["die-einladung","die-party"],introducedItems:["der-geburtstag","die-ueberraschung","der-wunsch","die-kerze","heimlich","wenn-du-zeit-hast"],beats:[{type:"narration",text:"Deniz hat einen Zettel im Treppenhaus verteilt: „BRÜGGE 70 — Freitag. Heimlich. Wer verrät, backt allein.“ Tobias liest ihn vor wie ein Staatsgeheimnis."},{type:"line",speaker:"deniz",text:"Also. Frau Brügge wird siebzig. Sie will NICHTS feiern — deswegen feiern wir. Überraschungsparty, vier Uhr, ihr Garten. …Sam: Du backst. Tobias: Du lenkst sie ab. Ich: Deko. Luise bringt Getränke. Fragen?",translation:"So. Frau Brügge is turning seventy. She wants to celebrate NOTHING — that's why we're celebrating. Surprise party, four o'clock, her garden. …Sam: you bake. Tobias: you distract her. Me: decorations. Luise brings drinks. Questions?"},{type:"meet",itemIds:["der-geburtstag","die-ueberraschung","heimlich"]},{type:"line",speaker:"tobias",text:"Ich hab schon eine Ablenkung: „Frau Brügge, mein Wasserhahn tropft.“ …Die kommt, sieht sich an, repariert mindestens drei Sachen, die nicht kaputt sind. Wir haben dann eine Stunde. …Ihr Wunsch? Was wünscht man SIEBZIG?",translation:"I've got the distraction covered: 'Ms Brügge, my tap is dripping.' …She'll come, look around, and fix at least three things that aren't broken. That gives us an hour. …Her wish? What do you wish someone turning SEVENTY?"},{type:"meet",itemIds:["der-wunsch","die-kerze","wenn-du-zeit-hast"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Deniz hält den Zettel hoch wie einen Pass.",options:[{label:"Wenn ich Zeit habe, backe ich zwei Torten. Sicher ist sicher.",line:"Wenn ich Zeit habe, backe ich zwei Torten. Sicher ist sicher. …Deniz: „Das ist der Geist von Frau Brügge.“"},{label:"70 Kerzen. Wer zündelt?",line:"70 Kerzen. Wer zündelt? …„Feuerzeug hab ich. Feuerlöscher sucht noch jemand.“"}]},{type:"check",count:2,mode:"recall"},{type:"line",speaker:"deniz",text:"Und: NICHTS verraten. Frau Brügge sieht ALLES. Die hat mal meinen Geheimniskoffer schon am Postboten-Gesicht erkannt. Wir reden ab jetzt nur noch übers Wetter. …Regen. Ich sage: Regen.",translation:"And: reveal NOTHING. Frau Brügge sees EVERYTHING. She once spotted my secret from the postman's face alone. From now on we only talk about the weather. …Rain. I say: rain."},{type:"reading",title:"Deniz' Zettel (von der Tür gerissen)",text:`AKTION B70 — streng geheim

Datum: Freitag. Ort: Garten. Grund: 70 Jahre Brügge.

Rollen: Tobias = Ablenkung (Wasserhahn-Lüge)
Sam = Kuchen (Mohn, Zimt: JA)
Deniz = Deko & Radarkontrolle
Luise = Getränke & Lautstärke

Wenn du-zeit-hast: komm um 14, nicht um 15:59.
Frau Brügge riecht Geheimnisse ab 15:00.`,translation:`OPERATION B70 — strictly secret

Date: Friday. Place: garden. Reason: Brügge turns 70.

Roles: Tobias = distraction (tap lie)
Sam = cake (poppy seed, cinnamon: YES)
Deniz = decorations & radar control
Luise = drinks & volume

If you have time: come at 2, not at 3:59.
Frau Brügge smells secrets from 3 pm.`,itemIds:["die-ueberraschung","heimlich","die-kerze"]}]},{id:"b1e10s2",episodeId:"b1e10",title:"Backen und Dekorieren",titleEn:"Baking and decorating",place:"Wohnung & Frau Brügges Garten, Freitag",bg:"wohnung",contextTags:["food","celebration","neighbors"],requiredItems:["das-grillfest","feiern"],introducedItems:["backen","die-torte","der-lieblingskuchen","die-deko","aufraeumen","die-tischdecke"],beats:[{type:"narration",text:"Freitag, 13 Uhr. Deine Küche ist eine Baustelle aus Mehl. Der Plan: Frau Brügges Lieblingskuchen — Mohnkuchen mit Zimt. Das Rezept steht in ihrer Handschrift auf einer Karte von 1994."},{type:"line",speaker:"tobias",text:"Statusbericht: Wasserhahn-Operation läuft, sie ist im Bad und ermittelt. …Ich hab ihr gesagt, der Hahn klinge „wie ein alter Mann im Treppenhaus“. Sie kam SOFORT. Verlass auf deutsche Handwerker-Instinkte.",translation:"Status report: tap operation is running, she's in the bathroom investigating. …I told her the tap sounds 'like an old man on the stairs'. She came IMMEDIATELY. You can rely on German craftsman instincts."},{type:"meet",itemIds:["backen","die-torte","der-lieblingskuchen"]},{type:"line",speaker:"deniz",text:"(aus dem Garten) Deko hängt! Girlanden, Lichter, ein Schild mit „70“ — und die Tischdecke ihrer Mutter, ganz vorsichtig gewaschen. …Sam, die Torte! Der Zimt! MEHR Zimt. Nein. Genau richtig. Perfekt.",translation:"(from the garden) Decorations are up! Garlands, lights, a sign with '70' — and her mother's tablecloth, very carefully washed. …Sam, the cake! The cinnamon! MORE cinnamon. No. Exactly right. Perfect."},{type:"meet",itemIds:["die-deko","die-tischdecke","aufraeumen"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Die Torte ist fertig. 70 Kerzen liegen daneben.",options:[{label:"Wir stecken 7 + 0. Eine große, eine runde.",line:"Wir stecken 7 und 0 rein. Eine große, eine runde. …Sicherer für den Garten. Und für die Geschichte."},{label:"Alle 70. Was kann schon passieren?",line:"Alle 70. Was kann schon passieren? …„Ein Gartenbrand mit Stil“, sagt Deniz und holt trotzdem den Eimer."}]},{type:"check",count:2,mode:"listen"},{type:"line",speaker:"tobias",text:"Sie kommt! Jeder an seine Position! …Und Sam: Wenn du dich morgen fragst, ob das hier dein Leben ist — ja. Du backst heimlich Mohnkuchen für eine Siebzigjährige in Leipzig. Das IST dein Leben. Und es ist gut.",translation:"She's coming! Everyone to your positions! …And Sam: if you ask yourself tomorrow whether this is your life — yes. You're secretly baking poppy seed cake for a seventy-year-old in Leipzig. That IS your life. And it's good."},{type:"reading",title:"Rezeptkarte + Backplan",text:`MOHNKUCHEN FÜR SIEBZIG (doppelte Backröhren-Logik)

12:00 Teig (Zimt: mehr als du denkst)
13:00 Backen. NICHT öffnen. Geduld üben.
14:00 Abkühlen. Kerzen testen (7+0, stabil?)
15:00 Torten-Transport. Gerade halten.

»Der Lieblingskuchen hat keine Geheimnisse.
 Nur Zimt. Viel davon.«`,translation:`POPPY SEED CAKE FOR SEVENTY (double-oven logic)

12:00 Batter (cinnamon: more than you think)
1 pm Bake. Do NOT open the oven. Practise patience.
2 pm Cool down. Test candles (7+0, stable?)
3 pm Cake transport. Keep level.

'The favourite cake has no secrets.
Only cinnamon. Plenty of it.'`,itemIds:["backen","die-torte","der-lieblingskuchen"]}]},{id:"b1e10s3",episodeId:"b1e10",title:"70 Kerzen",titleEn:"Seventy candles",place:"Frau Brügges Garten, 16:00",bg:"fest",contextTags:["celebration","neighbors","feelings"],requiredItems:["feiern","die-meinung"],introducedItems:["das-alter","herzlichen-glueckwunsch","anstossen","geruehrt","die-lebensfreude","die-umarmung"],beats:[{type:"narration",text:"Der Garten. Die Girlanden. Alle Nachbarn, still wie eine Verschwörung. Frau Brügge tritt raus — sieht, kehrt UM, kommt wieder, diesmal mit Taschentuch. „Na gut. Na gut. Aber ich koch dann morgen für euch ALLE.“"},{type:"line",speaker:"frau-bruegge",text:"Siebzig. …Meine Mutter sagte immer: Alter ist, was du draus machst. Ich hab draus gemacht: ein Haus, sechs Nachmietergenerationen, ein Garten, in dem jetzt plötzlich alle stehen. …Und MEINEN Mohnkuchen. Wer hat das Rezept?!",translation:"Seventy. …My mother always said: age is what you make of it. What I've made of it: a house, six generations of tenants, a garden where suddenly everyone's standing. …And MY poppy seed cake. Who has my recipe?!"},{type:"meet",itemIds:["das-alter","herzlichen-glueckwunsch","geruehrt"]},{type:"choice",prompt:"Alle schauen dich an. Torte. Kerzen. Dein Moment.",options:[{label:"Herzlichen Glückwunsch zum Geburtstag, Frau Brügge. Von uns allen.",line:"Herzlichen Glückwunsch zum Geburtstag, Frau Brügge. Von uns allen — und von der Torte."},{label:"Siebzig Jahre Lebensfreude. Das feiern wir jetzt nach.",line:"Siebzig Jahre Lebensfreude. Das feiern wir jetzt nach — mit Zimt, zu viel davon."}]},{type:"meet",itemIds:["die-lebensfreude","anstossen","die-umarmung"]},{type:"line",speaker:"deniz",text:"ANSTOSSEN! Aber Blickkontakt! Sonst sieben Jahre Pech! …(alle stoßen an, keiner riskiert was) …Auf Frau Brügge: auf fünfundsiebzig, auf achtzig, auf stilles Mietverhältnis und laute Feste!",translation:"TOAST! But eye contact! Otherwise seven years' bad luck! …(everyone toasts, nobody risks anything) …To Frau Brügge: to seventy-five, to eighty, to quiet tenancy and loud parties!"},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Frau Brügges Rezeptkarte (1994)",text:`Mohnkuchen — Omas Art

500 g Mohn · 4 Eier
200 g Butter (weich!)
ZIMT. Nicht sparen. Nie.
Zitronenschale von 1 Zitrone
1 Prise Salz (eine Prise,
 keine Handvoll, Deniz)

Backen: 45 Min., 180°, gut kontrollieren.
Wer ihn isst, kommt wieder.
Wer wiederkommt, kriegt die zweite Hälfte.

— E. Brügge, für Sonntage & 70. Geburtstage`,translation:`Poppy seed cake — grandma's way

500 g poppy seeds · 4 eggs
200 g butter (soft!)
CINNAMON. Don't skimp. Ever.
Zest of 1 lemon
1 pinch of salt (a pinch,
 not a handful, Deniz)

Bake: 45 min, 180°, inspect well.
Who eats it, comes back.
Who comes back, gets the second half.

— E. Brügge, for Sundays & 70th birthdays`},{type:"narration",text:"Abendlicht im Garten. Frau Brügge hält deine Schulter, sagt „du bist gut hier angekommen“ und geht dann Kuchen nachlegen. Tobias reicht dir still zwei Stück mit. Du isst sie beide. Es ist dein drittes Jahr, das in diesem Land beginnt — und das erste, das sich nicht mehr neu anfühlt."}]}],ss={episode:$n,cast:Un,items:On,scenes:Vn},os=Object.freeze(Object.defineProperty({__proto__:null,cast:Un,default:ss,episode:$n,items:On,scenes:Vn},Symbol.toStringTag,{value:"Module"})),Zn={id:"b1e11",arcId:"B1",cefrLevel:"B1",title:"Die Mieterversammlung",titleEn:"The tenants' meeting",blurb:"Hausverwaltung, Tagesordnung, Anträge: Im Hinterhof wird über einen Brunnen abgestimmt. Demokratie im Treppenhaus — mit Protokoll, Mehrheit und einem Gegenantrag von Frau Brügge.",order:19,sceneIds:["b1e11s1","b1e11s2","b1e11s3"]},Jn=[{id:"verwaltung",name:"Herr Kalisch",role:"Hausverwaltung"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"deniz",name:"Deniz",role:"Nachbar"},{id:"tobias",name:"Tobias",role:"Nachbar, Student"}],qn=[{id:"die-versammlung",type:"word",german:"die Versammlung",meaning:"the (assembly) meeting",image:"team",audio:"tts",introducedInScene:"b1e11s1",tags:["neighbors","admin","meeting"],cefrLevel:"B1",note:"die, Plural: die Versammlungen — Mieterversammlung, Hauptversammlung"},{id:"der-tagesordnungspunkt",type:"word",german:"der Tagesordnungspunkt",meaning:"the agenda item",image:"liste",audio:"tts",introducedInScene:"b1e11s1",tags:["meeting","admin"],cefrLevel:"B1",note:"der, Plural: die Tagesordnungspunkte — Abkürzung: TOP 3"},{id:"die-verwaltung",type:"word",german:"die Verwaltung",meaning:"the (property) administration",image:"firma",audio:"tts",introducedInScene:"b1e11s1",tags:["admin","work"],cefrLevel:"B1",note:"die, Plural: die Verwaltungen — leitet das Haus, liebt Klemmbretter"},{id:"die-heizkosten",type:"word",german:"die Heizkosten",meaning:"the heating costs (plural)",image:"münzen",audio:"tts",introducedInScene:"b1e11s1",tags:["money","home"],cefrLevel:"B1",note:"Plural: die Heizkosten — immer ein Tagesordnungspunkt"},{id:"die-ruecklage",type:"word",german:"die Rücklage",meaning:"the reserves (funds set aside)",image:"münzen",audio:"tts",introducedInScene:"b1e11s1",tags:["money","admin"],cefrLevel:"B1",note:"die, Plural: die Rücklagen — Instandhaltungsrücklage = das Sparschwein des Hauses"},{id:"damit-brunnen",type:"grammar_pattern",german:"Wir sammeln Geld, ___ der Hof einen Brunnen bekommt.",meaning:"We're collecting money so that the courtyard gets a fountain.",image:"ziel",audio:"tts",introducedInScene:"b1e11s1",tags:["grammar","neighbors"],cefrLevel:"B1",cloze:"damit",speak:"Wir sammeln Geld, damit der Hof einen Brunnen bekommt.",note:"damit + Satz = Ziel (final); im Satz danach: Verb an Position 2"},{id:"abstimmen",type:"word",german:"abstimmen",meaning:"to vote",image:"liste",audio:"tts",introducedInScene:"b1e11s2",tags:["meeting","democracy"],cefrLevel:"B1",note:"trennbar: wir stimmen ab — über etwas abstimmen"},{id:"der-beschluss",type:"word",german:"der Beschluss",meaning:"the (official) decision / resolution",image:"stempel",audio:"tts",introducedInScene:"b1e11s2",tags:["meeting","admin"],cefrLevel:"B1",note:"der, Plural: die Beschlüsse — einen Beschluss fassen"},{id:"die-mehrheit",type:"word",german:"die Mehrheit",meaning:"the majority",image:"team",audio:"tts",introducedInScene:"b1e11s2",tags:["meeting","democracy"],cefrLevel:"B1",note:"die, Plural: die Mehrheiten — einfache Mehrheit reicht meist"},{id:"die-muelltrennung",type:"word",german:"die Mülltrennung",meaning:"the waste separation",image:"korb",audio:"tts",introducedInScene:"b1e11s2",tags:["environment","home","rules"],cefrLevel:"B1",note:"die, Plural: die Mülltrennungen — Gelbe Tonne, Blaue Tonne, Biotonne"},{id:"der-hausmeister",type:"word",german:"der Hausmeister",meaning:"the caretaker",image:"werkzeug",audio:"tts",introducedInScene:"b1e11s2",tags:["work","home"],cefrLevel:"B1",note:"der, Plural: die Hausmeister — hat Schlüssel, hat Ordnung, hat Meinung"},{id:"stimmen-fuer",type:"grammar_pattern",german:"Ich stimme ___ den Brunnen.",meaning:"I'm voting for the fountain.",image:"liste",audio:"tts",introducedInScene:"b1e11s2",tags:["grammar","meeting"],cefrLevel:"B1",cloze:"für",speak:"Ich stimme für den Brunnen.",note:"stimmen für + Akkusativ; dagegen: stimmen gegen"},{id:"der-brunnen",type:"word",german:"der Brunnen",meaning:"the fountain / well",image:"wasser",audio:"tts",introducedInScene:"b1e11s3",tags:["nature","neighbors"],cefrLevel:"B1",note:"der, Plural: die Brunnen — ein Wunsch aller Innenhöfe"},{id:"die-spende",type:"word",german:"die Spende",meaning:"the donation",image:"geschenk",audio:"tts",introducedInScene:"b1e11s3",tags:["money","community"],cefrLevel:"B1",note:"die, Plural: die Spenden — spenden (Verb)"},{id:"die-einweihung",type:"word",german:"die Einweihung",meaning:"the inauguration / opening ceremony",image:"fest",audio:"tts",introducedInScene:"b1e11s3",tags:["celebration","neighbors"],cefrLevel:"B1",note:"die, Plural: die Einweihungen — etwas einweihen"},{id:"die-hoffnung",type:"word",german:"die Hoffnung",meaning:"the hope",image:"person",audio:"tts",introducedInScene:"b1e11s3",tags:["feelings"],cefrLevel:"B1",note:"die, Plural: die Hoffnungen — Hoffnung haben auf + Akkusativ"},{id:"der-sommer",type:"word",german:"der Sommer",meaning:"the summer",image:"sonnenuntergang",audio:"tts",introducedInScene:"b1e11s3",tags:["time","weather"],cefrLevel:"B1",note:"der, Plural: die Sommer — im Sommer; nächsten Sommer"}],Yn=[{id:"b1e11s1",episodeId:"b1e11",title:"Einladung mit Tagesordnung",titleEn:"Invitation with agenda",place:"Hausflur, schwarzes Brett",bg:"treppenhaus",contextTags:["neighbors","admin","meeting"],requiredItems:["die-einladung","die-ruhe"],introducedItems:["die-versammlung","der-tagesordnungspunkt","die-verwaltung","die-heizkosten","die-ruecklage","damit-brunnen"],beats:[{type:"narration",text:"Am schwarzen Brett: ein offizieller Zettel mit neun Tagesordnungspunkten und einer Handschrift darunter, die du kennst: „TOP 10: BRUNNEN. Bringt Kuchen mit. E. B.“"},{type:"line",speaker:"deniz",text:"Mieterversammlung, nächste Woche, Hinterhof. …TOP 1: Heizkosten. TOP 2: Mülltrennung, weil ALLE wieder raten. TOP 3: Rücklage. …Und die geheime TOP 10: Frau Brügge will einen Brunnen. Einen. Brunnen.",translation:"Tenants' meeting, next week, courtyard. …Item 1: heating costs. Item 2: waste separation, because EVERYONE keeps guessing. Item 3: reserves. …And the secret item 10: Frau Brügge wants a fountain. A. Fountain."},{type:"meet",itemIds:["die-versammlung","der-tagesordnungspunkt","die-verwaltung"]},{type:"line",speaker:"tobias",text:"Die Heizkosten stehen jedes Jahr drauf — wie Weihnachten, nur weniger festlich. …Und der Brunnen? Den wünscht sich der Hof seit Jahren. Wir sammeln halt Geld, damit der Hof endlich was Schönes bekommt.",translation:"Heating costs are on the list every year — like Christmas, just less festive. …And the fountain? The courtyard has wanted one for years. So we're collecting money so the courtyard finally gets something nice."},{type:"meet",itemIds:["die-heizkosten","die-ruecklage","damit-brunnen"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Deniz: „Du bist jetzt Mieter. Sagst du bei der Versammlung was?“",options:[{label:"Ja. Ich stimme für den Brunnen — mit Begründung.",line:"Ja, ich stimme für den Brunnen. Mit Begründung, damit die Verwaltung weiß, dass ich mitdenke."},{label:"Erst zuhören. Ich kenne meine Rolle: Kuchen und Klugheit.",line:"Erst mal zuhören. Meine Rolle: Kuchen mitbringen und klug nicken. Beides kann ich schon."}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Einladung zur Mieterversammlung",text:`EINLADUNG
zur Mieterversammlung am Donnerstag,
18:00 Uhr, Hinterhof (bei Regen: Flur, EG)

Tagesordnung:
TOP 1   Heizkostenabrechnung 2026
TOP 2   Mülltrennung: neue Beschilderung
TOP 3   Instandhaltungsrücklage
TOP 4   Fahrradständer: Standort
TOP 10  Antrag Brunnen (Brügge, E.)

Anträge sind bis Vorabend schriftlich
bei der Verwaltung einzureichen.

— Hausverwaltung Kalisch & Partner`,translation:`INVITATION
to the tenants' meeting on Thursday,
6 pm, courtyard (in case of rain: ground-floor hallway)

Agenda:
Item 1   Heating bill 2026
Item 2   Waste separation: new signage
Item 3   Maintenance reserve
Item 4   Bike racks: location
Item 10  Motion: fountain (Brügge, E.)

Motions must be submitted in writing
to the management by the evening before.

— Property management Kalisch & Partner`}]},{id:"b1e11s2",episodeId:"b1e11",title:"Antrag und Gegenantrag",titleEn:"Motion and counter-motion",place:"Hinterhof, Klappstühle & Kuchen",bg:"fest",contextTags:["neighbors","meeting","admin"],requiredItems:["die-meinung","die-frage"],introducedItems:["abstimmen","der-beschluss","die-mehrheit","die-muelltrennung","der-hausmeister","stimmen-fuer"],beats:[{type:"narration",text:"Donnerstag, 18 Uhr. Herr Kalisch von der Verwaltung liest vor wie ein Nachrichtensprecher mit Klemmbrett. Die Mülltrennung wird diskutiert — zwei Stunden für vier Tonnen. Danach kommt alles ins Rollen."},{type:"line",speaker:"verwaltung",text:"Zu TOP 2: Es gab Beschwerden. Gelbe Tonne = Verpackungen. NICHT: Restmüll. Wer zweifelt, schaut auf das neue Schild. …Gibt's Fragen? …Nein? Dann Abstimmung: Wer ist dafür, dass der Hausmeister die Schilder montiert?",translation:"On item 2: there were complaints. Yellow bin = packaging. NOT: residual waste. If in doubt, look at the new sign. …Any questions? …No? Then a vote: who's in favour of the caretaker mounting the signs?"},{type:"meet",itemIds:["die-muelltrennung","der-hausmeister","abstimmen"]},{type:"line",speaker:"frau-bruegge",text:"(zu TOP 10) Meine Damen und Herren. Dieser Hof ist grau seit 1987. Ich bin alt genug, um das zu sagen, und reich genug am Kuchen. …Ich stelle den Antrag: Brunnen. Finanzierung: Spenden plus Rücklage. …Jetzt möge man abstimmen.",translation:"(on item 10) Ladies and gentlemen. This courtyard has been grey since 1987. I'm old enough to say it and rich in cakes. …I put forward the motion: a fountain. Funding: donations plus reserves. …Now let's vote."},{type:"meet",itemIds:["der-beschluss","die-mehrheit","stimmen-fuer"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Kalisch hebt die Hand: „Wer stimmt für den Brunnen?“",options:[{label:"Ich stimme für den Brunnen. Und ich spende dreißig Euro.",line:"Ich stimme für den Brunnen — und ich spende dreißig Euro. …Kalisch: „Notiert. Erster Spender. Kraftvoll.“"},{label:"Ich stimme dafür — aber ich stelle eine Frage: Wer reinigt ihn?",line:"Ich stimme dafür. Eine Frage: Wer reinigt den Brunnen? …Frau Brügge: „Der Hausmeister. Das ist jetzt Teil seines Mythos.“"}]},{type:"line",speaker:"verwaltung",text:"Abstimmung: Sechs dafür, eine dagegen, eine Enthaltung. …Die Mehrheit hat entschieden. Beschluss gefasst: Brunnen im Frühjahr. …(Brügge, leise): „Wer war dagegen?“ …(Stille. Protokoll bleibt anonym.)",translation:"Vote: six in favour, one against, one abstention. …The majority has decided. Resolution passed: fountain in spring. …(Brügge, quietly): 'Who voted against?' …(Silence. The minutes stay anonymous.)"},{type:"check",count:2,mode:"recall"}]},{id:"b1e11s3",episodeId:"b1e11",title:"Die Einweihung",titleEn:"The inauguration",place:"Hinterhof, Mai, Brunnen läuft",bg:"fest",contextTags:["neighbors","celebration","community"],requiredItems:["feiern","die-umarmung"],introducedItems:["der-brunnen","die-spende","die-einweihung","die-hoffnung","der-sommer"],beats:[{type:"narration",text:"Mai. Der Brunnen läuft — ein Podest, eine Kupferschale, Wasser, das plätschert wie eine kleine Werbung fürs Leben. Darumherum: alle Nachbarn, Kuchen, und Frau Brügge mit einer Schere und einem roten Band."},{type:"line",speaker:"frau-bruegge",text:"Vor vierzig Jahren wollte dieser Hof einen Brunnen. Vor vierzig Jahren war ich nicht Vermieterin, sondern Mieterin — in DIESSEM Haus. …Heute machen wir es wahr. Danach: Kuchen. …Die Einweihung ist damit eröffnet!",translation:"Forty years ago this courtyard wanted a fountain. Forty years ago I wasn't the landlady — I was a tenant, in THIS very house. …Today we're making it happen. After that: cake. …The inauguration is hereby open!"},{type:"meet",itemIds:["der-brunnen","die-einweihung","die-spende"]},{type:"line",speaker:"deniz",text:"Sam, schau die Liste: Spenden von allen — der Bäcker, Luise, sogar die Verwaltung. …Hoffnung in Euro. Und im Sommer sitzen hier alle am Wasser wie in Italien. Nur mit mehr Regeln.",translation:"Sam, look at the list: donations from everyone — the baker, Luise, even the property management. …Hope in euros. And in summer everyone will sit here by the water like in Italy. Just with more rules."},{type:"meet",itemIds:["die-hoffnung","der-sommer"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Frau Brügge reicht dir die Schere. „Du hast mitgestimmt. Gemeinsam.“",options:[{label:"Ich schneide das Band durch — für den Sommer.",line:"Ich schneide das Band durch — auf den Sommer, auf das Wasser, auf Nachbarschaft mit Brunnen."},{label:"Wir schneiden zusammen. Alle Hände an der Schere.",line:"Wir schneiden zusammen — alle Hände an der Schere. …Das Foto hängt später im Treppenhaus. Lauter Lächeln."}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Protokoll (Auszug), von der Verwaltung verschickt",text:`PROTOKOLL — Mieterversammlung, 14.03.

TOP 2: Schilder werden montiert.
Beschluss: einstimmig.

TOP 10: Antrag „Brunnen im Hof“.
Abstimmung: 6 dafür, 1 dagegen, 1 Enthaltung.
Beschluss: angenommen. Umsetzung: Frühjahr.

Finanzierung: Spenden (bisher 412 €)
und Instandhaltungsrücklage.

Nächste Versammlung: Herbst.
Anträge bitte wieder schriftlich.

— Kalisch & Partner`,translation:`MINUTES — tenants' meeting, 14 March

Item 2: signs will be mounted.
Resolution: unanimous.

Item 10: motion 'fountain in the courtyard'.
Vote: 6 in favour, 1 against, 1 abstention.
Resolution: passed. Implementation: spring.

Funding: donations (so far €412)
and the maintenance reserve.

Next meeting: autumn.
Motions again in writing, please.

— Kalisch & Partner`}]}],ds={episode:Zn,cast:Jn,items:qn,scenes:Yn},ls=Object.freeze(Object.defineProperty({__proto__:null,cast:Jn,default:ds,episode:Zn,items:qn,scenes:Yn},Symbol.toStringTag,{value:"Module"})),Qn={id:"b1e12",arcId:"B1",cefrLevel:"B1",title:"Der Flohmarkt",titleEn:"The flea market",blurb:"Keller geräumt, Tisch gemietet, Preise gehandelt: Auf dem Flohmarkt verkauft du dein erstes Leipziger Jahr an Fremde — und lernst, warum alles zu verschenken am schnellsten weggeht.",order:20,sceneIds:["b1e12s1","b1e12s2","b1e12s3"]},Xn=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"kunde",name:"Herr Gellert",role:"Stammkunde des Flohmarkts"}],ei=[{id:"der-keller",type:"word",german:"der Keller",meaning:"the basement / cellar",image:"treppenhaus",audio:"tts",introducedInScene:"b1e12s1",tags:["home"],cefrLevel:"B1",note:"der, Plural: die Keller — wo Dinge warten, die man „noch braucht“"},{id:"der-flohmarkt",type:"word",german:"der Flohmarkt",meaning:"the flea market",image:"stand",audio:"tts",introducedInScene:"b1e12s1",tags:["shopping","city"],cefrLevel:"B1",note:"der, Plural: die Flohmärkte — flohen? Flöhe? Egal: Schnäppchen"},{id:"verkaufen",type:"word",german:"verkaufen",meaning:"to sell",image:"geld",audio:"tts",introducedInScene:"b1e12s1",tags:["money","shopping"],cefrLevel:"B1",note:"verkaufen — Gegenteil: kaufen; der Verkauf"},{id:"der-karton",type:"word",german:"der Karton",meaning:"the (cardboard) box",image:"paket",audio:"tts",introducedInScene:"b1e12s1",tags:["objects","home"],cefrLevel:"B1",note:"der, Plural: die Kartons — aus dem Keller, in die Freiheit"},{id:"das-schnaeppchen",type:"word",german:"das Schnäppchen",meaning:"the bargain",image:"geld",audio:"tts",introducedInScene:"b1e12s1",tags:["shopping","money"],cefrLevel:"B1",note:"das, Plural: die Schnäppchen — Schnäppchen machen = Bargeld-Adrenalin"},{id:"die-schallplatte",type:"word",german:"die Schallplatte",meaning:"the vinyl record",image:"konzert",audio:"tts",introducedInScene:"b1e12s1",tags:["music","objects"],cefrLevel:"B1",note:"die, Plural: die Schallplatten — auf Flohmärkten: Gold"},{id:"feilschen",type:"word",german:"feilschen",meaning:"to haggle",image:"gespräch",audio:"tts",introducedInScene:"b1e12s2",tags:["shopping","money"],cefrLevel:"B1",note:"feilschen — um den Preis feilschen; Sportart am Flohmarkt"},{id:"der-stammkunde",type:"word",german:"der Stammkunde",meaning:"the regular customer",image:"person",audio:"tts",introducedInScene:"b1e12s2",tags:["shopping","people"],cefrLevel:"B1",note:"der, Plural: die Stammkunden — kommt früh, kennt alles, zahlt bar"},{id:"der-rabatt",type:"word",german:"der Rabatt",meaning:"the discount",image:"münzen",audio:"tts",introducedInScene:"b1e12s2",tags:["money","shopping"],cefrLevel:"B1",note:"der, Plural: die Rabatte — 20 % Rabatt; Rabatt geben"},{id:"das-geschirr",type:"word",german:"das Geschirr",meaning:"the dishes / crockery",image:"tisch",audio:"tts",introducedInScene:"b1e12s2",tags:["kitchen","objects"],cefrLevel:"B1",note:"das ( Singular ) — ein Geschirr, viele Teller"},{id:"um-platz-zu",type:"grammar_pattern",german:"Ich verkaufe alles, ___ Platz zu schaffen.",meaning:"I'm selling everything to make room.",image:"ziel",audio:"tts",introducedInScene:"b1e12s2",tags:["grammar","shopping"],cefrLevel:"B1",cloze:"um",speak:"Ich verkaufe alles, um Platz zu schaffen.",note:"um … zu + Infinitiv = Zweck (gleiches Subjekt!)"},{id:"der-erloes",type:"word",german:"der Erlös",meaning:"the proceeds",image:"münzen",audio:"tts",introducedInScene:"b1e12s3",tags:["money"],cefrLevel:"B1",note:"der, Plural: die Erlöse — was am Ende übrig bleibt"},{id:"die-reste",type:"word",german:"die Reste",meaning:"the leftovers / remains",image:"tüte",audio:"tts",introducedInScene:"b1e12s3",tags:["objects"],cefrLevel:"B1",note:"Plural: die Reste — vom Essen, vom Tag, vom Keller"},{id:"zu-verschenken",type:"chunk",german:"Zu verschenken!",meaning:"For free! (giving away)",image:"geschenk",audio:"tts",introducedInScene:"b1e12s3",tags:["shopping","community"],cefrLevel:"B1",speak:"Zu verschenken!",note:"das Zauberwort: weg ist es schneller als verkauft"},{id:"die-freude",type:"word",german:"die Freude",meaning:"the joy",image:"person",audio:"tts",introducedInScene:"b1e12s3",tags:["feelings"],cefrLevel:"B1",note:"die, Plural: die Freuden — Freude an etwas (Dativ)"},{id:"die-haelfte",type:"word",german:"die Hälfte",meaning:"the half",image:"kuchen",audio:"tts",introducedInScene:"b1e12s3",tags:["numbers"],cefrLevel:"B1",note:"die, Plural: die Hälften — die Hälfte von etwas"}],ti=[{id:"b1e12s1",episodeId:"b1e12",title:"Keller-Archäologie",titleEn:"Basement archaeology",place:"Keller, dann Wohnzimmer",bg:"treppenhaus",contextTags:["home","shopping","friends"],requiredItems:["der-koffer","die-zeitschrift"],introducedItems:["der-keller","der-flohmarkt","verkaufen","der-karton","das-schnaeppchen","die-schallplatte"],beats:[{type:"narration",text:"Dein Keller ist ein Museum deines ersten Jahres: der Koffer von der Ankunft, drei Kartons Zeug von Flohmärkten (Rückwanderung inklusive), und eine Zeitschriftensammlung, die Tobias „dein Archiv“ nennt."},{type:"line",speaker:"tobias",text:"Sam. Am Samstag ist Flohmarkt am Jugendclub. Wir verkaufen. …Nicht, weil du arm bist — weil Platz auch Wohlstand ist. Und weil dein Keller langsam eine zweite Wohnung ist. Mit Mietpreis.",translation:"Sam. There's a flea market at the youth club on Saturday. We're selling. …Not because you're broke — because space is also wealth. And because your basement is slowly becoming a second flat. With rent."},{type:"meet",itemIds:["der-keller","der-flohmarkt","verkaufen"]},{type:"meet",itemIds:["der-karton","das-schnaeppchen","die-schallplatte"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias hält eine Schallplatte hoch: DDR-Schlager, 1978.",options:[{label:"Verkaufen. Schnäppchenjäger lieben das.",line:"Verkaufen! Schnäppchenjäger lieben genau das. …Tobias: „Kleinanzeigen-Preis: drei Euro. Am Markt: Zehn.
