"fotografieren — im Zoo: meistens ja!"},{id:"die-giraffe",type:"word",german:"die Giraffe",meaning:"the giraffe",image:"pfote",audio:"tts",introducedInScene:"a1e10s2",tags:["animals"],cefrLevel:"A1",note:"die, Plural: die Giraffen — der Hals!"},{id:"der-loewe",type:"word",german:"der Löwe",meaning:"the lion",image:"pfote",audio:"tts",introducedInScene:"a1e10s2",tags:["animals"],cefrLevel:"A1",note:"der, Plural: die Löwen"},{id:"das-kind",type:"word",german:"das Kind",meaning:"the child",image:"person",audio:"tts",introducedInScene:"a1e10s2",tags:["people","family"],cefrLevel:"A1",note:"das, Plural: die Kinder"},{id:"die-tierpflegerin",type:"word",german:"die Tierpflegerin",meaning:"the (female) zookeeper",image:"person",audio:"tts",introducedInScene:"a1e10s2",tags:["animals","work","people"],cefrLevel:"A1",note:"die, Plural: die Tierpflegerinnen; männlich: der Tierpfleger"},{id:"fuettern",type:"word",german:"füttern",meaning:"to feed (an animal)",image:"korb",audio:"tts",introducedInScene:"a1e10s2",tags:["animals"],cefrLevel:"A1",note:"füttern — im Zoo: BITTE NICHT FÜTTERN!"},{id:"den-affen",type:"grammar_pattern",german:"___ Affen finde ich am lustigsten.",meaning:"I find the monkeys the funniest.",image:"gespräch",audio:"tts",introducedInScene:"a1e10s2",tags:["grammar","animals"],cefrLevel:"A1",cloze:"Den",speak:"Den Affen finde ich am lustigsten.",note:"Akkusativ: der → den. Das Objekt bekommt den."},{id:"der-regenwald",type:"word",german:"der Regenwald",meaning:"the rainforest",image:"blumen",audio:"tts",introducedInScene:"a1e10s3",tags:["nature","animals"],cefrLevel:"A1",note:"der, Plural: die Regenwälder — Gondwanaland heißt dich willkommen"},{id:"der-eisbaer",type:"word",german:"der Eisbär",meaning:"the polar bear",image:"pfote",audio:"tts",introducedInScene:"a1e10s3",tags:["animals"],cefrLevel:"A1",note:"der, Plural: die Eisbären"},{id:"das-erlebnis",type:"word",german:"das Erlebnis",meaning:"the experience",image:"heimat",audio:"tts",introducedInScene:"a1e10s3",tags:["feelings","leisure"],cefrLevel:"A1",note:"das, Plural: die Erlebnisse — ein schönes Erlebnis"},{id:"der-geschenkeladen",type:"word",german:"der Geschenkeladen",meaning:"the gift shop",image:"geschenk",audio:"tts",introducedInScene:"a1e10s3",tags:["shopping","gifts"],cefrLevel:"A1",note:"der, Plural: die Geschenkeläden — am Ausgang, natürlich"},{id:"die-erklaerungstafel",type:"word",german:"die Erklärungstafel",meaning:"the information board",image:"formular",audio:"tts",introducedInScene:"a1e10s3",tags:["learning","signs"],cefrLevel:"A1",note:"die, Plural: die Erklärungstafeln — leselern-Paradies"},{id:"der-ausgang",type:"word",german:"der Ausgang",meaning:"the exit",image:"haus",audio:"tts",introducedInScene:"a1e10s3",tags:["city","signs"],cefrLevel:"A1",note:"der, Plural: die Ausgänge — Gegenteil: der Eingang"}],qe=[{id:"a1e10s1",episodeId:"a1e10",title:"Sonnenaufgang im Zoo",titleEn:"Sunrise at the zoo",place:"Zoo Leipzig, Haupteingang",bg:"park",contextTags:["leisure","animals","friends"],requiredItems:["der-sonntag","das-wetter"],introducedItems:["der-zoo","das-tier","der-elefant","der-affe","die-kamera","fotografieren"],beats:[{type:"narration",text:"Sonntag, halb neun. Tobias steht vor deiner Tür mit einem Rucksack und einem Kind. Das Kind heißt Lina, ist acht, und hat bereits den kompletten Zoo-Plan auswendig gelernt."},{type:"line",speaker:"lina",text:"Du bist der Neue aus dem ersten Stock! Ich bin Lina. …Zooplan: erst Elefanten, dann Affen, dann Löwen, dann Mittagessen, dann Eisbär. Der Regenwald ist am Ende, weil man da lange braucht. Klar?",translation:"You're the new one from the second floor! I'm Lina. …Zoo plan: first elephants, then monkeys, then lions, then lunch, then polar bear. The rainforest is at the end because it takes a long time. Clear?"},{type:"meet",itemIds:["der-zoo","das-tier","der-elefant"]},{type:"meet",itemIds:["der-affe","die-kamera","fotografieren"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Lina hält die Kamera in deine Richtung.",options:[{label:"Darf ich fotografieren? …Von dir und Onkel Tobias.",line:"Darf ich fotografieren? …Von dir und Onkel Tobias. …Tobias: „ONKEL? Seit wann bin ich Onkel?“"},{label:"Lina macht den Plan. Ich mache die Fotos. Team.",line:"Lina macht den Plan, ich mache die Fotos. Team Zoo. …Lina: „Bestes Team. Auf geht's!“"}]},{type:"line",speaker:"tobias",text:"Warnung: Lina kennt jedes Tier auf Deutsch UND Latein. Wenn sie anfängt, nick einfach. …Und das Wetter ist perfekt — die Tiere sind heute draußen. Alle. Sogar der Faule.",translation:"Warning: Lina knows every animal in German AND Latin. When she gets going, just nod. …And the weather is perfect — the animals are outside today. All of them. Even the lazy one."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Schild am Haupteingang",text:`ZOO LEIPZIG

Öffnungszeiten: 9:00 – 18:00

Erwachsene:        21,00 €
Kinder (6–15):     14,00 €
Kinder unter 6:    frei

BITTE NICHT FÜTTERN!

Gondwanaland: Einlass bis 16:30

Wir wünschen einen schönen Tag
mit über 850 Tierarten.`,translation:`LEIPZIG ZOO

Opening hours: 9 am – 6 pm

Adults:            €21.00
Children (6–15):   €14.00
Children under 6:  free

PLEASE DO NOT FEED THE ANIMALS!

Gondwanaland: entry until 4:30 pm

We wish you a lovely day
with over 850 species.`}]},{id:"a1e10s2",episodeId:"a1e10",title:"Linas Unterricht",titleEn:"Lina's class",place:"Affenhaus, dann Löwen-Anlage",bg:"park",contextTags:["animals","learning","friends"],requiredItems:["die-limo","die-decke"],introducedItems:["die-giraffe","der-loewe","das-kind","die-tierpflegerin","fuettern","den-affen"],beats:[{type:"narration",text:"Im Affenhaus passiert es: Ein junger Affe klaut Linas Limo-Halterung und trägt sie wie eine Trophäe durch das Gehege. Lina schreit vor Begeisterung. Du schreitest vor Erkenntnis: „DEN Affen“ — du hast es gerade benutzt, ohne es zu wissen."},{type:"line",speaker:"lina",text:"DEN Affen finde ich am lustigsten! Hast du das gehört, Onkel Tobias? Sam hat es RICHTIG gesagt! …Also: Den Affen. Den Elefanten. Der Affe macht was → den Affen sehe ich. Der macht, den sehe ich. Kapiert?",translation:"I find the monkeys the funniest! Did you hear that, Uncle Tobias? Sam said it RIGHT! …So: the monkeys (accusative). The monkey does something → I see the monkey (accusative). Nominative does, accusative gets seen. Got it?"},{type:"meet",itemIds:["den-affen","die-giraffe","der-loewe"]},{type:"line",speaker:"tobias",text:"Sie hat dir in vierzig Sekunden beigebracht, wofür meine Grammatikbücher zwei Kapitel brauchen. …Und da vorne: Giraffen. Der Hals ist echt. Kein Effekt. Ich hab nachgefragt.",translation:"She taught you in forty seconds what my grammar books need two chapters for. …And over there: giraffes. The neck is real. No trick photography. I checked."},{type:"meet",itemIds:["das-kind","die-tierpflegerin","fuettern"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Eine Tierpflegerin kommt mit einem Eimer vorbei. Lina zieht dich am Ärmel.",options:[{label:"Entschuldigung — darf ich eine Frage zur Fütterung stellen?",line:"Entschuldigung — darf ich eine Frage zur Fütterung stellen? …Sie darf. Und sie antwortet zwanzig Minuten. Lina: „BESTE TAG.“"},{label:"Lina, frag du. Du kennst dich besser aus.",line:"Lina, du fragst — du kennst dich besser aus. …Lina fragt. Lina kennt sich aus. Lina redet noch, als ihr längst bei den Löwen seid."}]},{type:"line",speaker:"tobias",text:"„Bitte nicht füttern“ — und trotzdem hat der Affe die Limo-Halterung. …Merke: Regeln im Zoo gelten für Gäste, nicht für Bewohner. Wie im realen Leben auch, wenn ich ehrlich bin.",translation:"'Please do not feed' — and yet the monkey got the lemonade holder. …Note: zoo rules apply to guests, not to residents. Same in real life, honestly."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Tafel: Fütterungszeiten",text:`FÜTTERUNG (BITTE ZUSCHAUEN, NICHT HELFEN):

Giraffen   11:00 & 15:00
Löwen      14:30 (lahm-Schauen inklusive)
Affen      immer. Wirklich. Immer.

Fragen? Die Tierpflegerin steht nach jeder
Fütterung bereit. Kinder zuerst. Erwachsene:
auch. (Kind im Herzen zählt.)`,translation:`FEEDING TIMES (please watch, don't help):

Giraffes   11 am & 3 pm
Lions      2:30 pm (lazy-watching included)
Monkeys    always. Really. Always.

Questions? The zookeeper is available after every
feeding. Children first. Adults:
too. (Inner child counts.)`,itemIds:["die-tierpflegerin","fuettern","die-giraffe"]}]},{id:"a1e10s3",episodeId:"a1e10",title:"Gondwanaland",titleEn:"Gondwanaland",place:"Gondwanaland, Regenwaldhalle",bg:"park",contextTags:["animals","nature","friends"],requiredItems:["die-kamera","die-limo"],introducedItems:["der-regenwald","der-eisbaer","das-erlebnis","der-geschenkeladen","die-erklaerungstafel","der-ausgang"],beats:[{type:"narration",text:"Gondwanaland: eine Halle so groß wie ein Dorf, 24 Grad, Luftfeuchtigkeit von einem anderen Kontinent. Irgendwo tropft es. Lina hat den Plan bereits dreimal angepasst. Aktuell: alles."},{type:"line",speaker:"lina",text:"Das ist der Regenwald! Nur drinnen! Mit Dach! …Und gleich kommen wir zu den Riesentauben und dann zur Brücke und dann… Onkel Tobias, der Eisbär ist NICHT hier. Der ist draußen. Mach den Plan nicht kaputt.",translation:"This is the rainforest! Just indoors! With a roof! …And soon we'll get to the giant pigeons and then the bridge and then… Uncle Tobias, the polar bear is NOT here. It's outside. Don't ruin the plan."},{type:"meet",itemIds:["der-regenwald","der-eisbaer","das-erlebnis"]},{type:"meet",itemIds:["die-erklaerungstafel","der-geschenkeladen","der-ausgang"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Ausgang naht. Der Geschenkeladen auch.",options:[{label:"Ein Plüschielefant. Als Erinnerung. Es gibt keine Diskussion.",line:"Ein Plüschielefant, als Erinnerung. Es gibt keine Diskussion. …Lina: „ZWEI. Einer für mich.“"},{label:"Nur eine Postkarte? …Zehn Postkarten.",line:"Nur eine Postkarte? …Zehn Postkarten. Alle bekommen Post. Der Zoo schreibt mit."}]},{type:"line",speaker:"tobias",text:"Sam, lass mal kurz festhalten: Vor einem Monat konntest du nicht mal „Entschuldigung“ sagen. Heute liest du Erklärungstafeln vor, und Lina korrigiert deinen Akkusativ. …Das ist ein Erlebnis. Ich dokumentiere das.",translation:"Sam, let's pause for a second: a month ago you couldn't even say 'Entschuldigung'. Today you're reading information boards out loud, and Lina corrects your accusative. …That's an experience. I'm documenting it."},{type:"check",count:2,mode:"recall"},{type:"narration",text:"Draußen: Die Sonne steht tief, Lina schläft im Rucksack-Trott ein, Tobias trägt sie und den Plüschielefanten. Am Ausgang drehst du dich noch einmal um. Der Zoo, der Regenwald, der Tag — alles wird im Kopf abgelegt unter: Erlebnis. Mehrzahl folgt sicher."}]}],da={episode:Ve,cast:Ze,items:Je,scenes:qe},la=Object.freeze(Object.defineProperty({__proto__:null,cast:Ze,default:da,episode:Ve,items:Je,scenes:qe},Symbol.toStringTag,{value:"Module"})),Ye={id:"a1e11",arcId:"A1",cefrLevel:"A1",title:"Das Museum",titleEn:"The museum",blurb:"Regentag, und Mei zieht dich ins Museum der bildenden Künste. Bilder, Farben, ein Wächter mit Meinungen — und die wichtigste Frage für Sprachlernende: „Was bedeutet das?“",order:11,sceneIds:["a1e11s1","a1e11s2","a1e11s3"]},Qe=[{id:"mei",name:"Mei",role:"Kollegin im Café"},{id:"pauly",name:"Herr Pauly",role:"Aufseher im Museum"}],Xe=[{id:"das-museum",type:"word",german:"das Museum",meaning:"the museum",image:"museum",audio:"tts",introducedInScene:"a1e11s1",tags:["culture","city","leisure"],cefrLevel:"A1",note:"das, Plural: die Museen — Leipzig hat viele"},{id:"der-eingang",type:"word",german:"der Eingang",meaning:"the entrance",image:"haus",audio:"tts",introducedInScene:"a1e11s1",tags:["city","signs"],cefrLevel:"A1",note:"der, Plural: die Eingänge — Gegenteil: der Ausgang"},{id:"die-fuehrung",type:"word",german:"die Führung",meaning:"the guided tour",image:"person",audio:"tts",introducedInScene:"a1e11s1",tags:["culture","learning"],cefrLevel:"A1",note:"die, Plural: die Führungen — an Sonntagen oft gratis"},{id:"der-audioguide",type:"word",german:"der Audioguide",meaning:"the audio guide",image:"laut",audio:"tts",introducedInScene:"a1e11s1",tags:["culture","technology"],cefrLevel:"A1",note:"der, Plural: die Audioguides — Nummer eintippen, lauschen"},{id:"das-obergeschoss",type:"word",german:"das Obergeschoss",meaning:"the upper floor",image:"treppenhaus",audio:"tts",introducedInScene:"a1e11s1",tags:["city","home"],cefrLevel:"A1",note:"das, Plural: die Obergeschosse — unten: das Erdgeschoss"},{id:"was-bedeutet",type:"grammar_pattern",german:"Was ___ „abstrakt“?",meaning:"What does 'abstract' mean?",image:"gespräch",audio:"tts",introducedInScene:"a1e11s1",tags:["grammar","questions","learning"],cefrLevel:"A1",cloze:"bedeutet",speak:"Was bedeutet „abstrakt“?",note:"Was bedeutet …? — die wichtigste Frage im Museum (und überall)"},{id:"das-gemaelde",type:"word",german:"das Gemälde",meaning:"the painting",image:"palette",audio:"tts",introducedInScene:"a1e11s2",tags:["culture","art"],cefrLevel:"A1",note:"das, Plural: die Gemälde — hängt an der Wand"},{id:"die-farbe",type:"word",german:"die Farbe",meaning:"the color / paint",image:"palette",audio:"tts",introducedInScene:"a1e11s2",tags:["art","home"],cefrLevel:"A1",note:"die, Plural: die Farben — bunt = many colors"},{id:"der-maler",type:"word",german:"der Maler",meaning:"the painter",image:"palette",audio:"tts",introducedInScene:"a1e11s2",tags:["art","work"],cefrLevel:"A1",note:"der, Plural: die Maler; weiblich: die Malerin"},{id:"modern",type:"word",german:"modern",meaning:"modern",image:"idee",audio:"tts",introducedInScene:"a1e11s2",tags:["art","opinion"],cefrLevel:"A1",note:"Adjektiv — nicht verwechseln mit „der Modus“"},{id:"das-kunstwerk",type:"word",german:"das Kunstwerk",meaning:"the (work of) art",image:"museum",audio:"tts",introducedInScene:"a1e11s2",tags:["culture","art"],cefrLevel:"A1",note:"das, Plural: die Kunstwerke"},{id:"die-erklaerung",type:"word",german:"die Erklärung",meaning:"the explanation",image:"buch",audio:"tts",introducedInScene:"a1e11s2",tags:["learning","culture"],cefrLevel:"A1",note:"die, Plural: die Erklärungen — neben jedem Bild"},{id:"das-original",type:"word",german:"das Original",meaning:"the original",image:"prüfen",audio:"tts",introducedInScene:"a1e11s3",tags:["art","culture"],cefrLevel:"A1",note:"das, Plural: die Originale — das echte Ding!"},{id:"die-postkarte",type:"word",german:"die Postkarte",meaning:"the postcard",image:"brief",audio:"tts",introducedInScene:"a1e11s3",tags:["media","gifts"],cefrLevel:"A1",note:"die, Plural: die Postkarten — 65 Cent, weltpostfähig"},{id:"das-stillleben",type:"word",german:"das Stillleben",meaning:"the still life (painting)",image:"palette",audio:"tts",introducedInScene:"a1e11s3",tags:["art"],cefrLevel:"A1",note:"das, Plural: die Stillleben — Blumen, Obst, Totenkopf, optional"},{id:"die-inspiration",type:"word",german:"die Inspiration",meaning:"the inspiration",image:"idee",audio:"tts",introducedInScene:"a1e11s3",tags:["art","feelings"],cefrLevel:"A1",note:"die ( Singular ) — von lateinisch inspirare: einatmen"},{id:"die-dauer",type:"word",german:"die Dauer",meaning:"the duration",image:"urehr",audio:"tts",introducedInScene:"a1e11s3",tags:["time"],cefrLevel:"A1",note:"die ( Singular ) — die Dauer des Regens: endlos"},{id:"der-eindruck",type:"word",german:"der Eindruck",meaning:"the impression",image:"person",audio:"tts",introducedInScene:"a1e11s3",tags:["opinion","feelings"],cefrLevel:"A1",note:"der, Plural: die Eindrücke — einen guten Eindruck machen"}],et=[{id:"a1e11s1",episodeId:"a1e11",title:"Der Regentag",titleEn:"The rainy day",place:"Museum der bildenden Künste, Sachsenplatz",bg:"strasse",contextTags:["culture","city","friends"],requiredItems:["die-zeitschrift","der-kaffee"],introducedItems:["das-museum","der-eingang","die-fuehrung","der-audioguide","das-obergeschoss","was-bedeutet"],beats:[{type:"narration",text:"Es regnet seit dem Frühstück, und der Regen hat Pläne: den ganzen Tag. Mei steht mit einem Schirm und einer Zeitschrift vor deiner Tür — dein Museumsklimbim: „Café-Luise-Pausen-Highlight: das Museum um die Ecke.“"},{type:"line",speaker:"mei",text:"Regen = Museums-Wetter. Das ist das Gesetz. …Kostenlos rein, alles anschauen, oben im Café heiße Schokolade. Und wenn du etwas nicht verstehst — frag mich. Frag anything. …Das ist heute dein Deutsch-Tagesziel: Fragen stellen.",translation:"Rain = museum weather. That's the law. …Free entry, look at everything, hot chocolate upstairs in the café. And if you don't understand something — ask me. Ask anything. …That's your German goal today: asking questions."},{type:"meet",itemIds:["das-museum","der-eingang","die-fuehrung"]},{type:"meet",itemIds:["der-audioguide","das-obergeschoss","was-bedeutet"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Die Kassenfrau reicht dir einen Audioguide. Auf dem Display steht „1 = Deutsch, 2 = English“.",options:[{label:"Eins. Deutsch. Ich fische mit dem Netz, das ich baue.",line:"Eins — Deutsch. Ich fische mit dem Netz, das ich gerade baue. …„Poetisch“, sagt Mei. „Und richtig.“"},{label:"Erst eins. Wenn ich nicht mehr kann: zwei.",line:"Erst eins, Deutsch. Und wenn ich nicht mehr kann, wechsle ich auf zwei. …Mei: „Deal. Schokolade danach.“"}]},{type:"line",speaker:"pauly",text:"(am Aufzug) Nach oben? Obergeschoss, moderne Kunst. …Junge Leute wollen immer direkt nach oben. Erst die alten Bilder, dann die neuen — so ist die Reihenfolge des Denkens. …Ach, fragt nur, wenn ihr was nicht versteht.",translation:"(at the lift) Going up? Upper floor, modern art. …Young people always want to go straight up. Old paintings first, then the new ones — that's the order of thinking. …Anyway, just ask if you don't understand something."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Kastentext am Eingang",text:`MUSEUM DER BILDENDEN KÜNSTE

Di–So 10–18 · Do bis 20 · Mo geschlossen

FÜHRUNG: So 11:00 (deutsch) · 15:00 (einfache Sprache)
AUDIOGUIDE: 2 € · am Tresen, mit Nummern

Obergeschoss: Moderne. Erdgeschoss: Alte Meister.

»Was bedeutet das Bild?
 Die richtige Antwort ist die deine.«`,translation:`MUSEUM OF FINE ARTS

Tue–Sun 10–6 · Thu till 8 · Mon closed

TOUR: Sun 11 am (German) · 3 pm (simple language)
AUDIO GUIDE: €2 · at the desk, with numbers

Upper floor: modern art. Ground floor: old masters.

'What does the painting mean?
The right answer is yours.'`,itemIds:["die-fuehrung","der-audioguide","der-eingang"]}]},{id:"a1e11s2",episodeId:"a1e11",title:"Bilder und Fragen",titleEn:"Paintings and questions",place:"1. Obergeschoss, Moderne",bg:"buero",contextTags:["culture","art","learning"],requiredItems:["der-audioguide","die-fuehrung"],introducedItems:["das-gemaelde","die-farbe","der-maler","modern","das-kunstwerk","die-erklaerung"],beats:[{type:"narration",text:"Moderne Kunst: ein Gemälde, das aussieht wie ein Streit zwischen Rot und Blau. Mei steht davor, verschränkt die Arme und nickt langsam. So nicken Menschen, die verstehen. Oder so tun."},{type:"line",speaker:"mei",text:"Ok. Was siehst du? …Nicht „ein rotes Durcheinander“. Beschreib: Farben, Formen, Gefühle. …Kunst im Museum ist wie Deutsch: Es gibt keine einzige richtige Antwort. Es gibt nur deine.",translation:"OK. What do you see? …Not 'a red mess'. Describe: colors, shapes, feelings. …Art in a museum is like German: there's no single right answer. There's only yours."},{type:"meet",itemIds:["das-gemaelde","die-farbe","modern"]},{type:"meet",itemIds:["der-maler","das-kunstwerk","die-erklaerung"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mei zeigt auf die Erklärungstafel. „Und was steht da?“",options:[{label:"Ich verstehe die Hälfte. Die Hälfte reicht für heute.",line:"Ich verstehe die Hälfte. Und die Hälfte reicht für heute. Die andere Hälfte kommt beim nächsten Regen."},{label:"Was bedeutet „Abstrakt“ genau? Ich frage den Herrn.",line:"Was bedeutet „abstrakt“ genau? Ich frage den Herrn mit der Brille. …Er freut sich. Wirklich."}]},{type:"line",speaker:"pauly",text:"„Abstrakt“ heißt: ohne echtes Vorbild. Der Maler malt nicht, WAS er sieht — sondern was er fühlt. …Verstehen Sie das nicht? Perfekt. Dann sind Sie ehrlich. Kunst ist geduldig, und Museen sind kostenlos am Sonntag.",translation:"'Abstract' means: without a real model. The painter doesn't paint WHAT he sees — but what he feels. …You don't understand it? Perfect. Then you're honest. Art is patient, and museums are free on Sundays."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Wandtext im Obergeschoss",text:`ABSTRAKT UND KONKRET
Malerei nach 1945

»Ein Bild muss nicht zeigen, was es gibt.
Es kann zeigen, was es bedeutet.«

Die Farben hier sind keine Gegenstände.
Sie sind Nachrichten.
Lesen Sie langsam. Sie dürfen raten.`,translation:`ABSTRACT AND CONCRETE
Painting after 1945

'A painting doesn't have to show what exists.
It can show what it means.'

The colors here are not objects.
They are messages.
Read slowly. You're allowed to guess.`}]},{id:"a1e11s3",episodeId:"a1e11",title:"Die Postkarte",titleEn:"The postcard",place:"Museumscafé, Obergeschoss",bg:"cafe",contextTags:["culture","friends","food"],requiredItems:["der-kuchen","das-geschenk"],introducedItems:["das-original","die-postkarte","das-stillleben","die-inspiration","die-dauer","der-eindruck"],beats:[{type:"narration",text:"Museumscafé: heiße Schokolade, Kuchen, Regenfenster. Auf dem Tisch liegt dein erster Museums-Eindruck — und im Rucksack klimpert eine Tüte Postkarten aus dem Shop."},{type:"line",speaker:"mei",text:"Und? Der Eindruck heute? …Siehst du: „Eindruck machen“ geht auch ohne Perfektion. Du hast heute gefragt, beschrieben, gelesen — das war mehr Deutsch als manche Unterrichtsstunde.",translation:"So? Today's impression? …See: 'making an impression' works without perfection too. Today you asked, described, read — that was more German than some whole lessons."},{type:"meet",itemIds:["der-eindruck","die-inspiration","die-dauer"]},{type:"meet",itemIds:["das-original","die-postkarte","das-stillleben"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mei schiebt dir eine Postkarte und einen Stift hin.",options:[{label:'Ich schreibe an Frau Brügge: „Danke für die Kanne. KommeSonntag."',line:"Ich schreibe an Frau Brügge: „Danke für die Kanne. Komme Sonntag vorbei. Sam.“ …Kunst als Geschenk. Klassiker."},{label:"Ich schreibe eine ans Café — an alle gleichzeitig.",line:"Ich schreibe eine ans Café, an alle gleichzeitig. …Sie hängt sie an. Direkt neben den Kuchen-Preisen."}]},{type:"line",speaker:"mei",text:"Weißt du, was ein Stillleben ist? Blumen, Obst, Anfang vom Leben — und daneben dann die Zeit, die alles isst. …So fühlt sich Deutschlernen auch an, manchmal: schön, und die Dauer ist länger als gedacht. Aber es isst dich nicht. Es füttert dich.",translation:"You know what a still life is? Flowers, fruit, the start of life — and next to it, time, which eats everything. …That's what learning German feels like sometimes: beautiful, and it takes longer than expected. But it doesn't eat you. It feeds you."},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Der Regen hört pünktlich zum Schließen auf. Im Ausgang drehst du dich um: Original, Gemälde, Farben, Eindruck — vier Wörter mehr im Kopf als am Morgen. Mei kauft noch schnell zwei Postkarten. Für den nächsten Regentag. Den gibt es in Leipzig sicher."}]}],ca={episode:Ye,cast:Qe,items:Xe,scenes:et},ha=Object.freeze(Object.defineProperty({__proto__:null,cast:Qe,default:ca,episode:Ye,items:Xe,scenes:et},Symbol.toStringTag,{value:"Module"})),tt={id:"a1e12",arcId:"A1",cefrLevel:"A1",title:"Im Kino",titleEn:"At the cinema",blurb:"Regen draußen, Popcorn drin: Tobias und Lina nehmen Sam mit ins Kino. Ein Film auf Deutsch — mit Leinwand, Helden und einem Ende, über das alle reden.",order:12,sceneIds:["a1e12s1","a1e12s2","a1e12s3"]},nt=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"lina",name:"Lina",role:"Tobias' Cousine, 8 Jahre"}],it=[{id:"das-kino",type:"word",german:"das Kino",meaning:"the cinema",image:"kino",audio:"tts",introducedInScene:"a1e12s1",tags:["culture","leisure","city"],cefrLevel:"A1",note:"das, Plural: die Kinos — wir gehen INS Kino"},{id:"der-film",type:"word",german:"der Film",meaning:"the film / movie",image:"kamera",audio:"tts",introducedInScene:"a1e12s1",tags:["culture","leisure"],cefrLevel:"A1",note:"der, Plural: die Filme — der Film läuft = it's showing"},{id:"die-eintrittskarte",type:"word",german:"die Eintrittskarte",meaning:"the (entry) ticket",image:"kino",audio:"tts",introducedInScene:"a1e12s1",tags:["culture","money"],cefrLevel:"A1",note:"die, Plural: die Eintrittskarten — Platz 7, Reihe 3"},{id:"das-popcorn",type:"word",german:"das Popcorn",meaning:"the popcorn",image:"popcorn",audio:"tts",introducedInScene:"a1e12s1",tags:["food","leisure"],cefrLevel:"A1",note:"das ( Singular ) — süß oder gesalzen: DIE Frage"},{id:"der-titel",type:"word",german:"der Titel",meaning:"the title",image:"kino",audio:"tts",introducedInScene:"a1e12s1",tags:["culture","media"],cefrLevel:"A1",note:"der, Plural: die Titel — Film, Buch, Lied"},{id:"ins-kino",type:"grammar_pattern",german:"Wir gehen ___ Kino.",meaning:"We're going to the cinema.",image:"ziel",audio:"tts",introducedInScene:"a1e12s1",tags:["grammar","culture"],cefrLevel:"A1",cloze:"ins",speak:"Wir gehen ins Kino.",note:"in + das = ins (Wohin?); im Kino = Wo? (Dativ)"},{id:"die-leinwand",type:"word",german:"die Leinwand",meaning:"the (cinema) screen",image:"kino",audio:"tts",introducedInScene:"a1e12s2",tags:["culture"],cefrLevel:"A1",note:"die, Plural: die Leinwände — groß wie ein Haus"},{id:"leise",type:"word",german:"leise",meaning:"quiet(ly)",image:"laut",audio:"tts",introducedInScene:"a1e12s2",tags:["opinion","rules"],cefrLevel:"A1",note:"Adjektiv/Adverb — das Gegenteil von laut"},{id:"spannend",type:"word",german:"spannend",meaning:"exciting / suspenseful",image:"prüfen",audio:"tts",introducedInScene:"a1e12s2",tags:["opinion","culture"],cefrLevel:"A1",note:"Adjektiv — der Film ist spannend!"},{id:"die-unterhaltung",type:"word",german:"die Unterhaltung",meaning:"the entertainment / conversation",image:"gespräch",audio:"tts",introducedInScene:"a1e12s2",tags:["culture","people"],cefrLevel:"A1",note:"die, Plural: die Unterhaltungen — sich unterhalten"},{id:"der-held",type:"word",german:"der Held",meaning:"the hero",image:"person",audio:"tts",introducedInScene:"a1e12s2",tags:["culture","people"],cefrLevel:"A1",note:"der, Plural: die Helden — Achtung: der Held, DEN HeldEN"},{id:"die-szene",type:"word",german:"die Szene",meaning:"the scene",image:"konzert",audio:"tts",introducedInScene:"a1e12s2",tags:["culture","media"],cefrLevel:"A1",note:"die, Plural: die Szenen — auch: die Szene = neighbourhood"},{id:"das-ende",type:"word",german:"das Ende",meaning:"the end",image:"zukunft",audio:"tts",introducedInScene:"a1e12s3",tags:["time","culture"],cefrLevel:"A1",note:"das, Plural: die Enden — am Ende; zu Ende sein"},{id:"weinen",type:"word",german:"weinen",meaning:"to cry",image:"person",audio:"tts",introducedInScene:"a1e12s3",tags:["feelings"],cefrLevel:"A1",note:"weinen — die Tränen (Plural); lachen ↔ weinen"},{id:"danach",type:"word",german:"danach",meaning:"afterwards",image:"zukunft",audio:"tts",introducedInScene:"a1e12s3",tags:["time"],cefrLevel:"A1",note:"Adverb — erst das Kino, danach der Spaziergang"},{id:"die-werbung",type:"word",german:"die Werbung",meaning:"the advertising / ads",image:"brief",audio:"tts",introducedInScene:"a1e12s3",tags:["media","culture"],cefrLevel:"A1",note:"die ( Singular ) — vor dem Film: 20 Minuten Werbung"},{id:"der-spaziergang",type:"word",german:"der Spaziergang",meaning:"the walk / stroll",image:"ziel",audio:"tts",introducedInScene:"a1e12s3",tags:["leisure","nature"],cefrLevel:"A1",note:"der, Plural: die Spaziergänge — einen Spaziergang machen"},{id:"die-diskussion",type:"word",german:"die Diskussion",meaning:"the discussion",image:"gespräch",audio:"tts",introducedInScene:"a1e12s3",tags:["people","opinion"],cefrLevel:"A1",note:"die, Plural: die Diskussionen — über den Film diskutieren"}],rt=[{id:"a1e12s1",episodeId:"a1e12",title:"Drei Karten",titleEn:"Three tickets",place:"Kino Cineding, Karl-Liebknecht-Straße",bg:"laden",contextTags:["culture","leisure","friends"],requiredItems:["der-sonntag","die-vorfreude"],introducedItems:["das-kino","der-film","die-eintrittskarte","das-popcorn","der-titel","ins-kino"],beats:[{type:"narration",text:"Es regnet (natürlich), und Tobias hat drei Karten für den Nachmittag: „Ein deutscher Film. Über einen Mann, der einen Zug verpasst und sein Leben findet.“ Lina ist dabei, weil es Popcorn gibt."},{type:"line",speaker:"tobias",text:"Heute gehen wir ins Kino — ins Deutsche Kino! Keine Sorge: Der Titel klingt kompliziert, aber der Film hatUntertitel für Gefühle. …Scherz. Du verstehst mehr als du denkst. Und sonst: Popcorn-Kurs danach.",translation:"Today we're going to the cinema — German cinema! Don't worry: the title sounds complicated, but the film has subtitles for feelings. …Just kidding. You'll understand more than you think. And otherwise: popcorn course afterwards."},{type:"meet",itemIds:["das-kino","der-film","der-titel"]},{type:"meet",itemIds:["die-eintrittskarte","das-popcorn","ins-kino"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"An der Kasse: „Süßes oder gesalzenes Popcorn?“",options:[{label:"Gesalzen, bitte. Ich bin jetzt ein deutscher Kinogänger.",line:"Gesalzen, bitte. Ich bin jetzt offiziell deutscher Kinogänger. …Lina: „FALSCH. Süß ist besser. Aber respektiert.“"},{label:"Süß. Lina hat recht und sie weiß es.",line:"Süß. Lina hat recht, und sie weiß es auch. …Lina: „ENDLICH sagt das mal jemand!“"}]},{type:"check",count:2,mode:"recall"},{type:"line",speaker:"lina",text:"Regeln im Kino: leise sein, Popcorn teilen (mit MIR), und wenn der Held fällt, darfst du „oooh“ sagen. Das ist erlaubt. Ich habe das geprüft.",translation:"Cinema rules: be quiet, share popcorn (with ME), and when the hero falls, you may say 'oooh'. That's allowed. I checked."},{type:"reading",title:"Programm – Kino Cineding",text:`HEUTE 17:00 · „Der zweite Zug“ (OF, 96 Min.)
Ein Mann, ein Gleis, ein neues Leben.

17:15 · „Winterlicht“ (OmU)
20:00 · Klassiker: „Leipzig, August“

Karten: 9 € / erm. 6,50 €
Popcorn: süß oder gesalzen. ALLE Fragen.
Es gibt nur zwei Lager. Wähle weise.`,translation:`TODAY 5 pm · 'The Second Train' (original German, 96 min)
A man, a platform, a new life.

5:15 pm · 'Winterlight' (subtitled)
8 pm · Classic: 'Leipzig, August'

Tickets: €9 / reduced €6.50
Popcorn: sweet or salty. EVERYONE asks.
There are only two camps. Choose wisely.`,itemIds:["das-kino","der-film","der-titel"]}]},{id:"a1e12s2",episodeId:"a1e12",title:"Die Leinwand",titleEn:"The big screen",place:"Saal 2, Reihe 3, Platz 5–7",bg:"buehne",contextTags:["culture","leisure","friends"],requiredItems:["lecker","die-limo"],introducedItems:["die-leinwand","leise","spannend","die-unterhaltung","der-held","die-szene"],beats:[{type:"narration",text:"Zwanzig Minuten Werbung, dann: Licht aus. Die Leinwand ist riesig, der Mann im Film verpasst seinen Zug, und du verstehst … Sätze. Ganze. Wirklich ganze Sätze."},{type:"line",speaker:"tobias",text:"(flüstert) Verstehst du was? …NEIN, warte, nicht jetzt, die Szene ist spannend — …(fünf Minuten später) Also? …(du nickst) GUT. Er hat den zweiten Zug genommen. Das ist die halbe Geschichte. Immer.",translation:"(whispering) Are you following? …NO wait, not now, this scene is suspenseful — …(five minutes later) So? …(you nod) GOOD. He took the second train. That's half the story. Always."},{type:"meet",itemIds:["die-leinwand","die-szene","spannend"]},{type:"meet",itemIds:["der-held","leise","die-unterhaltung"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Lina fällt fast vom Sitz: Der Held rennt. Wohin?",options:[{label:"(flüstert) Zum Bahnhof! Zweiter Zug! Ich HAB es verstanden!",line:"(flüstert) Zum Bahnhof! Zweiter Zug! Ich hab es verstanden! …Lina: „LEISE! Aber ja! BRAVO!“ (leise-bravo)"},{label:"(flüstert) Keine Ahnung. Aber es sieht wichtig aus.",line:"(flüstert) Keine Ahnung. Aber es sieht SEHR wichtig aus. …Tobias: „Das ist 80 % vom Deutschlernen: Wichtigkeit raten.“"}]},{type:"check",count:2,mode:"listen"},{type:"line",speaker:"lina",text:"Die beste Szene war, als der Held die alte Frau getroffen hat und dann… ach nein, das erzähle ich nicht. Die musst du sehen. Nur so viel: Er weint. Und das ist okay. Sogar gut.",translation:"The best scene was when the hero met the old woman and then… oh no, I won't tell. You have to see it. Just this much: he cries. And that's okay. Even good."},{type:"reading",title:"Tafel im Kinosaal",text:`IM KINORAUM:
— LEISE sein. Der Film ist lauter als du.
— Handy AUS. Alles kann warten.
— Der Held braucht keine Kommentare.
  (Aber ein leises „oooh“ ist menschlich.)

»Die Leinwand zeigt alles.
 Dein Nachbar will nichts hören.«`,translation:`IN THE SCREENING ROOM:
— Be QUIET. The film is louder than you.
— Phone OFF. Everything can wait.
— The hero doesn't need commentary.
  (But a quiet 'oooh' is human.)

'The screen shows everything.
Your neighbour doesn't want to hear anything.'`,itemIds:["leise","der-held","die-leinwand"]}]},{id:"a1e12s3",episodeId:"a1e12",title:"Nach dem Film",titleEn:"After the film",place:"Karl-Liebknecht-Straße, Abend",bg:"strasse",contextTags:["culture","friends","city"],requiredItems:["der-heimweg","zufrieden"],introducedItems:["das-ende","weinen","danach","die-werbung","der-spaziergang","die-diskussion"],beats:[{type:"narration",text:"Das Ende: Der Mann verpasst absichtlich den dritten Zug — und bleibt. Licht an. Lina hat Tränentropfen-Statistik geführt: „Zwei. Von MIR. Tobias auch zwei, er hat geheult, er hat nur geheult.“"},{type:"line",speaker:"tobias",text:"Ich habe NICHT geheult. Ich hatte… Kinoluft in den Augen. …Also: Was dachtest du am Ende? Würdest du auch bleiben — ohne Zug, neuer Ort, alles neu?",translation:"I did NOT cry. I had… cinema air in my eyes. …So: what did you think at the end? Would you stay too — without a train, new place, everything new?"},{type:"meet",itemIds:["das-ende","weinen","die-diskussion"]},{type:"meet",itemIds:["danach","die-werbung","der-spaziergang"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Die Frage hängt über der Karl-Liebknecht-Straße.",options:[{label:"Ich bin geblieben. Du siehst das Ergebnis: Ich stehe hier.",line:"Ich bin geblieben. Du siehst das Ergebnis — ich stehe hier und esse Popcorn vom Heimweg. …Tobias: „Beste Antwort des Kinojahres.“"},{label:"Der Film war gut. Aber mein Zug fährt noch.",line:"Der Film war gut, aber mein Zug fährt noch. …Vielleicht nach dem C1-Kurs. Erste Station: Flughafen. Mutter, ich komme."}]},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Ihr macht einen Spaziergang durch die feuchte Straße, und die Diskussion hört nie auf: War die Werbung zu lang? (Ja.) War der Held mutig? (Sehr.) Hast du alles verstanden? (Mehr als beim letzten Mal.) Genau das ist Fortschritt — messbar in Sätzen."}]}],ua={episode:tt,cast:nt,items:it,scenes:rt},ga=Object.freeze(Object.defineProperty({__proto__:null,cast:nt,default:ua,episode:tt,items:it,scenes:rt},Symbol.toStringTag,{value:"Module"})),at={id:"a1e13",arcId:"A1",cefrLevel:"A1",title:"Der Weihnachtsmarkt",titleEn:"The Christmas market",blurb:"Dezember, drei Grad, tausend Lichter: Der Weihnachtsmarkt auf dem Augustusplatz. Punsch, Waffeln, ein Karussell von 1911 — und die Frage des Abends: „Gefällt dir der Markt?“",order:13,sceneIds:["a1e13s1","a1e13s2","a1e13s3"]},st=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"lina",name:"Lina",role:"Tobias' Cousine, 8 Jahre"}],ot=[{id:"der-weihnachtsmarkt",type:"word",german:"der Weihnachtsmarkt",meaning:"the Christmas market",image:"weihnachtsbaum",audio:"tts",introducedInScene:"a1e13s1",tags:["celebration","city","food"],cefrLevel:"A1",note:"der, Plural: die Weihnachtsmärkte — Leipzigs größter: am Augustusplatz"},{id:"der-weihnachtsbaum",type:"word",german:"der Weihnachtsbaum",meaning:"the Christmas tree",image:"weihnachtsbaum",audio:"tts",introducedInScene:"a1e13s1",tags:["celebration","nature"],cefrLevel:"A1",note:"der, Plural: die Weihnachtsbäume — auch: der Christbaum"},{id:"der-stern",type:"word",german:"der Stern",meaning:"the star",image:"stern",audio:"tts",introducedInScene:"a1e13s1",tags:["celebration","nature"],cefrLevel:"A1",note:"der, Plural: die Sterne — oben auf dem Baum"},{id:"die-lichter",type:"word",german:"die Lichter",meaning:"the lights (plural)",image:"lampe",audio:"tts",introducedInScene:"a1e13s1",tags:["celebration"],cefrLevel:"A1",note:"Plural: die Lichter — das Licht, die Lichter"},{id:"das-karussell",type:"word",german:"das Karussell",meaning:"the carousel / merry-go-round",image:"fest",audio:"tts",introducedInScene:"a1e13s1",tags:["celebration","leisure"],cefrLevel:"A1",note:"das, Plural: die Karussells — das hier: von 1911!"},{id:"gefaellt-dir",type:"grammar_pattern",german:"___ dir der Markt?",meaning:"Do you like the market?",image:"gespräch",audio:"tts",introducedInScene:"a1e13s1",tags:["grammar","opinion"],cefrLevel:"A1",cloze:"Gefällt",speak:"Gefällt dir der Markt?",note:"gefallen + Dativ: „Gefällt dir…?“ — Das Essen gefällt mir"},{id:"der-punsch",type:"word",german:"der Punsch",meaning:"the (hot) punch",image:"getränk",audio:"tts",introducedInScene:"a1e13s2",tags:["food","celebration"],cefrLevel:"A1",note:"der, Plural: die Punsche — Kinderpunsch ohne Alkohol"},{id:"die-waffel",type:"word",german:"die Waffel",meaning:"the waffle",image:"kuchen",audio:"tts",introducedInScene:"a1e13s2",tags:["food","celebration"],cefrLevel:"A1",note:"die, Plural: die Waffeln — mit Puderzucker. Immer."},{id:"das-holzspielzeug",type:"word",german:"das Holzspielzeug",meaning:"the wooden toys",image:"geschenk",audio:"tts",introducedInScene:"a1e13s2",tags:["celebration","shopping"],cefrLevel:"A1",note:"das ( Singular ) — aus dem Erzgebirge, rechts vom Markt"},{id:"warm",type:"word",german:"warm",meaning:"warm (also: feeling warm)",image:"wetter",audio:"tts",introducedInScene:"a1e13s2",tags:["weather","feelings"],cefrLevel:"A1",note:"„Mir ist warm“ — Dativ! Mir, dir, ihm …"},{id:"der-duft",type:"word",german:"der Duft",meaning:"the scent / fragrance",image:"tee",audio:"tts",introducedInScene:"a1e13s2",tags:["nature","food"],cefrLevel:"A1",note:"der, Plural: die Düfte — der Duft von Zimt und Tannen"},{id:"die-huette",type:"word",german:"die Hütte",meaning:"the hut / cabin (market stall)",image:"laube",audio:"tts",introducedInScene:"a1e13s2",tags:["celebration","city"],cefrLevel:"A1",note:"die, Plural: die Hütten — auf dem Markt: viele kleine Hütten"},{id:"der-adventskalender",type:"word",german:"der Adventskalender",meaning:"the advent calendar",image:"kalender",audio:"tts",introducedInScene:"a1e13s3",tags:["celebration","time"],cefrLevel:"A1",note:"der, Plural: die Adventskalender — 24 Türen, 24 Schokoladen"},{id:"der-schneemann",type:"word",german:"der Schneemann",meaning:"the snowman",image:"schnee",audio:"tts",introducedInScene:"a1e13s3",tags:["celebration","weather"],cefrLevel:"A1",note:"der, Plural: die Schneemänner — mit Karottennase"},{id:"die-wunderkerze",type:"word",german:"die Wunderkerze",meaning:"the sparkler",image:"feuerwerk",audio:"tts",introducedInScene:"a1e13s3",tags:["celebration"],cefrLevel:"A1",note:"die, Plural: die Wunderkerzen — funkt! (sparkles)"},{id:"wuenschen",type:"chunk",german:"Ich wünsche dir frohe Weihnachten!",meaning:"I wish you a merry Christmas!",image:"geschenk",audio:"tts",introducedInScene:"a1e13s3",tags:["politeness","celebration"],cefrLevel:"A1",speak:"Ich wünsche dir frohe Weihnachten!",note:"wünschen + Dativ — der Wunsch"},{id:"die-mandarine",type:"word",german:"die Mandarine",meaning:"the mandarin orange",image:"apfel",audio:"tts",introducedInScene:"a1e13s3",tags:["food","celebration"],cefrLevel:"A1",note:"die, Plural: die Mandarinen — der Duft des Dezembers"},{id:"die-kastanie",type:"word",german:"die Kastanie",meaning:"the chestnut",image:"kuchen",audio:"tts",introducedInScene:"a1e13s3",tags:["food","celebration"],cefrLevel:"A1",note:"die, Plural: die Kastanien — heiß geröstet, in der Tüte"}],dt=[{id:"a1e13s1",episodeId:"a1e13",title:"Tausend Lichter",titleEn:"A thousand lights",place:"Augustusplatz, Weihnachtsmarkt",bg:"fest",contextTags:["celebration","city","friends"],requiredItems:["die-jacke","der-regenschirm"],introducedItems:["der-weihnachtsmarkt","der-weihnachtsbaum","der-stern","die-lichter","das-karussell","gefaellt-dir"],beats:[{type:"narration",text:"Dezember, drei Grad, und der ganze Platz leuchtet. Der Weihnachtsbaum ist höher als die Straßenbahn, obendrauf: ein Stern so groß wie ein Auto. Lina zieht sofort Richtung Karussell."},{type:"line",speaker:"tobias",text:"Willkommen auf dem Weihnachtsmarkt — Leipzigs schönster Zaubershow mit Eintritt frei. …Der Baum: 23 Meter. Der Stern: LED. Die Tradition: 500 Jahre. Deine Jacke: viel zu dünn. Nehm die hier, meine zweite.",translation:"Welcome to the Christmas market — Leipzig's most beautiful magic show, free entry. …The tree: 23 metres. The star: LEDs. The tradition: 500 years. Your jacket: way too thin. Take this one, my spare."},{type:"meet",itemIds:["der-weihnachtsmarkt","der-weihnachtsbaum","der-stern"]},{type:"meet",itemIds:["die-lichter","das-karussell","gefaellt-dir"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Frau Brügge kommt mit einem Einkaufsnetz voller Lichterketten. „Und, junger Mann? Gefällt dir der Markt?“",options:[{label:"Gefällt mir? Ich glaube, ich sehe Sterne — und nicht nur den vom Baum.",line:"Gefällt mir? Ich glaube, ich sehe Sterne — und nicht nur den vom Baum. …Frau Brügge: „Gut geantwortet. So redet man hier.“"},{label:"Ja! Alles leuchtet. Bei uns gab es so etwas nicht.",line:"Ja, alles leuchtet! So etwas gab es bei uns nicht. …Frau Brügge: „Dann ist es Zeit. Kalt ist es trotzdem. Komm, Punsch.“"}]},{type:"check",count:2,mode:"recall"},{type:"line",speaker:"lina",text:"Das Karussell ist von 1911! Da fuhren noch meine Urgroßeltern! …Und die Lichter: ZWEITAUSEEND. Ich habe sie gezählt. …Nicht alle. Aber die meisten.",translation:"The carousel is from 1911! My great-grandparents still rode it! …And the lights: TWO THOUSAND. I counted them. …Not all of them. But most of them."},{type:"reading",title:"Schild am Markteingang",text:`WEIHNACHTSMARKT LEIPZIG

»Der beste Wunsch ist einer,
der auch andere glücklich macht.«

Dahinter: eine Mandarine.
Dahinter dahinter: nichts.
Das reicht.`,translation:`Today no chocolate.
Today there's a sentence here:

'The best wish is one
that makes other people happy too.'

Behind it: a mandarin.
Behind that: nothing.
That's enough.`,itemIds:["der-adventskalender","wuenschen","die-mandarine"]},{type:"narration",text:"Frau Brügge verteilt Mandarinen aus dem Netz wie Geschenke, und du reihst dich ein: „Ich wünsche dir frohe Weihnachten“ — viermal geübt, viermal gesagt, viermal zurückgekriegt. Die Wunderkerze brennt runter, der Markt leuchtet weiter. Erster Dezember in Leipzig: eingetragen."}]}],ma={episode:at,cast:st,items:ot,scenes:dt},pa=Object.freeze(Object.defineProperty({__proto__:null,cast:st,default:ma,episode:at,items:ot,scenes:dt},Symbol.toStringTag,{value:"Module"})),lt={id:"a1e2",arcId:"A1",cefrLevel:"A1",title:"Die erste Wohnung",titleEn:"The first flat",blurb:"Möbel, Schrauben, Brötchen. Du kaufst ein, baust auf — und bestellst zum ersten Mal auf Deutsch.",order:2,sceneIds:["a1e2s1","a1e2s2","a1e2s3"]},ct=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"verkaeuferin",name:"Frau Wenzel",role:"Bäckerin"}],ht=[{id:"das-zimmer",type:"word",german:"das Zimmer",meaning:"the room",image:"wohnung",audio:"tts",introducedInScene:"a1e2s1",tags:["home","furniture"],cefrLevel:"A1",note:"das, Plural: die Zimmer"},{id:"das-bett",type:"word",german:"das Bett",meaning:"the bed",image:"bett",audio:"tts",introducedInScene:"a1e2s1",tags:["home","furniture"],cefrLevel:"A1",note:"das, Plural: die Betten"},{id:"der-tisch",type:"word",german:"der Tisch",meaning:"the table",image:"tisch",audio:"tts",introducedInScene:"a1e2s1",tags:["home","furniture"],cefrLevel:"A1",note:"der, Plural: die Tische"},{id:"das-fenster",type:"word",german:"das Fenster",meaning:"the window",image:"fenster",audio:"tts",introducedInScene:"a1e2s1",tags:["home","furniture"],cefrLevel:"A1",note:"das, Plural: die Fenster"},{id:"wo-ist-die-kueche",type:"chunk",german:"Wo ist die Küche?",meaning:"Where is the kitchen?",audio:"tts",introducedInScene:"a1e2s1",tags:["home","questions"],cefrLevel:"A1",parentId:"wo-ist-gleis"},{id:"die-wohnung-ist-schoen",type:"sentence",german:"Die Wohnung ist schön.",meaning:"The flat is nice.",audio:"tts",introducedInScene:"a1e2s1",tags:["home","smalltalk"],cefrLevel:"A1"},{id:"das-brot",type:"word",german:"das Brot",meaning:"the bread",image:"brot",audio:"tts",introducedInScene:"a1e2s2",tags:["food","shopping"],cefrLevel:"A1",note:"das, Plural: die Brote"},{id:"die-butter",type:"word",german:"die Butter",meaning:"the butter",image:"brot",audio:"tts",introducedInScene:"a1e2s2",tags:["food","shopping"],cefrLevel:"A1",note:"die ( Singular wie Plural )"},{id:"der-apfel",type:"word",german:"der Apfel",meaning:"the apple",image:"apfel",audio:"tts",introducedInScene:"a1e2s2",tags:["food","shopping"],cefrLevel:"A1",note:"der, Plural: die Äpfel"},{id:"das-wasser",type:"word",german:"das Wasser",meaning:"the water",image:"wasser",audio:"tts",introducedInScene:"a1e2s2",tags:["food","shopping"],cefrLevel:"A1",note:"das ( Singular ) — „ein Wasser“ am Tisch = ein Glas"},{id:"ich-haette-gern",type:"grammar_pattern",german:"Ich hätte gern ___.",meaning:"I would like ___. (the polite ordering machine)",audio:"tts",introducedInScene:"a1e2s2",tags:["food","shopping","request"],cefrLevel:"A1",cloze:"ein Brötchen",alt:["ein Brot","ein Wasser","zwei Brötchen","einen Apfel"],speak:"Ich hätte gern ein Brötchen, bitte.",note:"Universell: Bäcker, Café, Restaurant, Kiosk — einfach einsetzen."},{id:"zusammen-bitte",type:"chunk",german:"Zusammen, bitte.",meaning:"Together, please. (paying for it all at once)",audio:"tts",introducedInScene:"a1e2s2",tags:["shopping","request"],cefrLevel:"A1",note:"An der Kasse. Gegenteil: „Getrennt, bitte.“"},{id:"der-stuhl",type:"word",german:"der Stuhl",meaning:"the chair",image:"stuhl",audio:"tts",introducedInScene:"a1e2s3",tags:["home","furniture"],cefrLevel:"A1",note:"der, Plural: die Stühle"},{id:"die-lampe",type:"word",german:"die Lampe",meaning:"the lamp",image:"lampe",audio:"tts",introducedInScene:"a1e2s3",tags:["home","furniture"],cefrLevel:"A1",note:"die, Plural: die Lampen"},{id:"das-regal",type:"word",german:"das Regal",meaning:"the shelf",image:"wohnung",audio:"tts",introducedInScene:"a1e2s3",tags:["home","furniture"],cefrLevel:"A1",note:"das, Plural: die Regale — nicht das königliche Regal"},{id:"der-hammer",type:"word",german:"der Hammer",meaning:"the hammer",image:"werkzeug",audio:"tts",introducedInScene:"a1e2s3",tags:["objects","repair"],cefrLevel:"A1",note:"der, Plural: die Hämmer"},{id:"ich-helfe-dir",type:"chunk",german:"Ich helfe dir!",meaning:"I'll help you!",audio:"tts",introducedInScene:"a1e2s3",tags:["neighbors","friends"],cefrLevel:"A1",note:"du-Form — unter Nachbarn und Freunden normal."},{id:"danke-schoen",type:"chunk",german:"Danke schön!",meaning:"Thank you very much!",audio:"tts",introducedInScene:"a1e2s3",tags:["politeness","friends"],cefrLevel:"A1"}],ut=[{id:"a1e2s1",episodeId:"a1e2",title:"Zwei Zimmer, Küchenzeile",titleEn:"Two rooms, a kitchenette",place:"Bärbelstraße 12, 2. OG",bg:"wohnung",contextTags:["home","furniture"],requiredItems:[],introducedItems:["das-zimmer","das-bett","der-tisch","das-fenster","wo-ist-die-kueche","die-wohnung-ist-schoen"],beats:[{type:"narration",text:"Zwei Zimmer, Küchenzeile, Bad. Im Inserat stand „charmant“. Jetzt heißt das Wort: du wohnst hier."},{type:"meet",itemIds:["das-zimmer","das-bett","der-tisch"]},{type:"narration",text:"Aus dem Flur ruft eine Stimme. Ein junger Mann steht in der Tür, einen Karton mit Gläsern im Arm."},{type:"line",speaker:"tobias",text:"Hallo! Tobias, von gegenüber, dritter Stock. Ich hab ein Regal übrig, falls du eins brauchst. …Und eine Bohrmaschine.",translation:"Hi! Tobias, from across the hall, third floor. I have a spare shelf if you need one. …And a drill."},{type:"meet",itemIds:["das-fenster","wo-ist-die-kueche","die-wohnung-ist-schoen"]},{type:"choice",prompt:"Tobias: „Und, was sagst du zur Wohnung?“",options:[{label:"Die Wohnung ist schön!",line:"Die Wohnung ist schön!"},{label:"Wo ist die Küche? …Ah. Da.",line:"Wo ist die Küche? …Ah. Da ist sie."}]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"tobias",text:"Alte Wohnung, neue Fenster. Nachts hört man nur die Straßenbahn. Gewöhnst du dich dran, versprochen.",translation:"Old flat, new windows. At night you only hear the tram. You'll get used to it, promise."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Frau Brügges Möbelliste",text:`ZIMMER 1 (für Sam):
— Bett (klingt komisch, hält 30 Jahre)
— Tisch von meiner Tante (stabil, ehrlich)
— Fenster bleibt offen im Sommer, NOTIZ AN MICH: Fliegen

Rest steht im Keller.
Was fehlt, wird gekauft. Mit Liste.
Liste ist bei mir.`,translation:`ROOM 1 (for Sam):
— Bed (sounds strange, lasts 30 years)
— Table from my aunt (stable, honest)
— Window stays open in summer, NOTE TO SELF: flies

The rest is in the basement.
Whatever's missing will be bought. With a list.
The list is with me.`,itemIds:["das-zimmer","das-bett","die-wohnung-ist-schoen"]},{type:"narration",text:"Das Bett steht am Fenster. Erster Abend in Leipzig. Die Decke riecht noch nach dem Zug."}]},{id:"a1e2s2",episodeId:"a1e2",title:"Beim Bäcker",titleEn:"At the bakery",place:"Bäckerei Wenzel, Jahnallee",bg:"laden",contextTags:["food","shopping","request"],requiredItems:[],introducedItems:["das-brot","die-butter","der-apfel","das-wasser","ich-haette-gern","zusammen-bitte"],beats:[{type:"narration",text:"Sonntagmorgen. Die Jahnallee riecht nach Brötchen. In der Bäckerei Wenzel stehen vier Leute an — alle reden Deutsch. Alle."},{type:"meet",itemIds:["das-brot","die-butter","der-apfel"]},{type:"line",speaker:"verkaeuferin",text:"Guten Morgen! Und für Sie?",translation:"Good morning! And for you?"},{type:"meet",itemIds:["das-wasser","ich-haette-gern","zusammen-bitte"]},{type:"choice",prompt:"Du bist dran.",options:[{label:"Ich hätte gern ein Brötchen und ein Wasser.",line:"Ich hätte gern ein Brötchen und ein Wasser."},{label:"Ein Brot, bitte. …Und Butter.",line:"Ein Brot, bitte. …Und Butter."}]},{type:"line",speaker:"verkaeuferin",text:"Sehr gern. Sonst noch etwas? — Zusammen macht drei vierzig.",translation:"With pleasure. Anything else? — Together that's three forty."},{type:"check",count:2,mode:"mixed"},{type:"narration",text:"Mit der Tüte auf dem Arm gehst du zurück. Das Brot ist noch warm. Leipzig kann also was."},{type:"check",count:2,mode:"recall"}]},{id:"a1e2s3",episodeId:"a1e2",title:"Möbel mit Tobias",titleEn:"Furniture with Tobias",place:"Wohnung, 2. OG",bg:"wohnung",contextTags:["home","furniture","neighbors"],requiredItems:[],introducedItems:["der-stuhl","die-lampe","das-regal","der-hammer","ich-helfe-dir","danke-schoen"],beats:[{type:"narration",text:"Ein Karton Regalbretter, zwölf Schrauben, null Anleitung. Tobias kommt mit einer Werkzeugkiste die Treppe hoch."},{type:"line",speaker:"tobias",text:"Anleitung? Hab ich nie benutzt. Ich helfe dir!",translation:"Instructions? Never used one. I'll help you!"},{type:"meet",itemIds:["der-stuhl","die-lampe","das-regal"]},{type:"meet",itemIds:["der-hammer","ich-helfe-dir","danke-schoen"]},{type:"choice",prompt:"Er überreicht dir den Hammer wie einen Worcesters.",options:[{label:"Danke schön, Tobias!",line:"Danke schön, Tobias!"},{label:"Ich helfe dir dann beim Umzug. …Irgendwann.",line:"Ich helfe dir dann beim Umzug. …Irgendwann."}]},{type:"line",speaker:"tobias",text:"Abgemacht! …Moment. Der Stuhl wackelt. Hammer.",translation:"Deal! …Wait. The chair wobbles. Hammer."},{type:"check",count:2,mode:"mixed"},{type:"narration",text:"Zwei Stunden später steht das Regal. Schief, aber es steht. Die Lampe macht warmes Licht auf den alten Dielen."},{type:"check",count:2,mode:"recall"},{type:"line",speaker:"tobias",text:"Wenn du Bock hast: Donnerstag spielen wir in Connewitz. Komm doch mit!",translation:"If you're up for it: Thursday we're playing in Connewitz. Come along!"},{type:"reading",title:"Aufbauanleitung: Regal „LEP-2000“",text:`1. Teile zählen: 8 Bretter, 16 Schrauben, 1 Hammer.
2. Kurzes Brett oben. Lange Bretter unten. (Physik.)
3. Schrauben fest — aber nicht zu fest. (Erfahrung.)
4. Fertig? Regal schief? → Zweite Person hilft.

Hinweis: Das Regal ist gerade.
Die Wand ist schief. Willkommen im Altbau.`,translation:`1. Count the parts: 8 boards, 16 screws, 1 hammer.
2. Short board on top. Long boards at the bottom. (Physics.)
3. Tighten the screws — but not too tight. (Experience.)
4. Done? Shelf crooked? → A second person helps.

Note: the shelf is straight.
The wall is crooked. Welcome to old buildings.`,itemIds:["das-regal","der-hammer","ich-helfe-dir"]}]}],fa={episode:lt,cast:ct,items:ht,scenes:ut},ba=Object.freeze(Object.defineProperty({__proto__:null,cast:ct,default:fa,episode:lt,items:ht,scenes:ut},Symbol.toStringTag,{value:"Module"})),gt={id:"a1e3",arcId:"A1",cefrLevel:"A1",title:"Stadt und Alltag",titleEn:"City and daily life",blurb:"Markt, Café, erste Nummern. Leipzig wird langsam zu einem Ort mit Namen, Gerüchen und Wiedererkennung.",order:3,sceneIds:["a1e3s1","a1e3s2","a1e3s3"]},mt=[{id:"haendlerin",name:"Frau Pawlik",role:"Marktstand"},{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"tobias",name:"Tobias",role:"Nachbar, Student"}],pt=[{id:"das-gemuese",type:"word",german:"das Gemüse",meaning:"the vegetables",image:"gemuese",audio:"tts",introducedInScene:"a1e3s1",tags:["food","shopping"],cefrLevel:"A1",note:"das ( Sammelbegriff )"},{id:"die-kartoffel",type:"word",german:"die Kartoffel",meaning:"the potato",image:"gemuese",audio:"tts",introducedInScene:"a1e3s1",tags:["food","shopping"],cefrLevel:"A1",note:"die, Plural: die Kartoffeln"},{id:"der-euro",type:"word",german:"der Euro",meaning:"the euro",image:"geld",audio:"tts",introducedInScene:"a1e3s1",tags:["shopping","money"],cefrLevel:"A1",note:"der, Plural: die Euros — Preis: „drei Euro zwanzig“"},{id:"die-tuete",type:"word",german:"die Tüte",meaning:"the (paper/plastic) bag",image:"tüte",audio:"tts",introducedInScene:"a1e3s1",tags:["shopping"],cefrLevel:"A1",note:"die, Plural: die Tüten"},{id:"wie-viel-kostet",type:"sentence",german:"Wie viel kostet das?",meaning:"How much does that cost?",audio:"tts",introducedInScene:"a1e3s1",tags:["shopping","money","questions"],cefrLevel:"A1"},{id:"alles-frisch",type:"chunk",german:"Alles frisch!",meaning:"Everything's fresh!",audio:"tts",introducedInScene:"a1e3s1",tags:["food","shopping"],cefrLevel:"A1"},{id:"der-kaffee",type:"word",german:"der Kaffee",meaning:"the coffee",image:"kaffee",audio:"tts",introducedInSce s"],cefrLevel:"A1"},{id:"der-termin",type:"word",german:"der Termin",meaning:"the appointment",image:"kalender",audio:"tts",introducedInScene:"a1e3s3",tags:["admin","phone"],cefrLevel:"A1",note:"der, Plural: die Termine — in Deutschland heilig"},{id:"bis-morgen",type:"chunk",german:"Bis morgen!",meaning:"See you tomorrow!",audio:"tts",introducedInScene:"a1e3s3",tags:["smalltalk","friends"],cefrLevel:"A1"}],ft=[{id:"a1e3s1",episodeId:"a1e3",title:"Auf dem Markt",titleEn:"At the market",place:"Marktplatz, Gemüsestand 3",bg:"markt",contextTags:["food","shopping"],requiredItems:["ich-haette-gern"],introducedItems:["das-gemuese","die-kartoffel","der-euro","die-tuete","wie-viel-kostet","alles-frisch"],beats:[{type:"narration",text:"Samstag, Marktplatz. Stände, Rufe, Dampf von gebrannten Mandeln. Vor dem Gemüsestand diskutieren zwei Frauen leidenschaftlich über Kohlrabi."},{type:"meet",itemIds:["das-gemuese","die-kartoffel","der-euro"]},{type:"line",speaker:"haendlerin",text:"Na, was darf's sein? Die Kartoffeln sind heute frisch vom Feld.",translation:"So, what'll it be? The potatoes are fresh from the field today."},{type:"meet",itemIds:["die-tuete","wie-viel-kostet","alles-frisch"]},{type:"choice",prompt:"Die Frau schaut dich erwartungsvoll an.",options:[{label:"Ich hätte gern zwei Kilo Kartoffeln.",line:"Ich hätte gern zwei Kilo Kartoffeln."},{label:"Wie viel kostet das Gemüse?",line:"Wie viel kostet das Gemüse?"}]},{type:"line",speaker:"haendlerin",text:"Zwei Kilo — drei Euro zwanzig. Alles frisch, versprochen!",translation:"Two kilos — three euros twenty. Everything fresh, promised!"},{type:"check",count:2,mode:"mixed"},{type:"narration",text:"Sie wiegt, winkt ab und tut noch eine Möhre in die Tüte. Du zahlst mit Münzen und fühlst dich verdächtig einheimisch."},{type:"check",count:2,mode:"recall"}]},{id:"a1e3s2",episodeId:"a1e3",title:"Café Luise",titleEn:"Café Luise",place:"Café Luise, Kastanienweg",bg:"cafe",contextTags:["cafe","food","smalltalk"],requiredItems:["ic ning meal",image:"suppe",audio:"tts",introducedInScene:"a1e4s2",tags:["food","friends"],cefrLevel:"A1",note:"das, Plural: die Abendessen"},{id:"die-suppe",type:"word",german:"die Suppe",meaning:"the soup",image:"suppe",audio:"tts",introducedInScene:"a1e4s2",tags:["food"],cefrLevel:"A1",note:"die, Plural: die Suppen"},{id:"der-salat",type:"word",german:"der Salat",meaning:"the salad",image:"salat",audio:"tts",introducedInScene:"a1e4s2",tags:["food"],cefrLevel:"A1",note:"der, Plural: die Salate"},{id:"schmeckt-dir",type:"sentence",german:"Schmeckt dir der Salat?",meaning:"Do you like the salad?",audio:"tts",introducedInScene:"a1e4s2",tags:["food","smalltalk"],cefrLevel:"A1",note:'schmecken + Dativ: „Schmeckt dir …?"'},{id:"noch-etwas",type:"chunk",german:"Noch etwas?",meaning:"Some more? Anything else?",audio:"tts",introducedInScene:"a1e4s2",tags:["food","politeness"],cefrLevel:"A1"},{id:"es-war-sehr-lecker",type:"sentence",german:"Es war sehr lecker!",meaning:"It was very tasty!",audio:"tts",introducedInScene:"a1e4s2",tags:["food","politeness"],cefrLevel:"A1"},{id:"der-zettel",type:"word",german:"der Zettel",meaning:"the (paper) note / slip",image:"brief",audio:"tts",introducedInScene:"a1e4s3",tags:["neighbors","politeness"],cefrLevel:"A1",note:"der, Plural: die Zettel — klein, wichtig, überall"},{id:"die-kanne",type:"word",german:"die Kanne",meaning:"the pot / jug",image:"kaffee",audio:"tts",introducedInScene:"a1e4s3",tags:["kitchen","food"],cefrLevel:"A1",note:"die, Plural: die Kannen — eine Kanne Kaffee"},{id:"das-stueck",type:"word",german:"das Stück",meaning:"the piece",image:"kuchen",audio:"tts",introducedInScene:"a1e4s3",tags:["food"],cefrLevel:"A1",note:"das, Plural: die Stücke — ein Stück Kuchen, bitte"},{id:"der-gast",type:"word",german:"der Gast",meaning:"the guest",image:"person",audio:"tts",introducedInScene:"a1e4s3",tags:["people","neighbors"],cefrLevel:"A1",note:"der, Plural: die Gäste — heute bist du Gast"},{id:"selbstgemacht",type:"word",german:"selbstgemacht",meaning:"homemade / self-made",image:"geschenk",audio:"tts",introducedInScene:"a1e4s3",tags:["food","home"],cefrLevel:"A1",note:"selbst + gemacht — das höchste Küchenlob"},{id:"gern-geschehen",type:"chunk",german:"Gern geschehen!",meaning:"You're very welcome!",image:"gespräch",audio:"tts",introducedInScene:"a1e4s3",tags:["politeness"],cefrLevel:"A1",speak:"Gern geschehen!",note:"Antwort auf „Danke“ — herzlicher als „bitte schön“"}],yt=[{id:"a1e4s1",episodeId:"a1e4",title:"Die Einladung",titleEn:"The invitation",place:"Haustür & Blumenladen",bg:"strasse",contextTags:["neighbors","friends"],requiredItems:[],introducedItems:["das-geschenk","die-blumen","die-treppe","danke-fuer-die-einladung","ich-freue-mich"],beats:[{type:"narration",text:"Ein Zettel an der Haustür, in sauberer Füllfeder: „Nachbarschaftskaffee — Samstag, 16 Uhr. Frau Brügge lädt ein.“"},{type:"meet",itemIds:["das-geschenk","die-blumen","die-treppe"]},{type:"line",speaker:"frau-bruegge",text:"Ah, Sam! Gut, dass ich dich erwische. Samstag, vier Uhr, einfach hochkommen. Du musst nichts mitbringen!",translation:"Ah, Sam! Good I caught you. Saturday, four o'clock, just come up. You don't need to bring anything!"},{type:"meet",itemIds:["danke-fuer-die-einladung","ich-freue-mich"]},{type:"choice",prompt:"Sie wartet auf eine Antwort.",options:[{label:"Danke für die Einladung! Ich freue mich.",line:"Danke für die Einladung! Ich freue mich."},{label:"Ich bring Blumen mit. …Darf ich?",line:"Ich bring Blumen mit. …Darf ich?"}]},{type:"line",speaker:"frau-bruegge",text:"Blumen? Na gut, wenn's sein muss. …Aber herzlicher wär's, wenn einfach du kommst.",translation:"Flowers? Fine, if you must. …But it would be warmer if just you came."},{type:"check",count:2,mode:"mixed"},{type:"narration",text:"Samstagnachmittag. Du stehst mit einer Tüte Tulpen vor der Tür und klingelst zum ersten Mal bei jemandem in dieser Stadt. Vier Treppen."},{type:"check",count:2,mode:"recall"}]},{id:"a1e4s2",episodeId:"a1e4",title:"Beim Abendessen",titleEn:"At dinner",place:"Frau Brügges Küche, 4. OG",bg:"wohnung",contextTags:["friends","food","home"],requiredItems:[],introducedItems:["das-abendessen","die-suppe","der-salat","schmeckt-dir","noch-etwas","es-war-sehr-lecker"],beats:[{type:"narration",text:"Frau Brügges Küche: Blümchen auf der Decke, ein dampfender Topf — und Tobias ist auch da. „Ich helf nur beim Decken.“"},{type:"meet",itemIds:["das-abendessen","die-suppe","der-salat"]},{type:"line",speaker:"frau-bruegge",text:"Also — Guten Appetit! Die Suppe ist nach Omas Rezept. Tobias, sag jetzt nicht wieder, sie sei zu gesund.",translation:"Well — enjoy your meal! The soup is my grandma's recipe. Tobias, don't say again that it's too healthy."},{type:"meet",itemIds:["schmeckt-dir","noch-etwas","es-war-sehr-lecker"]},{type:"choice",prompt:"Frau Brügge beobachtet deinen Löffel.",options:[{label:"Es war sehr lecker!",line:"Es war sehr lecker!"},{label:"Noch etwas Suppe, bitte!",line:"Noch etwas Suppe, bitte!"}]},{type:"line",speaker:"tobias",text:"Sag ich doch: Sie kocht besser als mein Studifutter. …Frau Brügge, nächstes Mal grillen wir!",translation:"Told you: she cooks better than my student food. …Frau Brügge, next time we'll barbecue!"},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"frau-bruegge",text:"So. Und jetzt Kaffee. Und du, Sam: Wie gefällt dir Leipzig bis hierher?",translation:"Right. And now coffee. And you, Sam: How do you like Leipzig so far?"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Omas Rezept: Gemüsesuppe",text:`Für 4 Personen (oder 3 Nachbarn):

— 4 Kartoffeln, 2 Karotten, Gemüse nach Markt
— Butter in den Topf, Zwiebeln glasig
— Wasser dazu, 20 Minuten — GENUG, Oma sagt
— Salz probieren. Dann nochmal.

Dazu: Salat und Brot.
Wer nachfragt, kriegt die Suppe gleich doppelt erklärt.`,translation:`For 4 people (or 3 neighbours):

— 4 potatoes, 2 carrots, vegetables from the market
— Butter in the pot, onions till glassy
— Add water, 20 minutes — ENOUGH, grandma says
— Taste for salt. Then again.

With it: salad and bread.
Whoever asks gets the soup explained twice as long.`,itemIds:["die-suppe","der-salat","es-war-sehr-lecker"]},{type:"narration",text:"Du sagst „schön“ und meinst es. Der Kaffee duftet, draußen wird es dunkel über den Dächern der Bärbelstraße."}]},{id:"a1e4s3",episodeId:"a1e4",title:"Der Gegenbesuch",titleEn:"The return invitation",place:"Sams Küche, Samstag 16 Uhr",bg:"wohnung",contextTags:["neighbors","food","home"],requiredItems:["danke-fuer-die-einladung","der-kaffee"],introducedItems:["der-zettel","die-kanne","das-stueck","der-gast","selbstgemacht","gern-geschehen"],beats:[{type:"narration",text:"Eine Woche später: An deiner Tür hängt ein Antwortzettel in Füllfeder — „Zu Sam: Samstag, vier Uhr? Kaffee ist heiß, Kuchen backe ich selbst. Wenn er gelingt.“ Er ist gelungen. Fast."},{type:"meet",itemIds:["der-zettel","die-kanne","das-stueck"]},{type:"line",speaker:"frau-bruegge",text:"Du hast eingeladen! Der Zettel an der Tür — sehr charmant. …Mhm, die Kanne dampft noch, und der Kuchen: selbstgemacht? Dann bin ich heute Gast, nicht Vermieterin. Das ist ein Unterschied, Sam. Ein schöner.",translation:"You invited us! And the note is in block capitals — very wise. …Mm. The cake: homemade? Then today I'm a guest, not a landlady. That's a difference, Sam. A nice one."},{type:"meet",itemIds:["der-gast","selbstgemacht","gern-geschehen"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias steht schon mit der Gabel am Kuchen. „Darf ich?“",options:[{label:"Ja, nimm dir ein Stück. …Es war das letzte, oder?",line:"Ja, nimm dir ein Stück. …Das war das letzte, oder? …Tobias. TOBIAS."},{label:"Klar! Ich backe am Sonntag wieder.",line:"Klar! Ich backe am Sonntag wieder. Dann mit doppelt so viel Kuchen."}]},{type:"line",speaker:"tobias",text:"Der Kuchen ist besser als mein Studifutter. Und der Kaffee ist echt heiß, nicht „Wohnheim heiß“. …Sam, du bist offiziell Leipziger. Nächstes Mal bringe ich Blumen mit.",translation:"The cake is better than my student cafeteria food. And the coffee is properly hot, not 'dorm hot'. …Sam, you're officially a Leipziger now. Next time I'll bring flowers."},{type:"line",speaker:"frau-bruegge",text:"Du hast eingeladen! Der Zettel an der Tür — sehr charmant. …Mhm, die Kanne dampft noch, und der Kuchen: selbstgemacht? Dann bin ich heute Gast, nicht Vermieterin. Das ist ein Unterschied, Sam. Ein schöner.",translation:"And? How do you like Leipzig now, after five weeks? …See. More words, more of an answer. German helps. And cake helps too."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Antwortzettel (Füllfeder)",text:`»Kaffee ist um vier. Deine Kanne darf kommen —
sie hat schon einen guten Ruf in diesem Haus.

Kuchen selbstgemacht? Dann sind wir Gäste.
Das ist ein Unterschied, junger Mann.

— E. Brügge«

(An der Tür: kein Klingelschild. Nur dieser Zettel.
Alle im Haus kennen ihn.)`,translation:`'Coffee is at four. Your pot may come —
it already has a good reputation in this house.

Cake homemade? Then we're guests.
That's a difference, young man.

— E. Brügge'

ckung treffst du Tobias, der dich von weitem anwinkt."},{type:"line",speaker:"tobias",text:"Sam! Schau dich an — schon halb Leipziger. …Aber diese Jacke hält hier nichts. Wir gehen morgen shoppen. Second-hand!",translation:"Sam! Look at you — already half a Leipziger. …But that jacket won't survive here. We're going shopping tomorrow. Second-hand!"},{type:"meet",itemIds:["wie-ist-das-wetter","die-jacke","der-pullover"]},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Morgen also. Du schaust aus dem Fenster und sprichst dein erstes echtes deutsches Wettergespräch — mit dem Regen."}]},{id:"a1e5s2",episodeId:"a1e5",title:"Fundgrube Connewitz",titleEn:"Fundgrube Connewitz",place:"Second-Hand-Laden, Connewitz",bg:"laden",contextTags:["clothes","shopping"],requiredItems:["die-jacke","der-pullover"],introducedItems:["die-hose","die-schuhe","die-groesse","anprobieren","ich-suche-groesse","der-laden"],beats:[{type:"narration",text:"Ein Laden voller Gerüche nach Holz, Kaffee und alter Vinyl. Regale bis zur Decke, eine Garderobe wie eine kleine Stadt."},{type:"meet",itemIds:["der-laden","die-hose","die-schuhe"]},{type:"line",speaker:"rike",text:"Hallo ihr zwei! Pullover sind heute reduziert. Und an den Schuhen dürft ihr euch ruhig sattsehen.",translation:"Hello you two! Sweaters are discounted today. And feel free to feast your eyes on the shoes."},{type:"meet",itemIds:["die-groesse","anprobieren","ich-suche-groesse"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Rike schaut fragend.",options:[{label:"Ich suche eine Jacke in Größe M.",line:"Ich suche eine Jacke in Größe M."},{label:"Kann ich diese Jacke anprobieren?",line:"Kann ich diese Jacke anprobieren?"}]},{type:"line",speaker:"rike",text:"Klar, Umkleide ist da hinten. Sag Bescheid, wenn ich was anderes holen soll.",translation:"Sure, changing room's back there. Let me know if I should fetch something else."},{type:"check",count:2,mode:"recall"},{type:"reading" ",audio:"tts",introducedInScene:"a1e6s1",tags:["time"],cefrLevel:"A1"},{id:"der-abend",type:"word",german:"der Abend",meaning:"the evening",image:"sonnenuntergang",audio:"tts",introducedInScene:"a1e6s2",tags:["time","routine"],cefrLevel:"A1",note:'der, Plural: die Abende — „guten Abend"'},{id:"die-woche",type:"word",german:"die Woche",meaning:"the week",image:"kalender",audio:"tts",introducedInScene:"a1e6s2",tags:["time","routine"],cefrLevel:"A1",note:"die, Plural: die Wochen"},{id:"muede",type:"word",german:"müde",meaning:"tired",image:"bett",audio:"tts",introducedInScene:"a1e6s2",tags:["feelings","routine"],cefrLevel:"A1",note:"Adjektiv — die ehrlichste Antwort auf „Wie geht's?“"},{id:"ich-habe-geschlafen",type:"sentence",german:"Ich habe schlecht geschlafen.",meaning:"I slept badly.",image:"bett",audio:"tts",introducedInScene:"a1e6s2",tags:["routine","health"],cefrLevel:"A1",note:"Perfekt: haben + Partizip am Ende"},{id:"der-sonntag",type:"word",german:"der Sonntag",meaning:"the Sunday",image:"kalender",audio:"tts",introducedInScene:"a1e6s2",tags:["time"],cefrLevel:"A1",note:"der — in Deutschland ein Ruhetag, wirklich"},{id:"jeden-tag",type:"chunk",german:"Jeden Tag ein bisschen.",meaning:"A little bit every day.",image:"kalender",audio:"tts",introducedInScene:"a1e6s2",tags:["routine","learning"],cefrLevel:"A1",note:"Das Prinzip dieses Spiels."},{id:"fruehstueck",type:"word",german:"das Frühstück",meaning:"the breakfast",image:"brot",audio:"tts",introducedInScene:"a1e6s3",tags:["food","routine"],cefrLevel:"A1",note:"das — Frühstück in Deutschland ist ein Ereignis"},{id:"die-zeitschrift",type:"word",german:"die Zeitschrift",meaning:"the magazine",image:"brief",audio:"tts",introducedInScene:"a1e6s3",tags:["media","objects"],cefrLevel:"A1",note:"die, Plural: die Zeitschriften"},{id:"langsam",type:"chunk",german:"Langsam, langsam!",meaning:"Slowly, slowly! / Take it easy!",audio:"tts",introducedInScene:"a1e6s3",tags:["smalltalk"],cefrLevel:"A1"},{id:"gewoehnungssache",type:"word",german:"die Gewöhnungssache",meaning:"a matter of getting used to",image:"idee",audio:"tts",introducedInScene:"a1e6s3",tags:["smalltalk","learning"],cefrLevel:"A1",note:"typisch deutsch: ein Riesenwort für etwas Simples"},{id:"es-wird-licht",type:"sentence",german:"Es wird langsam hell.",meaning:"It's slowly getting light.",image:"sonnenuntergang",audio:"tts",introducedInScene:"a1e6s3",tags:["time","smalltalk"],cefrLevel:"A1"}],Mt=[{id:"a1e6s1",episodeId:"a1e6",title:"Sieben Uhr",titleEn:"Seven o'clock",place:"Wohnung, sehr früher Morgen",bg:"wohnung",contextTags:["routine","home","time"],requiredItems:["das-bett"],introducedItems:["der-tag","der-morgen","der-wecker","aufstehen","um-wie-viel-uhr","spaet"],beats:[{type:"narration",text:"Der Wecker klingelt wie ein Feuerwehreinsatz. Draußen ist es noch grau. Der erste Monat neigt sich dem Ende zu — und du hast beschlossen, dass dein Alltag Struktur braucht."},{type:"meet",itemIds:["der-wecker","aufstehen","der-morgen"]},{type:"narration",text:"Sieben Uhr. Du stehst auf, machst Kaffee und schaust aus dem Fenster: Leipzig im Morgengrau, ein Tramfahrer winkt einen Hundevergängler durch."},{type:"meet",itemIds:["der-tag","um-wie-viel-uhr","spaet"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias tippt dir aufs Handy: „Wann frühstücken wir?“",options:[{label:"Um wie viel Uhr öffnet der Bäcker?",line:"Um wie viel Uhr öffnet der Bäcker?"},{label:"Ich stehe um sieben auf. Danach?",line:"Ich stehe um sieben auf. Danach?"}]},{type:"line",speaker:"tobias",text:"Sechs! …Und du hast schon verpasst. …Scherz. Halb sieben. Aber gehst du lieber früher? Jeder Tag hat nur so viele Stunden.",translation:"Six! …And you already missed it. …Joke. Six thirty. But would you rather go earlier? Every day has only so many hours."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"}]},{id:"a1e6s2",episodeId:"a1e6",title:"Ein deutscher Traum",titleEn:"A German dream",place:"Treppenabsatz, Morgen",bg:"treppenhaus",contextTags:["routine","neighbors","time"],requiredItems:["der-morgen","der-tag"],introducedItems:["der-abend","die-woche","muede","ich-habe-geschlafen","der-sonntag","jeden-tag"],beats:[{type:"narration",text:"Du triffst Tobias auf dem Treppenabsatz — er hat zwei Brötchentüten, du hast dunkle Ringe unter den Augen."},{type:"line",speaker:"tobias",text:"Du siehst müde aus. …Schlecht geschlafen?",translation:"You look tired. …Slept badly?"},{type:"meet",itemIds:["muede","ich-habe-geschlafen","der-abend"]},{type:"choice",prompt:"Ehrliche Antwort.",options:[{label:"Ich habe schlecht geschlafen. Ich war müde.",line:"Ich habe schlecht geschlafen. Der Wecker war zu laut."},{label:"Nein, gut! Ich habe auf Deutsch geträumt.",line:"Nein, gut! Ich habe auf Deutsch geträumt."}]},{type:"line",speaker:"tobias",text:"Auf Deutsch geträumt?! …Bruder. Das ist der Moment. Jetzt hast du es offiziell geschafft.",translation:"You dreamed in German?! …Bro. That's the moment. You've officially made it now."},{type:"meet",itemIds:["die-woche","der-sonntag","jeden-tag"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"tobias",text:"Weißt du, was ich am Anfang gemacht habe? Jeden Tag ein bisschen. Zehn Minuten. Sonntags mehr. Und jetzt: Ich rede mit dir.",translation:"You know what I did at the beginning? A little bit every day. Ten minutes. More on Sundays. And now: I'm talking with you."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Sams Wochenplan (Entwurf 5)",text:`MONTAG   6:30 aufstehen   ·   CAFÉ-PROBE? nein: CAFÉ-JOB
