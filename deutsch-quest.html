The general provisions apply.`,itemIds:["der-aufenthaltstitel","die-gueltigkeit","die-voraussetzung"]}]},{id:"b1e7s2",episodeId:"b1e7",title:"Der Ordner",titleEn:"The folder",place:"Ausländerbehörde, Schalter 7",bg:"amt",contextTags:["admin","paperwork","work"],requiredItems:["das-gehalt"],introducedItems:["die-unterlage","vollstaendig","bearbeiten","die-krankenversicherung-b1","der-arbeitsvertrag","das-einkommen","ich-bewerbe-mich-um"],beats:[{type:"narration",text:"Dein Ordner ist ein Meisterwerk: Register, Locher, Kopien in dreifach. Tobias nennt ihn „den Sachbearbeiter-Killer“. Frau Wolter nennt ihn, nach vier Sekunden, „sehr gut“."},{type:"meet",itemIds:["die-unterlage","vollstaendig","bearbeiten"]},{type:"line",speaker:"wolter",text:"Unterlagen, bitte. …Arbeitsvertrag: vollständig. Gehaltsabrechnungen, drei Monate: vollständig. Krankenversicherung: hier. …Sie haben das Einkommen nachgewiesen wie ein Steuerberater.",translation:"Documents, please. …Employment contract: complete. Payslips, three months: complete. Health insurance: here. …You've documented your income like a tax accountant."},{type:"meet",itemIds:["der-arbeitsvertrag","das-einkommen","die-krankenversicherung-b1"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"wolter",text:"Ein Formular noch. Hier bewerben Sie sich um die Verlängerung — Feld 4, 7 und 12. …Und: Der Antrag wird bearbeitet. Vier bis sechs Wochen.",translation:"One more form. Here you apply for the renewal — fields 4, 7 and 12. …And: the application will be processed. Four to six weeks."},{type:"meet",itemIds:["ich-bewerbe-mich-um"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Frau Wolter: „Noch Fragen?“",options:[{label:"Wie lange dauert die Bearbeitung genau?",line:"Wie lange dauert die Bearbeitung genau? …Vier bis sechs Wochen, habe ich verstanden."},{label:"Brauchen Sie noch weitere Nachweise?",line:"Brauchen Sie noch weitere Nachweise? Ich liefere gern nach."}]},{type:"line",speaker:"wolter",text:"Nein. Ihre Unterlagen sind vollständig. Das schreiben ich selten. …Sie hören von mir. Schriftlich.",translation:"No. Your documents are complete. That's something I rarely write. …You'll hear from me. In writing."},{type:"check",count:2,mode:"recall"}]},{id:"b1e7s3",episodeId:"b1e7",title:"Der Bescheid",titleEn:"The notice",place:"Wohnung, Treppenhaus, wieder",bg:"treppenhaus",contextTags:["admin","feelings","identity"],requiredItems:["die-vermieterin"],introducedItems:["der-bescheid","die-verlaengerung","gueltig","dankbar","der-zeitraum","ich-freue-mich-ueber"],beats:[{type:"narration",text:"Fünf Wochen später. Ein Umschlag mit Wappen. Dein Herz wählt Modus drei: kaputt vor Aufregung. Tobias ist zum Auspacken da, vorgeblich wegen Kaffee."},{type:"meet",itemIds:["der-bescheid","die-verlaengerung","gueltig"]},{type:"line",speaker:"tobias",text:"Auf, auf! …„Hiermit wird der Aufenthaltstitel für den Zeitraum von zwei Jahren verlängert. Gültig bis November 2028.“ …SAM. ZWEI JAHRE.",translation:"Open it! …'The residence permit is hereby extended for a period of two years. Valid until November 2028.' …SAM. TWO YEARS."},{type:"meet",itemIds:["der-zeitraum","dankbar","ich-freue-mich-ueber"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias: „Und, wie fühlt es sich an?“",options:[{label:"Ich bin so dankbar. Und froh.",line:"Ich bin so dankbar. Und froh. Und ein bisschen müde vom Glück."},{label:"Ich freue mich über den Bescheid. Sehr sogar.",line:"Ich freue mich über den Bescheid. Sehr sogar."}]},{type:"line",speaker:"tobias",text:"Zwei Jahre. Weißt du, was man in zwei Jahren alles machen kann? …Alles. Sagt die Erfahrung. Meine.",translation:"Two years. Do you know what you can do in two years? …Everything. Says experience. Mine."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Der Bescheid (Auszug)",text:`Landeshauptstadt Leipzig — Ausländerbehörde

Otherwise: much success and all the best in Leipzig.`,itemIds:["der-bescheid","gueltig","der-zeitraum"]},{type:"narration",text:"Du pinnst den Bescheid neben das Zertifikat. Zwei Papiere, ein Leben. Draußen radelt jemand mit einem Plastiksack vorbei, und du fühlst dich, zum ersten Mal, komplett legal angekommen."}]}],Ls={episode:Bi,cast:Ei,items:xi,scenes:Pi},Ts=Object.freeze(Object.defineProperty({__proto__:null,cast:Ei,default:Ls,episode:Bi,items:xi,scenes:Pi},Symbol.toStringTag,{value:"Module"})),Wi={id:"b1e8",arcId:"B1",cefrLevel:"B1",title:"Das Ehrenamt",titleEn:"Volunteering",blurb:"Ein Plakat an der Bushaltestelle: „Hilf einem Kind beim Lesen.“ Du hast jetzt Zeit, Deutsch und eine einzige freie Thursday-Abend-Lücke.",order:16,sceneIds:["b1e8s1","b1e8s2","b1e8s3"]},Ki=[{id:"berger",name:"Frau Berger",role:"Koordinatorin, Jugendclub Lindenau"},{id:"milo",name:"Milo",role:"Schüler, 10 Jahre"},{id:"tobias",name:"Tobias",role:"Freund"}],_i=[{id:"das-ehrenamt",type:"word",german:"das Ehrenamt",meaning:"volunteering (unpaid civic work)",image:"team",audio:"tts",introducedInScene:"b1e8s1",tags:["community","hobby","friends"],cefrLevel:"B1",note:"das, Plural: die Ehrenämter — Ehrenamt ist die Hälfte des deutschen Soziallebens"},{id:"die-nachhilfe",type:"word",german:"die Nachhilfe",meaning:"the tutoring (extra lessons)",image:"lebenslauf",audio:"tts",introducedInScene:"b1e8s1",tags:["learning","community"],cefrLevel:"B1",note:"die ( Singular ) — Nachhilfe geben = to tutor"},{id:"sich-engagieren",type:"chunk",german:"Ich engagiere mich im Verein.",meaning:"I'm involved with the club.",image:"team",audio:"tts",introducedInScene:"b1e8s1",tags:["community"],cefrLevel:"B1",note:"sich engagieren FÜR etwas — eines der schönsten deutschen Verben"},{id:"die-freizeit",type:"word",german:"die Freizeit",meaning:"the free time",image:"urehr",audio:"tts",introducedInScene:"b1e8s1",tags:["time","hobby"],cefrLevel:"B1",note:"die ( Singular ) — Freizeitgestaltung ist ein echtes deutsches Wort"},{id:"sinnvoll",type:"word",german:"sinnvoll",meaning:"meaningful / sensible",image:"idee",audio:"tts",introducedInScene:"b1e8s1",tags:["opinion"],cefrLevel:"B1",note:"Adjektiv — „Das ist sinnvoll“ = hohes deutsches Lob"},{id:"der-jugendclub",type:"word",german:"der Jugendclub",meaning:"the youth club",image:"fest",audio:"tts",introducedInScene:"b1e8s1",tags:["community","friends"],cefrLevel:"B1",note:"der, Plural: die Jugendclubs"},{id:"der-schueler",type:"word",german:"der Schüler",meaning:"the pupil / student (school)",image:"person",audio:"tts",introducedInScene:"b1e8s2",tags:["learning","people"],cefrLevel:"B1",note:"der, Plural: die Schüler; weiblich: die Schülerin"},{id:"erklaeren",type:"chunk",german:"Kannst du mir das erklären?",meaning:"Can you explain that to me?",image:"gespräch",audio:"tts",introducedInScene:"b1e8s2",tags:["learning","questions"],cefrLevel:"B1",note:"erklären + Dativ + Akkusativ"},{id:"die-geduld",type:"word",german:"die Geduld",meaning:"the patience",image:"ruhe",audio:"tts",introducedInScene:"b1e8s2",tags:["feelings"],cefrLevel:"B1",note:"die ( Singular ) — „Geduld haben“; geduldig = patient"},{id:"vermitteln",type:"chunk",german:"Ich möchte Wissen vermitteln.",meaning:"I want to pass on knowledge.",image:"idee",audio:"tts",introducedInScene:"b1e8s2",tags:["learning","community"],cefrLevel:"B1",note:"vermitteln — Wissen, Werte, auch: Gefühle"},{id:"der-erfolg",type:"word",german:"der Erfolg",meaning:"the success",image:"ziel",audio:"tts",introducedInScene:"b1e8s2",tags:["opinion","feelings"],cefrLevel:"B1",note:"der, Plural: die Erfolge — erfolgreich = successful"},{id:"konzentriert",type:"word",german:"konzentriert",meaning:"concentrated / focused",image:"prüfen",audio:"tts",introducedInScene:"b1e8s2",tags:["learning"],cefrLevel:"B1"},{id:"das-sommerfest",type:"word",german:"das Sommerfest",meaning:"the summer party",image:"fest",audio:"tts",introducedInScene:"b1e8s3",tags:["community","celebration"],cefrLevel:"B1",note:"das, Plural: die Sommerfeste"},{id:"das-miteinander",type:"word",german:"das Miteinander",meaning:"togetherness / dealing with each other",image:"team",audio:"tts",introducedInScene:"b1e8s3",tags:["community","opinion"],cefrLevel:"B1",note:"das ( Singular ) — Miteinander statt Gegeneinander"},{id:"der-dank",type:"word",german:"der Dank",meaning:"the thanks / gratitude",image:"geschenk",audio:"tts",introducedInScene:"b1e8s3",tags:["politeness","feelings"],cefrLevel:"B1",note:"der ( Singular ) — „Vielen Dank“, „Als Dank…“"},{id:"wertvoll",type:"word",german:"wertvoll",meaning:"valuable",image:"geld",audio:"tts",introducedInScene:"b1e8s3",tags:["opinion"],cefrLevel:"B1"},{id:"die-verstaendigung",type:"word",german:"die Verständigung",meaning:"the (mutual) understanding",image:"gespräch",audio:"tts",introducedInScene:"b1e8s3",tags:["community","language"],cefrLevel:"B1",note:"die ( Singular ) — Verständigung ist das Ziel jeder Sprache"},{id:"vorher-hatte-ich-nie",type:"grammar_pattern",german:"Vorher ___ ich nie in einem Verein mitgearbeitet.",meaning:"Before that, I had never worked with a club.",image:"kalender",audio:"tts",introducedInScene:"b1e8s3",tags:["grammar","community"],cefrLevel:"B1",cloze:"hatte",speak:"Vorher hatte ich nie in einem Verein mitgearbeitet.",note:"Plusquamperfekt: hatte + Partizip — die Vorvergangenheit für Erzählungen"}],Fi=[{id:"b1e8s1",episodeId:"b1e8",title:"Das Plakat",titleEn:"The poster",place:"Bushaltestelle Lindenau",bg:"strasse",contextTags:["community","hobby","city"],requiredItems:["der-verein"],introducedItems:["das-ehrenamt","die-nachhilfe","sich-engagieren","die-freizeit","sinnvoll","der-jugendclub"],beats:[{type:"narration",text:"An der Bushaltestelle, zwischen Pizza-Flyer und Konzertplakat, hängt ein Zettel in Kinderschrift: „Ich kann nicht gut lesen. Kannst du mir helfen? — Milo, 10.“ Darunter: Jugendclub Lindenau, donnerstags 16 Uhr."},{type:"meet",itemIds:["das-ehrenamt","die-nachhilfe","der-jugendclub"]},{type:"line",speaker:"tobias",text:"Ah, du hast Fango gefangen. Ehrenamt. …Ich war da mal, aufs Mal lauern die besten Sachen. Donnerstags, zwei Stunden. Deine Freizeit wäre das — aber deine GUTE Zeit.",translation:"Ah, you've been hooked. Volunteering. …I did that once — the best things lurk on posters like this. Thursdays, two hours. It'd be your free time — but your GOOD time."},{type:"meet",itemIds:["die-freizeit","sich-engagieren","sinnvoll"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Die Bushaltestelle wartet. Milo auch.",options:[{label:"Ich ruf da an. Das ist sinnvoll.",line:"Ich ruf da an. Das ist sinnvoll — für mich und für Milo."},{label:"Donnerstags? Ich sehe nach meinem Kalender.",line:"Donnerstags? …Ich sehe nach meinem Kalender. …Er sagt ja."}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Das Plakat (ganz)",text:`JUGENDCLUB LINDENAU — EHRENAMT GESUCHT

Wir suchen Menschen mit Zeit und Geduld.
Nachhilfe für Kinder (Lesen, Schreiben, Mathe).
Donnerstags 16–18 Uhr, Vereinsraum Bärbelstraße.

»Ich kann nicht gut lesen. Kannst du mir helfen?«
— Milo, 10

Interesse? Sprich uns an oder komm einfach vorbei.
Ehrenamt heißt: freiwillig, aber nicht egal.`,translation:`LINDENAU YOUTH CLUB — VOLUNTEERS WANTED

We're looking for people with time and patience.
Tutoring for children (reading, writing, maths).
Thursdays 4–6 pm, club room Bärbelstraße.

'I can't read well. Can you help me?'
— Milo, 10

Interested? Talk to us or just come by.
Volunteering means: voluntary, but not indifferent.`,itemIds:["das-ehrenamt","die-nachhilfe","der-jugendclub"]}]},{id:"b1e8s2",episodeId:"b1e8",title:"Milo",titleEn:"Milo",place:"Jugendclub, Donnerstag 16:00",bg:"buero",contextTags:["community","learning"],requiredItems:["das-ehrenamt","die-nachhilfe"],introducedItems:["der-schueler","erklaeren","die-geduld","vermitteln","der-erfolg","konzentriert"],beats:[{type:"narration",text:"Vereinsraum: gefleckte Teppiche, ein Bücherregal, ein Luftballon aus einem vergangenen Geburtstag. Milo sitzt mit einem Buch, das ihn unverblümt hasst."},{type:"line",speaker:"berger",text:"Du musst der Neue sein. Ich bin Frau Berger. …Und da drüben: Milo. Er ist zehnte Klasse, er ist schlau — und die Buchstaben ordnen sich einfach nicht wie er will. Geduld ist Ihre Superkraft heute.",translation:"You must be the new one. I'm Ms Berger. …And over there: Milo. He's smart — and the letters just won't order themselves the way he wants. Patience is your superpower today."},{type:"meet",itemIds:["der-schueler","die-geduld","konzentriert"]},{type:"line",speaker:"milo",text:"Du bist also mein Nachhilfe-Mensch. …Kannst du mir das erklären? Das hier — „th“ im Englischen und „ch“ im Deutschen — das ist alles Quatsch.",translation:"So you're my tutoring person. …Can you explain that to me? This — 'th' in English and 'ch' in German — it's all nonsense."},{type:"meet",itemIds:["erklaeren","vermitteln","der-erfolg"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Milo starrt auf das Wort „konzentriert“.",options:[{label:"Sag es laut vor — Silbe für Silbe. Dann bin ich dran.",line:"Sag es laut vor, Silbe für Silbe. Dann lese ich es — und dann liest DU es."},{label:"Das Wort ist Quatsch. Du hast recht. Aber lesen wir's trotzdem.",line:"Das Wort ist Quatsch. Du hast recht. …Aber lesen wir es trotzdem."}]},{type:"line",speaker:"milo",text:"Kon-zent-riert. …KON-zent-RIERT! …Habe ich das gerade GELESEN?!",translation:"Con-cen-trat-ed. …I just READ that?!"},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Milos Notizzettel (konzentriert gefaltet)",text:`konzentriert = kon-zent-riert (3 Teile)
Geduld = wenn Sam nicht genervt ist
Erfolg = wenn es klick macht

Nächstes Mal: das Wort „vermutlich“
(das klingt wie Vermutung, und Vermutungen sind oft falsch)`,translation:`konzentriert = con-cen-trat-ed (3 parts)
Geduld (patience) = when Sam isn't annoyed
Erfolg (success) = when it clicks

Next time: the word 'vermutlich'
(it sounds like Vermutung/assumption, and assumptions are often wrong)`,itemIds:["konzentriert","die-geduld","der-erfolg"]}]},{id:"b1e8s3",episodeId:"b1e8",title:"Sommerfest des Vereins",titleEn:"The club's summer party",place:"Hof hinter dem Vereinsraum",bg:"fest",contextTags:["community","celebration","friends"],requiredItems:["das-spiel","das-grillfest"],introducedItems:["das-sommerfest","das-miteinander","der-dank","wertvoll","die-verstaendigung","vorher-hatte-ich-nie"],beats:[{type:"narration",text:"Drei Monate später. Der Hof des Jugendclubs: Girlanden, Waffelgeruch, ein Hund mit Namensschild („Kartoffel“). Milo liest das Waffelmenu laut vor — fehlerfrei und mit Betonung."},{type:"meet",itemIds:["das-sommerfest","das-miteinander","die-verstaendigung"]},{type:"line",speaker:"berger",text:"Kurz, alle! Milo hat dieses Jahr vom „kann nicht“ zum „hört mal zu“ gelesen. …Und unser neuer Ehrenamtler hier? Der hat Geduld, Humor und einen seltsam deutschen Akzent bei manchen Wörtern. Aber der passt.",translation:"Quick, everyone! This year Milo went from 'can't' to 'listen up' with his reading. …And our new volunteer here? He's got patience, humour, and a strangely German accent with some words. But he fits."},{type:"meet",itemIds:["der-dank","wertvoll","vorher-hatte-ich-nie"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Milo gibt dir eine Waffel. Ganz.",options:[{label:"Vorher hatte ich nie in einem Verein mitgearbeitet. Jetzt weiß ich warum nicht — sonst hätte ich's früher gemacht.",line:"Vorher hatte ich nie in einem Verein mitgearbeitet. Jetzt weiß ich, was ich verpasst habe."},{label:"Der Dank ist deine Waffel. Wertvollster Dank des Jahres.",line:"Der Dank ist diese Waffel. Der wertvollste Dank des Jahres."}]},{type:"line",speaker:"milo",text:"Sam? …Wenn du mal wieder Deutsch lernen willst: Ich erklär's dir. Ich bin jetzt nämlich gut in Buchstaben.",translation:"Sam? …If you ever want to learn German again: I'll explain it to you. I'm good with letters now, you see."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Newsletter des Jugendclubs (Auszug)",text:`Lindenau liest — Sommerrückblick

Unser Leseprogramm: 14 Kinder, 9 Ehrenamtliche,
unzählige Buchstaben. Besonderer Dank an Sam,
der jeden Donnerstag mit Waffeln und Geduld da war.

»Verständigung beginnt mit jemandem, der zuhört.«

Nächstes Jahr wieder — das Miteinander macht den Verein.`,translation:`Lindenau reads — summer review

Our reading programme: 14 children, 9 volunteers,
countless letters. Special thanks to Sam,
who was there every Thursday with waffles and patience.

'Understanding begins with someone who listens.'

Again next year — the togetherness is what makes the club.`,itemIds:["die-verstaendigung","das-miteinander","der-dank"]},{type:"narration",text:"Abendsonne über dem Hof. Du hast zwei Sprachen, einen Verein, einen Schüler, der jetzt laut liest — und das Gefühl, dass Leipzig langsam anfängt, dich zurückzuholen."}]}],Ms={episode:Wi,cast:Ki,items:_i,scenes:Fi},Ds=Object.freeze(Object.defineProperty({__proto__:null,cast:Ki,default:Ms,episode:Wi,items:_i,scenes:Fi},Symbol.toStringTag,{value:"Module"})),Hi={id:"b1e9",arcId:"B1",cefrLevel:"B1",title:"Das Tandem",titleEn:"The tandem (language exchange)",blurb:"Sprachcafé im Café Luise: eine Frau namens Sara mit Madrid-Akzent und einem Plan — du sprichst Spanisch, sie Deutsch, beide korrigieren. Sowohl als auch.",order:17,sceneIds:["b1e9s1","b1e9s2","b1e9s3"]},Ni=[{id:"sara",name:"Sara",role:"Tandem-Partnerin aus Madrid"},{id:"mei",name:"Mei",role:"Kollegin im Café"},{id:"luise",name:"Luise",role:"Café-Besitzerin"}],Gi=[{id:"das-sprachcafe",type:"word",german:"das Sprachcafé",meaning:"the language café (meetup)",image:"kaffee",audio:"tts",introducedInScene:"b1e9s1",tags:["language","learning","friends"],cefrLevel:"B1",note:"das, Plural: die Sprachcafés — Tische mit Sprachetiketten"},{id:"das-tandem",type:"word",german:"das Tandem",meaning:"the tandem (language exchange; also: bicycle for two)",image:"team",audio:"tts",introducedInScene:"b1e9s1",tags:["language","learning"],cefrLevel:"B1",note:"das, Plural: die Tandems — zwei Personen, ein Ziel"},{id:"die-muttersprache",type:"word",german:"die Muttersprache",meaning:"the native language / mother tongue",image:"heimat",audio:"tts",introducedInScene:"b1e9s1",tags:["language"],cefrLevel:"B1",note:"die, Plural: die Muttersprachen — Sara: Spanisch"},{id:"der-akzent",type:"word",german:"der Akzent",meaning:"the accent",image:"mic",audio:"tts",introducedInScene:"b1e9s1",tags:["language"],cefrLevel:"B1",note:"der, Plural: die Akzente — ein Akzent ist eine Biografie"},{id:"der-fehler",type:"word",german:"der Fehler",meaning:"the mistake",image:"prüfen",audio:"tts",introducedInScene:"b1e9s1",tags:["language","learning"],cefrLevel:"B1",note:"der, Plural: die Fehler — Fehler machen = Fortschritt machen"},{id:"die-neugier",type:"word",german:"die Neugier",meaning:"the curiosity",image:"idee",audio:"tts",introducedInScene:"b1e9s1",tags:["feelings","learning"],cefrLevel:"B1",note:"die ( Singular ) — neugierig auf + Akkusativ"},{id:"korrigieren",type:"word",german:"korrigieren",meaning:"to correct",image:"prüfen",audio:"tts",introducedInScene:"b1e9s2",tags:["language","learning"],cefrLevel:"B1",note:"korrigieren — bitte korrigier mich!"},{id:"die-aussprache",type:"word",german:"die Aussprache",meaning:"the pronunciation",image:"laut",audio:"tts",introducedInScene:"b1e9s2",tags:["language"],cefrLevel:"B1",note:"die ( Singular ) — Eier, Ehre, Eule: guter Test"},{id:"uebersetzen",type:"word",german:"übersetzen",meaning:"to translate",image:"buch",audio:"tts",introducedInScene:"b1e9s2",tags:["language"],cefrLevel:"B1",note:"übersetzen — auch (Schiff!): übersetzen; Kontext entscheidet"},{id:"das-woerterbuch",type:"word",german:"das Wörterbuch",meaning:"the dictionary",image:"buch",audio:"tts",introducedInScene:"b1e9s2",tags:["language","learning"],cefrLevel:"B1",note:"das, Plural: die Wörterbücher — Papier schlägt App beim lernen"},{id:"der-wortschatz",type:"word",german:"der Wortschatz",meaning:"the vocabulary",image:"konzept",audio:"tts",introducedInScene:"b1e9s2",tags:["language","learning"],cefrLevel:"B1",note:"der ( Singular ) — der Wortschatz wächst, wenn man ihn benutzt"},{id:"sowohl-als-auch",type:"grammar_pattern",german:"___ Sara als auch Mei lernen gern mit mir.",meaning:"Both Sara and Mei like learning with me.",image:"team",audio:"tts",introducedInScene:"b1e9s2",tags:["grammar","learning"],cefrLevel:"B1",cloze:"Sowohl",speak:"Sowohl Sara als auch Mei lernen gern mit mir.",note:"sowohl … als auch — verbindet zwei Dinge auf B1-Niveau"},{id:"gegenseitig",type:"word",german:"gegenseitig",meaning:"mutual / each other",image:"team",audio:"tts",introducedInScene:"b1e9s3",tags:["language","friends"],cefrLevel:"B1",note:"Adverb — wir helfen uns gegenseitig"},{id:"die-motivation",type:"word",german:"die Motivation",meaning:"the motivation",image:"ziel",audio:"tts",introducedInScene:"b1e9s3",tags:["learning","feelings"],cefrLevel:"B1",note:"die, Plural: die Motivationen — kommt und geht; Systeme bleiben"},{id:"das-sprachgefuehl",type:"word",german:"das Sprachgefühl",meaning:"the (innate) feel for language",image:"idee",audio:"tts",introducedInScene:"b1e9s3",tags:["language"],cefrLevel:"B1",note:"das ( Singular ) — kommt mit der Zeit, nicht mit dem Wörterbuch"},{id:"die-wiederholung",type:"word",german:"die Wiederholung",meaning:"the repetition / review",image:"kalender",audio:"tts",introducedInScene:"b1e9s3",tags:["learning"],cefrLevel:"B1",note:"die, Plural: die Wiederholungen — der Motor deines Schedulers"},{id:"mutig",type:"word",german:"mutig",meaning:"brave / courageous",image:"mic",audio:"tts",introducedInScene:"b1e9s3",tags:["feelings"],cefrLevel:"B1",note:"Adjektiv — mutig sein + beim Sprechen helfen"},{id:"der-spass",type:"word",german:"der Spaß",meaning:"the fun",image:"fest",audio:"tts",introducedInScene:"b1e9s3",tags:["feelings","learning"],cefrLevel:"B1",note:"der ( Singular ) — Spaß machen + Dativ"}],Ri=JSON.parse(`[{"id":"b1e9s1","episodeId":"b1e9","title":"Sprachcafé","titleEn":"Language café","place":"Café Luise, Donnerstag 19:00","bg":"cafe","contextTags":["language","friends","learning"],"requiredItems":["hast-du-lust","die-meinung"],"introducedItems":["das-sprachcafe","das-tandem","die-muttersprache","der-akzent","der-fehler","die-neugier"],"beats":[{"type":"narration","text":"Donnerstagabend, Café Luise: Luise hat die Tische mit Schildchen bestückt — „English“, „Español“, „Deutsch/hier falsch, aber herzlich“. Mei hat drei Kännchen Kaffee und ein Mikrofon-Verbot durchgesetzt."},{"type":"line","speaker":"luise","text":"Sprachcafé, erster Versuch. …Regeln: Wer Fehler macht, kriegt Kaffee. Wer keine macht, redet zu wenig. …Und jetzt sei ruhig mutig, ja? Da hinten sitzt übrigens jemand, der Spanisch will und Deutsch hat.","translation":"Language café, first attempt. …Rules: anyone making mistakes gets coffee. Anyone making none isn't talking enough. …And now be brave, yes? Over there sits someone who wants Spanish and has German."},{"type":"meet","itemIds":["das-sprachcafe","der-fehler","die-neugier"]},{"type":"line","speaker":"sara","text":"Hola. Sara. Aus Madrid, seit April hier. …Ich lerne Deutsch mit einer App, die mich wie ein Kind behandelt. Ich will ein Tandem — du sprichst Spanisch, ich Deutsch, und wir korrigieren uns gegenseitig. Also: gegenseitig brutal ehrlich.","translation":"Hola. Sara. From Madrid, here since April. …I'm learning German with an app that treats me like a child. I want a tandem — you speak Spanish, I German, and we correct each other. Well: mutually, brutally honest."},{"type":"meet","itemIds":["das-tandem","die-muttersprache","der-akzent"]},{"type":"check","count":2,"mode":"mixed"},{"type":"choice","prompt":"Sara reicht die Hand. Ihr Akzent bei „Tandem“ ist besser als deiner.","options":[{"label":"Deal. Aber: Korrigier mich sofort, nicht irgendwann.","line":"Deal. Aber: Korrigier mich sofort, nicht irgendwann. …Sara: „Deal. Und du mich auch. Sofort ist auch mein Stil.“"},{"label":"Erst ein Kaffee. Dann das Tandem. Dann die Ehrlichkeit.","line":"Erst ein Kaffee, dann das Tandem, dann die Ehrlichkeit. …In dieser Reihenfolge. Sara nickt: „Sehr deutsch.“"}]},{"type":"check","count":2,"mode":"recall"},{"type":"line","speaker":"mei","text":"Ich hab zugehört. …Sam, dein Spanisch hat einen Leipziger Akzent. Das heißt, du hast jetzt EINE Muttersprache, EINE Zweitsprache und EINEN Akzent auf Rädern. Ich hab das Schildchen „Español“ schon eingeframt.","translation":"I was listening. …Sam, your Spanish has a Leipzig accent. That means you now have ONE native language, ONE second language and ONE accent on wheels. I already framed the 'Español' table sign."},{"type":"reading","title":"Tischaufsteller: Sprachcafé","text":"WIE DAS HIER FUNKTIONIERT:\\n\\n1. Nimm ein Schildchen. Deine Sprache.\\n2. Setz dich an den anderen Tisch.\\n3. Fehler sind Eintrittskarten, keine Schande.\\n4. Korrigieren erlaubt. Freundlich formulierte Wahrheit.\\n\\n»Ein Tandem braucht zwei.\\n Die Hälfte der Zeit gehört der anderen Sprache.«","translation":"HOW THIS WORKS:\\n\\n1. Take a table sign. Your language.\\n2. Sit at the other table.\\n3. Mistakes are entry tickets, not shame.\\n4. Correcting allowed. Kindly worded truth.\\n\\n'A tandem needs two.\\nHalf the time belongs to the other language.'","itemIds":["das-sprachcafe","das-tandem","der-fehler"]}]},{"id":"b1e9s2","episodeId":"b1e9","title":"Halbe Zeit, halbe Sprache","titleEn":"Half time, half language","place":"Clara-Zetkin-Park, Samstag 10:00","bg":"park","contextTags":["language","learning","friends"],"requiredItems":["die-geduld","die-frage"],"introducedItems":["korrigieren","die-aussprache","uebersetzen","das-woerterbuch","der-wortschatz","sowohl-als-auch"],"beats":[{"type":"narration","text":"Clara-Zetkin-Park, Bank mit Sicht auf Radfahrer und einen Mann mit äußerst optimalem Frisbee-Wurf. Regel des Tandems: 25 Minuten Deutsch, 25 Minuten Spanisch. Ein Wecker als Schiedsrichter."},{"type":"line","speaker":"sara","text":"Regel eins: Du korrigierst mich sofort. Regel zwei: Ich korrigiere dich sofort. Regel drei: Wörterbuch erst NACH dem dritten Versuch. …Los: „Ich bin seit zwei Jahren in Leipzig.“?","translation":"Rule one: you correct me immediately. Rule two: I correct you immediately. Rule three: dictionary only AFTER the third attempt. …Go: 'Ich bin seit zwei Jahren in Leipzig.'?"},{"type":"meet","itemIds":["korrigieren","die-aussprache","der-wortschatz"]},{"type":"line","speaker":"sara","text":"Fast. „Seit zweiJahren“ — mit Fugen-s. Und: „seit zwei Jahren“ ist gut! …Jetzt du: Übersetz mir „la libreta“. Nicht ins Wörterbuch. Ins Deutsche. Aus dem Kopf.","translation":"Almost. 'seit zweiJahren' — with the joint s. And: 'seit zwei Jahren' is good! …Now you: translate 'la libreta' for me. Not into the dictionary. Into German. From memory."},{"type":"meet","itemIds":["uebersetzen","das-woerterbuch","sowohl-als-auch"]},{"type":"check","count":2,"mode":"mixed"},{"type":"choice","prompt":"Sara zählt deine Fehler heute auf: sieben. Sie lächelt dabei.","options":[{"label":"Sieben? Also bin ich schneller geworden.","line":"Sieben? Also bin ich schneller geworden — letzte Woche wären es zwölf und eine Flucht gewesen."},{"label":"Schreib sie auf. Alle. Ich sammle sie wie Pokale.","line":"Schreib sie auf, alle. Ich sammle sie wie Pokale. …Sara: „Dann brauchst du ein größeres Regal.“"}]},{"type":"line","speaker":"sara","text":"Weißt du, was ich an Deutsch liebe? Es gibt Wörter wie „Doch“. Ein ganzes Wort für Widerspruch. …Meine Theorie: Sowohl mein Deutsch als auch dein Spanisch werden besser, weil wir beide mutig genug sind, dumm zu klingen.","translation":"You know what I love about German? There are words like 'Doch'. A whole word for contradiction. …My theory: both my German and your Spanish get better because we're both brave enough to sound stupid."},{"type":"check","count":2,"mode":"listen"},{"type":"reading","title":"Nachricht von Sara (Gruppenchat „Tandem“)","text":"Sara: Heute gelernt:\\n— „doch“ ≠ „pero“ (trotzdem anders!)\\n— Sam: der Unterschied zwischen\\n  „können“ und „dürfen“ = Fragewort\\n— ich: „der Arm“, nicht „das Arm“\\n  (Arme haben kein Geschlecht,\\n   laut Sam. Falsch, aber logisch.)\\n\\nNächste Woche: Präteritum-Tag.\\nBringe Trauerflor mit. 😂","translation":"Sara: Today we learned:\\n— 'doch' ≠ 'pero' (different anyway!)\\n— Sam: the difference between\\n  'können' and 'dürfen' = question word\\n— me: 'der Arm', not 'das Arm'\\n  (arms have no gender,\\n   according to Sam. Wrong, but logical.)\\n\\nNext week: preterite day.\\nBring mourning crepe. 😂"}]},{"id":"b1e9s3","episodeId":"b1e9","title":"Fehler sind Freunde","titleEn":"Mistakes are friends","place":"Café Luise, ein Monat später","bg":"cafe","contextTags":["language","friends","reflection"],"requiredItems":["die-verstaendigung","der-erfolg"],"introducedItems":["gegenseitig","die-motivation","das-sprachgefuehl","die-wiederholung","mutig","der-spass"],"beats":[{"type":"narration","text":"Ein Monat später. Vier Tandem-Termine, ein fehlgeschlagener Spanisch-Filmabend (Untertitel: deutsch, Sprache: spanisch, Verständnis: kreativ), und ein neues Gefühl: Sätze kommen, bevor du sie suchst."},{"type":"line","speaker":"sara","text":"Sam. Vor vier Wochen hast du gefragt, ob das Café „zu“ ist. Heute hast du der Kellnerin erklärt, warum du keinen Milchschaum willst, mit Ausnahme und alles. …Das ist nicht nur Wortschatz. Das ist Sprachgefühl, das wächst.","translation":"Sam. Four weeks ago you asked if the café was 'zu'. Today you explained to the waitress why you don't want milk foam, with a subordinate clause and everything. …That's not just vocabulary. That's a feel for the language that's growing."},{"type":"meet","itemIds":["das-sprachgefuehl","gegenseitig","der-spass"]},{"type":"line","speaker":"sara","text":"Mein Rezept? …Wiederholung. Nicht die fromme Art — die tägliche. Zehn Minuten, jeden Tag, laut. Und: Mut. Ein Fehler pro Satz ist mein Minimum. …Und Spaß. Wenn es keinen Spaß macht, springt die Motivation ab.","translation":"My recipe? …Repetition. Not the pious kind — the daily kind. Ten minutes, every day, out loud. And: courage. One mistake per sentence is my minimum. …And fun. When it's no fun, motivation jumps off."},{"type":"meet","itemIds":["die-wiederholung","die-motivation","mutig"]},{"type":"check","count":2,"mode":"mixed"},{"type":"choice","prompt":"Sara: „Was war dein größter Fehler diese Woche?“","options":[{"label":"Ich habe der Postbotin „Guten Tag“ um 22 Uhr gesagt.","line":"Ich habe der Postbotin „Guten Tag“ um 22 Uhr gesagt. Sie hat gelacht. Ich auch. Fortschritt."},{"label":"Ich habe „hohl“ statt „hol“ gesagt. Beim Holzkauf.","line":"Ich habe „hohl“ statt „hol“ gesagt. Beim Holzkauf. …Der Baumarkt-Mann heißt jetzt bei mir: der Höhlen-Holz-Herr."}]},{"type":"line","speaker":"luise","text":"(stellt Kaffee hin, ohne zu fragen) Ihr zwei redet inzwischen wie ein Ehepaar, nur mit Grammatik. …Sam, dein Deutsch klingt neuerdings nach Erfolg. Das ist neu. Das gefällt mir.","translation":"(brings coffee without being asked) You two talk like a married couple now, just with grammar. …Sam, your German sounds like success these days. That's new. I like it."},{"type":"check","count":2,"mode":"recall"},{"type":"reading","title":"Saras Nachricht (Gruppenchat)","text":"Monats-Hausaufgabe, beide Richtungen:\\n\\nSam → Spanisch: ein Anruf ohne Google.\\nSara → Deutsch: ein Witz, der funktioniert.\\n\\nRegel: gegenseitig korrigieren, gegenseitig loben.\\nMotivation folgt Geld nicht, aber Kaffee.\\nUnd: MUTIG bleiben. Ein Fehler pro Satz, Minimum.","translation":"Monthly homework, both directions:\\n\\nSam → Spanish: one phone call without Google.\\nSara → German: one joke that lands.\\n\\nRule: correct each other, praise each other.\\nMotivation doesn't follow money, but it follows coffee.\\nAnd: stay BRAVE. One mistake per sentence, minimum.","itemIds":["gegenseitig","die-motivation","mutig"]},{"type":"narration","text":"Auf dem Heimweg denkst du an Sara Theorie zurück: mutig genug, dumm zu klingen. Genau das macht der Scheduler jeden Tag mit dir — stellt die richtige Frage, kurz bevor du sie vergisst. Gegenseitig. Wie ein Tandem."}]}]`),Bs={episode:Hi,cast:Ni,items:Gi,scenes:Ri},Es=Object.freeze(Object.defineProperty({__proto__:null,cast:Ni,default:Bs,episode:Hi,items:Gi,scenes:Ri},Symbol.toStringTag,{value:"Module"})),ji={id:"b2e1",arcId:"B2",cefrLevel:"B2",title:"Café Luise macht Pläne",titleEn:"Café Luise makes plans",blurb:"Ein Hinterhof-Anbau, Zahlen, ein Pitch. Du hältst deine erste Präsentation — auf Deutsch, vor Publikum.",order:13,sceneIds:["b2e1s1","b2e1s2","b2e1s3"]},Ci=[{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"mei",name:"Mei",role:"Kollegin"},{id:"marek",name:"Marek",role:"Kollege, Backstube"}],$i=[{id:"der-vorschlag",type:"word",german:"der Vorschlag",meaning:"the proposal / suggestion",image:"idee",audio:"tts",introducedInScene:"b2e1s1",tags:["meeting","planning","work"],cefrLevel:"B2",note:"der, Plural: die Vorschläge"},{id:"ich-schlage-vor",type:"grammar_pattern",german:"Ich schlage vor, ___.",meaning:"I propose that ___.",audio:"tts",introducedInScene:"b2e1s1",tags:["meeting","planning","opinion"],cefrLevel:"B2",cloze:"wir testen es im April",alt:"wir starten im April",speak:"Ich schlage vor, wir testen es im April.",note:"schlagen vor + Nebensatz mit Verb am Ende"},{id:"das-ziel",type:"word",german:"das Ziel",meaning:"the goal / target",image:"ziel",audio:"tts",introducedInScene:"b2e1s1",tags:["meeting","planning"],cefrLevel:"B2",note:"das, Plural: die Ziele"},{id:"der-umsatz",type:"word",german:"der Umsatz",meaning:"the revenue / turnover",image:"budget",audio:"tts",introducedInScene:"b2e1s1",tags:["meeting","money","work"],cefrLevel:"B2",note:"der, Plural: die Umsätze"},{id:"was-haltet-ihr-davon",type:"sentence",german:"Was haltet ihr davon?",meaning:"What do you think of it? (to a group)",audio:"tts",introducedInScene:"b2e1s1",tags:["meeting","opinion"],cefrLevel:"B2"},{id:"die-praesentation",type:"word",german:"die Präsentation",meaning:"the presentation",image:"präsentation",audio:"tts",introducedInScene:"b2e1s2",tags:["work","meeting"],cefrLevel:"B2",note:"die, Plural: die Präsentationen"},{id:"das-konzept",type:"word",german:"das Konzept",meaning:"the concept",image:"konzept",audio:"tts",introducedInScene:"b2e1s2",tags:["work","planning"],cefrLevel:"B2",note:"das, Plural: die Konzepte"},{id:"die-kennzahl",type:"word",german:"die Kennzahl",meaning:"the key figure / metric",image:"prüfen",audio:"tts",introducedInScene:"b2e1s2",tags:["work","money"],cefrLevel:"B2",note:"die, Plural: die Kennzahlen"},{id:"die-kundschaft",type:"word",german:"die Kundschaft",meaning:"the clientele / customers",image:"kunde",audio:"tts",introducedInScene:"b2e1s2",tags:["work","cafe"],cefrLevel:"B2",note:"die ( Singular, Sammelbegriff )"},{id:"die-zahlen-ueberzeugen",type:"chunk",german:"Die Zahlen überzeugen.",meaning:"The numbers are convincing.",audio:"tts",introducedInScene:"b2e1s2",tags:["meeting","money","opinion"],cefrLevel:"B2"},{id:"die-entscheidung",type:"word",german:"die Entscheidung",meaning:"the decision",image:"entscheidung",audio:"tts",introducedInScene:"b2e1s3",tags:["meeting","planning"],cefrLevel:"B2",note:'die, Plural: die Entscheidungen — „eine Entscheidung treffen"'},{id:"das-budget",type:"word",german:"das Budget",meaning:"the budget",image:"budget",audio:"tts",introducedInScene:"b2e1s3",tags:["money","planning"],cefrLevel:"B2"},{id:"die-verantwortung",type:"word",german:"die Verantwortung",meaning:"the responsibility",image:"kaution",audio:"tts",introducedInScene:"b2e1s3",tags:["work","career"],cefrLevel:"B2",note:'die ( Singular ) — „Verantwortung übernehmen"'},{id:"wir-haben-entschieden",type:"sentence",german:"Wir haben entschieden: Wir wagen es.",meaning:"We've decided: we'll dare to do it.",audio:"tts",introducedInScene:"b2e1s3",tags:["meeting","planning"],cefrLevel:"B2"},{id:"das-ist-mutig",type:"chunk",german:"Das ist mutig.",meaning:"That's brave.",audio:"tts",introducedInScene:"b2e1s3",tags:["opinion","smalltalk"],cefrLevel:"B2",note:"Kann Kompliment sein. Kann auch Warnung sein. Kontext!"}],Ui=[{id:"b2e1s1",episodeId:"b2e1",title:"Das Team-Meeting",titleEn:"The team meeting",place:"Café Luise, nach Schluss, Theke als Tisch",bg:"cafe",contextTags:["work","meeting","planning"],requiredItems:["die-stelle"],introducedItems:["der-vorschlag","ich-schlage-vor","das-ziel","der-umsatz","was-haltet-ihr-davon"],beats:[{type:"narration",text:'Abend. Stühle auf den Tischen, einer bleibt unten: Teamrunde. Luise hat eine Excel-Tabelle und einen Namen für den Hinterhof: „Luises Zweiter".'},{type:"line",speaker:"luise",text:"Kurz und ehrlich: Der Umsatz stimmt, aber wir platzen aus allen Nähten. Ideen?",translation:"Brief and honest: revenue is fine, but we're bursting at the seams. Ideas?"},{type:"meet",itemIds:["der-umsatz","das-ziel","der-vorschlag"]},{type:"meet",itemIds:["ich-schlage-vor","was-haltet-ihr-davon"]},{type:"choice",prompt:"Alle schauen dich an. Du hast einen Plan.",options:[{label:"Ich schlage vor, wir testen es im April.",line:"Ich schlage vor, wir testen den Anbau im April — klein und reversibel."},{label:"Mein Ziel: mehr Plätze draußen.",line:"Mein Ziel wäre: mehr Plätze draußen, weniger Risiko drinnen."}]},{type:"line",speaker:"mei",text:"Ich find's gut. Marek? …Marek findet alles gut, was Mehl enthält. — Sam, rechnest du das mal aus?",translation:"I like it. Marek? …Marek likes everything containing flour. — Sam, will you work out the numbers?"},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"narration",text:"Du gehst mit einer Aufgabe nach Hause: Zahlen. Auf Deutsch rechnen, plausch­halber schrecklicher als reden. Aber du hast ja Kennzahlen."}]},{id:"b2e1s2",episodeId:"b2e1",title:"Die Präsentation",titleEn:"The presentation",place:"Café Luise, hintere Stube, Beamer vom Flohmarkt",bg:"buero",contextTags:["work","presentation","meeting"],requiredItems:["das-ziel","der-vorschlag"],introducedItems:["die-praesentation","das-konzept","die-kennzahl","die-kundschaft","die-zahlen-ueberzeugen"],beats:[{type:"narration",text:"Drei Folien, eine Lampe, vier Zuhörer. Deine Vorbereitung hängt am Kühlschrank seit einer Woche. Die Hände sind kalt, die Kennzahlen sind heiß."},{type:"meet",itemIds:["die-praesentation","das-konzept","die-kennzahl"]},{type:"line",speaker:"luise",text:"Also los. Ich höre.",translation:"Go ahead. I'm listening."},{type:"choice",prompt:"Tiefer Atem. Folie eins.",options:[{label:"Unser Konzept in drei Sätzen.",line:"Unser Konzept in drei Sätzen: mehr Platz, gleiche Küche, gleiche Preise."},{label:"Ich fange mit den Zahlen an.",line:"Ich fange mit den Zahlen an, weil die Zahlen überzeugen."}]},{type:"meet",itemIds:["die-kundschaft","die-zahlen-ueberzeugen"]},{type:"line",speaker:"marek",text:"Moment — die Kennzahl hier unten: dreißig Prozent mehr Kundschaft am Wochenende? …Das ist nicht klein und reversibel. Das ist richtig groß.",translation:"Wait — the metric down here: thirty percent more customers on weekends? …That's not small and reversible. That's properly big."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Luises Konzeptpapier „Anbau“",text:`CAFÉ LUISE — IDEE ANBAU

Ziel: 12 mehr Plätze, Winter draußen möglich.
Kernzahl: Mehrwert 4.000 €/Jahr (Kalkulation folgt)
Kundschaft: Stammgäste + Bibliotheksflüchtlinge

Offene Fragen:
— Genehmigung? (Kalisch fragen)
— Wer baut? (Jonas? Andere? Zwei Angebote!)
— Budget-Deckel: setzen. STRIKT.`,translation:`CAFÉ LUISE — IDEA: EXTENSION

Goal: 12 more seats, winter seating possible.
Core number: added value €4,000/year (calculation to follow)
Clientele: regulars + library refugees

Open questions:
— Permit? (ask Kalisch)
— Who builds? (Jonas? Others? Two quotes!)
— Budget cap: set it. STRICT.`,itemIds:["das-konzept","die-kennzahl","die-kundschaft"]},{type:"narration",text:"Diskussion um acht Uhr abends, auf Deutsch, du mitten drin. Irgendwann merkst du, dass du nicht mehr übersetzt. Du denkst einfach."}]},{id:"b2e1s3",episodeId:"b2e1",title:"Die Entscheidung",titleEn:"The decision",place:"Café Luise, Theke, eine Woche später",bg:"cafe",contextTags:["work","planning","meeting"],requiredItems:["das-ziel"],introducedItems:["die-entscheidung","das-budget","die-verantwortung","wir-haben-entschieden","das-ist-mutig"],beats:[{type:"line",speaker:"luise",text:"So. Ich habe mit meiner Bank geredet. Das Budget steht — mit Bedingungen. Darum sage ich es vor allen: Wir haben entschieden, wir wagen es.",translation:"Right. I talked to my bank. The budget is there — with conditions. That's why I'm saying it in front of everyone: we've decided, we'll dare to do it."},{type:"meet",itemIds:["das-budget","die-entscheidung","wir-haben-entschieden"]},{type:"meet",itemIds:["die-verantwortung","das-ist-mutig"]},{type:"choice",prompt:"Luise schaut dich an, ernster als sonst.",options:[{label:"Ich übernehme die Verantwortung für die Zahlen.",line:"Ich übernehme die Verantwortung für die Zahlen — jede einzelne."},{label:"Das ist mutig, Luise. Und richtig.",line:"Das ist mutig, Luise. Und es ist richtig."}]},{type:"line",speaker:"luise",text:"Mutig ist es erst, wenn man's riskiert hat. …Deswegen: Projektleitung Anbau — Sam. Ab Montag. Herzlichen Glückwunsch.",translation:"It's only brave once you've risked it. …Therefore: project lead for the extension — Sam. Starting Monday. Congratulations."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Beschluss-Notiz (Theke, unter der Glaskappe)",text:`ENTSCHIEDEN (Ende der Diskussion, Anfang der Arbeit):

1. Anbau kommt. Frühling. Kein „vielleicht“.
2. Budget: 28.000 €. Deckel zu.
3. Verantwortung: Luise (Geld) + Team (Baustelle-Diät).

»Mutig ist nicht laut.
 Mutig ist: unterschreiben und dann kommen.«`,translation:`DECIDED (end of discussion, start of work):

1. The extension is happening. Spring. No 'maybe'.
2. Budget: €28,000. Lid closed.
3. Responsibility: Luise (money) + team (construction-site diet).

'Brave isn't loud.
Brave is: sign, and then show up.'`,itemIds:["die-entscheidung","das-budget","wir-haben-entschieden"]},{type:"narration",text:"Mei pfeift, Marek klatscht mit mehligen Händen. Du hast jetzt Verantwortung, ein Budget — und samstags Baustellenstaub in der Schürze."}]}],xs={episode:ji,cast:Ci,items:$i,scenes:Ui},Ps=Object.freeze(Object.defineProperty({__proto__:null,cast:Ci,default:xs,episode:ji,items:$i,scenes:Ui},Symbol.toStringTag,{value:"Module"})),Oi={id:"b2e10",arcId:"B2",cefrLevel:"B2",title:"Ein Jahr Leipzig",titleEn:"One year in Leipzig",blurb:"Ein Jahr. Eine Pinnwand voller Nachweise, ein Hof voller Nachbarn, eine Mail von der Volkshochschule: C1-Kurs, ab Oktober. Ohne euch hätte ich das nicht geschafft.",order:22,sceneIds:["b2e10s1","b2e10s2","b2e10s3"]},Vi=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"mei",name:"Mei",role:"Kollegin, Freundin"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"}],Zi=[{id:"das-jahr",type:"word",german:"das Jahr",meaning:"the year",image:"kalender",audio:"tts",introducedInScene:"b2e10s1",tags:["time"],cefrLevel:"B2",note:"das, Plural: die Jahre — „im Laufe des Jahres“"},{id:"der-rueckblick",type:"word",german:"der Rückblick",meaning:"the look back / review",image:"heimat",audio:"tts",introducedInScene:"b2e10s1",tags:["reflection","time"],cefrLevel:"B2",note:"der, Plural: die Rückblicke — Rückblick halten"},{id:"die-etappe",type:"word",german:"die Etappe",meaning:"the stage / leg (of a journey)",image:"ziel",audio:"tts",introducedInScene:"b2e10s1",tags:["time","reflection"],cefrLevel:"B2",note:"die, Plural: die Etappen — eine schwierige Etappe"},{id:"die-gewohnheit",type:"word",german:"die Gewohnheit",meaning:"the habit",image:"wecker",audio:"tts",introducedInScene:"b2e10s1",tags:["reflection","time"],cefrLevel:"B2",note:"die, Plural: die Gewohnheiten — aus Übung wird Gewohnheit"},{id:"der-anfang",type:"word",german:"der Anfang",meaning:"the beginning",image:"urehr",audio:"tts",introducedInScene:"b2e10s1",tags:["time","reflection"],cefrLevel:"B2",note:"der, Plural: die Anfänge — am Anfang, zum Anfang"},{id:"die-sammlung",type:"word",german:"die Sammlung",meaning:"the collection",image:"buch",audio:"tts",introducedInScene:"b2e10s1",tags:["reflection","home"],cefrLevel:"B2",note:"die, Plural: die Sammlungen — sammeln"},{id:"gelingen",type:"chunk",german:"Es ist gelungen.",meaning:"It worked out. / It succeeded.",image:"fest",audio:"tts",introducedInScene:"b2e10s2",tags:["reflection","opinion"],cefrLevel:"B2",speak:"Es ist gelungen.",note:"gelingen — gelang — gelungen; mit Dativ-Subjekt oft"},{id:"die-freundschaft",type:"word",german:"die Freundschaft",meaning:"the friendship",image:"team",audio:"tts",introducedInScene:"b2e10s2",tags:["friends","feelings"],cefrLevel:"B2",note:"die, Plural: die Freundschaften — eine Freundschaft schließen"},{id:"der-entschluss",type:"word",german:"der Entschluss",meaning:"the decision / resolve",image:"entscheidung",audio:"tts",introducedInScene:"b2e10s2",tags:["reflection"],cefrLevel:"B2",note:"der, Plural: die Entschlüsse — einen Entschluss fassen"},{id:"gemeinsam",type:"word",german:"gemeinsam",meaning:"together / joint",image:"ball",audio:"tts",introducedInScene:"b2e10s2",tags:["friends"],cefrLevel:"B2",note:"Adverb/Adjektiv — gemeinsam kochen, gemeinsame Sache"},{id:"wohlfuehlen",type:"chunk",german:"Ich fühle mich hier wohl.",meaning:"I feel at home here.",image:"ruhe",audio:"tts",introducedInScene:"b2e10s2",tags:["feelings","reflection"],cefrLevel:"B2",speak:"Ich fühle mich hier wohl.",note:"sich wohlfühlen — das Ziel aller Einwanderung"},{id:"die-wurzeln",type:"word",german:"die Wurzeln",meaning:"the roots",image:"blumen",audio:"tts",introducedInScene:"b2e10s2",tags:["reflection","nature"],cefrLevel:"B2",note:"Plural: die Wurzeln — Wurzeln schlagen = put down roots"},{id:"die-weiterbildung",type:"word",german:"die Weiterbildung",meaning:"the further education / training",image:"zertifikat",audio:"tts",introducedInScene:"b2e10s3",tags:["learning","work"],cefrLevel:"B2",note:"die, Plural: die Weiterbildungen — Deutschland-Lieblingswort"},{id:"der-vhs-kurs",type:"word",german:"der VHS-Kurs",meaning:"the adult education centre course",image:"haus",audio:"tts",introducedInScene:"b2e10s3",tags:["learning"],cefrLevel:"B2",note:"der, Plural: die VHS-Kurse — Volkshochschule: Bildung für alle"},{id:"die-einschreibung",type:"word",german:"die Einschreibung",meaning:"the enrolment / registration",image:"formular",audio:"tts",introducedInScene:"b2e10s3",tags:["learning","admin"],cefrLevel:"B2",note:"die, Plural: die Einschreibungen — einschreiben (lassen)"},{id:"gespannt",type:"word",german:"gespannt",meaning:"curious / excited (to see)",image:"person",audio:"tts",introducedInScene:"b2e10s3",tags:["feelings"],cefrLevel:"B2",note:"„Ich bin gespannt“ — auf + Akkusativ"},{id:"die-perspektive",type:"word",german:"die Perspektive",meaning:"the perspective / outlook",image:"train",audio:"tts",introducedInScene:"b2e10s3",tags:["reflection","opinion"],cefrLevel:"B2",note:"die, Plural: die Perspektiven — auch: Blickwinkel"},{id:"ohne-euch-haette",type:"grammar_pattern",german:"Ohne euch ___ ich dieses Jahr nicht geschafft.",meaning:"Without you, I wouldn't have made it through this year.",image:"team",audio:"tts",introducedInScene:"b2e10s3",tags:["grammar","feelings"],cefrLevel:"B2",cloze:"hätte",speak:"Ohne euch hätte ich dieses Jahr nicht geschafft.",note:"Konjunktiv II Vergangenheit: hätte + Partizip — höflich, feierlich, ehrlich"}],Ji=[{id:"b2e10s1",episodeId:"b2e10",title:"Die Pinnwand",titleEn:"The pinboard",place:"Wohnung, Abend vor dem Jahrestag",bg:"wohnung",contextTags:["reflection","home","feelings"],requiredItems:["die-erinnerung","der-bericht"],introducedItems:["das-jahr","der-rueckblick","die-etappe","die-gewohnheit","der-anfang","die-sammlung"],beats:[{type:"narration",text:"Ein Jahr, morgen. Du machst einen Rückblick der handwerklichen Art: die Pinnwand abnehmen und ausbreiten. Auf dem Bett landet eine Sammlung: Zettel, Belege, ein Bescheid, ein Physio-Bericht, die Rezeptkarte von Frau Brügge, das Programmheft von gestern."},{type:"line",speaker:"tobias",text:"Was ist das? …Oh. OH. Das ist ja dein… Archiv. …Sam, das hier ist ein Bescheid! Und das ein Fahrstunden-Zettel! …Du hast dokumentiert wie ein Steuerberater mit Gefühlen.",translation:"What's that? …Oh. OH. That's your… archive. …Sam, that's an official notice! And that's a driving-lesson note! …You've documented like a tax accountant with feelings."},{type:"meet",itemIds:["die-sammlung","das-jahr","der-rueckblick"]},{type:"line",speaker:"tobias",text:"Weißt du, was mir auffällt? Am Anfang war alles Papier: Anmeldung, Formular, Nachweis. …Und jetzt ist alles Leben: Kuchen, Lesung, Verein. …Das Jahr hat sich von Verwaltung zu Gewohnheit entwickelt. Das ist, glaube ich, wie Ankommen funktioniert.",translation:"You know what I notice? At the beginning everything was paperwork: registration, form, proof. …And now it's all life: cake, reading, club. …The year turned from administration into habit. I think that's how arriving works."},{type:"meet",itemIds:["die-etappe","die-gewohnheit","der-anfang"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias hält die allererste Notiz hoch: „Guten Tag, ich heiße Sam.“",options:[{label:"Die bleibt an der Pinnwand. Für immer. Erste Etappe.",line:"Die bleibt an der Pinnwand. Für immer. Erste Etappe — sie hat alles eingeleitet."},{label:"Die lege ich ins Kochbuch. Als Einleitung für mein Buch.",line:"Die lege ich ins Kochbuch. Als Einleitung für mein Buch. Kapitel minus eins."}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Pinnwand-Inventar (Tobias listet mit)",text:`DAS JAHR AN PAPIER:

Anmeldung · Bürgeramt-Stempel (Schön!)
Arbeitsvertrag 1 · Arbeitsvertrag 2 (immer besser)
Bescheid Aufenthaltstitel (2 Jahre!)
Physio-Bericht · Zeugnis B2 · 1 Kassenbon Zoo
1 Postkarte Leipzig (eigene Handschrift, erste Wochen)

Sammlung = Etappen.
Rückblick = Beweis. Das Jahr war lang.
Und genau richtig lang.`,translation:`THE YEAR ON PAPER:

Registration · citizens'-office stamp (pretty!)
Employment contract 1 · employment contract 2 (always better)
Residence-permit notice (2 years!)
Physio report · B2 certificate · 1 zoo receipt
1 postcard of Leipzig (own handwriting, first weeks)

A collection = stages.
A look back = proof. The year was long.
And exactly the right kind of long.`,itemIds:["die-sammlung","der-rueckblick","die-etappe"]},{type:"narration",text:"Du pinnst alles wieder an — diesmal nicht als Ablage, sondern als Linie: Anfang, Mitte, jetzt. Die Linie zeigt Richtung. Morgen: Gartenparty. Übermorgen: ein Brief, den du noch nicht kennst."}]},{id:"b2e10s2",episodeId:"b2e10",title:"Hof, Grill, Nachbarn",titleEn:"Courtyard, barbecue, neighbours",place:"Hinterhof, Jahrestag, später Nachmittag",bg:"fest",contextTags:["friends","celebration","neighbors"],requiredItems:["das-grillfest","die-nachbarschaft"],introducedItems:["gelingen","die-freundschaft","der-entschluss","gemeinsam","wohlfuehlen","die-wurzeln"],beats:[{type:"narration",text:"Der Hof: Girlanden von Frau Brügges Geburtstag (recycelt, mit Würde), der Grill von Jonas, und sämtliche Menschen, die du in einem Jahr gesammelt hast. Luise hält eine Rede von genau einem Satz."},{type:"line",speaker:"luise",text:"Vor einem Jahr kam ein Mensch mit einem Koffer rein und fragte nach Gleis sieben. …Er hat es nicht gefunden. Aber er hat alles andere gefunden. …Prost, Sam.",translation:"A year ago a person walked in with a suitcase and asked for platform seven. …He didn't find it. But he found everything else. …Cheers, Sam."},{type:"meet",itemIds:["die-freundschaft","gemeinsam","wohlfuehlen"]},{type:"line",speaker:"frau-bruegge",text:"Ich vermiete seit dreißig Jahren. Die meisten ziehen nach drei Jahren weiter — Studium, Liebe, Beruf. …Du aber: Du hast Wurzeln geschlagen. Ich sehe das am Mülltonnensystem. Wer sein Mülltonnensystem liebt, der bleibt.",translation:"I've been renting out for thirty years. Most people move on after three — studies, love, career. …But you: you've put down roots. I can tell from the bin system. Anyone who loves their bin system stays."},{type:"meet",itemIds:["die-wurzeln","gelingen","der-entschluss"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Luise fragt beiläufig: „Und, bleibst du?“",options:[{label:"Ich bleibe. Es ist gelungen — hier fühle ich mich wohl.",line:"Ich bleibe. Es ist gelungen — hier fühle ich mich wohl. Das ist der kürzeste Entschluss meines Lebens."},{label:"Bis Gleis sieben mich findet, ja.",line:"Bis Gleis sieben mich findet: ja. …Vielleicht baue ich es ja irgendwann selbst. Als Gartenprojekt."}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Luises Karte an Sam (auf dem Grilltisch)",text:`»Ein Jahr. Ein Koffer. Ein Café.

Du hast Wurzeln geschlagen, ohne es zu merken —
man sieht es daran, dass du hier Namensschilder
für die Gäste geschrieben hast. Freiwillig.

Gemeinsam ist ein gutes Wort.
Sich wohlfühlen ist ein besseres.
Bleiben ist das beste.

— Luise«`,translation:`'One year. One suitcase. One café.

You've put down roots without noticing —
you can tell because you wrote name tags
for the guests here. Voluntarily.

Together is a good word.
Feeling at home is a better one.
Staying is the best.

— Luise'`,itemIds:["gemeinsam","die-wurzeln","wohlfuehlen"]},{type:"narration",text:"Der Abend wird lang und gut. Irgendwann sitzt ihr alle auf der Treppe, Teller auf den Knien, und deniz erzählt den Gleis-7-Witz falsch und niemand korrigiert ihn. Ein Jahr. Es ist gelungen."}]},{id:"b2e10s3",episodeId:"b2e10",title:"Der nächste Schritt",titleEn:"The next step",place:"Café Kontor, Montag, Post kommt",bg:"cafe",contextTags:["reflection","learning","work"],requiredItems:["ich-habe-bestanden","die-anfrage"],introducedItems:["die-weiterbildung","der-vhs-kurs","die-einschreibung","gespannt","die-perspektive","ohne-euch-haette"],beats:[{type:"narration",text:"Montagmorgen, Café Kontor. Zwischen Lieferanten-Rechnungen liegt ein Brief der Volkshochschule. Du öffnest ihn zwischen zwei Milchschaum-Wolken, wie damals das Telefonat der Rundschau."},{type:"line",speaker:"mei",text:"Auf, auf! …„Sehr geehrter Herr Jones, gern bestätigen wir Ihre Anfrage: Platz im C1-Kurs, ab Oktober, dienstags und donnerstags. Einschreibung bis 15. September.“ …SAM. Du hast DICH beworben. Ohne dass jemand geschubst hat.",translation:"Open it! …'Dear Mr Jones, we are happy to confirm your inquiry: place in the C1 course, from October, Tuesdays and Thursdays. Enrolment by 15 September.' …SAM. You applied. By yourself. Without anyone pushing you."},{type:"meet",itemIds:["die-weiterbildung","der-vhs-kurs","die-einschreibung"]},{type:"choice",prompt:"Mei: „Und? C1. Das ist… hoch.“",options:[{label:"Ich bin gespannt. Und ein bisschen nervös. Beides gehört dazu.",line:"Ich bin gespannt. Und ein bisschen nervös. Beides gehört dazu — wie Milch und Schaum."},{label:"Nach der B2-Prüfung ist vor der C1-Prüfung.",line:"Nach der B2-Prüfung ist vor der C1-Prüfung. …Sag das nicht Luise, sonst baut sie uns einen Anbau für die Bücher."}]},{type:"meet",itemIds:["gespannt","die-perspektive","ohne-euch-haette"]},{type:"line",speaker:"luise",text:"(aus dem Lagerraum) Ich hab gehört, was da drin steht. …C1, Sam. Dann kannst du mir die Lieferanten-Rechnungen auf Deutsch inspizieren. …Nein, im Ernst: Weiterbildung ist das Größte. Mach die Einschreibung heute. JETZT. Vor der Mittagspause.",translation:"(from the storeroom) I heard what's in there. …C1, Sam. Then you can dispute my supplier invoices at a native level. …No, seriously: further education is the greatest thing. Do the enrolment today. NOW. Before the lunch rush."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"E-Mail der Volkshochschule Leipzig",text:`Volkshochschule Leipzig
Programmbereich Sprachen

Sehr geehrter Herr Jones,

gern bestätigen wir Ihre Anfrage:

Kurs:      Deutsch C1 — Oberstufe (Abendkurs)
Beginn:    Dienstag, 06.10.2026
Zeiten:    dienstags & donnerstags, 18:30–20:00
Ort:       VHS-Haus, Raum 2.14
Dozentin:  Fr. Dr. Ahlers

Die Einschreibung ist bis 15.09. möglich.
Bitte bringen Sie Ihren B2-Nachweis mit.

Wir freuen uns auf Sie.
Ihre VHS Leipzig`,translation:`Leipzig Adult Education Centre
Languages department

Dear Mr Jones,

we are happy to confirm your inquiry:

Course:    German C1 — advanced (evening class)
Start:     Tuesday, 6 Oct 2026
Times:     Tuesdays & Thursdays, 6:30–8 pm
Location:  VHS building, room 2.14
Teacher:   Ms Dr Ahlers

Enrolment is possible until 15 Sep.
Please bring your B2 certificate.

We look forward to seeing you.
Your VHS Leipzig`},{type:"narration",text:"Mittags legst du den Brief auf die Pinnwand — an den Anfang einer neuen Linie. Tobias kommt vorbei, liest, pfeift. Du sagst den Satz, den du seit Gleis sieben übst: „Ohne euch hätte ich dieses Jahr nicht geschafft.“ Tobias sagt nichts. Er nickt so, wie Nachbarn nicken, wenn ein Satz stimmt. …Der Scheduler räumt derweil leise auf: viele hundert Wörter später ist die nächste Etappe fällig — und du bist gespannt."}]}],Ws={episode:Oi,cast:Vi,items:Zi,scenes:Ji},Ks=Object.freeze(Object.defineProperty({__proto__:null,cast:Vi,default:Ws,episode:Oi,items:Zi,scenes:Ji},Symbol.toStringTag,{value:"Module"})),qi={id:"b2e11",arcId:"B2",cefrLevel:"B2",title:"Die zweite Filiale",titleEn:"The second branch",blurb:"Café Kontor wächst: Filiale Nummer zwei, und Luise will dich als Leitung. Du sitzt jetzt auf der anderen Seite des Tisches — und stellst die Fragen beim Vorstellungsgespräch.",order:23,sceneIds:["b2e11s1","b2e11s2","b2e11s3"]},Yi=[{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"rosa",name:"Rosa",role:"Bewerberin"},{id:"mei",name:"Mei",role:"Kollegin, Freundin"}],Qi=[{id:"die-erweiterung",type:"word",german:"die Erweiterung",meaning:"the expansion / extension",image:"konzept",audio:"tts",introducedInScene:"b2e11s1",tags:["work","business"],cefrLevel:"B2",note:"die, Plural: die Erweiterungen — erweitern; hier: die des Cafés"},{id:"die-eroeffnung",type:"word",german:"die Eröffnung",meaning:"the opening",image:"fest",audio:"tts",introducedInScene:"b2e11s1",tags:["work","celebration","business"],cefrLevel:"B2",note:"die, Plural: die Eröffnungen — eröffnen; die offizielle Eröffnung"},{id:"die-stellenanzeige",type:"word",german:"die Stellenanzeige",meaning:"the job advertisement",image:"formular",audio:"tts",introducedInScene:"b2e11s1",tags:["work","media"],cefrLevel:"B2",note:"die, Plural: die Stellenanzeigen — „Wir suchen ab sofort…“"},{id:"die-fuehrungsverantwortung",type:"word",german:"die Führungsverantwortung",meaning:"the leadership responsibility",image:"ziel",audio:"tts",introducedInScene:"b2e11s1",tags:["work"],cefrLevel:"B2",note:"die ( Singular ) — Personal führen = Menschen, nicht Maschinen"},{id:"die-einarbeitung",type:"word",german:"die Einarbeitung",meaning:"the onboarding / induction",image:"urehr",audio:"tts",introducedInScene:"b2e11s1",tags:["work","time"],cefrLevel:"B2",note:"die, Plural: die Einarbeitungen — jmdn. einarbeiten"},{id:"das-gespraech",type:"word",german:"das Gespräch",meaning:"the conversation / interview",image:"gespräch",audio:"tts",introducedInScene:"b2e11s1",tags:["work","meeting"],cefrLevel:"B2",note:"das, Plural: die Gespräche — ein Gespräch führen"},{id:"die-bewerberin",type:"word",german:"die Bewerberin",meaning:"the (female) applicant",image:"person",audio:"tts",introducedInScene:"b2e11s2",tags:["work","people"],cefrLevel:"B2",note:"die, Plural: die Bewerberinnen; männlich: der Bewerber"},{id:"selbstbewusst",type:"word",german:"selbstbewusst",meaning:"self-confident",image:"mic",audio:"tts",introducedInScene:"b2e11s2",tags:["work","opinion"],cefrLevel:"B2",note:"Adjektiv — selbstbewusst auftreten; auch: selbstbewusste Pause"},{id:"die-rueckfrage",type:"word",german:"die Rückfrage",meaning:"the follow-up question",image:"gespräch",audio:"tts",introducedInScene:"b2e11s2",tags:["work","meeting"],cefrLevel:"B2",note:"die, Plural: die Rückfragen — wer Rückfragen stellt, denkt mit"},{id:"stelle-besetzt-werden",type:"grammar_pattern",german:"Die Stelle muss bis Ende des Monats ___ werden.",meaning:"The position has to be filled by the end of the month.",image:"formular",audio:"tts",introducedInScene:"b2e11s2",tags:["grammar","work"],cefrLevel:"B2",cloze:"besetzt",speak:"Die Stelle muss bis Ende des Monats besetzt werden.",note:"Passiv mit Modalverb: muss … + Partizip II + werden"},{id:"die-schlange",type:"word",german:"die Schlange",meaning:"the queue / line (also: snake)",image:"kasse",audio:"tts",introducedInScene:"b2e11s3",tags:["everyday"],cefrLevel:"B2",note:"die, Plural: die Schlangen — sich anstellen / anstehen"},{id:"der-stammgast",type:"word",german:"der Stammgast",meaning:"the regular (guest)",image:"person",audio:"tts",introducedInScene:"b2e11s3",tags:["people","business"],cefrLevel:"B2",note:"der, Plural: die Stammgäste — das Rückgrat jedes Cafés"},{id:"die-teamleiterin",type:"word",german:"die Teamleiterin",meaning:"the (female) team leader",image:"team",audio:"tts",introducedInScene:"b2e11s3",tags:["work","people"],cefrLevel:"B2",note:"die, Plural: die Teamleiterinnen — du, ab heute"},{id:"die-ansprache",type:"word",german:"die Ansprache",meaning:"the (short) address / speech",image:"mic",audio:"tts",introducedInScene:"b2e11s3",tags:["work","events"],cefrLevel:"B2",note:"die, Plural: die Ansprachen — kurz halten, wirken lassen"},{id:"der-ansturm",type:"word",german:"der Ansturm",meaning:"the (great) rush / influx",image:"team",audio:"tts",introducedInScene:"b2e11s3",tags:["business","events"],cefrLevel:"B2",note:"der, Plural: die Anstürme — großer Ansturm am Eröffnungstag"},{id:"die-kalkulation",type:"word",german:"die Kalkulation",meaning:"the (cost) calculation",image:"budget",audio:"tts",introducedInScene:"b2e11s2",tags:["work","money"],cefrLevel:"B2",note:"die, Plural: die Kalkulationen — kalkulieren; Herzstück der Gastronomie"}],Xi=JSON.parse(`[{"id":"b2e11s1","episodeId":"b2e11","title":"Luises Plan B","titleEn":"Luise's plan B","place":"Café Kontor, Lager, zwischen Kaffeelieferungen","bg":"cafe","contextTags":["work","business","friends"],"requiredItems":["die-filiale","die-stelle"],"introducedItems":["die-erweiterung","die-eroeffnung","die-stellenanzeige","die-fuehrungsverantwortung","die-einarbeitung","das-gespraech"],"beats":[{"type":"narration","text":"Luise hat eine Karte auf den Mehlsack geknallt: Eine Fläche in Plagwitz ist frei — 80 Quadratmeter, Backstein, zu viel Charme. „Zweites Kontor“, sagt sie. „Und du leitest es.“ Kein Fragezeichen im Raum."},{"type":"line","speaker":"luise","text":"Sam. Du hast den Anbau gebaut, die Zahlen im Griff und meinen Stammkunden die Namen gemerkt. …Die Erweiterung ist beschlossene Sache, die Eröffnung im Mai. Und DU bekommst die Führungsverantwortung. …Widerworte dauern bei mir genau bis Freitag.","translation":"Sam. You built the extension, you handle the numbers, and you remember my regulars' names. …The expansion is a done deal, the opening is in May. And YOU get the leadership role. …Objections are accepted until Friday exactly."},{"type":"meet","itemIds":["die-erweiterung","die-eroeffnung","die-fuehrungsverantwortung"]},{"type":"line","speaker":"mei","text":"Und damit das legal ist: Stellenanzeige. …„Café Kontor Plagwitz sucht zum nächstmöglichen Zeitpunkt eine Teamleitung (m/w/d).“ …Du wirst sie NICHT selbst schreiben dürfen, Luise. Du schreibst Anzeigen wie Liebesbriefe an 1989.","translation":"And so it's legal: a job ad. …'Café Kontor Plagwitz is looking for a team lead (m/f/d) at the earliest possible date.' …You will NOT be allowed to write it yourself, Luise. You write job ads like love letters to 1989."},{"type":"meet","itemIds":["die-stellenanzeige","die-einarbeitung","das-gespraech"]},{"type":"check","count":2,"mode":"mixed"},{"type":"choice","prompt":"Luise: „Du hast Bedenken. Sprich sie aus, ich hab Kaffee.“","options":[{"label":"Ich habe noch nie jemanden eingearbeitet. Aber ich lerne schnell.","line":"Ich habe noch nie jemanden eingearbeitet — aber ich lerne schnell, und ich kenne jede Maschine hier mit Vornamen."},{"label":"Führungsverantwortung auf Deutsch? Da fehlen mir noch Wörter.","line":"Führungsverantwortung auf Deutsch? Da fehlen mir noch Fachwörter. …Luise: „Die kaufen wir dir. Ein Wörterbuch ist billiger als eine Fehlbesetzung.“"}]},{"type":"check","count":2,"mode":"recall"},{"type":"reading","title":"Stellenanzeige (endgültige Fassung)","text":"CAFÉ KONTOR PLAGWITZ\\nNeueröffnung Mai — Wir suchen Sie!\\n\\nTeamleitung (m/w/d), Vollzeit\\n\\nIhre Aufgaben:\\n— Führung des Teams (4–6 Personen)\\n— Verantwortung für Ablauf & Qualität\\n— Kontakt zu Lieferanten & Stammgästen\\n\\nSie bringen mit:\\n— Erfahrung in der Gastronomie\\n— Organisationstalent und Ruhe\\n— Freude an Menschen und Kaffee\\n\\nBewerbung: persönlich, per Post\\noder — modern! — per Mail.","translation":"CAFÉ KONTOR PLAGWITZ\\nOpening in May — We're looking for you!\\n\\nTeam lead (m/f/d), full-time\\n\\nYour tasks:\\n— Leading the team (4–6 people)\\n— Responsibility for operations & quality\\n— Contact with suppliers & regulars\\n\\nYou bring:\\n— Experience in hospitality\\n— Organisational talent and calm\\n— Joy in people and coffee\\n\\nApply: in person, by post\\nor — modern! — by email."}]},{"id":"b2e11s2","episodeId":"b2e11","title":"Das Interview","titleEn":"The interview","place":"Café Kontor, Theke als Konferenztisch","bg":"buero","contextTags":["work","meeting","people"],"requiredItems":["der-eindruck","die-frage","der-lebenslauf","die-vorbereitung"],"introducedItems":["die-bewerberin","die-kalkulation","selbstbewusst","die-rueckfrage","stelle-besetzt-werden"],"beats":[{"type":"narration","text":"Dreizehn Bewerbungen, vier Gespräche. Heute: Rosa, 31, zehn Jahre Gastronomie, Lebenslauf in sauberem Deutsch, Blick, der Kaffeemaschinen mal eben mental kalibriert. Du sitzt auf der ANDEREN Seite. Die Rolle sitzt komisch. Noch."},{"type":"line","speaker":"rosa","text":"Vorab: Ich habe Ihre Eröffnung gelesen, Ihren Anbau, Ihre Kritiken. …Ich mag Konzepte, die wachsen, ohne sich zu verbiegen. …Und jetzt bitte Sie: Fragen Sie. Ich bin vorbereitet — aber überraschen Sie mich ruhig.","translation":"Up front: I've read about your opening, your extension, your reviews. …I like concepts that grow without bending out of shape. …And now your turn: ask. I'm prepared — but feel free to surprise me."},{"type":"meet","itemIds":["die-bewerberin","die-kalkulation","selbstbewusst"]},{"type":"line","speaker":"luise","text":"(flüsternd) Gut, oder? …Du jetzt: Rückfragen stellen! Nicht nur fragen — NACHfragen. Nachfragen zeigt, dass du zuhörst. …Und dann das Wichtigste: Wenn sie gut ist, sag es ihr. Deutsche höfliche Vagheit hilft niemandem.","translation":"(whispering) Good, right? …You now: ask follow-up questions! Not just questions — follow-ups. Follow-ups show you're listening. …And the most important thing: if she's good, tell her. Polite German vagueness helps nobody."},{"type":"meet","itemIds":["die-rueckfrage","stelle-besetzt-werden"]},{"type":"check","count":2,"mode":"mixed"},{"type":"choice","prompt":"Rosa hat geantwortet. Jetzt die Rückfrage.","options":[{"label":"Sie sagten „Team statt Hierarchie“. Wie sieht das im stressigen Montag aus?","line":"Sie sagten „Team statt Hierarchie“ — wie sieht das konkret am stressigen Montag um acht aus? …Rosa: „Sehr gut gefragt. Antwort: Kaffee zuerst, Klärung danach.“"},{"label":"Was war Ihr schwerster Arbeitstag — und was haben Sie gelernt?","line":"Was war Ihr schwerester Arbeitstag — und was haben Sie daraus gelernt? …Rosa erzählt. Ehrlich. Mit Daten. Luise nickt langsam."}]},{"type":"line","speaker":"luise","text":"Rosa — Sie sind die Beste von allen. Klartext. …Sam, sachlich: Der Vertrag muss diese Woche raus, die Stelle muss bis Monatsende besetzt werden. …Du leitest das Gespräch. Sag du es ihr.","translation":"Rosa — you're the best of all of them. Plain talk. …Sam, factually: the contract has to go out this week, the position must be filled by the end of the month. …You're leading this. You tell her."},{"type":"choice","prompt":"Dein erster Satz als Leitung. Ruhig atmen.","options":[{"label":"Rosa: Sie sind eingestellt. Willkommen bei Kontor.","line":"Rosa — Sie sind eingestellt. Willkommen bei Kontor. …Rosa: „Das war die kürzeste Absage-Nacht meines Lebens. Danke.“"},{"label":"Wir möchten Sie einstellen. Die Einarbeitung startet am 2. — okay?","line":"Wir möchten Sie einstellen — die Einarbeitung startet am zweiten. Passt das? …Rosa: „Passt. Unglaublich, aber es passt.“"}]},{"type":"check","count":2,"mode":"listen"},{"type":"reading","title":"Dein Bewertungsbogen (handschriftlich)","text":"BEWERTUNG — Gespräch 4 (Rosa K.)\\n\\nVorbereitung: sehr gut (kennt Konzept)\\nAuftreten: selbstbewusst, nicht laut\\nFachfragen: stark (Preiskalkulation!)\\nTeamverständnis: „Team statt Hierarchie“\\n  → Rückfrage nötig: Alltag? — beantwortet.\\n\\nEindruck: passt zu uns. Mehr als das.\\n\\nEmpfehlung: einstellen.\\nStelle bis 31. besetzen. ✓\\n\\n(Sam)","translation":"EVALUATION — interview 4 (Rosa K.)\\n\\nPreparation: very good (knows the concept)\\nPresence: self-confident, not loud\\nExpert questions: strong (price calculation!)\\nTeam spirit: 'team over hierarchy'\\n  → follow-up needed: daily life? — answered.\\n\\nImpression: fits us. More than that.\\n\\nRecommendation: hire.\\nFill position by the 31st. ✓\\n\\n(Sam)"}]},{"id":"b2e11s3","episodeId":"b2e11","title":"Eröffnung Plagwitz","titleEn":"Opening day, Plagwitz","place":"Café Kontor Plagwitz, 8:58 Uhr","bg":"laden","contextTags":["work","celebration","friends"],"requiredItems":["feiern","die-einladung","der-einsatz"],"introducedItems":["die-schlange","der-stammgast","die-teamleiterin","die-ansprache","der-ansturm"],"beats":[{"type":"narration","text":"Zwei Minuten vor der Eröffnung: Rosa poliert die Theke wie eine Bühne, Luise prüft die Blumen zum dritten Mal, und vor der Tür steht eine Schlange. Eine echte. Mit Leuten. Die Kaffee wollen."},{"type":"line","speaker":"luise","text":"Sam. Ansprache. Kurz. …Kürzer. …Drei Sätze, dann machen wir auf. Und: Lächeln ist keine Pflicht, aber es hilft beim Umsatz.","translation":"Sam. Speech. Short. …Shorter. …Three sentences, then we open. And: smiling isn't mandatory, but it helps turnover."},{"type":"meet","itemIds":["die-ansprache","die-schlange","die-teamleiterin"]},{"type":"choice","prompt":"Die Schlange wartet. Drei Sätze. Deine.","options":[{"label":"„Vor zwei Jahren stand ich mit einem Koffer vor Gleis 7. Heute mache ich hier auf. Kaffee für alle!“","line":"„Vor zwei Jahren stand ich mit einem Koffer vor Gleis 7. Heute öffnen wir hier eine Filiale. Kaffee für alle — und danke, dass ihr da seid!“"},{"label":"„Kurze Ansprache: Auf dass der Kaffee heiß und die Wartezeiten kurz sind. Auf!“","line":"„Kurze Ansprache: Auf dass der Kaffee heiß und die Schlangen kurz bleiben. Wir öffnen!“ …Applaus von Frau Brügge, die natürlich da ist."}]},{"type":"meet","itemIds":["der-stammgast","der-ansturm"]},{"type":"line","speaker":"rosa","text":"Chef — äh, Chefträger? …Die erste Schlange ist abgebaut, der Stammgast von gegenüber hat sich bereits zweimal angemeldet: „Bedenken? Null. Kaffee? Stark.“ …Wir schaffen das. Mit vollem Einsatz und halbem Kaffee in mir.","translation":"Boss — er, boss-carrier? …The first queue is cleared, the regular from across the street has already signed up twice: 'Regrets? None. Coffee? Strong.' …We've got this. With full commitment and half a coffee in me."},{"type":"check","count":2,"mode":"mixed"},{"type":"check","count":2,"mode":"recall"},{"type":"reading","title":"Kurznotiz der Leipziger Rundschau (Lokalteil)","text":"NEU IN PLAGWITZ\\n\\nCafé Kontor eröffnet zweite Filiale\\n\\nAm Samstag öffnete das Café Kontor\\nseinen zweiten Standort. Geleitet wird\\ndie Filiale von Sam Jones, der vor\\nzwei Jahren als Aushilfe begann.\\n\\nInhaberin Luise Berger: »Wachstum ist\\nnichts ohne Menschen. Und Jones ist\\nder beste Beweis dafür.«\\n\\nÖffnungszeiten: Mo–Fr 7–18,\\nSa/So 8–16. Kuchen: täglich wechselnd.","translation":"NEW IN PLAGWITZ\\n\\nCafé Kontor opens second branch\\n\\nOn Saturday, Café Kontor opened its\\nsecond location. The branch is managed\\nby Sam Jones, who started as a temp\\ntwo years ago.\\n\\nOwner Luise Berger: 'Growth is nothing\\nwithout people. And Jones is the best\\nproof of that.'\\n\\nOpening hours: Mon–Fri 7 am–6 pm,\\nSat/Sun 8 am–4 pm. Cake: changes daily."}]}]`),_s={episode:qi,cast:Yi,items:Qi,scenes:Xi},Fs=Object.freeze(Object.defineProperty({__proto__:null,cast:Yi,default:_s,episode:qi,items:Qi,scenes:Xi},Symbol.toStringTag,{value:"Module"})),er={id:"b2e12",arcId:"B2",cefrLevel:"B2",title:"Der Kleingarten",titleEn:"The allotment garden",beats:[],blurb:"Ein Garten im Verein, eine Laube mit Geschichte, ein Zaun mit Regelwerk: Du pachtest Schrebergarten Nr. 14 — und findest heraus, dass Gärten nicht nur Arbeit sind, sondern auch Halt.",order:24,sceneIds:["b2e12s1","b2e12s2","b2e12s3"]},tr=[{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin, Gartenexpertin"},{id:"jonas",name:"Jonas",role:"Handwerker, Vereinsmitglied"},{id:"mei",name:"Mei",role:"Freundin"},{id:"frau-lippold",name:"Frau Lippold",role:"ehemalige Pächterin von Parzelle 14, 94 Jahre"}],nr=[{id:"der-kleingarten",type:"word",german:"der Kleingarten",meaning:"the allotment garden",image:"laube",audio:"tts",introducedInScene:"b2e12s1",tags:["hobby","nature","community"],cefrLevel:"B2",note:"der, Plural: die Kleingärten — auch: Schrebergarten"},{id:"die-laube",type:"word",german:"die Laube",meaning:"the (garden) hut / arbour",image:"laube",audio:"tts",introducedInScene:"b2e12s1",tags:["hobby","home"],cefrLevel:"B2",note:"die, Plural: die Lauben — Herzstück jedes Kleingartens"},{id:"pachten",type:"word",german:"pachten",meaning:"to lease / rent (land)",image:"vertrag",audio:"tts",introducedInScene:"b2e12s1",tags:["hobby","paperwork"],cefrLevel:"B2",note:"pachten — ein Grundstück pachten; der Pachtvertrag"},{id:"die-anlage",type:"word",german:"die Anlage",meaning:"the (garden) complex / facility",image:"korb",audio:"tts",introducedInScene:"b2e12s1",tags:["hobby","community"],cefrLevel:"B2",note:"die, Plural: die Anlagen — die Kleingartenanlage mit 40 Parzellen"},{id:"die-warteliste",type:"word",german:"die Warteliste",meaning:"the waiting list",image:"liste",audio:"tts",introducedInScene:"b2e12s1",tags:["admin","hobby"],cefrLevel:"B2",note:"die, Plural: die Wartelisten — in Städten: oft jahrelang"},{id:"die-gartenordnung",type:"word",german:"die Gartenordnung",meaning:"the garden rules",image:"formular",audio:"tts",introducedInScene:"b2e12s1",tags:["rules","hobby"],cefrLevel:"B2",note:"die, Plural: die Gartenordnungen — Lesestoff für Winterabende"},{id:"das-beet",type:"word",german:"das Beet",meaning:"the (flower/vegetable) bed",image:"blumen",audio:"tts",introducedInScene:"b2e12s2",tags:["hobby","nature"],cefrLevel:"B2",note:"das, Plural: die Beete — Beete anlegen, Unkraut jäten"},{id:"giessen",type:"word",german:"gießen",meaning:"to water / pour",image:"giesskanne",audio:"tts",introducedInScene:"b2e12s2",tags:["hobby","actions"],cefrLevel:"B2",note:"gießen — goss — gegossen; morgens oder abends, nie mittags"},{id:"das-unkraut",type:"word",german:"das Unkraut",meaning:"the weeds",image:"blumen",audio:"tts",introducedInScene:"b2e12s2",tags:["hobby","nature"],cefrLevel:"B2",note:"das, Plural: die Unkräuter — wächst schneller als jeder Beschluss"},{id:"jaeten",type:"word",german:"jäten",meaning:"to weed",image:"werkzeug",audio:"tts",introducedInScene:"b2e12s2",tags:["hobby","actions"],cefrLevel:"B2",note:"jäten — Unkraut jäten; meditativ, verspricht Frau Brügge"},{id:"die-ernte",type:"word",german:"die Ernte",meaning:"the harvest",image:"korb",audio:"tts",introducedInScene:"b2e12s2",tags:["hobby","nature","food"],cefrLevel:"B2",note:"die, Plural: die Ernten — ernten; im August: alles gleichzeitig"},{id:"nicht-nur-sondern-auch",type:"grammar_pattern",german:"Ein Garten ist nicht nur Arbeit, ___ auch Entspannung.",meaning:"A garden isn't just work, but also relaxation.",image:"gespräch",audio:"tts",introducedInScene:"b2e12s2",tags:["grammar","hobby"],cefrLevel:"B2",cloze:"sondern",speak:"Ein Garten ist nicht nur Arbeit, sondern auch Entspannung.",note:"nicht nur … sondern auch — zweiter Teil nach dem Komma"},{id:"die-kaffeetafel",type:"word",german:"die Kaffeetafel",meaning:"the (lavish) coffee table",image:"kaffee",audio:"tts",introducedInScene:"b2e12s3",tags:["food","celebration"],cefrLevel:"B2",note:"die, Plural: die Kaffeetafeln — im Garten: üppiger als zu Hause"},{id:"der-apfelbaum",type:"word",german:"der Apfelbaum",meaning:"the apple tree",image:"apfel",audio:"tts",introducedInScene:"b2e12s3",tags:["nature","hobby"],cefrLevel:"B2",note:"der, Plural: die Apfelbäume — Parzelle 14 hat einen: alt, stolz"},{id:"der-zaun",type:"word",german:"der Zaun",meaning:"the fence",image:"schloss",audio:"tts",introducedInScene:"b2e12s3",tags:["hobby","rules"],cefrLevel:"B2",note:"der, Plural: die Zäune — laut Ordnung: max. 80 cm, Hecke zählt mit"},{id:"der-kompost",type:"word",german:"der Kompost",meaning:"the compost",image:"korb",audio:"tts",introducedInScene:"b2e12s3",tags:["nature","hobby"],cefrLevel:"B2",note:"der, Plural: die Komposte — der wahre Motor des Gartens"},{id:"die-marmelade",type:"word",german:"die Marmelade",meaning:"the jam",image:"brot",audio:"tts",introducedInScene:"b2e12s3",tags:["food"],cefrLevel:"B2",note:"die, Plural: die Marmeladen — aus der Ernte, mit Etikett"}],ir=[{id:"b2e12s1",episodeId:"b2e12",title:"Parzelle 14 wird frei",titleEn:"Plot 14 becomes available",place:"Kleingartenverein Lindenau, Aushang & Garten",bg:"park",contextTags:["hobby","community","nature"],requiredItems:["der-verein","die-nachbarschaft"],introducedItems:["der-kleingarten","die-laube","pachten","die-anlage","die-warteliste","die-gartenordnung"],beats:[{type:"narration",text:"Der Aushang hängt wie ein Gerücht: „Parzelle 14 frei ab 1. Mai. Pacht 38 €/Monat. Bewerbung beim Vorstand.“ Jonas tippt dir auf die Schulter: „Nummer 14? Da war mal Frau Lippold. Die ist 94 und zieht zu ihrer Tochter. Die Laube ist von 1961.“"},{type:"line",speaker:"jonas",text:"Kleingarten ist keine Freizeit, das ist ein Amt mit Erdbeeren. …Du pachtest das Land, du pflegst die Anlage mit, du hältst dich an die Gartenordnung. …Und du gewinnst: Nachbarn, Apfelbaum, und den besten Sommer deines Lebens.",translation:"An allotment isn't leisure, it's an office with strawberries. …You lease the land, you help maintain the complex, you follow the ga
