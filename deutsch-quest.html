rden rules. …And you gain: neighbours, an apple tree, and the best summer of your life."},{type:"meet",itemIds:["der-kleingarten","pachten","die-gartenordnung"]},{type:"line",speaker:"frau-bruegge",text:"(kommt angelaufen, natürlich hat sie es längst gehört) Nummer 14! …Die Warteliste ist lang, aber der Vorstand kennt dich — vom Brunnen, vom Ehrenamt, vom Vereinsfußball. …Und die Laube: NICHTS abreißen. Frau Lippold kommt im Sommer zum Kaffee. Alles bleibt.",translation:"(comes hurrying over, of course she already knows) Plot 14! …The waiting list is long, but the board knows you — from the fountain, from volunteering, from club football. …And the hut: tear NOTHING down. Frau Lippold is coming for coffee in summer. Everything stays."},{type:"meet",itemIds:["die-laube","die-anlage","die-warteliste"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Vorstand: „Herr Jones. Warum wollen Sie ausgerechnet hier einen Garten?“",options:[{label:"Weil ich hier angekommen bin — und Gärten wachsen langsamer als ich.",line:"Weil ich hier angekommen bin — und weil Gärten langsamer wachsen als mein Leben. Das tut gut."},{label:"Weil Frau Brügge Brunnen, Kuchen und nun auch Erdbeeren will.",line:"Weil Frau Brügge den Brunnen wollte, dann Kuchen — und jetzt offenbar Erdbeeren. Ich bereite mich vor."}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Aushang am Vereinsheim",text:`KLEINGARTENVEREIN LINDENAU e. V.

Parzelle 14 wird frei zum 01.05.

— Fläche: 320 m², mit Obstbäumen
— Laube (1961, gepflegt, mit Ofen)
— Pacht: 38 €/Monat
— Mitgliedschaft im Verein erforderlich

Bewerbungen schriftlich beim Vorstand.
Vergabe durch den Vorstand, nicht durch
die Warteliste allein — Engagement zählt.

Die Gartenordnung liegt im Vereinsheim aus.
Bitte lesen. Bitte beherzigen.`,translation:`ALLOTMENT CLUB LINDENAU

Plot 14 becomes available from 1 May.

— Area: 320 m², with fruit trees
— Hut (1961, well kept, with stove)
— Lease: €38/month
— Club membership required

Applications in writing to the board.
Allocation decided by the board, not by
the waiting list alone — commitment counts.

The garden rules are on display in the clubhouse.
Please read them. Please follow them.`}]},{id:"b2e12s2",episodeId:"b2e12",title:"Beete und Beschwerden",titleEn:"Beds and complaints",place:"Parzelle 14, erster richtiger Arbeitstag",bg:"park",contextTags:["hobby","nature","neighbors"],requiredItems:["das-werkzeug","die-geduld"],introducedItems:["das-beet","giessen","das-unkraut","jaeten","die-ernte","nicht-nur-sondern-auch"],beats:[{type:"narration",text:"Erster Arbeitstag: sieben Uhr, taufrisch, Werkzeug aus Jonas' Werkstatt. Frau Brügge hat eine Garten-Schürze mitgebracht. Aufgestickt: „Oberrat der Beete“. Niemand kennt dieses Amt. Sie erfindet es gerade."},{type:"line",speaker:"frau-bruegge",text:"So. Erst schauen, dann handeln. …Die Beete von Frau Lippold: Johannisbeere links, Rhabarber hinten, und in der Mitte — probier mal! — Erdbeeren. …Du gießt MORGENS oder ABENDS. Mittags gießen ist wie mittags reden: unnütz und anstrengend.",translation:"Right. First look, then act. …Frau Lippold's beds: redcurrants left, rhubarb at the back, and in the middle — taste! — strawberries. …You water in the MORNING or EVENING. Watering at noon is like talking at noon: useless and exhausting."},{type:"meet",itemIds:["das-beet","giessen","die-ernte"]},{type:"line",speaker:"jonas",text:"Und das hier ist Unkraut. Das ist nicht einfach Gras — das ist dein Gegner. …Jäten heißt: Wurzel mit raus, sonst kommt es wieder, und zwar beleidigt. …Ein Garten ist nicht nur Arbeit, sondern auch Entspannung. Aber heute? Heute ist Arbeit.",translation:"And this is weeds. That's not just grass — that's your opponent. …Weeding means: root and all, otherwise it comes back, and offended, too. …A garden isn't just work, it's also relaxation. But today? Today it's work."},{type:"meet",itemIds:["das-unkraut","jaeten","nicht-nur-sondern-auch"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Nachbar von Parzelle 13 läuft dreimal vorbei. Beim dritten Mal bleibt er.",options:[{label:"Guten Morgen! Ich bin Sam, neu bei 14. Rat erwünscht.",line:"Guten Morgen! Ich bin Sam, neu bei Nummer 14. Rat ist ausdrücklich erwünscht. …Er erzählt 40 Minuten. Alles Wichtige. Und was nicht Wichtiges."},{label:"Ihr Rasen ist beeindruckend. Mein Tip: Ich werde versuchen, euer Niveau zu halten.",line:"Ihr Rasen ist beeindruckend. Ich versuche, euer Niveau zu halten — aber ohne eure Mäh-Termine auszuspionieren."}]},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Mittags: Rücken meldet sich, Erdbeeren auch — süß, warm von der Sonne, unverkäuflich. Du pflückst eine Schale für Frau Lippold. Jäten, sagen sie, sei Meditation. Sie haben recht, aber erst nach der dritten Wurzel."}]},{id:"b2e12s3",episodeId:"b2e12",title:"Die Kaffeetafel",titleEn:"The coffee table",place:"Parzelle 14, unter dem Apfelbaum, Sonntag",bg:"fest",contextTags:["hobby","celebration","community"],requiredItems:["die-einladung","die-freude"],introducedItems:["die-kaffeetafel","der-apfelbaum","der-zaun","der-kompost","die-marmelade"],beats:[{type:"narration",text:"Sonntag, Ende Juli. Unter dem alten Apfelbaum steht die Kaffeetafel: Zwetschgenkuchen (Frau Brügge), Erdbeermarmelade (deine erste, Etikett: „Parzelle 14, handverlesen“), Kaffee aus der Thermoskanne von Jonas. Frau Lippold, 94, sitzt im Ehrenplatz."},{type:"line",speaker:"frau-lippold",text:"Also. …Die Laube sieht aus wie immer. Der Zaun ist 79 Zentimeter — einen Zentimeter Luft haben Sie gelassen, gut so, die Ordnung liebt Lücken. …Und die Marmelade? …(probiert) …Junger Mann. Die schmeckt wie 1975. Nehmen Sie das als Kompliment.",translation:"So. …The hut looks like it always has. The fence is 79 centimetres — you left one centimetre of air, good, rules love gaps. …And the jam? …(tastes) …Young man. It tastes like 1975. Take that as a compliment."},{type:"meet",itemIds:["die-kaffeetafel","die-marmelade","der-zaun"]},{type:"line",speaker:"jonas",text:"Und schau: der Kompost. …Alles, was der Garten nicht mehr braucht, wird wieder Boden. …Manchmal denk ich, so funktioniert Leipzig auch. Und vielleicht so ein Leben: Kompost, Geduld, dann Ernte.",translation:"And look: the compost. …Everything the garden no longer needs becomes soil again. …Sometimes I think that's how Leipzig works too. And maybe a life: compost, patience, then harvest."},{type:"meet",itemIds:["der-apfelbaum","der-kompost"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:'Frau Lippold klopft dir auf den Handrücken. „Bewahren Sie den Garten so. Versprechen Sie es."',options:[{label:"Ich verspreche es. Mit Ausnahme: neue Erdbeersorten.",line:"Ich verspreche es — mit genau einer Ausnahme: neue Erdbeersorten. Experimente sind Erbe auch."},{label:"Ich verspreche es. Und Sie kommen jeden Sommer zum Kontrolle.",line:"Ich verspreche es. Und Sie kommen jeden Sommer zur Kontrolle vorbei. …Frau Lippold: „Angenommen. Mit Kuchenpflicht.“"}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Aus der Gartenordnung (Abschnitt 7)",text:`§7 Nachbarschaft & Ordnung

(1) Hecken und Zäune dürfen eine Höhe
    von 80 cm nicht überschreiten.
(2) Der Kompost ist so zu führen, dass
    keine Belästigung entsteht.
(3) Wasser wird gespart. Die Regentonne
    ist VOR der Leitung zu benutzen.
(4) Gemeinschaftsflächen werden von allen
    Mitgliedern gepflegt. Klagen bitte
    beim Vorstand, nicht beim Nachbarn.
(5) Die Kaffeetafel ist eine Einladung.
    Kuchen mitbringen ist üblich,
    Rezepte zu teilen ist Pflicht.`,translation:`§7 Neighbourliness & order

(1) Hedges and fences must not exceed
    a height of 80 cm.
(2) The compost must be kept in a way
    that causes no nuisance.
(3) Water is to be saved. The rain barrel
    is to be used BEFORE the tap.
(4) Common areas are maintained by all
    members. Complaints go to the board,
    not to the neighbour.
(5) The coffee table is an invitation.
    Bringing cake is customary,
    sharing recipes is mandatory.`},{type:"narration",text:"Abendsonne durch die Apfelblätter. Auf deiner Liste steht für morgen: gießen, jäten, die Regentonne anschließen, Frau Lippold anrufen. Ein Garten ist nicht nur Arbeit — du hast es selbst gesagt, mitten im Unkraut, und es hat gestimmt."}]}],Hs={episode:er,cast:tr,items:nr,scenes:ir},Ns=Object.freeze(Object.defineProperty({__proto__:null,cast:tr,default:Hs,episode:er,items:nr,scenes:ir},Symbol.toStringTag,{value:"Module"})),rr={id:"b2e13",arcId:"B2",cefrLevel:"B2",title:"Die Weihnachtsansprache",titleEn:"The Christmas address",blurb:"Luises Idee: eine kurze Ansprache an beide Teams, vor Weihnachten. Du schreibst sie, kürzt sie, streichst sie — und hältst sie zweimal. Der Kern: Danke.",order:25,sceneIds:["b2e13s1","b2e13s2","b2e13s3"]},ar=[{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"rosa",name:"Rosa",role:"Teamleitung Plagwitz"},{id:"mei",name:"Mei",role:"Kollegin, Freundin"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"}],sr=[{id:"der-jahresabschluss",type:"word",german:"der Jahresabschluss",meaning:"the year-end (review/balance)",image:"kalender",audio:"tts",introducedInScene:"b2e13s1",tags:["work","time","reflection"],cefrLevel:"B2",note:"der, Plural: die Jahresabschlüsse — im Büro: Zahlen; im Café: Worte"},{id:"die-herausforderung",type:"word",german:"die Herausforderung",meaning:"the challenge",image:"ziel",audio:"tts",introducedInScene:"b2e13s1",tags:["work","reflection"],cefrLevel:"B2",note:"die, Plural: die Herausforderungen — herausfordern; gern im Bewerbungsgespräch"},{id:"zwar-aber",type:"grammar_pattern",german:"___ ist das Café klein, aber es hat Herz.",meaning:"The café may be small, but it has heart.",image:"gespräch",audio:"tts",introducedInScene:"b2e13s1",tags:["grammar"],cefrLevel:"B2",cloze:"Zwar",speak:"Zwar ist das Café klein, aber es hat Herz.",note:"zwar …, aber — Einräumung + Gegensatz; Verb nach „zwar“ auf Position 2"},{id:"der-humor",type:"word",german:"der Humor",meaning:"the humour",image:"person",audio:"tts",introducedInScene:"b2e13s1",tags:["opinion","people"],cefrLevel:"B2",note:"der ( Singular ) — Humor haben; trockener Humor = deutsche Spezialität"},{id:"die-kuerze",type:"word",german:"die Kürze",meaning:"the brevity / shortness",image:"urehr",audio:"tts",introducedInScene:"b2e13s1",tags:["time","writing"],cefrLevel:"B2",note:"die ( Singular ) — „In der Kürze liegt die Würze.“"},{id:"die-botschaft",type:"word",german:"die Botschaft",meaning:"the message",image:"brief",audio:"tts",introducedInScene:"b2e13s1",tags:["writing","media"],cefrLevel:"B2",note:"die, Plural: die Botschaften — die Botschaft ankommen lassen"},{id:"formulieren",type:"word",german:"formulieren",meaning:"to formulate / phrase",image:"konzept",audio:"tts",introducedInScene:"b2e13s2",tags:["writing","work"],cefrLevel:"B2",note:"formulieren — höflich formulieren; die Formulierung"},{id:"streichen",type:"word",german:"streichen",meaning:"to delete / cut (text)",image:"formular",audio:"tts",introducedInScene:"b2e13s2",tags:["writing"],cefrLevel:"B2",note:"stark: streichen — strich — gestrichen; auch: Farbe streichen"},{id:"zuhoeren",type:"chunk",german:"Zuhören ist eine Fähigkeit.",meaning:"Listening is a skill.",image:"gespräch",audio:"tts",introducedInScene:"b2e13s2",tags:["people","reflection"],cefrLevel:"B2",speak:"Zuhören ist eine Fähigkeit.",note:"das Zuhören — zuhören (trennbar) + Dativ"},{id:"die-einfachheit",type:"word",german:"die Einfachheit",meaning:"the simplicity",image:"idee",audio:"tts",introducedInScene:"b2e13s2",tags:["opinion","writing"],cefrLevel:"B2",note:"die ( Singular ) — einfach ≠ simpel; Einfachheit ist schwer"},{id:"der-kern",type:"word",german:"der Kern",meaning:"the core / kernel",image:"idee",audio:"tts",introducedInScene:"b2e13s2",tags:["reflection","writing"],cefrLevel:"B2",note:"der, Plural: die Kerne — auf den Kern kommen; im Kern"},{id:"das-podium",type:"word",german:"das Podium",meaning:"the podium / platform",image:"konzert",audio:"tts",introducedInScene:"b2e13s3",tags:["events","work"],cefrLevel:"B2",note:"das, Plural: die Podien — heute: ein Milch-Kistchen"},{id:"die-aufmerksamkeit",type:"word",german:"die Aufmerksamkeit",meaning:"the attention",image:"laut",audio:"tts",introducedInScene:"b2e13s3",tags:["people","events"],cefrLevel:"B2",note:"die, Plural: die Aufmerksamkeiten — Aufmerksamkeit schenken"},{id:"der-applaus",type:"word",german:"der Applaus",meaning:"the applause",image:"fest",audio:"tts",introducedInScene:"b2e13s3",tags:["events"],cefrLevel:"B2",note:"der ( Singular ) — Applaus ist nicht Beifall; beides ist schön"},{id:"die-gelegenheit-ergreifen",type:"chunk",german:"Ich ergreife die Gelegenheit.",meaning:"I'm seizing the opportunity.",image:"entscheidung",audio:"tts",introducedInScene:"b2e13s3",tags:["politeness","work"],cefrLevel:"B2",speak:"Ich ergreife die Gelegenheit.",note:"die Gelegenheit — ergreifen, nutzen; förmlich und gut"},{id:"der-zusammenhalt",type:"word",german:"der Zusammenhalt",meaning:"the (team) cohesion / solidarity",image:"team",audio:"tts",introducedInScene:"b2e13s3",tags:["work","people"],cefrLevel:"B2",note:"der ( Singular ) — Zusammenhalt ist das Wort fürs Teamgefühl"},{id:"der-jahresausklang",type:"word",german:"der Jahresausklang",meaning:"the end of the year",image:"sonnenuntergang",audio:"tts",introducedInScene:"b2e13s3",tags:["time","celebration"],cefrLevel:"B2",note:"der, Plural: die Jahresausklänge — ausklingen lassen"}],or=[{id:"b2e13s1",episodeId:"b2e13",title:"Der Auftrag",titleEn:"The assignment",place:"Café Kontor, Theke, vor Öffnung",bg:"cafe",contextTags:["work","friends","reflection"],requiredItems:["die-filiale","die-ansprache"],introducedItems:["der-jahresabschluss","die-herausforderung","zwar-aber","der-humor","die-kuerze","die-botschaft"],beats:[{type:"narration",text:"Luise legt ein Blatt auf die Theke, darauf: „Jahresabschluss — WORTE, nicht Zahlen. Sam hält die Ansprache. Beide Filialen. Kurz.“ …Du liest zweimal. Sie wartet, wie man wartet, wenn die Antwort sowieso feststeht."},{type:"line",speaker:"luise",text:"Sam. Du hast dieses Jahr zwei Filialen am Laufen gehalten, ein Team eingearbeitet und meinen Stammgästen ihre Namen gemerkt. …Die Ansprache gehört dir. Zwar ist das Café klein, aber es hat Herz — und du sprichst sein Herz am besten.",translation:"Sam. You've kept two branches running this year, onboarded a team, and remembered my regulars' names. …The address is yours. The café may be small, but it has heart — and you speak its heart best."},{type:"meet",itemIds:["der-jahresabschluss","zwar-aber","die-herausforderung"]},{type:"line",speaker:"rosa",text:"(aus Plagwitz angerufen) Ich habe gehört, du hältst die Ansprache! …Ein Tipp aus der Praxis: Teams verzeihen lange Ansprachen NICHT. …Kürze. Botschaft. Ein bisschen Humor. Fertig. Wir hören zu, versprochen — mit Kaffee.",translation:"(called from Plagwitz) I heard you're giving the address! …One tip from practice: teams do NOT forgive long speeches. …Brevity. Message. A bit of humour. Done. We'll listen, promise — with coffee."},{type:"meet",itemIds:["die-kuerze","die-botschaft","der-humor"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Luise: „Was ist die Herausforderung an der Sache? Du redest doch gern.“",options:[{label:"Dass es WAHR sein muss. Teams riechen Floskeln.",line:"Die Herausforderung: Es muss WAHR sein. Teams riechen Floskeln von drei Metern Entfernung."},{label:"Dass ich alle meine — und alle vermissen dürfen.",line:"Dass ich alle nennen will — und die Liste zu lang wird. Vermissen darf niemanden. …Luise: „Dann sag es so.“"}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Luises Notiz (auf dem Blatt geblieben)",text:`JAHRESABSCHLUSS — KONTROLLLISTE

✓ Zahlen: macht Rosa, danke Rosa
✓ Geschenke: macht Mei, danke Mei
○ Ansprache: macht Sam

Ansprache-Regeln (aus Erfahrung):
— unter 5 Minuten
— alle Namen, korrekt
— eine Geschichte, WAHR
— kein Firmendeutsch
— am Ende: Danke. Mehr braucht's nicht.

— L.`,translation:`YEAR-END — CHECKLIST

✓ numbers: Rosa's on it, thanks Rosa
✓ presents: Mei's on it, thanks Mei
○ address: Sam's on it

Address rules (from experience):
— under 5 minutes
— all names, correct
— one story, TRUE
— no corporate German
— at the end: thank you. That's all you need.

— L.`}]},{id:"b2e13s2",episodeId:"b2e13",title:"Schreiben, Streichen",titleEn:"Writing, cutting",place:"Wohnung, Donnerstag abend",bg:"wohnung",contextTags:["writing","friends","reflection"],requiredItems:["das-manuskript","die-kolumne"],introducedItems:["formulieren","streichen","zuhoeren","die-einfachheit","der-kern"],beats:[{type:"narration",text:"Manuskript Nummer eins: vier Seiten. Mei liest und sagt nichts. Das Nichts sagt genug. Dann streicht sie mit dem Bleistift Linien — die Hälfte bleibt, der Kern auch."},{type:"line",speaker:"mei",text:"Ich streiche jetzt. …Das hier: „Ich möchte die Gelegenheit nutzen“? Weg. Formulier das direkt: „Ich sage Danke.“ …Und das: „Wir haben Herausforderungen gemeistert“? Firmendeutsch. Sag stattdessen, WELCHE. Konkret ist dankbar.",translation:"I'm cutting now. …This: 'I would like to take the opportunity'? Gone. Phrase it directly: 'I say thank you.' …And: 'We mastered challenges'? Corporate speak. Say instead WHICH ones. Concrete is grateful."},{type:"meet",itemIds:["formulieren","streichen","die-einfachheit"]},{type:"line",speaker:"mei",text:"Und jetzt das Wichtigste: Der Kern deiner Ansprache ist nicht das Jahr. Der Kern bist du — und die Frage: Wer bist du nach zwei Jahren hier? …Antwort: Jemand, der zuhören gelernt hat. …Das ist dein letzter Satz. Vor dem Danke.",translation:"And now the most important thing: the core of your address isn't the year. The core is you — and the question: who are you after two years here? …Answer: someone who learned to listen. …That's your last sentence. Before the thank-you."},{type:"meet",itemIds:["zuhoeren","der-kern"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Zwei Versionen vor dir: zwei Seiten oder ein Satz. Was gewinnst?",options:[{label:"Der Satz. Und zwei Geschichten drumherum. Sonst nichts.",line:"Der Satz gewinnt — mit zwei echten Geschichten drumherum. Sonst nichts. Kürze ist Respekt vor der Zeit der anderen."},{label:"Zwei Seiten. Ich habe zwei Filialen zu bedanken.",line:"Zwei Seiten — ich habe zwei Filialen zu bedanken und zu viele Namen, die es wert sind. …Mei: „Dann streich die Übergänge, nicht die Namen.“"}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Manuskript, endgültige Fassung (Auszug)",text:`ANSPRACHE — 23. DEZEMBER

„Vor zwei Jahren fragte ich nach Gleis 7.
Heute frage ich nach Milch — für 400 Leute am Tag.

Zwar war dieses Jahr anstrengend,
aber es war das beste, das ich hatte.

Ich habe gelernt: Zuhören ist eine Fähigkeit.
Ich übe noch.

Danke. Für Namen, für Geduld, für Kaffee.
Frohe Weihnachten — jetzt guckt auf Mei,
sie singt gleich."`,translation:`ADDRESS — 23 DECEMBER

'Two years ago I asked about platform 7.
Today I ask about milk — for 400 people a day.

The café may be small,
but this year had heart.

I've learned: listening is a skill.
I'm still practising.

Thank you. For names, for patience, for coffee.
Merry Christmas — and now look at Mei,
she's about to sing.'`}]},{id:"b2e13s3",episodeId:"b2e13",title:"Zwei Filialen, eine Ansprache",titleEn:"Two branches, one address",place:"Café Kontor & Plagwitz, 23. Dezember",bg:"cafe",contextTags:["work","celebration","friends"],requiredItems:["die-teamleiterin","der-stammgast"],introducedItems:["das-podium","die-aufmerksamkeit","der-applaus","die-gelegenheit-ergreifen","der-zusammenhalt","der-jahresausklang"],beats:[{type:"narration",text:"Elf Uhr, Café Kontor: Das Team steht zwischen Kaffeemaschine und Theke, das Podium ist ein Milchkistchen. Elf vierzig, Plagwitz: dasselbe Blatt, ein anderes Kistchen. Dazwischen: die Tram, du, und ein Blatt mit einem Satz als Kern."},{type:"line",speaker:"luise",text:"(Kontor) So, Leute. Der Jahresausklang steht an, und Sam ergreift die Gelegenheit. …Sam: Wir zuhören. (flüsternd) Und JA, ich weine. Das ist kein Geheimnis mehr, das ist Tradition.",translation:"(Kontor) Right, everyone. The year is winding down, and Sam is seizing the opportunity. …Sam: we're listening. (whispering) And YES, I'm going to cry. That's no secret any more, that's tradition."},{type:"meet",itemIds:["das-podium","die-gelegenheit-ergreifen","der-jahresausklang"]},{type:"choice",prompt:"Der Anfang. Ein Satz, dann Stille. Deine Worte:",options:[{label:"„Vor zwei Jahren fragte ich nach Gleis 7. Heute frage ich nach Milch.“",line:"„Vor zwei Jahren fragte ich nach Gleis 7. Heute frage ich nach Milch — für vierhundert Leute am Tag.“ …(Lachen. Dann Stille. Der guten Art.)"},{label:"„Ich habe keine Zahlen. Rosa hat sie. Ich habe Namen.“",line:"„Ich habe keine Zahlen — Rosa hat sie. Ich habe Namen. Ich nenne sie alle, und wir gehen erst, wenn sie alle genannt sind.“ …(Applaus vor dem Applaus.)"}]},{type:"meet",itemIds:["die-aufmerksamkeit","der-zusammenhalt"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"rosa",text:"(Plagwitz, nach der Ansprache) …Ich hab gedacht, ich bin hart. …Ich stehe hier und habe Tränen in einer Kaffeebranche, in der ich seit zehn Jahren arbeite. …Zusammenhalt, Sam. Das war das Wort, das gefehlt hat. Alle Jahre wieder.",translation:"(Plagwitz, after the address) …I thought I was tough. …I'm standing here with tears in a coffee industry where I've worked for ten years. …Cohesion, Sam. That was the missing word. Every year again."},{type:"meet",itemIds:["der-applaus"]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Programmzettel: Jahresausklang",text:`CAFÉ KONTOR — JAHRESAUSKLANG

17:00 Ansprache (Sam. Kurz. Versprochen.)
17:05 Aufmerksamkeit fürs Team: Namen, Zahlen, Danke.
17:10 Zusammenhalt-Übung: gemeinsames Foto. Lächeln optional,
     Anwesenheit Pflicht.
17:30 Glühwein (Luise) · Kinderpunsch (Rosa denkt an alle)

»Ein Jahr geht nicht ohne die Menschen,
 die es getragen haben.«`,translation:`CAFÉ KONTOR — YEAR-END GATHERING

5 pm Address (Sam. Short. Promised.)
5:05 attention for the team: names, numbers, thank-you.
5:10 cohesion exercise: group photo. Smiling optional,
     attendance mandatory.
5:30 mulled wine (Luise) · kids' punch (Rosa thinks of everyone)

'A year doesn't pass without the people
who carried it.'`,itemIds:["der-jahresausklang","die-aufmerksamkeit","der-zusammenhalt"]},{type:"narration",text:"Zwischen den Filialen sitzt du in der Tram und schaust auf das Blatt. Es ist besetzt mit Notizen: Rosa hat „Zusammenhalt“ unterstrichen, Mei hat ein Häkchen hinter „Mei singt gleich“ gemacht, Luise hat ein Wasserflecken-Exposé ihrer Tränen hinterlassen. Zwei Filialen, eine Ansprache, ein Jahr — ausklingen lassen, bis Silvester den Rest sagt."}]}],Gs={episode:rr,cast:ar,items:sr,scenes:or},Rs=Object.freeze(Object.defineProperty({__proto__:null,cast:ar,default:Gs,episode:rr,items:sr,scenes:or},Symbol.toStringTag,{value:"Module"})),dr={id:"b2e14",arcId:"B2",cefrLevel:"B2",title:"Der Jahreswechsel",titleEn:"New Year's Eve",blurb:"Silvester im Hinterhof: Bleigießen, Feuerwerk, Wünsche, Vorsätze. Ein Jahr geht, ein Jahr kommt — und Sam weiß jetzt, was er sagen will, ohne vorher zu üben.",order:26,sceneIds:["b2e14s1","b2e14s2","b2e14s3"]},lr=[{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"mei",name:"Mei",role:"Freundin"},{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"deniz",name:"Deniz",role:"Nachbar"},{id:"sara",name:"Sara",role:"Tandem-Partnerin"},{id:"jonas",name:"Jonas",role:"Handwerker, Freund"}],cr=[{id:"der-jahreswechsel",type:"word",german:"der Jahreswechsel",meaning:"the turn of the year",image:"kalender",audio:"tts",introducedInScene:"b2e14s1",tags:["time","celebration"],cefrLevel:"B2",note:"der, Plural: die Jahreswechsel — zum Jahreswechsel"},{id:"die-silvesterparty",type:"word",german:"die Silvesterparty",meaning:"the New Year's Eve party",image:"fest",audio:"tts",introducedInScene:"b2e14s1",tags:["celebration","friends"],cefrLevel:"B2",note:"die, Plural: die Silvesterpartys — St. Sylvester heißt auf Deutsch Silvester"},{id:"das-feuerwerk",type:"word",german:"das Feuerwerk",meaning:"the fireworks",image:"feuerwerk",audio:"tts",introducedInScene:"b2e14s1",tags:["celebration"],cefrLevel:"B2",note:"das, Plural: die Feuerwerke — Mitternacht: alle gleichzeitig"},{id:"bleigießen",type:"chunk",german:"Wir machen Bleigießen.",meaning:"We're doing lead pouring (fortune telling).",image:"werkzeug",audio:"tts",introducedInScene:"b2e14s1",tags:["celebration","tradition"],cefrLevel:"B2",speak:"Wir machen Bleigießen.",note:"das Blei — gießen; klassisches Silvestrorakel (heute oft mit Wachs)"},{id:"das-konfetti",type:"word",german:"das Konfetti",meaning:"the confetti",image:"fest",audio:"tts",introducedInScene:"b2e14s1",tags:["celebration"],cefrLevel:"B2",note:"das ( Singular ) — im März findet man es noch. Immer."},{id:"ohne-zu",type:"grammar_pattern",german:"Ohne ___ Wort zu sagen, nickte sie.",meaning:"Without saying a word, she nodded.",image:"gespräch",audio:"tts",introducedInScene:"b2e14s1",tags:["grammar"],cefrLevel:"B2",cloze:"ein",speak:"Ohne ein Wort zu sagen, nickte sie.",note:"ohne … zu + Infinitiv — etwas bleibt aus; wie um…zu, aber negativ"},{id:"die-mitternacht",type:"word",german:"die Mitternacht",meaning:"midnight",image:"urehr",audio:"tts",introducedInScene:"b2e14s2",tags:["time","celebration"],cefrLevel:"B2",note:"die, Plural: die Mitternächte — um Mitternacht: der Jahreswechsel"},{id:"der-funke",type:"word",german:"der Funke",meaning:"the spark",image:"feuerwerk",audio:"tts",introducedInScene:"b2e14s2",tags:["celebration","reflection"],cefrLevel:"B2",note:"der, Plural: die Funken — der Funke springt über"},{id:"das-glueck",type:"word",german:"das Glück",meaning:"the luck / happiness",image:"person",audio:"tts",introducedInScene:"b2e14s2",tags:["feelings","celebration"],cefrLevel:"B2",note:"das ( Singular ) — „Viel Glück im neuen Jahr!“"},{id:"der-vorsatz",type:"word",german:"der Vorsatz",meaning:"the resolution / intention",image:"ziel",audio:"tts",introducedInScene:"b2e14s2",tags:["reflection","time"],cefrLevel:"B2",note:"der, Plural: die Vorsätze — der Neujahrsvorsatz, weltberühmt flüchtig"},{id:"sich-vornehmen",type:"chunk",german:"Ich nehme mir vor, weniger zu arbeiten.",meaning:"I intend to work less.",image:"kalender",audio:"tts",introducedInScene:"b2e14s2",tags:["reflection"],cefrLevel:"B2",speak:"Ich nehme mir vor, weniger zu arbeiten.",note:"sich (Dat.) etwas vornehmen — der Vorsatz kommt davon"},{id:"die-nacht",type:"word",german:"die Nacht",meaning:"the night",image:"zukunft",audio:"tts",introducedInScene:"b2e14s2",tags:["time"],cefrLevel:"B2",note:"die, Plural: die Nächte — die lange Nacht; Gute Nacht!"},{id:"das-neujahr",type:"word",german:"das Neujahr",meaning:"New Year's (Day)",image:"fest",audio:"tts",introducedInScene:"b2e14s3",tags:["celebration","time"],cefrLevel:"B2",note:"das ( Singular ) — „Frohes Neujahr!“; Neujahr = der 1. Januar"},{id:"die-vision",type:"word",german:"die Vision",meaning:"the vision",image:"idee",audio:"tts",introducedInScene:"b2e14s3",tags:["reflection","opinion"],cefrLevel:"B2",note:"die, Plural: die Visionen — größer als der Plan, kleiner als der Traum? Nein. Größer."},{id:"der-toast",type:"word",german:"der Toast",meaning:"the toast (drink)",image:"getränk",audio:"tts",introducedInScene:"b2e14s3",tags:["celebration","politeness"],cefrLevel:"B2",note:"der, Plural: die Toasts — einen Toast ausbringen AUF + Akkusativ"},{id:"das-versprechen",type:"word",german:"das Versprechen",meaning:"the promise",image:"geschenk",audio:"tts",introducedInScene:"b2e14s3",tags:["people","reflection"],cefrLevel:"B2",note:"das, Plural: die Versprechen — ein Versprechen geben und halten"},{id:"der-optimismus",type:"word",german:"der Optimismus",meaning:"the optimism",image:"sonnenuntergang",audio:"tts",introducedInScene:"b2e14s3",tags:["feelings","opinion"],cefrLevel:"B2",note:"der ( Singular ) — mit gesundem Optimismus; pessimistisch ↔ optimistisch"}],hr=[{id:"b2e14s1",episodeId:"b2e14",title:"Bleigießen",titleEn:"Lead pouring",place:"Hinterhof, Silvesternachmittag",bg:"fest",contextTags:["celebration","friends","tradition"],requiredItems:["das-jahr","die-freundschaft"],introducedItems:["der-jahreswechsel","die-silvesterparty","das-feuerwerk","bleigießen","das-konfetti","ohne-zu"],beats:[{type:"narration",text:"Silvester, Nachmittag. Der Hinterhof ist eine Party-Baustelle: Girlanden vom Geburtstag (dritte Wiederverwendung, mit Würde), Tische, Kerzen, und Frau Brügge mit einem Set Bleigießen aus dem Jahr 1989. Das Blei ist längst Wachs. Die Tradition ist geblieben."},{type:"line",speaker:"frau-bruegge",text:"Bleigießen! Ihr schmelzt Wachs, kippt es ins Wasser, und die Form sagt deine Zukunft. …Wissenschaftlich: Unsinn. Traditionell: Pflicht. …Sam, du fängst an. Neujahr braucht Omen, und deine haben bisher gut funktioniert.",translation:"Lead pouring! You melt wax, pour it into water, and the shape tells your future. …Scientifically: nonsense. Traditionally: mandatory. …Sam, you start. The new year needs omens, and yours have worked out well so far."},{type:"meet",itemIds:["bleigießen","die-silvesterparty","der-jahreswechsel"]},{type:"meet",itemIds:["das-feuerwerk","das-konfetti","ohne-zu"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Deine Wachsform landet im Wasser. Sie sieht aus wie … jemand rätselt.",options:[{label:"Ein Koffer. Na klar. Das Universum hat Humor.",line:"Ein Koffer. Na klar — das Universum hat Humor. …Frau Brügge: „Oder ein Brot. Dann hättest du einen Bäckerladen. Beides gut.“"},{label:"Eine Brücke. Ich lasse sie nicht deuten. Ich deute selbst.",line:"Eine Brücke. Und ich deute selbst: Ich verbinde. Das war das Jahr, das wird das nächste. …Ohne ein Wort zu sagen, nickt Frau Brügge."}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Deutungshilfe (aus Frau Brügges Karton)",text:`BLEIGIESSEN — OFFIZIELLE DEUTUNGS-HILFE
(Ernsthaftigkeit: flexibel)

Schiff      → eine Reise kommt
Brot        → du wirst satt oder Bäcker
Vogel       → Nachricht von Weitem
Blume       → etwas blüht
Koffer      → du gehst ODER du bleibst
Brücke      → du verbindest
Klumpen     → das Jahr war anstrengend.
              Leg dich hin.

Wer weint, muss Kuchen holen.`,translation:`LEAD POURING — OFFICIAL INTERPRETATION GUIDE
(Seriousness: flexible)

Ship       → a journey is coming
Bread      → you'll be fed, or become a baker
Bird       → news from afar
Flower     → something is blooming
Suitcase   → you'll leave OR you'll stay
Bridge     → you connect
Lump       → the year was exhausting.
            Lie down.

Whoever cries has to fetch cake.`}]},{id:"b2e14s2",episodeId:"b2e14",title:"Mitternacht",titleEn:"Midnight",place:"Hinterhof, kurz vor zwölf",bg:"fest",contextTags:["celebration","friends","feelings"],requiredItems:["feiern","die-einladung"],introducedItems:["die-mitternacht","der-funke","das-glueck","der-vorsatz","sich-vornehmen","die-nacht"],beats:[{type:"narration",text:"Elf Uhr sechsundfünfzig. Alle stehen im Hof, Gläser in der Hand, Atem in kleinen Wolken. Irgendwo knallt der erste frühe Feuerwerksfan. Tobias zählt falsch runter. Alle zählen mit. Es ist egal."},{type:"line",speaker:"tobias",text:"…drei, zwei, EINS — zu früh! …Nochmal! …(dann, wirklich) drei, zwei, eins — FROHES NEUES JAHR! …(Feuerwerk überall. Konfetti aus dem Nichts. Luise umarmt den ganzen Hof gleichzeitig.)",translation:"…three, two, ONE — too early! …Again! …(then, for real) three, two, one — HAPPY NEW YEAR! …(fireworks everywhere. Confetti from nowhere. Luise hugging the entire courtyard at once.)"},{type:"meet",itemIds:["die-mitternacht","das-glueck","der-funke"]},{type:"line",speaker:"luise",text:"Glück! Mehr davon! …Und jetzt: Vorsätze. Jeder einen, laut. …Ich nehme mir vor, weniger zu arbeiten. …(alle schauen sie an) …Oder wenigstens pünktlicher Feierabend. …JONAS. Du bist.",translation:"Luck! More of it! …And now: resolutions. One each, out loud. …I intend to work less. …(everyone stares) …Or at least finish on time. …JONAS. Your turn."},{type:"meet",itemIds:["der-vorsatz","sich-vornehmen","die-nacht"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Dein Vorsatz. Alle hören zu. Das Feuerwerk auch.",options:[{label:"Ich nehme mir vor, ein Buch zu schreiben. Die Kolumne hat's begonnen.",line:"Ich nehme mir vor, ein Buch zu schreiben — die Kolumne hat angefangen, der Rest fehlt noch. …(Mei: „KAPITEL EINS IST FERTIG. Du hast es vorgelesen!“)"},{label:"Ich nehme mir vor, Sara beim Spanisch korrigieren nicht mehr zu petzen.",line:"Ich nehme mir vor, beim Spanisch lernen mutiger zu sein — ein Fehler pro Satz, Minimum. Saras Regel. Sie nickt. Ohne ein Wort zu sagen."}]},{type:"check",count:2,mode:"listen"}]},{id:"b2e14s3",episodeId:"b2e14",title:"Frohes Neujahr",titleEn:"Happy New Year",place:"Treppenhaus, Neujahr, 1:20 Uhr",bg:"treppenhaus",contextTags:["celebration","friends","reflection"],requiredItems:["die-gewohnheit","gespannt"],introducedItems:["das-neujahr","die-vision","der-toast","das-versprechen","der-optimismus"],beats:[{type:"narration",text:"Nach Mitternacht: Der Hof leert sich langsam, und im Treppenhaus sitzen die übrig Gebliebenen — Tobias, Mei, Sara — auf den Stufen, Gläser in der Hand, Konfetti in den Haaren. Die Nacht ist warm trotz Winter."},{type:"line",speaker:"sara",text:"Ein Toast auf das Neujahr! …Auf Sam: vor zwei Jahren mit Koffer und ohne Wörter, heute mit zwei Filialen, einer Kolumne und einem Buch-Plan. …Auf die Vision! …Und auf das Versprechen: Du schreibst, wir lesen. Das ist ein Deal.",translation:"A toast to the New Year! …To Sam: two years ago with a suitcase and no words, today with two branches, a column and a book plan. …To the vision! …And to the promise: you write, we read. That's a deal."},{type:"meet",itemIds:["das-neujahr","der-toast","die-vision"]},{type:"line",speaker:"mei",text:"Und weißt du, was das Schönste ist? …Vor zwei Jahren hättest du diesen Toast nicht verstanden. Heute hast du ihn GEMACHT, mit Subjunktiv und allem. …Der Optimismus von dir, Sam. Der ist echt geworden. Der war vorher nur Zugabe.",translation:"And you know what's most beautiful? …Two years ago you wouldn't have understood that toast. Today you GAVE it, with subjunctive and everything. …Your optimism, Sam. It's become real. Before, it was just an encore."},{type:"meet",itemIds:["das-versprechen","der-optimismus"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias streckt die Hand aus. „Und dein erstes Wort im neuen Jahr?“",options:[{label:"„Danke.“ Zwei Silben, ein ganzes Jahr.",line:"Danke. Zwei Silben, ein ganzes Jahr drin. …Alle nicken. Ohne ein Wort zu sagen — ausnahmsweise."},{label:"„Weiter.“ Wie der Leserbrief von Ruth B. Weitermachen.",line:'Weiter. Wie im Leserbrief von Ruth B.: weitermachen. …Mei: „Das schaffst du. Kapitel eins wartet." '}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Frau Brügges Neujahrsnachricht (2:04 Uhr)",text:`Liebe Mieter, liebe Freunde,

das Jahr ist gewechselt, die Nächte werden länger
heller. (Fachbegriff.)

Danke für: Brunnen, Kuchen, Ratgeber,
Kaffee, Geduld, Musik, Deko, Besuche.

Meine Vorsätze:
1. weniger kontrollieren (Anfänge: schwer)
2. mehr Feiern (Anfänge: leicht)

Meine Vision: Dieses Haus bleibt voll.
Das ist keine Prophezeiung. Das ist ein Plan.

Frohes Neujahr — E. Brügge
(PS: Konfetti kehrt jeder selbst. Samstag.)`,translation:`Dear tenants, dear friends,

the year has turned; the nights are getting
longer-brighter. (technical term)

Thank you for: fountain, cake, advice,
coffee, patience, music, decorations, visits.

My resolutions:
1. less controlling (start: hard)
2. more celebrating (start: easy)

My vision: this house stays full.
That's not a prophecy. That's a plan.

Happy New Year — E. Brügge
(PS: everyone sweeps their own confetti. Saturday.`}]}],js={episode:dr,cast:lr,items:cr,scenes:hr},Cs=Object.freeze(Object.defineProperty({__proto__:null,cast:lr,default:js,episode:dr,items:cr,scenes:hr},Symbol.toStringTag,{value:"Module"})),ur={id:"b2e2",arcId:"B2",cefrLevel:"B2",title:"Bei Dr. Kern",titleEn:"At Dr. Kern's",blurb:"Die Schulter macht nicht mehr mit. Diagnose, Krankschreibung, Dienstrplan — Gesundheitsdeutsch auf B2-Niveau.",order:14,sceneIds:["b2e2s1","b2e2s2","b2e2s3"]},gr=[{id:"dr-kern",name:"Dr. Kern",role:"Hausärztin"},{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"mei",name:"Mei",role:"Kollegin"}],mr=[{id:"die-beschwerden",type:"word",german:"die Beschwerden",meaning:"the (medical) complaints",image:"stethoskop",audio:"tts",introducedInScene:"b2e2s1",tags:["health","doctor"],cefrLevel:"B2",note:"Pluralwort — im medizinischen Sinn: Symptome"},{id:"die-diagnose",type:"word",german:"die Diagnose",meaning:"the diagnosis",image:"stethoskop",audio:"tts",introducedInScene:"b2e2s1",tags:["health","doctor"],cefrLevel:"B2",note:"die, Plural: die Diagnosen"},{id:"das-ergebnis",type:"word",german:"das Ergebnis",meaning:"the result",image:"prüfen",audio:"tts",introducedInScene:"b2e2s1",tags:["health","doctor"],cefrLevel:"B2",note:"das, Plural: die Ergebnisse"},{id:"die-belastung",type:"word",german:"die Belastung",meaning:"the strain / load",image:"koffer",audio:"tts",introducedInScene:"b2e2s1",tags:["health","work"],cefrLevel:"B2",note:"die, Plural: die Belastungen"},{id:"verschreiben",type:"sentence",german:"Ich verschreibe Ihnen Physiotherapie.",meaning:"I'll prescribe physiotherapy for you.",audio:"tts",introducedInScene:"b2e2s1",tags:["health","doctor"],cefrLevel:"B2"},{id:"schonen-sie",type:"chunk",german:"Schonen Sie die Schulter.",meaning:"Take it easy on the shoulder.",audio:"tts",introducedInScene:"b2e2s1",tags:["health","doctor"],cefrLevel:"B2"},{id:"die-krankschreibung",type:"word",german:"die Krankschreibung",meaning:"the official sick leave",image:"brief",audio:"tts",introducedInScene:"b2e2s2",tags:["health","work","sick-leave"],cefrLevel:"B2",note:"die, Plural: die Krankschreibungen"},{id:"vertreten",type:"sentence",german:"Kann dich jemand vertreten?",meaning:"Can anyone cover for you?",audio:"tts",introducedInScene:"b2e2s2",tags:["work","sick-leave"],cefrLevel:"B2",note:"vertreten — hier: die Schicht übernehmen"},{id:"der-dienstplan",type:"word",german:"der Dienstplan",meaning:"the shift schedule / rota",image:"kalender",audio:"tts",introducedInScene:"b2e2s2",tags:["work","sick-leave"],cefrLevel:"B2",note:"der, Plural: die Dienstpläne"},{id:"bald-wieder-fit",type:"chunk",german:"Ich hoffe, du bist bald wieder fit.",meaning:"I hope you're back on your feet soon.",audio:"tts",introducedInScene:"b2e2s2",tags:["health","politeness"],cefrLevel:"B2"},{id:"sich-schonen",type:"chunk",german:"Ich muss mich schonen.",meaning:"I have to take it easy.",audio:"tts",introducedInScene:"b2e2s2",tags:["health"],cefrLevel:"B2",note:"sich schonen — reflexiv"},{id:"die-pause",type:"word",german:"die Pause",meaning:"the break",image:"urehr",audio:"tts",introducedInScene:"b2e2s2",tags:["work","health"],cefrLevel:"B2",note:"die, Plural: die Pausen — in Deutschland ein Grundrecht"},{id:"die-physiotherapie",type:"word",german:"die Physiotherapie",meaning:"the physiotherapy",image:"stethoskop",audio:"tts",introducedInScene:"b2e2s3",tags:["health"],cefrLevel:"B2",note:"die ( Singular ) — verschrieben von Dr. Kern, sechs Termine"},{id:"die-uebung",type:"word",german:"die Übung",meaning:"the exercise",image:"ball",audio:"tts",introducedInScene:"b2e2s3",tags:["health","learning"],cefrLevel:"B2",note:"die, Plural: die Übungen — täglich, nicht nur wenn's sich anhört"},{id:"die-beweglichkeit",type:"word",german:"die Beweglichkeit",meaning:"the mobility / flexibility",image:"ball",audio:"tts",introducedInScene:"b2e2s3",tags:["health"],cefrLevel:"B2",note:"die ( Singular ) — Berichtswort: „deutliche Verbesserung der Beweglichkeit“"},{id:"die-verbesserung",type:"word",german:"die Verbesserung",meaning:"the improvement",image:"zukunft",audio:"tts",introducedInScene:"b2e2s3",tags:["health","work"],cefrLevel:"B2",note:"die, Plural: die Verbesserungen — deutliche Verbesserung, sagt der Bericht"},{id:"belastbar",type:"word",german:"belastbar",meaning:"resilient / able to bear strain",image:"werkzeug",audio:"tts",introducedInScene:"b2e2s3",tags:["health","work","opinion"],cefrLevel:"B2",note:"Adjektiv — belastbar sein; liebt Bewerbungen und Atteste"},{id:"der-folgetermin",type:"word",german:"der Folgetermin",meaning:"the follow-up appointment",image:"kalender",audio:"tts",introducedInScene:"b2e2s3",tags:["health","time"],cefrLevel:"B2",note:"der, Plural: die Folgetermine — in vier Wochen, sagt Dr. Kern"}],pr=[{id:"b2e2s1",episodeId:"b2e2",title:"Klare Worte",titleEn:"Clear words",place:"Hausarztpraxis Dr. Kern",bg:"klinik",contextTags:["health","doctor","diagnosis"],requiredItems:["die-praxis","der-termin"],introducedItems:["die-beschwerden","die-diagnose","das-ergebnis","die-belastung","verschreiben","schonen-sie"],beats:[{type:"narration",text:"Baustellenwochen, Kaffeekisten, ein falscher Hebelgriff. Die Schulter meldet sich jetzt bei jedem Tassenheben. Dr. Kern misst, drückt, hört zu."},{type:"meet",itemIds:["die-beschwerden","die-belastung","schonen-sie"]},{type:"line",speaker:"dr-kern",text:"Also — Ihre Beschwerden passen zu einer Reizung der Sehne. Zu viel Belastung, zu wenig Pausen. Kein Weltuntergang, versprochen.",translation:"Well — your complaints fit an irritation of the tendon. Too much strain, too few breaks. Nothing serious."},{type:"meet",itemIds:["die-diagnose","das-ergebnis","verschreiben"]},{type:"choice",prompt:"Sie legt den Stift bereit.",options:[{label:"Und für die Arbeit? Ich hebe dort viel.",line:"Und für die Arbeit? Ich hebe dort täglich Kisten."},{label:"Soll ich die Schulter komplett schonen?",line:"Soll ich die Schulter komplett schonen?"}]},{type:"line",speaker:"dr-kern",text:"Ich verschreibe Ihnen Physiotherapie, sechs Termine. Und eine Woche Krankschreibung für die schweren Sachen. Das Ergebnis kontrollieren wir in zwei Wochen.",translation:"I'll prescribe physiotherapy, six sessions. And a week of sick leave for the heavy lifting. We'll check the result in two weeks."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"}]},{id:"b2e2s2",episodeId:"b2e2",title:"Die Krankschreibung",titleEn:"The sick leave",place:"Wohnung, Telefonat mit der Theke",bg:"wohnung",contextTags:["health","work","sick-leave"],requiredItems:["krank","die-verantwortung"],introducedItems:["die-krankschreibung","vertreten","der-dienstplan","bald-wieder-fit","sich-schonen","die-pause"],beats:[{type:"narration",text:"Du liegst mit einer Wärmflasche auf der Schulter und einer Aufgabe: Luise informieren, ohne Drama. Dr. Kerns Zettel liegt neben dem Handy."},{type:"meet",itemIds:["die-krankschreibung","der-dienstplan","die-pause"]},{type:"line",speaker:"luise",text:"Eine Woche?! …Nein, Moment: gut, dass du's sagst. Wer vertreibt… wer vertritt dich im Dienstplan? Mei?",translation:"A week?! …No, wait: good that you're telling me. Who covers you on the rota? Mei?"},{type:"meet",itemIds:["vertreten","sich-schonen","bald-wieder-fit"]},{type:"choice",prompt:"Luise wartet.",options:[{label:"Mei kann mich vertreten, ich kläre das.",line:"Mei kann mich vertreten, ich kläre das mit ihr."},{label:"Ich schicke dir die Krankschreibung als Foto.",line:"Ich schicke dir gleich ein Foto von der Krankschreibung."}]},{type:"line",speaker:"mei",text:"Alles gut, Chef-Träger. Ich übernehme deinen Samstag. Und jetzt: sich schonen, verstanden? Ich hoffe, du bist bald wieder fit!",translation:"All good, boss-lifter. I'll take your Saturday. And now: take it easy, understood? I hope you're back on your feet soon!"},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"SMS-Kette: Luise ↔ Sam",text:`LU: Wie schlimm? Wahrheit.
SAM: Schulter. Eine Woche Attest. Wahrheit.
LU: Wer vertritt deinen Samstag?
SAM: Mei. Dienstplan ist fertig. Foto folgt.
LU: Attest photo. NOW. Bürokratie-Liebe.
SAM: Folgt. Gute Besserung wünsche ich MIR selbst.
LU: Pause heißt PAUSE. Chef-Anweisung.
SAM: Sie sind nicht meine Chefin.
LU: Ich bin deine Kundin. Schlimmer.`,translation:`LU: How bad? Truth.
SAM: Shoulder. One week's sick note. Truth.
LU: Who covers your Saturday?
SAM: Mei. Rota's done. Photo to follow.
LU: Sickness-certificate photo. NOW. Bureaucratic love.
SAM: Coming. I wish MYSELF get-well-soon.
LU: Rest means REST. Boss's orders.
SAM: You're not my boss.
LU: I'm your customer. Worse.`,itemIds:["die-krankschreibung","vertreten","der-dienstplan"]},{type:"narration",text:"Eine Woche Pause. Der Dienstplan läuft ohne dich, die Welt dreht sich weiter — und das ist, stellt sich heraus, der ganze Sinn der Sache."}]},{id:"b2e2s3",episodeId:"b2e2",title:"Der Folgetermin",titleEn:"The follow-up",place:"Hausarztpraxis Dr. Kern, zwei Wochen später",bg:"klinik",contextTags:["health","work","recovery"],requiredItems:["die-krankschreibung","die-diagnose"],introducedItems:["die-physiotherapie","die-uebung","die-beweglichkeit","die-verbesserung","belastbar","der-folgetermin"],beats:[{type:"narration",text:"Zwei Wochen Krankschreibung, sechs Physio-Termine, fünf Übungen täglich — plus eine, die du vergessen hast, bis Frau Brügge dich beim Heben der Milchkisten erwischte. Heute: Folgetermin. Deine Schulter meldet sich, statt zu protestieren. Das ist neu."},{type:"meet",itemIds:["der-folgetermin","die-physiotherapie","die-uebung"]},{type:"line",speaker:"dr-kern",text:"Zeig mal. Heben … drehen … halten. …Das ist eine deutliche Verbesserung. Die Beweglichkeit ist fast vollständig zurück. Und die Übungen — machen Sie die wirklich? Seien Sie ehrlich. Patientenantworten sind meistens Poesie.",translation:"Show me. Lift … rotate … hold. …That's a clear improvement. Mobility is almost fully back. And the exercises — do you actually do them? Be honest. Patient answers are mostly poetry."},{type:"meet",itemIds:["die-beweglichkeit","die-verbesserung","belastbar"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Dr. Kern: „Und die Arbeit? Wann zurück?“",options:[{label:"Ich arbeite wieder — aber ich trage nicht mehr alles allein.",line:"Ich arbeite wieder — aber ich trage nicht mehr alles allein. Kaffeekisten sind jetzt Teamarbeit."},{label:"Samstag leite ich wieder. Der Dienstplan und ich sind wieder Freunde.",line:"Samstag leite ich wieder. Der Dienstplan und ich haben uns versöhnt."}]},{type:"line",speaker:"dr-kern",text:"Sehr gut. Nichts gegen Enthusiasmus — aber Schultern sind keine Kaffeekisten-Regale. …Wieder in vier Wochen, dann zur Kontrolle. Und: langsam steigern. Belastbar heißt nicht unzerstörbar. Das gilt für Schultern und für Menschen.",translation:"Very good. Nothing against enthusiasm — but shoulders are not coffee-crate shelves. …Again in four weeks, for a check-up. And: increase slowly. Resilient doesn't mean indestructible. That goes for shoulders and for people."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Physiotherapeutischer Verlaufsbericht (Auszug)",text:`Verlaufsbericht nach 6 Sitzungen

Beweglichkeit: deutliche Verbesserung,
Abduktion 140°, schmerzfrei.
Kraft: im Seitenvergleich annähernd ausgeglichen.

Empfehlung: Übungsprogramm täglich fortsetzen,
Belastung langsam steigern. Tätigkeiten bis 10 kg
sind tolerabel. Kontrolle durch die Hausärztin
im Folgetermin in 4 Wochen.

Patient wirkt motiviert. (Vermerk)`,translation:`Progress report after 6 sessions

Mobility: clear improvement, abduction 140°, pain-free.
Strength: nearly balanced in side-to-side comparison.

Recommendation: continue the exercise programme daily,
increase strain slowly. Activities up to 10 kg
are tolerable. Check-up with the GP at the
follow-up appointment in 4 weeks.

Patient appears motivated. (note)`,itemIds:["die-beweglichkeit","die-verbesserung","der-folgetermin"]},{type:"narration",text:"Du pinnst den Bericht an die Pinnwand — zwischen Zertifikat und Bescheid, auf den Platz, der Zukunft heißt. Mei schreibt: „Willkommen zurück, Chef-Träger. Leicht-Version.“"}]}],$s={episode:ur,cast:gr,items:mr,scenes:pr},Us=Object.freeze(Object.defineProperty({__proto__:null,cast:gr,default:$s,episode:ur,items:mr,scenes:pr},Symbol.toStringTag,{value:"Module"})),fr={id:"b2e3",arcId:"B2",cefrLevel:"B2",title:"Nebenkosten & Recht",titleEn:"Utilities & the law",blurb:"Eine Abrechnung, die nicht stimmt. Fristen, Widerspruch, Mieterverein — du lernst, für dich zu sprechen.",order:15,sceneIds:["b2e3s1","b2e3s2"]},br=[{id:"frau-otten",name:"Frau Otten",role:"Mieterverein, Beratung"},{id:"tobias",name:"Tobias",role:"Freund"}],kr=[{id:"die-abrechnung",type:"word",german:"die Abrechnung",meaning:"the (utility) statement / settlement",image:"beleg",audio:"tts",introducedInScene:"b2e3s1",tags:["bills","home","paperwork"],cefrLevel:"B2",note:"die, Plural: die Abrechnungen — jährlich gefürchtet"},{id:"der-betrag",type:"word",german:"der Betrag",meaning:"the amount",image:"münzen",audio:"tts",introducedInScene:"b2e3s1",tags:["bills","money"],cefrLevel:"B2",note:"der, Plural: die Beträge"},{id:"der-beleg",type:"word",german:"der Beleg",meaning:"the receipt / supporting document",image:"beleg",audio:"tts",introducedInScene:"b2e3s1",tags:["bills","paperwork"],cefrLevel:"B2",note:"der, Plural: die Belege"},{id:"ich-pruefe-jede-zahl",type:"chunk",german:"Ich prüfe jede Zahl.",meaning:"I check every number.",audio:"tts",introducedInScene:"b2e3s1",tags:["bills","paperwork"],cefrLevel:"B2"},{id:"hier-stimmt-etwas-nicht",type:"sentence",german:"Hier stimmt etwas nicht.",meaning:"Something is wrong here.",audio:"tts",introducedInScene:"b2e3s1",tags:["bills","law","conflict"],cefrLevel:"B2"},{id:"die-heizung",type:"word",german:"die Heizung",meaning:"the heating",image:"thermos",audio:"tts",introducedInScene:"b2e3s1",tags:["bills","home"],cefrLevel:"B2",note:"die, Plural: die Heizungen"},{id:"der-mieterverein",type:"word",german:"der Mieterverein",meaning:"the tenants' association",image:"team",audio:"tts",introducedInScene:"b2e3s2",tags:["law","home","paperwork"],cefrLevel:"B2"},{id:"die-frist",type:"word",german:"die Frist",meaning:"the deadline",image:"frist",audio:"tts",introducedInScene:"b2e3s2",tags:["law","paperwork","time"],cefrLevel:"B2",note:'die, Plural: die Fristen — „fristgerecht widersprechen"'},{id:"das-schreiben",type:"word",german:"das Schreiben",meaning:"the (official) letter",image:"brief",audio:"tts",introducedInScene:"b2e3s2",tags:["law","paperwork"],cefrLevel:"B2",note:"das, Plural: die Schreiben"},{id:"widersprechen",type:"grammar_pattern",german:"Wir widersprechen ___.",meaning:"We object to ___.",audio:"tts",introducedInScene:"b2e3s2",tags:["law","conflict"],cefrLevel:"B2",cloze:"der Forderung",alt:"der Forderung teilweise",speak:"Wir widersprechen der Forderung.",note:"widersprechen + Dativ"},{id:"der-anspruch",type:"word",german:"der Anspruch",meaning:"the claim / entitlement",image:"kaution",audio:"tts",introducedInScene:"b2e3s2",tags:["law","paperwork"],cefrLevel:"B2",note:"der, Plural: die Ansprüche"},{id:"die-beratung",type:"word",german:"die Beratung",meaning:"the advice / consultation",image:"gespräch",audio:"tts",introducedInScene:"b2e3s2",tags:["law","learning"],cefrLevel:"B2"}],wr=[{id:"b2e3s1",episodeId:"b2e3",title:"Die Abrechnung",titleEn:"The statement",place:"Küchentisch, Karl-Heine-Straße",bg:"wohnung",contextTags:["bills","home","paperwork"],requiredItems:["die-nebenkosten"],introducedItems:["die-abrechnung","der-betrag","der-beleg","ich-pruefe-jede-zahl","hier-stimmt-etwas-nicht","die-heizung"],beats:[{type:"narration",text:"Ein dicker Brief von der Hausverwaltung. Tobias kommt mit Lineal, du mit Kaffee. Auf dem Küchentisch entsteht ein Feldlager aus Zetteln."},{type:"meet",itemIds:["die-abrechnung","der-betrag","die-heizung"]},{type:"line",speaker:"tobias",text:"Nachzahlung, vierhundertzwölf Euro. …Hm. Vorjahr war die Heizung bei der Hälfte. Hast du geheizt wie ein Russe im Winter? …Nein. Also:",translation:"Back payment, four hundred twelve euros. …Hm. Last year the heating was half that. Did you heat like there's no tomorrow? …No. So:"},{type:"meet",itemIds:["der-beleg","ich-pruefe-jede-zahl","hier-stimmt-etwas-nicht"]},{type:"choice",prompt:"Zwei Stunden später: vierzehn Zahlen, ein Verdacht.",options:[{label:"Hier stimmt etwas nicht. Der Betrag ist doppelt.",line:"Hier stimmt etwas nicht — dieser Betrag steht zweimal drin."},{label:"Ich prüfe jede Zahl. Wo sind die Belege?",line:"Ich prüfe jede Zahl. Und: Wo sind die Belege zur Heizung?"}]},{type:"line",speaker:"tobias",text:"Genau das. Kein Beleg, falsche Summe. …Weißt du, was jetzt kommt? Mieterverein. Ich fahr dich hin, die haben Sprechstunde dienstags.",translation:"Exactly that. No receipt, wrong amount. …You know what comes now? Tenants' association. I'll take you there, they have consultation hours on Tuesdays."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Betriebskostenabrechnung (Auszug, markiert)",text:`Abrechnung 2025 — Kaltmiete 420 €/Monat

 Hier stimmt etwas nicht — Heizung zu hoch
 für zwei Monate Abwesenheit.«`,translation:`Utility statement 2025 — base rent €420/month

for two months of absence.'`,itemIds:["die-abrechnung","der-betrag","ich-pruefe-jede-zahl"]}]},{id:"b2e3s2",episodeId:"b2e3",title:"Beim Mieterverein",titleEn:"At the tenants' association",place:"Mieterverein Leipzig, Sprechstunde",bg:"amt",contextTags:["law","home","paperwork"],requiredItems:["hier-stimmt-etwas-nicht","die-abrechnung"],introducedItems:["der-mieterverein","die-frist","das-schreiben","widersprechen","der-anspruch","die-beratung"],beats:[{type:"narration",text:'Ein Büro mit Aktenschrank und einem Schild: „Mitgliedern Beratungsstunde". Frau Otten liest deine Abrechnung wie einen Krimi und kennt das Ende.'},{type:"meet",itemIds:["der-mieterverein","die-beratung","der-anspruch"]},{type:"line",speaker:"frau-otten",text:"Die Heizkosten sind falsch verteilt — ohne Belege dürfen sie gar nicht so abrechnen. Ihr habt Anspruch auf eine korrigierte Abrechnung. Punkt.",translation:"The heating costs are allocated wrongly — without receipts they're not even allowed to bill like that. You're entitled to a corrected statement. Full stop."},{type:"meet",itemIds:["die-frist","das-schreiben","widersprechen"]},{type:"choice",prompt:"Sie schiebt dir ein Formular.",options:[{label:"Wir widersprechen der Forderung.",line:"Wir widersprechen der Forderung — formell und fristgerecht."},{label:"Was ist die Frist für den Widerspruch?",line:"Was genau ist die Frist für den Widerspruch?"}]},{type:"line",speaker:"frau-otten",text:"Zwölf Monate, Sie haben Zeit. Aber: nicht warten. Das Schreiben geht raus, ich kopiere es für die Akte. …Und Samuel? Gut gemacht, dass Sie jede Zahl geprüft haben.",translation:"Twelve months, you have time. But: don't wait. The letter goes out, I'll copy it for the file. …And Sam? Well done checking every number."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Widerspruch (Entwurf, Mieterverein gelesen)",text:`Sehr geehrte Damen und Herren,

lege ich fristgerecht WIDERSPRUCH ein.

Begründung: Heizkostenvorauszahlung ohne
Belege, Abrechnungszeitraum unklar.

Ich bitte um Prüfung und Korrektur
bis zum 30.6. Die Frist ist notiert.

Mit freundlichen Grüßen
S. Jones (Mitglied: Mieterverein Leipzig)`,translation:`Dear Sir or Madam,

within the deadline.

unclear billing period.

by 30 June. The deadline is noted.

S. Jones (member: Leipzig Tenants' Association)`,itemIds:["widersprechen","die-frist","der-mieterverein"]},{type:"narration",text:"Acht Wochen später: korrigierte Abrechnung, dreihundertsechzig Euro zurück. Du rahmst nicht den Scheck, aber fast. Sich auf Deutsch durchsetzen — es geht. Du hast es gerade bewiesen."}]}],Os={episode:fr,cast:br,items:kr,scenes:wr},Vs=Object.freeze(Object.defineProperty({__proto__:null,cast:br,default:Os,episode:fr,items:kr,scenes:wr},Symbol.toStringTag,{value:"Module"})),yr={id:"b2e4",arcId:"B2",cefrLevel:"B2",title:"Das Nachbarschaftsfest",titleEn:"The neighbourhood festival",blurb:"Ein Jahr nach deiner Ankunft: Aufbau, Bratwurst, eine Rede. Was du gelernt hast, kommt zurück — alles gleichzeitig.",order:16,sceneIds:["b2e4s1","b2e4s2","b2e4s3"]},vr=[{id:"deniz",name:"Deniz",role:"Nachbar, Festorganisator"},{id:"alle",name:"Alle",role:"der Hof"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin, Ehrengast"},{id:"tobias",name:"Tobias",role:"Freund"},{id:"mei",name:"Mei",role:"Freundin, Kollegin"},{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"jonas",name:"Jonas",role:"Handwerker, Freund"}],Sr=[{id:"das-fest",type:"word",german:"das Fest",meaning:"the festival / celebration",image:"fest",audio:"tts",introducedInScene:"b2e4s1",tags:["festival","celebration","neighbors"],cefrLevel:"B2",note:"das, Plural: die Feste"},{id:"der-stand",type:"word",german:"der Stand",meaning:"the stall / booth",image:"stand",audio:"tts",introducedInScene:"b2e4s1",tags:["festival","neighbors"],cefrLevel:"B2",note:"der, Plural: die Stände"},{id:"wir-bauen-auf",type:"chunk",german:"Wir bauen den Stand um acht auf.",meaning:"We'll set up the stall at eight.",audio:"tts",introducedInScene:"b2e4s1",tags:["festival","planning"],cefrLevel:"B2",note:"aufbauen = auf + bauen, trennbar"},{id:"die-nachbarschaft",type:"word",german:"die Nachbarschaft",meaning:"the neighbourhood",image:"heimat",audio:"tts",introducedInScene:"b2e4s1",tags:["festival","neighbors","friends"],cefrLevel:"B2",note:"die ( Singular )"},{id:"das-getraenk",type:"word",german:"das Getränk",meaning:"the drink / beverage",image:"getränk",audio:"tts",introducedInScene:"b2e4s1",tags:["festival","food"],cefrLevel:"B2",note:"das, Plural: die Getränke"},{id:"bis-spaeter",type:"chunk",german:"Bis später!",meaning:"See you later!",audio:"tts",introducedInScene:"b2e4s1",tags:["smalltalk","festival"],cefrLevel:"B2"},{id:"die-bratwurst",type:"word",german:"die Bratwurst",meaning:"the bratwurst / grilled sausage",image:"bratwurst",audio:"tts",introducedInScene:"b2e4s2",tags:["festival","food"],cefrLevel:"B2",note:"die, Plural: die Bratwürste — thüringisch oder coburger, niemals neutral"},{id:"die-limonade",type:"word",german:"die Limonade",meaning:"the lemonade / soft drink",image:"getränk",audio:"tts",introducedInScene:"b2e4s2",tags:["festival","food"],cefrLevel:"B2",note:"die, Plural: die Limonaden — Hausgemachte ist Pflicht"},{id:"platz-im-schatten",type:"sentence",german:"Gibt es einen Platz im Schatten?",meaning:"Is there a seat in the shade?",audio:"tts",introducedInScene:"b2e4s2",tags:["festival","politeness","questions"],cefrLevel:"B2"},{id:"die-sonne",type:"word",german:"die Sonne",meaning:"the sun",image:"sonnenuntergang",audio:"tts",introducedInScene:"b2e4s2",tags:["festival","smalltalk"],cefrLevel:"B2"},{id:"zum-wohl",type:"chunk",german:"Zum Wohl!",meaning:"Cheers! / To your health!",audio:"tts",introducedInScene:"b2e4s2",tags:["festival","politeness"],cefrLevel:"B2",note:"Mit Blickkontakt. Immer mit Blickkontakt."},{id:"die-rede",type:"word",german:"die Rede",meaning:"the speech",image:"mic",audio:"tts",introducedInScene:"b2e4s3",tags:["festival","reflection"],cefrLevel:"B2",note:'die, Plural: die Reden — „eine Rede halten"'},{id:"stolz",type:"word",german:"stolz",meaning:"proud",image:"heimat",audio:"tts",introducedInScene:"b2e4s3",tags:["reflection","opinion"],cefrLevel:"B2",note:'Adjektiv — „stolz auf jemanden"'},{id:"die-heimat",type:"word",german:"die Heimat",meaning:"the home / homeland",image:"heimat",audio:"tts",introducedInScene:"b2e4s3",tags:["reflection"],cefrLevel:"B2",note:"die ( Singular ) — großes deutsches Wort, viele Bedeutungen"},{id:"wir-haben-gemeinsam",type:"chunk",german:"Wir haben gemeinsam etwas gebaut.",meaning:"We built something together.",audio:"tts",introducedInScene:"b2e4s3",tags:["reflection","neighbors"],cefrLevel:"B2"},{id:"auf-uns",type:"chunk",german:"Auf uns!",meaning:"To us! (toast)",audio:"tts",introducedInScene:"b2e4s3",tags:["festival","celebration"],cefrLevel:"B2"},{id:"danke-dass-ihr",type:"sentence",german:"Danke, dass ihr mich so aufgenommen habt.",meaning:"Thank you for taking me in like this.",audio:"tts",introducedInScene:"b2e4s3",tags:["reflection","politeness","friends"],cefrLevel:"B2"}],Ir=[{id:"b2e4s1",episodeId:"b2e4",title:"Aufbau",titleEn:"Setting up",place:"Innenhof der Bärbelstraße, 8:00 Uhr",bg:"park",contextTags:["festival","neighbors","celebration"],requiredItems:[],introducedItems:["das-fest","der-stand","wir-bauen-auf","die-nachbarschaft","das-getraenk","bis-spaeter"],beats:[{type:"narration",text:'Ein Jahr ist es her, seit du mit einem Koffer durch die Bahnhofshalle liefst. Heute hängt ein Banner zwischen den Bäumen: „Nachbarschaftsfest Bärbelstraße — alle sind eingeladen". Alle heißt: auch du, offiziell.'},{type:"meet",itemIds:["das-fest","der-stand","wir-bauen-auf"]},{type:"line",speaker:"deniz",text:"Morgen, Sam! Wir bauen den Stand um acht auf — Kaffee gibt's ab acht Uhr fünf.",translation:"Morning, Sam! We'll set up the stall at eight — coffee from eight fifteen."},{type:"meet",itemIds:["die-nachbarschaft","das-getraenk","bis-spaeter"]},{type:"choice",prompt:"Deniz reicht dir eine Kiste Limonadenflaschen.",options:[{label:"Wir bauen zusammen auf — wo hin mit den Getränken?",line:"Wir bauen zusammen auf — wo soll ich die Getränke hintun?"},{label:"Bis später! Ich hol noch Frau Brügge ab.",line:"Bis später! Ich hole noch Frau Brügge ab."}]},{type:"line",speaker:"deniz",text:"Getränke an den Stand, Kuchen zu Frau Brügge. …Und Sam: Um vier hält jemand eine Rede. Ich hab an dich gedacht. Überraschung!",translation:"Drinks to the stall, cake to Frau Brügge. …And Sam: at four somebody's giving a speech. I thought of you. Surprise!"},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Aushang: Nachbarschaftsfest",text:`HOF FEST — SAMSTAG, 15 UHR

3. »Heimat ist kein Ort. Heimat ist, wer bleibt.«
4. »Wir haben gemeinsam einen Hof lebendig gemacht.«
5. »Auf uns.«

(Rückseite: „Nicht weinen. ABER wenn, dann bei 5.“)`,translation:`1. 'Two years ago I knew nobody here.'

4. 'Together we brought a courtyard to life.'
5. 'To us.'

 solution",image:"idee",audio:"tts",introducedInScene:"b2e5s2",tags:["construction","planning"],cefrLevel:"B2",note:"die, Plural: die Lösungen"},{id:"der-fortschritt",type:"word",german:"der Fortschritt",meaning:"the progress",image:"ziel",audio:"tts",introducedInScene:"b2e5s3",tags:["construction","planning"],cefrLevel:"B2",note:"der ( Singular ) — „Fortschritte machen“"},{id:"das-protokoll-wird-geschrieben",type:"grammar_pattern",german:"Das Protokoll wird von Sam ___.",meaning:"The minutes are being ___ (written) by Sam.",audio:"tts",introducedInScene:"b2e5s3",tags:["construction","grammar","work"],cefrLevel:"B2",cloze:"geschrieben",speak:"Das Protokoll wird von Sam geschrieben.",note:"Passiv mit Agentur: von + Dativ"},{id:"abnehmen",type:"chunk",german:"Wir nehmen die Arbeit ab.",meaning:"We accept the work (inspection).",image:"prüfen",audio:"tts",introducedInScene:"b2e5s3",tags:["construction","work"],cefrLevel:"B2",note:"abnehmen = ab + nehmen — hier: formal abnehmen"},{id:"rohbau-steht",type:"chunk",german:"Rohbau steht!",meaning:"Shell construction is up!",image:"haus",audio:"tts",introducedInScene:"b2e5s3",tags:["construction"],cefrLevel:"B2"},{id:"zuverlaessigkeit-zaehlt",type:"sentence",german:"Am Ende zählt Zuverlässigkeit.",meaning:"In the end, reliability is what counts.",image:"ziel",audio:"tts",introducedInScene:"b2e5s3",tags:["construction","opinion","work"],cefrLevel:"B2"},{id:"stolz-auf-uns",type:"chunk",german:"Wir können stolz auf uns sein.",meaning:"We can be proud of ourselves.",audio:"tts",introducedInScene:"b2e5s3",tags:["opinion","feelings"],cefrLevel:"B2",note:"stolz sein auf + Akkusativ"}],Tr=[{id:"b2e5s1",episodeId:"b2e5",title:"Baubeginn",titleEn:"Construction begins",place:"Hinterhof des Cafés, Montag 7:00",bg:"werkstatt",contextTags:["construction","work","money"],requiredItems:["die-verantwortung","das-budget"],introducedItems:["die-baustelle","der-anbau-wird-gebaut","der-lieferant","die-lieferung","der-kostenvoranschlag","das-mater nial.",translation:"Well negotiated. …The delivery comes Monday morning, no extra cost, and the materials were already checked at the warehouse. We'll pick them up ourselves. Brilliant."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Montag, 7:15. Der LKW rückwärts in den Hof. Du schreibst es ins Protokoll, mit Datum und Uhrzeit, wie ein Mensch, der sowas einfach kann."}]},{id:"b2e5s3",episodeId:"b2e5",title:"Rohbau steht",titleEn:"Shell is up",place:"Hinterhof, drei Wochen später",bg:"buero",contextTags:["construction","planning","celebration"],requiredItems:["die-baustelle","das-budget"],introducedItems:["der-fortschritt","das-protokoll-wird-geschrieben","abnehmen","rohbau-steht","zuverlaessigkeit-zaehlt","stolz-auf-uns"],beats:[{type:"narration",text:"Drei Wochen später: Wände, Fenster, Dach. Glasfront nach Süden, genau wie im Plan. Der Hinterhof sieht aus wie die Zeichnung, die Herr Baumann vor Wochen entrollt hat."},{type:"line",speaker:"architekt",text:"Rohbau steht! Ich nehme die Arbeit heute offiziell ab — und ich sage es selten: Alles sauber. Alles termingerecht.",translation:"Shell is up! I'm officially accepting the work today — and I rarely say this: everything's clean. Everything on schedule."},{type:"meet",itemIds:["rohbau-steht","abnehmen","der-fortschritt"]},{type:"line",speaker:"luise",text:"Protokoll, letzter Stand? …Danke. Weißt du, was ich gelernt habe? Am Ende zählt Zuverlässigkeit. Und die kommt nicht vom Architekten.",translation:"Minutes, latest status? …Thanks. You know what I've learned? In the end reliability is what counts. And that doesn't come from the architect."},{type:"meet",itemIds:["das-protokoll-wird-geschrieben","zuverlaessigkeit-zaehlt","stolz-auf-uns"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mei und Jonas schauen dich an.",options:[{label:"Wir können stolz auf uns sein.",line:"Wir können wirklich stolz auf uns sein."},{label:"Nächstes Projekt: Dachterrasse. chen","wie-lange-lernst-du-schon"],beats:[{type:"narration",text:"Volkshochschule Leipzig, Flur mit Kursplänen hinter Glas. Bei der Anmeldung liegt ein Zettel: „telc Deutsch B2 — nächste Prüfung in sechs Wochen.“ Mei schiebt dich fast durch die Tür."},{type:"line",speaker:"mei",text:"Wir melden uns beide an. Wenn du bestehst, zahle ich den Kuchen. Wenn ICH bestehe, zahlst du. Fair?",translation:"We're both registering. If you pass, I'll pay for the cake. If I pass, you pay. Fair?"},{type:"meet",itemIds:["die-volkshochschule","sich-anmelden-zur-pruefung","das-ziel-erreichen"]},{type:"narration",text:"Der Probetest liegt vor euch. 90 Minuten Lesen, dann Hören. Nach 40 Minuten hat Mei den Stift durchgebissen."},{type:"meet",itemIds:["der-probetest","die-anspannung","wie-lange-lernst-du-schon"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mei, entnervt: „Und, wie lange lernst du schon Deutsch?“",options:[{label:"Zwei Jahre. Aber jeden Tag. Jeden!",line:"Zwei Jahre — aber jeden Tag ein bisschen. Wirklich jeden."},{label:"Bis mein Ziel erreicht ist. Punkt.",line:"Bis ich mein Ziel erreiche. Mehr sage ich nicht."}]},{type:"line",speaker:"mei",text:"„Jeden Tag“ … okay, das ist keine Antwort, das ist ein Lebensstil. Gut. Sechs Wochen. Wir schaffen das.",translation:"'Every day' … okay, that's not an answer, that's a lifestyle. Fine. Six weeks. We've got this."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Prüfungsbestätigung VHS Leipzig",text:`Anmeldung telc Deutsch B2 — bestätigt
