 Markt schlägt Netz.“"},{label:"Behalten. Das ist die Hintergrundmusik meines Kellers.",line:"Behalten! Das ist die Hintergrundmusik meines Kellers. …„Sam. Musik im Keller braucht keinen Anwalt, sie braucht Zuhörer.“"}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Aushang am Jugendclub",text:`FLOHMARKT AM JUGENDCLUB
Samstag, 9–15 Uhr

Tisch mieten: 8 € (2 m)
Aufbau ab 7:30 Uhr

Regeln:
— Kein Verkauf von Neuer Ware
— Feilschen ausdrücklich erwünscht
— Reste bitte selbst mitnehmen

Bei Regen: fällt aus. Leipzig-Wetter.
Ehrenamtler gesucht für Kaffee & Kuchen.`,translation:`FLEA MARKET AT THE YOUTH CLUB
Saturday, 9 am–3 pm

Table rental: €8 (2 m)
Set-up from 7:30 am

Rules:
— No selling of new goods
— Haggling explicitly encouraged
— Please take leftovers home

In case of rain: cancelled. Leipzig weather.
Volunteers wanted for coffee & cake.`}]},{id:"b1e12s2",episodeId:"b1e12",title:"Hageln erlaubt",titleEn:"Haggling allowed",place:"Flohmarkt, Tisch 14, zwischen Porzellan und Platten",bg:"markt",contextTags:["shopping","money","city"],requiredItems:["bar-oder-mit-karte","die-kasse"],introducedItems:["feilschen","der-stammkunde","der-rabatt","das-geschirr","um-platz-zu"],beats:[{type:"narration",text:"Tisch 14: Geschirr von der letzten Miete, zwei Kartons Zeitschriften, die Schallplatte (dein teuerstes Objekt), und ein Schild: „ALLES MUSS WEG — wir verkaufen, um Platz zu schaffen!“"},{type:"line",speaker:"tobias",text:"Regel eins am Flohmarkt: Preise sind Vorschläge. Regel zwei: Wer feilscht, ist ehrlich. Regel drei: Erster Preis ist immer Test. …Und da kommt Herr Gellert — Stammkunde, kommt um acht, zahlt bar, kennt jeden. Warte ab.",translation:"Rule one at the flea market: prices are suggestions. Rule two: those who haggle are honest. Rule three: the first price is always a test. …And there comes Mr Gellert — regular customer, arrives at eight, pays cash, knows everyone. Just wait."},{type:"meet",itemIds:["feilschen","der-stammkunde","der-rabatt"]},{type:"meet",itemIds:["das-geschirr","um-platz-zu"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Herr Gellert: „Junge, die ganze Schüssel für fünf? Ich nehme alle. Was sagst du?“",options:[{label:"Acht, und ich gebe dir zehn Prozent Rabatt drauf.",line:"Acht Euro, und ich gebe dir zehn Prozent Rabatt. …Gellert: „Sechs.“ …„Sieben.“ …„Siebeneinhalb.“ …„Gesehen. Abgemacht, Sieben.“"},{label:"Fünf sind ok. Aber Sie erzählen mir, was das Geschirr war.",line:"Fünf sind ok. Aber Sie erzählen mir, was das Geschirr früher war. …Gellert erzählt. Achtzehn Minuten. Wertvoller als Euro."}]},{type:"line",speaker:"kunde",text:"Ich kaufe hier seit zwanzig Jahren. Bedenken? Klar. Aber wirfst du dein Geschirr weg, verlierst du Geschichten. Junge: Du sprichst gut. …Bargeld, wie es sich gehört. …Und: viel Erfolg beim Platz schaffen — du brauchst Platz, ich hab gesehen, wie du guckst.",translation:"I've been buying here for twenty years. Regrets? Sure. But when you throw your dishes away, you lose stories. Young man: you speak well. …Cash, as it should be. …And good luck making room — you need the space, I can see it in your face."},{type:"check",count:2,mode:"listen"}]},{id:"b1e12s3",episodeId:"b1e12",title:"Zu verschenken",titleEn:"For free",place:"Flohmarkt, 14:30, Restetisch",bg:"markt",contextTags:["shopping","community","friends"],requiredItems:["der-kuchen","die-torte"],introducedItems:["der-erloes","die-reste","zu-verschenken","die-freude","die-haelfte"],beats:[{type:"narration",text:"14:30 Uhr. Die Kasse wiegt sich zufrieden: Zweiundvierzig Euro Erlös. Auf dem Restetisch: die Reste — eine Laterne ohne Lampenfassungen, Geschirr-Einzelkinder, Zeitschriften von 2019. Tobias hat ein Schild geschrieben: „ZU VERSCHENKEN!“"},{type:"line",speaker:"tobias",text:"Schau zu. …Das ist Magie: „Zu verschenken“ — und binnen fünf Minuten ist die Hälfte weg. Leute, die nichts brauchen, laufen schneller als Busse, wenn es gratis ist. …Leipzig-Physik.",translation:"Watch this. …That's magic: 'for free' — and within five minutes half of it's gone. People who need nothing run faster than buses when it's free. …Leipzig physics."},{type:"meet",itemIds:["der-erloes","zu-verschenken","die-haelfte"]},{type:"meet",itemIds:["die-reste","die-freude"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Ein Junge fragt schüchtern, ob die Zeitschriften wirklich gratis sind.",options:[{label:"Zu verschenken! Viel Spaß damit — und les mal Seite 34.",line:"Zu verschenken! Viel Spaß damit — und les mal Seite 34, da ist ein Modellflugzeug drin. …Sein Lächeln ist mehr wert als der Erlös."},{label:"Klar — aber dafür erzählst du mir, was du damit baust.",line:"Klar, aber dafür erzählst du mir, was du damit baust. …Er baut Flugzeuge. Aus Pappe. Der Morgen ist gerettet."}]},{type:"line",speaker:"tobias",text:"Bilanz: zweiundvierzig Euro, ein leerer Keller, drei neue Bekannte, eine Lektion. …Manchmal ist der beste Preis nicht der höchste — sondern der, der dir was zurückgibt. Und du hast heute geredet wie ein Verkäufer, der die Sprache seines Markts spricht.",translation:"Balance sheet: forty-two euros, an empty basement, three new acquaintances, one lesson. …Sometimes the best price isn't the highest — it's the one that gives something back. And today you talked like a seller who speaks the language of his market."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Zettel auf dem Restetisch",text:`ZU VERSCHENKEN!

— Laterne (ohne Elektrik,
   mit Charakter)
— Teller, Einzelkinder
— Zeitschriften 2019
   (mit Modellbogen auf S. 34)
— ein Regenschirm,
   der Schnee überlebt hat

Nehmen, lächeln, gehen.
Das ist der ganze Deal.`,translation:`FOR FREE!

— Lantern (no wiring,
   plenty of character)
— Plates, singles only
— Magazines 2019
   (with model kit on page 34)
— one umbrella
   that survived snow

Take, smile, leave.
That's the whole deal.`}]}],cs={episode:Qn,cast:Xn,items:ei,scenes:ti},hs=Object.freeze(Object.defineProperty({__proto__:null,cast:Xn,default:cs,episode:Qn,items:ei,scenes:ti},Symbol.toStringTag,{value:"Module"})),ni={id:"b1e13",arcId:"B1",cefrLevel:"B1",title:"Heimweh und Fernweh",titleEn:"Homesickness and wanderlust",blurb:"November, grau wie ein unausgeschriebener Brief. Ein Videoanruf nach Hause, ein Gespräch mit Sara — und die Erkenntnis, dass man zwei Heimaten haben kann.",order:21,sceneIds:["b1e13s1","b1e13s2","b1e13s3"]},ii=[{id:"sara",name:"Sara",role:"Tandem-Partnerin aus Madrid"},{id:"mei",name:"Mei",role:"Kollegin, Freundin"},{id:"tobias",name:"Tobias",role:"Nachbar, Student"}],ri=[{id:"das-heimweh",type:"word",german:"das Heimweh",meaning:"homesickness",image:"heimat",audio:"tts",introducedInScene:"b1e13s1",tags:["feelings","family"],cefrLevel:"B1",note:"das ( Singular ) — Heimweh haben; Heim + Weh = Schmerz"},{id:"das-fernweh",type:"word",german:"das Fernweh",meaning:"wanderlust / longing for far places",image:"train",audio:"tts",introducedInScene:"b1e13s1",tags:["feelings","reflection"],cefrLevel:"B1",note:"das ( Singular ) — das Gegenteil von Heimweh. Oder die gleiche Sehnsucht?"},{id:"die-jahreszeit",type:"word",german:"die Jahreszeit",meaning:"the season",image:"kalender",audio:"tts",introducedInScene:"b1e13s1",tags:["time","weather"],cefrLevel:"B1",note:"die, Plural: die Jahreszeiten — „die dunkle Jahreszeit“"},{id:"diesig",type:"word",german:"diesig",meaning:"hazy / misty",image:"wetter",audio:"tts",introducedInScene:"b1e13s1",tags:["weather"],cefrLevel:"B1",note:"Adjektiv — der Himmel ist diesig; der Nebel ist nah"},{id:"die-mutter",type:"word",german:"die Mutter",meaning:"the mother",image:"person",audio:"tts",introducedInScene:"b1e13s1",tags:["people","family"],cefrLevel:"B1",note:"die, Plural: die Mütter — vertraut: die Mama"},{id:"der-vater",type:"word",german:"der Vater",meaning:"the father",image:"person",audio:"tts",introducedInScene:"b1e13s1",tags:["people","family"],cefrLevel:"B1",note:"der, Plural: die Väter — vertraut: der Papa"},{id:"sich-gewoehnen-an",type:"grammar_pattern",german:"Ich gewöhne mich ___ den November.",meaning:"I'm getting used to November.",image:"ziel",audio:"tts",introducedInScene:"b1e13s2",tags:["grammar","feelings"],cefrLevel:"B1",cloze:"an",speak:"Ich gewöhne mich an den November.",note:"sich gewöhnen AN + Akkusativ — das Gewöhnen braucht Zeit"},{id:"der-videoanruf",type:"word",german:"der Videoanruf",meaning:"the video call",image:"handy",audio:"tts",introducedInScene:"b1e13s2",tags:["technology","family"],cefrLevel:"B1",note:"der, Plural: die Videoanrufe — sollte, wird aber nur angerufen"},{id:"erinnern",type:"chunk",german:"Ich erinnere mich an alles.",meaning:"I remember everything.",image:"heimat",audio:"tts",introducedInScene:"b1e13s2",tags:["feelings","reflection"],cefrLevel:"B1",speak:"Ich erinnere mich an alles.",note:"sich erinnern AN + Akkusativ; die Erinnerung"},{id:"die-kindheit",type:"word",german:"die Kindheit",meaning:"the childhood",image:"person",audio:"tts",introducedInScene:"b1e13s2",tags:["family","reflection"],cefrLevel:"B1",note:"die, Plural: die Kindheiten — Kindheitserinnerungen"},{id:"zwischen-heimaten",type:"chunk",german:"Ich lebe zwischen zwei Heimaten.",meaning:"I live between two homelands.",image:"heimat",audio:"tts",introducedInScene:"b1e13s3",tags:["feelings","reflection"],cefrLevel:"B1",speak:"Ich lebe zwischen zwei Heimaten.",note:"die Heimat, Plural: die Heimaten — nicht everyone finds this word easy"},{id:"der-traum",type:"word",german:"der Traum",meaning:"the dream",image:"idee",audio:"tts",introducedInScene:"b1e13s3",tags:["feelings","reflection"],cefrLevel:"B1",note:"der, Plural: die Träume — ein Traum wird wahr"},{id:"wachsen",type:"word",german:"wachsen",meaning:"to grow",image:"blumen",audio:"tts",introducedInScene:"b1e13s3",tags:["nature","reflection"],cefrLevel:"B1",note:"wachsen — wuchs — gewachsen; auch: Menschen wachsen"},{id:"die-bruecke",type:"word",german:"die Brücke",meaning:"the bridge",image:"train",audio:"tts",introducedInScene:"b1e13s3",tags:["city","reflection"],cefrLevel:"B1",note:"die, Plural: die Brücken — Brücken bauen (auch im übertragenen Sinn)"},{id:"die-begegnung",type:"word",german:"die Begegnung",meaning:"the encounter / meeting",image:"team",audio:"tts",introducedInScene:"b1e13s3",tags:["people","reflection"],cefrLevel:"B1",note:"die, Plural: die Begegnungen — eine besondere Begegnung"},{id:"die-sehnsucht",type:"word",german:"die Sehnsucht",meaning:"the longing / yearning",image:"heimat",audio:"tts",introducedInScene:"b1e13s2",tags:["feelings","reflection"],cefrLevel:"B1",note:"die, Plural: die Sehnsuchten — sich sehnen NACH + Dativ"}],ai=[{id:"b1e13s1",episodeId:"b1e13",title:"November",titleEn:"November",place:"Wohnung, Fenster, grauer Himmel",bg:"wohnung",contextTags:["feelings","family","reflection"],requiredItems:["die-erinnerung","die-motivation"],introducedItems:["das-heimweh","das-fernweh","die-jahreszeit","diesig","die-mutter","der-vater"],beats:[{type:"narration",text:"November in Leipzig: Der Himmel ist diesig, die Sonne geht um vier unter, und die Stadt riecht nach nassem Laub. Dein Handy zeigt ein Foto: die Straße von zu Hause, in Sonne. Deine Mutter hat es geschickt. Kein Text. Nur das Foto."},{type:"line",speaker:"tobias",text:"Du starrst schon wieder auf dein Handy. …Heimweh? …Hey, das ist keine Schwäche, das ist eine Jahreszeit. November macht ALLEN was — ich kriege im November sogar Heimweh nach Sommer.",translation:"You're staring at your phone again. …Homesickness? …Hey, that's not weakness, that's a season. November gets to EVERYONE — I even get homesick for summer in November."},{type:"meet",itemIds:["das-heimweh","die-jahreszeit","diesig"]},{type:"meet",itemIds:["das-fernweh","die-mutter","der-vater"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Das Handy klingelt. Ihre Mutter. Dein Daumen schwebt über der Abheben-Taste.",options:[{label:"Ich nehme ab. Und lach dabei. Sie muss das sehen.",line:"Ich nehme ab — und ich lache dabei. Sie soll sehen, dass es mir hier gut geht. Auch wenn's heute weh tut."},{label:"Später. Erst Tee, erst Wort fürs Gespräch sammeln.",line:"Später. Erst ein Tee, erst die richtigen Wörter fürs Gespräch sammeln. Heimweh verzeiht eine Stunde."}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Nachricht von deiner Mutter",text:`Liebling,

vater fragt, ob du Wärmedämmung für den Balkon brauchst.
Ich sage ihm: er hat eine Wohnung. Mit Heizung. In Europa.
Er sagt: trotzdem.

Ich habe deine Lieblingsmarmelade eingekocht.
Sie ist nicht mailbar. Sie wartet.

Ruf an, wenn du magst.
Wir sind nicht weit. Nur laut.

Mutter`,translation:`Sweetheart,

your father asks if you need insulation for the balcony.
I tell him: he has a flat. With heating. In Europe.
He says: still.

I've bottled your favourite jam.
It's not mailable. It's waiting.

Call when you like.
We're not far. Just loud.

Mother`}]},{id:"b1e13s2",episodeId:"b1e13",title:"Videoanruf",titleEn:"The video call",place:"Clara-Zetkin-Park, Bank, Sonntag",bg:"park",contextTags:["family","feelings","reflection"],requiredItems:["das-tandem","die-muttersprache"],introducedItems:["sich-gewoehnen-an","der-videoanruf","erinnern","die-kindheit","die-sehnsucht"],beats:[{type:"narration",text:"Sonntag, Park, Bank. Der Videoanruf läuft: Ihre Mutter fragt nach dem Wetter (grau), dem Essen (gut), den Menschen („fremd, aber freundlich“). Ihr Vater erscheint im Bild, fragt nach der Heizung, verschwindet, kommt zurück mit einer Marmeladendose als Beweis."},{type:"line",speaker:"tobias",text:"(nach dem Anruf) Und? …Sam, du hast gelacht. Zehnmal. …Das ist kein Heimweh mehr — das ist ein anderes Wort: Zuhause in zwei Sprachen. …Sara sagt übrigens dasselbe. Sie wohnt seit drei Jahren „zwischen Madrid und Leipzig“.",translation:"(after the call) So? …Sam, you laughed. Ten times. …That's not homesickness any more — that's a different word: home in two languages. …Sara says the same thing. She's lived 'between Madrid and Leipzig' for three years."},{type:"meet",itemIds:["der-videoanruf","erinnern","die-kindheit"]},{type:"line",speaker:"sara",text:"Sam. Ich gewöhne mich seit drei Jahren an den deutschen November. …Warte, das klingt traurig. Ist es nicht: Man gewöhnt sich nicht, man WÄCHST in die Jahreszeit. …Und ich erinnere mich an jede Kindheitssommer-Sonne in Madrid. Beides darf sein.",translation:"Sam. I've been getting used to the German November for three years. …Wait, that sounds sad. It isn't: you don't get used to it, you GROW into the season. …And I remember every childhood summer sun in Madrid. Both are allowed."},{type:"meet",itemIds:["sich-gewoehnen-an","die-sehnsucht"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Sara: „Und was machst du mit dem Heimweh? Praktisch.“",options:[{label:"Ich koche ihr Rezept. Marmelade gibt es hier auch — fast.",line:"Ich koche ihr Rezept nach. Die Marmelade gibt es hier auch — fast die gleiche. Der Duft macht den Rest."},{label:"Ich plane eine Reise. Fernweh und Heimweh können sich abwechseln.",line:"Ich plane eine Reise nach Hause. Fernweh und Heimweh wechseln sich ab — wie die Jahreszeiten."}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Saras Sprachnotizen (Gruppenchat)",text:`Wochenende, Thema Heimweh:

— das Heimweh ≠ das Fernweh
  (eines zieht dich zurück,
   eines zieht dich fort)
— sich gewöhnen AN + Akkusativ
  („Ich gewöhne mich an den November“)
— sich erinnern AN + Akkusativ
  (beide Präpositionen: an! Merkwürdig,
   aber jetzt sind sie Freunde)

Hausaufgabe: ein Satz mit beiden Wörtern.
Ich fange an: „Fernweh brachte mich hierher,
Heimweh lässt mich schreiben.«`,translation:`Weekend, topic: homesickness.

— das Heimweh ≠ das Fernweh
  (one pulls you back,
   one pulls you away)
— sich gewöhnen AN + accusative
  ('I'm getting used to November')
— sich erinnern AN + accusative
  (both prepositions: an! Strange,
   but now they're friends)

Homework: one sentence with both words.
I'll start: 'Wanderlust brought me here,
homesickness makes me write.'`}]},{id:"b1e13s3",episodeId:"b1e13",title:"Zwischen zwei Heimaten",titleEn:"Between two homelands",place:"Café Luise, Abend",bg:"cafe",contextTags:["feelings","friends","reflection"],requiredItems:["die-zukunft","dankbar"],introducedItems:["zwischen-heimaten","der-traum","wachsen","die-bruecke","die-begegnung"],beats:[{type:"narration",text:"Abends im Café Luise: Mei hat Waffeln gemacht („Mitleid mit November-Menschen“), Sara sitzt mit Tee, Tobias mit einem Plan fürs Wochenende. Das Gespräch wird tiefer als der Kaffee."},{type:"line",speaker:"mei",text:"Ich hab auch Heimweh gehabt. Jahrelang. …Bis ich gemerkt habe: Heimweh ist keine Richtung, das ist Liebe. Man liebt einfach von weit weg. …Und dann, irgendwann, liebt man zweimal. Ohne Verrat. Das ist der Trick.",translation:"I had homesickness too. For years. …Until I realised: homesickness isn't a direction, it's love. You just love from far away. …And then, at some point, you love twice. Without betrayal. That's the trick."},{type:"meet",itemIds:["zwischen-heimaten","der-traum","die-begegnung"]},{type:"line",speaker:"sara",text:"Genau. Ich lebe zwischen zwei Heimaten — und weißt du, was dazwischen liegt? Eine Brücke. Die heißt: Telefonate, Briefe, Besuche, Erinnerungen. …Und: neue Begegnungen. Ich bin nicht zwischen zwei Welten. Ich bin auf einer Brücke mit Aussicht.",translation:"Exactly. I live between two homelands — and you know what lies between them? A bridge. It's called: phone calls, letters, visits, memories. …And: new encounters. I'm not between two worlds. I'm on a bridge with a view."},{type:"meet",itemIds:["die-bruecke","wachsen"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mei: „Und du, Sam? Wo bist du gerade?“",options:[{label:"Auf der Brücke. Aber ich baue sie breiter. Mit Kaffee.",line:"Auf der Brücke. Aber ich baue sie gerade breiter — mit Telefonaten, Kaffee und einem Café voller Leute."},{label:"Ich bin dankbar. Für beide Heimat-Adressen in meinem Kopf.",line:"Ich bin dankbar. Für beide Heimat-Adressen in meinem Kopf — und dass ich die Briefmarken für beide habe."}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Saras Sprachnotiz (November-Sonderausgabe)",text:`Wort der dunklen Jahreszeit:

die Brücke — verbindet zwei Seiten.
Beispiele: Madrid–Leipzig. Gestern–Morgen.

Man wächst in die Jahreszeit hinein.
Jede Begegnung ist eine Planke.

Hausaufgabe: Nenne deine Brücke.
Ein Satz reicht. Mehr wird nicht verlangt.
Weniger wäre schade.`,translation:`Word of the dark season:

die Brücke (the bridge) — connects two sides.
Examples: Madrid–Leipzig. Yesterday–tomorrow.

You grow into the season.
Every encounter is one plank.

Homework: name your bridge.
One sentence is enough. More isn't required.
Less would be a shame.`,itemIds:["die-bruecke","wachsen","die-begegnung"]},{type:"narration",text:"Zu Hause schreibst du zwei Nachrichten: eine auf Spanisch an deine Mutter („die Marmelade kann warten, ich bringe einen Koffer mit“), eine an Frau Brügge („brauche für nächsten Sommer zwei Wochen Urlaub“). Fernweh und Heimweh, eingeteilt in einen Kalender. Der November graut weiter draußen — drinnen wächst etwas."}]}],us={episode:ni,cast:ii,items:ri,scenes:ai},gs=Object.freeze(Object.defineProperty({__proto__:null,cast:ii,default:us,episode:ni,items:ri,scenes:ai},Symbol.toStringTag,{value:"Module"})),si={id:"b1e14",arcId:"B1",cefrLevel:"B1",title:"Das Winterkonzert",titleEn:"The winter concert",blurb:"Meis Band spielt im Jugendclub — und du bist diesmal nicht im Publikum, sondern an der Abendkasse. Karten, Vorgruppe, Gänsehaut: Konzert von der Arbeitsseite.",order:22,sceneIds:["b1e14s1","b1e14s2","b1e14s3"]},oi=[{id:"mei",name:"Mei",role:"Sängerin bei Taucherglocke"},{id:"tobias",name:"Tobias",role:"Nachbar, Student"},{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"berger",name:"Frau Berger",role:"Koordinatorin, Jugendclub"}],di=[{id:"der-auftritt",type:"word",german:"der Auftritt",meaning:"the (stage) appearance / gig",image:"mic",audio:"tts",introducedInScene:"b1e14s1",tags:["music","events"],cefrLevel:"B1",note:"der, Plural: die Auftritte — auftreten; der große Auftritt"},{id:"der-soundcheck",type:"word",german:"der Soundcheck",meaning:"the sound check",image:"laut",audio:"tts",introducedInScene:"b1e14s1",tags:["music","technology"],cefrLevel:"B1",note:"der, Plural: die Soundchecks — Test, Test, eins, zwei"},{id:"die-buehne",type:"word",german:"die Bühne",meaning:"the stage",image:"konzert",audio:"tts",introducedInScene:"b1e14s1",tags:["music","culture"],cefrLevel:"B1",note:"die, Plural: die Bühnen — auf der Bühne stehen"},{id:"die-halle",type:"word",german:"die Halle",meaning:"the hall",image:"haus",audio:"tts",introducedInScene:"b1e14s1",tags:["city","events"],cefrLevel:"B1",note:"die, Plural: die Hallen — Turnhalle, Festhalle, Jugendclub-Halle"},{id:"der-aufbau",type:"word",german:"der Aufbau",meaning:"the set-up / assembly",image:"werkzeug",audio:"tts",introducedInScene:"b1e14s1",tags:["events","work"],cefrLevel:"B1",note:"der, Plural: die Aufbauten — aufbauen (trennbar); danach: der Abbau"},{id:"falls",type:"grammar_pattern",german:"___ es regnet, verlegen wir ins Innere.",meaning:"If it rains, we'll move inside.",image:"ziel",audio:"tts",introducedInScene:"b1e14s1",tags:["grammar","events"],cefrLevel:"B1",cloze:"Falls",speak:"Falls es regnet, verlegen wir ins Innere.",note:"falls = wenn (für den Fall dass) — Vorrang vor wenn"},{id:"aufgeregt",type:"word",german:"aufgeregt",meaning:"excited / nervous",image:"person",audio:"tts",introducedInScene:"b1e14s2",tags:["feelings"],cefrLevel:"B1",note:"Adjektiv/Adverb — aufgeregt sein; sich aufregen (strengere Version)"},{id:"die-abendkasse",type:"word",german:"die Abendkasse",meaning:"the box office (at the door)",image:"kasse",audio:"tts",introducedInScene:"b1e14s2",tags:["events","money"],cefrLevel:"B1",note:"die, Plural: die Abendkassen — abends, an der Tür"},{id:"der-merchstand",type:"word",german:"der Merchstand",meaning:"the merch table",image:"laden",audio:"tts",introducedInScene:"b1e14s2",tags:["music","shopping"],cefrLevel:"B1",note:"der, Plural: die Merchstands — Merchandise: T-Shirts, Platten, Sticker"},{id:"die-vorgruppe",type:"word",german:"die Vorgruppe",meaning:"the opening act / support band",image:"band",audio:"tts",introducedInScene:"b1e14s2",tags:["music","events"],cefrLevel:"B1",note:"die, Plural: die Vorgruppen — plays BEFORE the main act"},{id:"der-sound",type:"word",german:"der Sound",meaning:"the sound (style)",image:"laut",audio:"tts",introducedInScene:"b1e14s2",tags:["music"],cefrLevel:"B1",note:"der, Plural: die Sounds — Denglisch, aber etabliert"},{id:"anstehen",type:"word",german:"anstehen",meaning:"to queue / stand in line",image:"kasse",audio:"tts",introducedInScene:"b1e14s2",tags:["everyday","events"],cefrLevel:"B1",note:"anstehen — an der Kasse anstehen; die Schlange"},{id:"die-zugabe",type:"word",german:"die Zugabe",meaning:"the encore",image:"mic",audio:"tts",introducedInScene:"b1e14s3",tags:["music","events"],cefrLevel:"B1",note:"die, Plural: die Zugaben — „Zugabe!“ rufen, bis sie kommt"},{id:"die-gaensehaut",type:"word",german:"die Gänsehaut",meaning:"goose bumps",image:"person",audio:"tts",introducedInScene:"b1e14s3",tags:["feelings"],cefrLevel:"B1",note:"die ( Singular ) — Gänsehaut bekommen: Gans + Haut"},{id:"durchhalten",type:"chunk",german:"Durchhalten!",meaning:"Hang in there!",image:"ziel",audio:"tts",introducedInScene:"b1e14s3",tags:["encouragement"],cefrLevel:"B1",speak:"Durchhalten!",note:"trennbar: wir halten durch — Motivationssatz"},{id:"die-setlist",type:"word",german:"die Setlist",meaning:"the set list",image:"konzept",audio:"tts",introducedInScene:"b1e14s3",tags:["music"],cefrLevel:"B1",note:"die, Plural: die Setlisten — nach dem Konzert: Souvenir"},{id:"mitsingen",type:"word",german:"mitsingen",meaning:"to sing along",image:"mic",audio:"tts",introducedInScene:"b1e14s3",tags:["music"],cefrLevel:"B1",note:"trennbar: ich singe mit — im Refrain mitzusingen"},{id:"stolz-auf",type:"chunk",german:"Ich bin stolz auf euch.",meaning:"I'm proud of you (all).",image:"team",audio:"tts",introducedInScene:"b1e14s3",tags:["feelings"],cefrLevel:"B1",speak:"Ich bin stolz auf euch.",note:"stolz sein AUF + Akkusativ"}],li=[{id:"b1e14s1",episodeId:"b1e14",title:"Aufbau in der Halle",titleEn:"Set-up in the hall",place:"Jugendclub Lindenau, Halle",bg:"buehne",contextTags:["music","events","friends"],requiredItems:["das-konzert","die-band"],introducedItems:["der-auftritt","der-soundcheck","die-buehne","die-halle","der-aufbau","falls"],beats:[{type:"narration",text:"Samstag, drei Uhr. Die Halle des Jugendclubs riecht nach Farbe und Spannung. Taucherglocke spielt heute Abend — und du bist nicht Gast, sondern Crew. Frau Berger verteilt Aufgaben wie Geschenke."},{type:"line",speaker:"berger",text:"Sam! Du machst die Abendkasse, Tobias den Merchstand. …Mei ist übrigens aufgeregt, aber sagt das nicht laut — Sänger:innen glauben, Nervosität ist ansteckend. …Falls es regnet, verlegen wir rein. Sonst: Hofbühne. Alles klar?",translation:"Sam! You're on the box office, Tobias on merch. …Mei's nervous, by the way, but don't say it out loud — singers believe nervousness is contagious. …If it rains, we move inside. Otherwise: courtyard stage. All clear?"},{type:"meet",itemIds:["der-auftritt","die-buehne","die-halle"]},{type:"meet",itemIds:["der-aufbau","der-soundcheck","falls"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mei steht vor der Bühne und sagt nichts. Zum ersten Mal.",options:[{label:"„Mei. Du hast schon vor Taucherglocke gesungen. Vor allem.“",line:"Mei. Du hast vor Taucherglocke gesungen, vor Kaffee-Kunden, vor mir. Heute kommt nur mehr Publikum dazu."},{label:"„Der Soundcheck ist dein Zuhause. Der Rest ist Wiederholung.“",line:"Der Soundcheck ist dein Zuhause. Der Auftritt ist Wiederholung — mit mehr Leuten. …Mei: „…Danke. Crew-Psychologie.“"}]},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Aushang am Eingang",text:`WINTERKONZERT IM JUGENDCLUB

Taucherglocke
+ Vorgruppe: Die Mieter (ja, wirklich)

Einlass: 19:00 · Beginn: 20:00
Vorkauf: 8 € · Abendkasse: 10 €

Falls das Wetter mitspielt:
Hofbühne, offen. Sonst: Halle.

Getränke zu Freundespreisen.
Garderobe: gegen Spende.`,translation:`WINTER CONCERT AT THE YOUTH CLUB

Taucherglocke
+ support: Die Mieter (yes, really)

Doors: 7 pm · start: 8 pm
Advance: €8 · box office: €10

If the weather cooperates:
courtyard stage, open air. Otherwise: hall.

Drinks at friendly prices.
Coat check: by donation.`}]},{id:"b1e14s2",episodeId:"b1e14",title:"Abendkasse",titleEn:"Box office",place:"Eingang, Abendkasse-Tisch",bg:"laden",contextTags:["music","events","work"],requiredItems:["die-kasse","das-ticket"],introducedItems:["aufgeregt","die-abendkasse","der-merchstand","die-vorgruppe","der-sound","anstehen"],beats:[{type:"narration",text:"19 Uhr: Die Schlange beginnt. Du sitzt hinter der Abendkasse, ein Stuhl, eine Kiste Wechselgeld, ein Schild: „BITTE ANSTEHEN — ES LOHNT SICH.“ Tobias verkauft daneben T-Shirts wie ein Profi-Händler."},{type:"line",speaker:"tobias",text:"Merchstand-Regel eins: Erzähl zu jedem Shirt die Geschichte. …„Das hier? Das Design ist von Milos Lesegruppe. Ja, DEM Milo.“ …Verkauft. …Und du: Erste Gäste stehen an. Mach die Kasse auf und dich locker.",translation:"Merch rule one: tell the story behind every shirt. …'This one? The design is from Milo's reading group. Yes, THAT Milo.' …Sold. …And you: first guests are queuing. Open the till and relax."},{type:"meet",itemIds:["die-abendkasse","anstehen","aufgeregt"]},{type:"meet",itemIds:["der-merchstand","die-vorgruppe","der-sound"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Ein Gast: „Zwei Tickets — und stimmt das Gerücht, dass die Vorgruppe TAUCHERGLocke-Songs spielt?“",options:[{label:"Ich sag nur: Zuhören lohnt sich. Ab 20 Uhr.",line:"Ich sage nur: Zuhören lohnt sich, ab 20 Uhr. …Er lacht, zahlt, winkt. Kassieren mit Geheimnis."},{label:"Die Vorgruppe spielt eigene Songs. Der Sound ist stärker als ihr Name.",line:"Die Vorgruppe spielt eigene Songs — der Sound ist stärker als ihr Name. Und der Name ist schon stark."}]},{type:"check",count:2,mode:"listen"},{type:"line",speaker:"berger",text:"(vorbei mit Getränkekisten) Zweiundvierzig vorverkauft, du hast schon dreißig an der Kasse! …Sam, du rechnest schneller als mein Kassenprogramm. Bleib genau so — und schau dir die Vorgruppe an. Übung für dein Auge.",translation:"(passing by with drink crates) Forty-two pre-sold, and you've already done thirty at the box office! …Sam, you count faster than my ticketing software. Stay exactly like that — and go watch the support act. Training for your eye."},{type:"reading",title:"Preisliste Merchstand (Tobias' Handschrift)",text:`TAUCHERGLOCKE — ABENDKASSE & MERCH

Ticket: 10 € (Vorkauf 8 € — sag's den Leuten!)
T-Shirt: 18 € (L fast weg)
Platte: 20 € (signiert +2, Mei entscheidet spontan)
Sticker: 1 € oder Geschichte gegen Sticker

Vorgruppe „Die Mieter“: besser als ihr Name.
(Statement vom Stand. Wird verteidigt.)`,translation:`TAUCHERGLOCKE — BOX OFFICE & MERCH

Ticket: €10 (advance €8 — tell people!)
T-shirt: €18 (L almost gone)
Record: €20 (signed +2, Mei decides spontaneously)
Sticker: €1 or story-for-sticker

Support act 'Die Mieter': better than their name.
(Statement from the stand. Will be defended.)`,itemIds:["der-merchstand","die-abendkasse","die-vorgruppe"]}]},{id:"b1e14s3",episodeId:"b1e14",title:"Zugabe",titleEn:"Encore",place:"Halle, 21:40",bg:"buehne",contextTags:["music","events","feelings"],requiredItems:["feiern","der-spass"],introducedItems:["die-zugabe","die-gaensehaut","durchhalten","die-setlist","mitsingen","stolz-auf"],beats:[{type:"narration",text:"Taucherglocke spielt das letzte Lied der Setlist — und die Halle singt mehr mit als Mei. „Zugabe!“ rufen vierzig Menschen. Mei sieht dich an der Kasse, du zeigst auf die Uhr. Sie lächelt. Sie spielt trotzdem."},{type:"line",speaker:"mei",text:"(ins Mikrofon) Letzter Song. Der heißt „Bis zur Zugabe“ — und der ist für alle, die heute hinter der Kasse standen, als ich nicht reden konnte. …Sam. Ich bin stolz auf euch. Auf uns. Auf DIESEN Sound. …Und jetzt: alle mitsingen!",translation:"(into the microphone) Last song. It's called 'Until the encore' — and it's for everyone who stood behind the box office today when I couldn't speak. …Sam. I'm proud of you. Of us. Of THIS sound. …And now: everyone sing along!"},{type:"meet",itemIds:["die-setlist","mitsingen","stolz-auf"]},{type:"meet",itemIds:["die-zugabe","die-gaensehaut","durchhalten"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Die Gänsehaut ist real. Tobias steht neben dir, die Kasse sicher unter dem Arm.",options:[{label:"Hörst du das? Die Halle singt DEUTSCH. Und ich verstehe alles.",line:"Hörst du das? Die ganze Halle singt Deutsch — und ich verstehe jedes Wort. …Gänsehaut. Reale."},{label:"Vierzig Zugabe-Rufe. Und ich habe jede Kassiert gemerkt.",line:"Vierzig Zugabe-Rufe, und die Kasse ist voll. …Konzerte zahlen sich besser aus, als mein Mathelehrer behauptet hat."}]},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Setlist (von der Bühne gefallen)",text:`1. Gleislos
2. Regen auf Beton
3. Milchschaum
4. Die Mieter (mit Vorgruppe!)
5. Kinshasa, 4 Uhr
—
6. (ZUGABE) Bis zur Zugabe

Anmerkung von Mei:
»Alle mitsingen. Besonders bei 5.
 Besonders SAM.«`,translation:`1. Platformless
2. Rain on Concrete
3. Milk Foam
4. The Tenants (with the support act!)
5. Kinshasa, 4 a.m.
—
6. (ENCORE) Until the Encore

Note from Mei:
'Everyone sings along. Especially on 5.
Especially SAM.'`,itemIds:["die-setlist","mitsingen","die-zugabe"]},{type:"narration",text:"Nach dem Konzert: Aufräumen als Crew-Ritual. Kabel rollen, Stühle stapeln, Mei zählt die Abendkasse noch einmal — nur für den Klang der Münzen. „Nächstes Mal“, sagt sie, „bist du an der Bühne.“ Du: „Nächstes Mal sing ich mit.“ Sie: „Zugabe.“ Frau Berger schreibt die Zahlen auf die Wandtafel: Eintritt dreihundertvierzehn Euro. Der Verein hat wieder Geld für Waffeln."}]}],ms={episode:si,cast:oi,items:di,scenes:li},ps=Object.freeze(Object.defineProperty({__proto__:null,cast:oi,default:ms,episode:si,items:di,scenes:li},Symbol.toStringTag,{value:"Module"})),ci={id:"b1e2",arcId:"B1",cefrLevel:"B1",title:"Mei und das Konzert",titleEn:"Mei and the concert",blurb:"Eine neue Kollegin mit Congolese-Playlist. Karten, Konzert, erste echte Meinungen auf Deutsch.",order:10,sceneIds:["b1e2s1","b1e2s2","b1e2s3"]},hi=[{id:"mei",name:"Mei",role:"Kollegin im Café"},{id:"luise",name:"Luise",role:"Café-Besitzerin"}],ui=[{id:"das-konzert",type:"word",german:"das Konzert",meaning:"the concert",image:"konzert",audio:"tts",introducedInScene:"b1e2s1",tags:["music","friends"],cefrLevel:"B1",note:"das, Plural: die Konzerte"},{id:"die-band",type:"word",german:"die Band",meaning:"the band",image:"band",audio:"tts",introducedInScene:"b1e2s1",tags:["music","friends"],cefrLevel:"B1",note:"die, Plural: die Bands"},{id:"hast-du-lust",type:"grammar_pattern",german:"Hast du Lust, ___?",meaning:"Do you feel like ___-ing?",audio:"tts",introducedInScene:"b1e2s1",tags:["invitation","friends","questions"],cefrLevel:"B1",cloze:"mitzukommen",alt:["mitzugehen","ins Kino zu gehen"],speak:"Hast du Lust, mitzukommen?",note:"Lust haben, … zu + Infinitiv — die Einladungsmaschine"},{id:"der-eintritt",type:"word",german:"der Eintritt",meaning:"the admission / entry fee",image:"kasse",audio:"tts",introducedInScene:"b1e2s1",tags:["music","money"],cefrLevel:"B1",note:'der ( Singular ) — „kostenloser Eintritt"'},{id:"ich-freue-mich-darauf",type:"sentence",german:"Ich freue mich darauf!",meaning:"I'm looking forward to it!",audio:"tts",introducedInScene:"b1e2s1",tags:["friends","invitation"],cefrLevel:"B1",note:"sich freuen auf + Akkusativ — Zukunft"},{id:"die-meinung",type:"word",german:"die Meinung",meaning:"the opinion",image:"meinung",audio:"tts",introducedInScene:"b1e2s2",tags:["opinion","friends"],cefrLevel:"B1",note:'die, Plural: die Meinungen — „Meiner Meinung nach …"'},{id:"das-lied",type:"word",german:"das Lied",meaning:"the song",image:"konzert",audio:"tts",introducedInScene:"b1e2s2",tags:["music","opinion"],cefrLevel:"B1",note:"das, Plural: die Lieder"},{id:"wie-fandest-du",type:"sentence",german:"Wie fandest du das Konzert?",meaning:"How did you find the concert?",audio:"tts",introducedInScene:"b1e2s2",tags:["music","opinion","questions"],cefrLevel:"B1",note:"Vergangenheit von finden: fandest (du)"},{id:"das-lied-war-stark",type:"chunk",german:"Das Lied war stark!",meaning:"The song was awesome!",audio:"tts",introducedInScene:"b1e2s2",tags:["music","opinion"],cefrLevel:"B1",note:'stark = ugs. „großartig"'},{id:"der-saenger",type:"word",german:"der Sänger",meaning:"the singer (m)",image:"mic",audio:"tts",introducedInScene:"b1e2s2",tags:["music"],cefrLevel:"B1",note:"der, Plural: die Sänger; weiblich: die Sängerin"},{id:"ehrlich-gesagt",type:"chunk",german:"Ehrlich gesagt …",meaning:"Honestly speaking …",audio:"tts",introducedInScene:"b1e2s2",tags:["opinion","smalltalk"],cefrLevel:"B1",note:"Der Einstieg für jede ehrliche Meinung"},{id:"die-playlist",type:"word",german:"die Playlist",meaning:"the playlist",image:"konzert",audio:"tts",introducedInScene:"b1e2s3",tags:["music","friends"],cefrLevel:"B1",note:"die, Plural: die Playlists — Mei hat 36 Lieder für dich"},{id:"der-kopfhoerer",type:"word",german:"der Kopfhörer",meaning:"the headphones",image:"laut",audio:"tts",introducedInScene:"b1e2s3",tags:["music","technology"],cefrLevel:"B1",note:"der, Plural: die Kopfhörer — meistens Plural im Alltag"},{id:"die-stimme",type:"word",german:"die Stimme",meaning:"the voice",image:"mic",audio:"tts",introducedInScene:"b1e2s3",tags:["music","people"],cefrLevel:"B1",note:"die, Plural: die Stimmen — eine große Stimme"},{id:"der-rhythmus",type:"word",german:"der Rhythmus",meaning:"the rhythm",image:"band",audio:"tts",introducedInScene:"b1e2s3",tags:["music"],cefrLevel:"B1",note:"der, Plural: die Rhythmen — im Rhythmus bleiben"},{id:"der-text",type:"word",german:"der Text",meaning:"the lyrics / the text",image:"konzept",audio:"tts",introducedInScene:"b1e2s3",tags:["music","writing"],cefrLevel:"B1",note:"der, Plural: die Texte — beim Lied: der Songtext"},{id:"die-erinnerung",type:"word",german:"die Erinnerung",meaning:"the memory",image:"heimat",audio:"tts",introducedInScene:"b1e2s3",tags:["feelings","music"],cefrLevel:"B1",note:"die, Plural: die Erinnerungen — sich erinnern AN + Akkusativ"}],gi=[{id:"b1e2s1",episodeId:"b1e2",title:"Zwei Karten",titleEn:"Two tickets",place:"Café Luise, Theke",bg:"cafe",contextTags:["music","friends","invitation"],requiredItems:[],introducedItems:["das-konzert","die-band","hast-du-lust","der-eintritt","ich-freue-mich-darauf"],beats:[{type:"narration",text:"Luise hat Verstärkung eingestellt: Mei, zweiundzwanzig, malt hinter der Theke auf die Milchkanne und kennt jede Band zwischen Halle und Chemnitz."},{type:"line",speaker:"mei",text:"Sam, hör mal — am Freitag spielt „Taucherglocke“ im Werk 2. Die Band ist unglaublich gut. Ich hab schon zwei Karten, aber Cara ist krank.",translation:"Sam, listen — on Friday 'Taucherglocke' is playing at Werk 2. The band is incredibly good. I already have two tickets, but Cara is sick."},{type:"meet",itemIds:["das-konzert","die-band","der-eintritt"]},{type:"meet",itemIds:["hast-du-lust","ich-freue-mich-darauf"]},{type:"choice",prompt:"Mei wedelt mit den Karten.",options:[{label:"Hast du Lust, mich mitzunehmen?",line:"Hast du Lust, mich mitzunehmen? …Ich bin dabei!"},{label:"Ja! Ich freue mich darauf.",line:"Ja! Ich freue mich darauf."}]},{type:"line",speaker:"mei",text:"Abgemacht! Eintritt hast du damit auch. Ich hol dich um sieben ab — wir fahren mit den Rädern.",translation:"Deal! Admission's covered too. I'll pick you up at seven — we'll go by bike."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Flyer: TAUCHERGLOCKE live",text:`WERK 2 — HALLE D
Freitag · 21:00 · Einlass 20:00

TAUCHERGLOCKE
(„Postpunk mit Herzklopfen“ — Leipziger Volkszeitung)

VVK 9 € · ABENDKASSE 12 €

»Bring Ohren. Der Rest kommt von selbst.«`,translation:`WERK 2 — HALL D
Friday · 9 pm · doors 8 pm

TAUCHERGLOCKE
('post-punk with a pounding heart' — Leipzig paper)

Advance €9 · box office €12

'Bring ears. The rest comes by itself.'`,itemIds:["das-konzert","die-band","der-eintritt"]},{type:"narration",text:"Luise summt von der Kaffeemaschine aus. Du hast jetzt für Freitag etwas, worauf du dich freust. Das ist, leise gesagt, ein Lebensgefühl."}]},{id:"b1e2s2",episodeId:"b1e2",title:"Nach dem Konzert",titleEn:"After the concert",place:"Werk 2, Innenhof, nach der Zugabe",bg:"buehne",contextTags:["music","opinion","friends"],requiredItems:["das-konzert","die-band"],introducedItems:["die-meinung","das-lied","wie-fandest-du","das-lied-war-stark","der-saenger","ehrlich-gesagt"],beats:[{type:"narration",text:"Ohrenkino. Der Innenhof summt noch nach. Mei hält zwei Limonaden, ihre Haare noch im Takt."},{type:"line",speaker:"mei",text:"Also raus damit: Wie fandest du das Konzert?",translation:"Come on, out with it: how did you find the concert?"},{type:"meet",itemIds:["wie-fandest-du","die-meinung","ehrlich-gesagt"]},{type:"meet",itemIds:["das-lied","das-lied-war-stark","der-saenger"]},{type:"choice",prompt:"Eine echte Meinungsfrage. Eine echte Meinung.",options:[{label:"Ehrlich gesagt: Das letzte Lied war stark!",line:"Ehrlich gesagt: das letzte Lied war stark! Der Rest war … gut."},{label:"Super! Aber der Sänger war etwas leise.",line:"Super! Aber der Sänger war etwas leise, oder?"}]},{type:"line",speaker:"mei",text:"Siehst du? Genau darüber reden wir noch den ganzen Weg. Meiner Meinung nach war die Zugabe das Beste — aber Argumente, Sam, ich will Argumente!",translation:"See? That's exactly what we'll discuss the whole way. In my opinion the encore was the best — but arguments, Sam, I want arguments!"},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"listen"},{type:"narration",text:"Ihr radelt durch die Nacht und streitet glücklich. Auf Deutsch streiten macht genauso viel Spaß wie auf jeder anderen Sprache. Mehr, sogar."}]},{id:"b1e2s3",episodeId:"b1e2",title:"Die Playlist",titleEn:"The playlist",place:"Café Luise, Feierabend",bg:"cafe",contextTags:["music","friends","learning"],requiredItems:["das-lied","die-meinung"],introducedItems:["die-playlist","der-kopfhoerer","die-stimme","der-rhythmus","der-text","die-erinnerung"],beats:[{type:"narration",text:"Feierabend im Café Luise. Die Stühle stehen schon auf den Tischen — bis auf zwei. Mei schiebt dir ihre Kopfhörer über die Theke, Kabel und allem: „Deine Hausaufgabe.“"},{type:"meet",itemIds:["die-playlist","der-kopfhoerer","die-stimme"]},{type:"line",speaker:"mei",text:"Meine Playlist. Sechsunddreißig Lieder, Kinshasa bis Leipzig, Papa bis Rammstein. Hör mal rein — diese Stimme! Und der Rhythmus? Den findest du in keinem Lehrbuch. Das ist mein Versprechen.",translation:"My playlist. Thirty-six songs, Kinshasa to Leipzig, dad to Rammstein. Listen to it — that voice! And the rhythm? You won't find that in any textbook. That's my promise."},{type:"meet",itemIds:["der-rhythmus","der-text","die-erinnerung"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Mei: „Und? Was sagst du — ehrlich?“",options:[{label:"Ehrlich gesagt: Der Text ist zu schnell. Aber die Stimme ist … groß.",line:"Ehrlich gesagt: Der Text ist zu schnell für mich. Aber die Stimme ist … groß. Riesig."},{label:"Ich verstehe nicht alles. Aber ich will das Lied verstehen.",line:"Ich verstehe nicht alles. Aber ich will das Lied verstehen. Das zählt doch, oder?"}]},{type:"line",speaker:"mei",text:"Das zählt mehr als du denkst. Musik war mein erstes Deutsch — Rammstein, bitte jetzt nicht lachen. Ich hab die Texte falsch gesungen, falsch UND laut. Und wurde nicht ausgelacht. …Naja. Fast nie.",translation:"That counts more than you think. Music was my first German — Rammstein, please don't laugh now. I sang the lyrics wrong, wrong AND loud. And I wasn't laughed at. …Well. Almost never."},{type:"line",speaker:"mei",text:"Die Erinnerung an meine ersten Wochen hier? Ein Wörterbuch, ein Kaffee und Lied Nummer zwölf. Ich hab's zehnmal gehört, bis jeder Satz saß. …Dein Lied ist auch dabei. Du musst es nur finden.",translation:"The memory of my first weeks here? A dictionary, a coffee and song number twelve. I listened to it ten times until every sentence stuck. …Your song is on there too. You just have to find it."},{type:"check",count:2,mode:"listen"},{type:"reading",title:"Meis Playlist (Zettel, doppelt gefaltet)",text:`Nr. 7 „Regen auf Beton“ — für Sam, erster Tag
Nr. 12 „Kinshasa, 4 Uhr“ — mein erstes Deutsch-Lied
Nr. 19 „Stille Nacht, lauter Hof“ — December only
Nr. 24 „Der Schlüssel“ — geht um Frau Brügge. Logisch.
Nr. 36 „Angekommen (B-Seite)“ — noch ungeschrieben.
Vielleicht schreibst du den Text. Du kannst jetzt Deutsch.

Regel: Im Refrain mitsingen. Laut ist erlaubt.`,translation:`No. 7 'Rain on Concrete' — for Sam, day one
No. 12 'Kinshasa, 4 a.m.' — my first German song
No. 19 'Silent Night, Loud Courtyard' — December only
No. 24 'The Key' — it's about Frau Brügge. Obviously.
No. 36 'Arrived (B-side)' — still unwritten.
Maybe you'll write the lyrics. You can speak German now.

Rule: sing along in the chorus. Loud is allowed.`,itemIds:["die-playlist","die-erinnerung","der-rhythmus"]},{type:"narration",text:"Du gibst ihr einen Kaffee aus, sie gibt dir die Playlist mit — auf einen Zettel geschrieben, mit Titeln und kleinen Kommentaren. Auf dem Heimweg hörst du Lied sieben und verstehst die Hälfte. Genug, um im Refrain mitzusingen. Laut. Es ist Freitagabend, und niemand beschwert sich."}]}],fs={episode:ci,cast:hi,items:ui,scenes:gi},bs=Object.freeze(Object.defineProperty({__proto__:null,cast:hi,default:fs,episode:ci,items:ui,scenes:gi},Symbol.toStringTag,{value:"Module"})),mi={id:"b1e3",arcId:"B1",cefrLevel:"B1",title:"Arbeit und Zukunft",titleEn:"Work and future",blurb:"Luise macht ein Angebot, ein kleiner Betrieb stellt ein — und du führst dein erstes deutsches Vorstellungsgespräch.",order:11,sceneIds:["b1e3s1","b1e3s2","b1e3s3"]},pi=[{id:"luise",name:"Luise",role:"Café-Besitzerin"},{id:"personal",name:"Frau Liebig",role:"Geschäftsführung, Café Kontor"}],fi=[{id:"die-zukunft",type:"word",german:"die Zukunft",meaning:"the future",image:"zukunft",audio:"tts",introducedInScene:"b1e3s1",tags:["career","planning"],cefrLevel:"B1",note:"die ( Singular ) — „in Zukunft“"},{id:"die-teilzeit",type:"word",german:"die Teilzeit",meaning:"part-time (work)",image:"urehr",audio:"tts",introducedInScene:"b1e3s1",tags:["work","career"],cefrLevel:"B1",note:"die ( Singular ) — Gegenteil: die Vollzeit"},{id:"der-kurs",type:"word",german:"der Kurs",meaning:"the course",image:"lebenslauf",audio:"tts",introducedInScene:"b1e3s1",tags:["career","learning"],cefrLevel:"B1",note:"der, Plural: die Kurse — z. B. ein B2-Kurs"},{id:"verbessern",type:"grammar_pattern",german:"Ich möchte mein Deutsch ___.",meaning:"I want to ___ my German.",audio:"tts",introducedInScene:"b1e3s1",tags:["career","learning"],cefrLevel:"B1",cloze:"verbessern",speak:"Ich möchte mein Deutsch verbessern.",note:"möchte + Infinitiv am Satzende"},{id:"die-chance",type:"word",german:"die Chance",meaning:"the chance / opportunity",image:"ziel",audio:"tts",introducedInScene:"b1e3s1",tags:["career","planning"],cefrLevel:"B1",note:"die, Plural: die Chancen"},{id:"die-firma",type:"word",german:"die Firma",meaning:"the company",image:"firma",audio:"tts",introducedInScene:"b1e3s2",tags:["work","career"],cefrLevel:"B1",note:"die, Plural: die Firmen"},{id:"die-ausbildung",type:"word",german:"die Ausbildung",meaning:"the (vocational) training",image:"stelle",audio:"tts",introducedInScene:"b1e3s2",tags:["work","career"],cefrLevel:"B1",note:"die, Plural: die Ausbildungen — sehr deutsches Konzept"},{id:"die-staerke",type:"word",german:"die Stärke",meaning:"the strength",image:"ziel",audio:"tts",introducedInScene:"b1e3s2",tags:["work","interview"],cefrLevel:"B1",note:"die, Plural: die Stärken — Gegenteil: die Schwäche"},{id:"darf-ich-mich-vorstellen",type:"sentence",german:"Darf ich mich kurz vorstellen?",meaning:"May I briefly introduce myself?",audio:"tts",introducedInScene:"b1e3s2",tags:["interview","politeness"],cefrLevel:"B1"},{id:"die-frage",type:"word",german:"die Frage",meaning:"the question",image:"gespräch",audio:"tts",introducedInScene:"b1e3s2",tags:["interview","questions"],cefrLevel:"B1",note:"die, Plural: die Fragen — „Haben Sie Fragen?“ — Ja, haben Sie!"},{id:"die-vorbereitung",type:"word",german:"die Vorbereitung",meaning:"the preparation",image:"idee",audio:"tts",introducedInScene:"b1e3s2",tags:["interview","learning"],cefrLevel:"B1",note:"die, Plural: die Vorbereitungen"},{id:"die-zusage",type:"word",german:"die Zusage",meaning:"the acceptance / yes",image:"prüfen",audio:"tts",introducedInScene:"b1e3s3",tags:["work","career"],cefrLevel:"B1",note:"die, Plural: die Zusagen — Gegenteil: die Absage"},{id:"anfangen",type:"chunk",german:"Wann kannst du anfangen?",meaning:"When can you start?",audio:"tts",introducedInScene:"b1e3s3",tags:["work","questions"],cefrLevel:"B1",note:"anfangen = an + fangen, trennbar"},{id:"das-gehalt",type:"word",german:"das Gehalt",meaning:"the salary",image:"münzen",audio:"tts",introducedInScene:"b1e3s3",tags:["work","money"],cefrLevel:"B1",note:"das, Plural: die Gehälter — monatlich, bei Angestellten"},{id:"die-ueberstunde",type:"word",german:"die Überstunde",meaning:"the overtime hour",image:"urehr",audio:"tts",introducedInScene:"b1e3s3",tags:["work","time"],cefrLevel:"B1",note:"die, Plural: die Überstunden"},{id:"der-kollege",type:"word",german:"der Kollege",meaning:"the colleague (m)",image:"team",audio:"tts",introducedInScene:"b1e3s3",tags:["work","people"],cefrLevel:"B1",note:"der, Plural: die Kollegen; weiblich: die Kollegin"},{id:"wir-freuen-uns-auf-dich",type:"chunk",german:"Wir freuen uns auf dich!",meaning:"We're looking forward to having you!",audio:"tts",introducedInScene:"b1e3s3",tags:["work","friends"],cefrLevel:"B1"}],bi=[{id:"b1e3s1",episodeId:"b1e3",title:"Luise und die Zukunft",titleEn:"Luise and the future",place:"Café Luise, nach Feierabend",bg:"cafe",contextTags:["work","career","planning"],requiredItems:["der-vertrag","die-stelle"],introducedItems:["die-zukunft","die-teilzeit","der-kurs","verbessern","die-chance"],beats:[{type:"line",speaker:"luise",text:"Setz dich. …Sam, ehrlich: Du bist gut. Aber ich kann dir hier keine Zukunft bieten, nur Kaffee. Mein Tipp: eine größere Stelle, Teilzeit — und parallel ein Deutschkurs.",translation:"Sit down. …Sam, honestly: you're good. But I can't offer you a future here, only coffee. My tip: a bigger job, part-time — and a German course in parallel."},{type:"meet",itemIds:["die-zukunft","die-teilzeit","die-chance"]},{type:"meet",itemIds:["der-kurs","verbessern"]},{type:"choice",prompt:"Luise klappt ihren Laptop auf.",options:[{label:"Ich möchte mein Deutsch verbessern. Und dann mehr.",line:"Ich möchte mein Deutsch verbessern. Und dann mehr Verantwortung."},{label:"Ein Kurs klingt gut. Aber ich bleibe dir treu!",line:"Ein Kurs klingt gut. Aber ich bleibe dir treu!"}]},{type:"line",speaker:"luise",text:"Treu schmeckt nach nichts. Ich schreib dir eine Adresse auf: Café Kontor, die suchen fürs Frühjahr. Probieren schadet nie.",translation:"Loyalty doesn't taste like anything. I'll write down an address for you: Café Kontor, they're hiring for spring. Trying never hurts."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"narration",text:"Du gehst mit einer Adresse und einem Plan. Auf dem Heimweg wiederholst du leise: „Ich möchte mein Deutsch verbessern.“ Klingt gut. Klingt nach dir."}]},{id:"b1e3s2",episodeId:"b1e3",title:"Das Vorstellungsgespräch",titleEn:"The job interview",place:"Café Kontor, Besprechungsecke",bg:"buero",contextTags:["work","career","interview"],requiredItems:["die-erfahrung","verbessern"],introducedItems:["die-firma","die-ausbildung","die-staerke","darf-ich-mich-vorstellen","die-frage","die-vorbereitung"],beats:[{type:"narration",text:"Café Kontor: größer, lauter, professioneller. Deine Vorbereitung: ein Notizzettel mit drei Wörtern. Einer davon ist „Erfahrung“."},{type:"meet",itemIds:["die-firma","die-vorbereitung","darf-ich-mich-vorstellen"]},{type:"line",speaker:"personal",text:"Frau Liebig, Geschäftsführung. Schön, dass Sie da sind. — Erzählen Sie, wer sind Sie?",translation:"Frau Liebig, management. Nice that you're here. — Tell me: who are you?"},{type:"meet",itemIds:["die-ausbildung","die-staerke","die-frage"]},{type:"choice",prompt:"Der klassische Moment.",options:[{label:"Darf ich mich kurz vorstellen?",line:"Darf ich mich kurz vorstellen?"},{label:"Ja, gern: Ich heiße Sam und lerne schnell.",line:"Ja, gern: Ich heiße Sam, ich lerne schnell und mag volle Räume."}]},{type:"line",speaker:"personal",text:"Bitte. …Interessant. Und was ist Ihre Stärke? …„Ich lerne schnell“ — gut, das prüfen wir praktisch. Ein Probewochenende, beide Seiten.",translation:"Please. …Interesting. And what's your strength? …'I learn fast' — good, we'll test that in practice. A trial weekend, both sides."},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"personal",text:"Eine Frage noch, von mir: Haben Sie Fragen an uns?",translation:"One more question, from me: Do you have questions for us?"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Bewerbungs-E-Mail (Entwurf 2)",text:`Betreff: Bewerbung — Teammitglied Teilzeit

Sehr geehrte Frau Berger,

ich arbeite seit einem Jahr im Café Luise und suche
eine Teilzeitstelle ab dem nächsten Monat.
Meine Stärken: Zuverlässigkeit, Kaffee, Neugier.
Ich lerne schnell — und ich mag Menschen.

Darf ich mich kurz vorstellen? Gerne persönlich.

Mit freundlichen Grüßen
Sam Jones`,translation:`Re: Application — part-time team member

Dear Ms Berger,

I've been working at Café Luise for a year and am looking
for a part-time position from next month.
My strengths: reliability, coffee, curiosity.
I learn fast — and I like people.

May I introduce myself briefly? Gladly in person.

Kind regards,
Sam Jones`,itemIds:["die-vorbereitung","darf-ich-mich-vorstellen","die-staerke"]},{type:"narration",text:"Du hast eine. Zwei sogar. Frau Liebig nickt bei beiden — und notiert etwas. Vorbereitung wirkt, das sieht man ihr an."}]},{id:"b1e3s3",episodeId:"b1e3",title:"Die Zusage",titleEn:"The offer",place:"Café Kontor, Telefonat",bg:"buero",contextTags:["work","career","money"],requiredItems:["die-chance","die-firma"],introducedItems:["die-zusage","anfangen","das-gehalt","die-ueberstunde","der-kollege","wir-freuen-uns-auf-dich"],beats:[{type:"narration",text:"Drei Tage später vibriert dein Handy während der Schicht. Unbekannte Nummer. Du gehst raus, vor die Tür, in den Regen. Wenn schon."},{type:"line",speaker:"personal",text:"Frau Liebig hier. Kurz: Wir haben entschieden — Sie bekommen die Zusage. Zwanzig Stunden Teilzeit, das Gehalt liegt bei … und eine Frage:",translation:"Frau Liebig here. Briefly: we've decided — you get the offer. Twenty hours part-time, the salary is … and one question:"},{type:"meet",itemIds:["die-zusage","das-gehalt","anfangen"]},{type:"meet",itemIds:["die-ueberstunde","der-kollege","wir-freuen-uns-auf-dich"]},{type:"choice",prompt:"Sie fragt: „Wann können Sie anfangen?“",options:[{label:"Ab dem Ersten. Ich freue mich!",line:"Ab dem Ersten. Ich freue mich sehr!"},{label:"Können wir Überstunden klar regeln?",line:"Können wir Überstunden von Anfang an klar regeln?"}]},{type:"line",speaker:"personal",text:"Klare Worte, das gefällt mir. Dann bis zum Ersten — und: Wir freuen uns auf dich!",translation:"Clear words, I like that. Then see you on the first — and: we're looking forward to having you!"},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Arbeitsvertrag (Auszug, unterschrieben)",text:`§1 Tätigkeit: Teilzeit, 20 Std./Woche

 auf Deutsch. Bewahre das auf. Wirklich.)`,translation:`§1 Position: part-time, 20 hrs/week

in German. Keep this. Really.)`,itemIds:["die-zusage","das-gehalt","anfangen"]},{type:"narration",text:"Im Regen stehst du da und grinast. Dann rufst du Luise an, weil man solche Nachrichten der Person erzählt, die die Adresse aufgeschrieben hat."}]}],ks={episode:mi,cast:pi,items:fi,scenes:bi},ws=Object.freeze(Object.defineProperty({__proto__:null,cast:pi,default:ks,episode:mi,items:fi,scenes:bi},Symbol.toStringTag,{value:"Module"})),ki={id:"b1e4",arcId:"B1",cefrLevel:"B1",title:"Der Umzug",titleEn:"The move",blurb:"Besichtigung, Mietvertrag, Schlüsselübergabe. Ein Kapitel schließt sich — und genau deshalb fällt dir auf, was du alles kannst.",order:12,sceneIds:["b1e4s1","b1e4s2"]},wi=[{id:"maklerin",name:"Frau Hedicke",role:"Wohnungsvermittlung"},{id:"frau-bruegge",name:"Frau Brügge",role:"Vermieterin"},{id:"tobias",name:"Tobias",role:"Nachbar, Freund"}],yi=[{id:"die-miete",type:"word",german:"die Miete",meaning:"the rent",image:"münzen",audio:"tts",introducedInScene:"b1e4s1",tags:["flat-hunt","moving","money"],cefrLevel:"B1",note:"die, Plural: die Mieten"},{id:"die-nebenkosten",type:"word",german:"die Nebenkosten",meaning:"the additional/utility costs",image:"beleg",audio:"tts",introducedInScene:"b1e4s1",tags:["flat-hunt","money","bills"],cefrLevel:"B1",note:"Pluralwort — Strom, Wasser, Heizung"},{id:"der-balkon",type:"word",german:"der Balkon",meaning:"the balcony",image:"balkon",audio:"tts",introducedInScene:"b1e4s1",tags:["flat-hunt","home"],cefrLevel:"B1",note:"der, Plural: die Balkone — Südseite!"},{id:"frisch-renoviert",type:"chunk",german:"Die Wohnung ist frisch renoviert.",meaning:"The flat is freshly renovated.",audio:"tts",introducedInScene:"b1e4s1",tags:["flat-hunt","home"],cefrLevel:"B1"},{id:"wann-kann-ich-einziehen",type:"sentence",german:"Wann kann ich einziehen?",meaning:"When can I move in?",audio:"tts",introducedInScene:"b1e4s1",tags:["flat-hunt","moving","questions"],cefrLevel:"B1",note:"einziehen = ein + ziehen, trennbar"},{id:"der-mietvertrag", ung Süden. Sieben Interessenten, du bist der dritte. Vor dir geht jemand wieder raus."},{type:"meet",itemIds:["die-miete","die-nebenkosten","der-balkon"]},{type:"line",speaker:"maklerin",text:"Fünf hundertzwanzig warm, Nebenkosten inklusive. Die Wohnung ist frisch renoviert — aber ohne Möbel, das ist fair.",translation:"Five hundred twenty warm, utilities included. The flat is freshly renovated — but unfurnished, that's fair."},{type:"meet",itemIds:["frisch-renoviert","der-mietvertrag","wann-kann-ich-einziehen"]},{type:"choice",prompt:"Die Maklerin schaut auf ihre Uhr.",options:[{label:"Wann kann ich einziehen?",line:"Wann kann ich einziehen?"},{label:"Zeigen Sie mir noch den Mietvertrag.",line:"Zeigen Sie mir bitte noch den Mietvertrag."}]},{type:"line",speaker:"maklerin",text:"Erster des Monats. Der Mietvertrag geht heute Abend per E-Mail — lesen Sie ihn in Ruhe, wirklich.",translation:"First of the month. The rental contract goes out by email tonight — read it properly, really."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Wohnungsanzeige (vom Brett gerissen)",text:`2-ZIMMER-WOHNUNG, 54 m², Lindenau

»An andere Interessenten gedacht?
 Ja. Sie waren zu langsam.«`,translation:`2-ROOM FLAT, 54 m², Lindenau

— Balcony (evening sun, tenant joy free of charge)
— freshly renovated, new bathroom
— 3rd floor, no lift ('fitness included')

Base rent €420 + utilities €110
No agent fee. Viewing: immediately.

Wenn wir mehr Zeit hätten, ___ wir in die Altstadt.",meaning:"If we had more time, we'd go to the old town.",audio:"tts",introducedInScene:"b1e5s1",tags:["travel","wishes"],cefrLevel:"B1",cloze:"gingen",alt:["fahren","kämen"],speak:"Wenn wir mehr Zeit hätten, gingen wir in die Altstadt.",note:"Konjunktiv II: hätte / ginge / käme — Träume auf Deutsch"},{id:"uebermorgen",type:"word",german:"übermorgen",meaning:"the day after tomorrow",image:"kalender",audio:"tts",introducedInScene:"b1e5s1",tags:["travel","time"],cefrLevel:"B1",note:"vorgestern – gestern – heute – morgen – übermorgen"},{id:"der-zug-faehrt-um",type:"sentence",german:"Der Zug fährt um 8:42 Uhr.",meaning:"The train leaves at 8:42.",image:"train",audio:"tts",introducedInScene:"b1e5s2",tags:["travel","transport","time"],cefrLevel:"B1"},{id:"der-bahnsteig",type:"word",german:"der Bahnsteig",meaning:"the platform",image:"train",audio:"tts",introducedInScene:"b1e5s2",tags:["travel","transport"],cefrLevel:"B1",note:"der, Plural: die Bahnsteige — ugs. auch: das Gleis"},{id:"der-zug-der-nach-dresden-faehrt",type:"grammar_pattern",german:"Der Zug, ___ nach Dresden fährt, ist verspätet.",meaning:"The train that goes to Dresden is delayed.",audio:"tts",introducedInScene:"b1e5s2",tags:["travel","grammar"],cefrLevel:"B1",cloze:"der",speak:"Der Zug, der nach Dresden fährt, ist verspätet.",note:"Relativsatz: der/die/das — das Wort steht zwei Mal im Satz"},{id:"die-sehenswuerdigkeit",type:"word",german:"die Sehenswürdigkeit",meaning:"the sight / place of interest",image:"schloss",audio:"tts",introducedInScene:"b1e5s2",tags:["travel","city"],cefrLevel:"B1",note:"die, Plural: die Sehenswürdigkeiten — wörtlich: Wert, der sich zu sehen lohnt"},{id:"das-schloss",type:"word",german:"das Schloss",meaning:"the palace / castle",image:"schloss",audio:"tts",introducedInScene:"b1e5s2",tags:["travel","city"],cefrLevel:"B1",note:"das, Plural: die Schlösser — nicht verwechseln mit dem Schloss an der Tür!"},{id:"die-altstadt",type:"word",german:"die Altstadt",meaning:"the old town",image:"haus",audio:"tts",introducedInScene:"b1e5s2",tags:["travel","city"],cefrLevel:"B1",note:"die, Plural: die Altstädte"},{id:"fuehren",type:"sentence",german:"Wo führt diese Straße hin?",meaning:"Where does this street lead?",image:"strasse",audio:"tts",introducedInScene:"b1e5s3",tags:["travel","directions","questions"],cefrLevel:"B1"},{id:"sich-lohnen",type:"chunk",german:"Das lohnt sich!",meaning:"It's worth it!",image:"ziel",audio:"tts",introducedInScene:"b1e5s3",tags:["travel","opinion"],cefrLevel:"B1",note:"sich lohnen — reflexiv, sehr häufig"},{id:"die-aussicht",type:"word",german:"die Aussicht",meaning:"the view / outlook",image:"sonnenuntergang",audio:"tts",introducedInScene:"b1e5s3",tags:["travel"],cefrLevel:"B1",note:"die, Plural: die Aussichten — auch übertragen: „gute Aussichten“"},{id:"der-andenkenladen",type:"word",german:"der Andenkenladen",meaning:"the souvenir shop",image:"tüte",audio:"tts",introducedInScene:"b1e5s3",tags:["travel","shopping"],cefrLevel:"B1",note:"der, Plural: die Andenkenläden"},{id:"entspannt",type:"chunk",german:"Völlig entspannt.",meaning:"Completely relaxed.",audio:"tts",introducedInScene:"b1e5s3",tags:["feelings","smalltalk"],cefrLevel:"B1"},{id:"es-hat-sich-gelohnt",type:"sentence",german:"Es hat sich gelohnt!",meaning:"It was worth it!",audio:"tts",introducedInScene:"b1e5s3",tags:["travel","opinion"],cefrLevel:"B1",note:"Perfekt von sich lohnen — der Abschluss eines jeden guten Tages"}],Ai=[{id:"b1e5s1",episodeId:"b1e5",title:"Freier Samstag",titleEn:"A free Saturday",place:"Café Luise, Dienstrplan",bg:"cafe",contextTags:["travel","friends","planning"],requiredItems:["die-fahrkarte"],introducedItems:["der-ausflug","die-verbindung","die-verspaetung","hin-und-zurueck","wenn-wir-zeit-haetten","uebermorgen"],beats:[{type:"line",speaker:"mei",text:"Sam, schau: Übermorgen ist Samstag und wir haben ALLE frei. Das passiert zweimal im Jahr. Ausflug!",translation:"Sam, look: the day after tomorrow is Saturday and we ALL have the day off. That happens twice a year. Day trip!"},{type:"meet",itemIds:["der-ausflug","uebermorgen","die-verbindung"]},{type:"line",speaker:"tobias",text:"Dresden! Eine Stunde mit dem Zug, die Altstadt ist eine einzige Sehenswürdigkeit. Und der Zug fährt pünktlich. …Meistens.",translation:"Dresden! An hour by train, the old town is one big sight. And the train runs on time. …Mostly."},{type:"meet",itemIds:["die-verspaetung","hin-und-zurueck","wenn-wir-zeit-haetten"]},{type:"choice",prompt:"Mei hat schon die DB-App offen.",options:[{label:"Hin und zurück, bitte — äh, ich mein: Ich buche hin und zurück.",line:"Ich buche gleich hin und zurück für uns drei."},{label:"Wenn wir mehr Zeit hätten, gingen wir bis in die Sächsische Schweiz!",line:"Wenn wir mehr Zeit hätten, würden wir bis in die Sächsische Schweiz fahren!"}]},{type:"line",speaker:"mei",text:"Ehrgeizig! …Ich mag das. Aber erst: Dresden. Der Zug fährt um 8:42. Nicht 8:45. 8:42.",translation:"Ambitious! …I like it. But first: Dresden. The train leaves at 8:42. Not 8:45. 8:42."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"}]},{id:"b1e5s2",episodeId:"b1e5",title:"Gleis 9, 8:42 Uhr",titleEn:"Platform 9, 8:42",place:"Hauptbahnhof, Bahnsteig 9",bg:"bahnhof",contextTags:["travel","transport","friends"],requiredItems:["der-bahnhof","das-gleis","die-verspaetung"],introducedItems:["der-zug-faehrt-um","der-bahnsteig","der-zug-der-nach-dresden-faehrt","die-sehenswuerdigkeit","das-schloss","die-altstadt"],beats:[{type:"narration",text:"Hauptbahnhof, Samstagmorgen. Die Halle ist hell, überall Räder, Rucksäcke und Ausflüglern mit Thermoskannen."},{type:"meet",itemIds:["der-bahnsteig","der-zug-faehrt-um","die-altstadt"]},{type:"line",speaker:"bahnangestellte",text:"Achtung auf Gleis 9: Der Zug, der nach Dresden fährt, hat heute zehn Minuten Verspätung. Wir bitten um Geduld.",translation:"Attention on platform 9: The train going to Dresden is ten minutes delayed today. We ask for your patience."},{type:"meet",itemIds:["der-zug-der-nach-dresden-faehrt","die-sehenswuerdigkeit","das-schloss"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias seufzt dramatisch.",options:[{label:"Zehn Minuten Verspätung? Das ist doch fast pünktlich.",line:"Zehn Minuten Verspätung? Das ist doch fast pünktlich — für deutsche Züge."},{label:"Gut, dass die Aussicht auf Dresden sich lohnt.",line:"Gut, dass sich der Tag lohnt, sobald wir da sind."}]},{type:"line",speaker:"mei",text:"Typisch! Der eine Zug der Republik, der pünktlich sein SOLL … Aber wisst ihr was? Heute ist das egal. Wir haben Kaffee, Croissants und Zeit.",translation:"Typical! The one train in the republic that's SUPPOSED to be on time … But you know what? Doesn't matter today. We have coffee, croissants and time."},{type:"check",count:2,mode:"listen"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Anzeigetafel, Bahnsteig 9",text:`RE 50 Dresden Hbf
ab 8:42 — heute +15 Min. (Bauarbeiten)

Der Zug fährt um — Gleis 9 bleibt, Gleis 7 träumt.

»Reisen mit der Bahn ist eine Übung in Gelassenheit.
 Die Übung beginnt vor dem Ankommen.«

Verspätung ab 20 Minuten: Ausgleich beantragen.
(Frage am Schalter bringt auch ohne Ausgleich Sympathie.)`,translation:`RE 50 Dresden central station
dep. 8:42 — today +15 min (construction work)

The train departs later — platform 9 stays, platform 7 dreams.

'Travelling by train is an exercise in calm.
The exercise begins before the arrival.'

Delays over 20 minutes: claim compensation.
(Asking at the counter earns sympathy even without compensation.)`,itemIds:["der-bahnsteig","der-zug-faehrt-um","der-zug-der-nach-dresden-faehrt"]}]},{id:"b1e5s3",episodeId:"b1e5",title:"Altstadt im Abendlicht",titleEn:"Old town in evening light",place:"Dresden, Brühlsche Terrasse",bg:"amt",contextTags:["travel","friends","opinion"],requiredItems:["die-altstadt","die-sehenswuerdigkeit"],introducedItems:["fuehren","sich-lohnen","die-aussicht","der-andenkenladen","entspannt","es-hat-sich-gelohnt"],beats:[{type:"narration",text:"Nachmittag über der Elbe. Die Brühlsche Terrasse, weißer Stein, goldenes Licht. Mei macht elf Fotos pro Minute. Tobias liest laut aus einem Reiseführer von 2004 vor."},{type:"meet",itemIds:["die-aussicht","sich-lohnen","entspannt"]},{type:"line",speaker:"mei",text:"Sam, dreh dich um — diese Aussicht! …Okay, letzte Runde: Schloss noch, Andenkenladen noch, dann Zug.",translation:"Sam, turn around — this view! …Okay, final round: palace still, souvenir shop still, then train."},{type:"meet",itemIds:["fuehren","der-andenkenladen","es-hat-sich-gelohnt"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Der Zug fährt in einer Stunde. Was macht ihr?",options:[{label:"Wir schauen uns schnell das Schloss an — es lohnt sich!",line:"Wir schauen uns schnell das Schloss an — das lohnt sich bestimmt!"},{label:"Kaffee zuerst. Völlig entspannt.",line:"Kaffee zuerst. Völlig entspannt. Der Zug wartet auf keinen, aber wir auf Kaffee."}]},{type:"line",speaker:"tobias",text:"Beides! Kaffee mit Blick aufs Schloss. …So sind wir: kulturell ambitioniert und koffeinhaltig.",translation:"Both! Coffee with a view of the palace. …That's us: culturally ambitious and caffeinated."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Postkarte aus Dresden (an Tobias)",text:`»Die Aussicht von der Brühlschen Terrasse
ist genau so gut wie alle sagen.
Vielleicht besser. Man sieht die Stadt,
und sie sieht entspannt zurück.

Der Ausflug hat sich gelohnt —
auch mit 15 Minuten Verspätung.
Eigentlich: deshalb.

Bringst du morgen Kaffee mit? — Sam«`,translation:`'The view from the Brühl Terrace
is exactly as good as everyone says.
Maybe better. You see the city,
and it looks back, relaxed.

The trip was worth it —
even with a 15-minute delay.
Actually: because of it.

Are you bringing coffee tomorrow? — Sam'`,itemIds:["die-aussicht","es-hat-sich-gelohnt","entspannt"]},{type:"narration",text:"Im Zug zurück, Sonnenuntergang links, Mei schnarcht fast. Dein erstes deutsches Wochenende, das sich anfühlt wie ein Urlaubsfoto. Es hat sich gelohnt."}]}],Ss={episode:Si,cast:Ii,items:zi,scenes:Ai},Is=Object.freeze(Object.defineProperty({__proto__:null,cast:Ii,default:Ss,episode:Si,items:zi,scenes:Ai},Symbol.toStringTag,{value:"Module"})),Li={id:"b1e6",arcId:"B1",cefrLevel:"B1",title:"Der Verein",titleEn:"The club",blurb:"Jonas' Fußballverein braucht Leute. Du sagst zu — und lernst gewinnen, verlieren und das Wort Unentschieden auf Herz und Nieren.",order:14,sceneIds:["b1e6s1","b1e6s2","b1e6s3"]},Ti=[{id:"jonas",name:"Jonas",role:"Handwerker, Vereinsspieler"},{id:"trainer",name:"Ines",role:"Trainerin"},{id:"tobias",name:"Tobias",role:"Freund, Fan"}],Mi=[{id:"der-verein",type:"word",german:"der Verein",meaning:"the club / association",image:"team",audio:"tts",introducedInScene:"b1e6s1",tags:["sport","friends","hobby"],cefrLevel:"B1",note:"der, Plural: die Vereine — deutsches Sozialleben läuft über Vereine"},{id:"das-spiel",type:"word",german:"das Spiel",meaning:"the game / match",image:"ball",audio:"tts",introducedInScene:"b1e6s1",tags:["sport"],cefrLevel:"B1",note:"das, Plural: die Spiele"},{id:"die-mannschaft",type:"word",german:"die Mannschaft",meaning:"the team",image:"team",audio:"tts",introducedInScene:"b1e6s1",tags:["sport","team"],cefrLevel:"B1",note:"die, Plural: die Mannschaften"},{id:"mitspielen",type:"chunk",german:"Ich würde gern mitspielen.",meaning:"I'd like to play along.",image:"ball",audio:"tts",introducedInScene:"b1e6s1",tags:["sport","wishes"],cefrLevel:"B1",note:"mitspielen = mit + spielen; „würde gern“ = höflicher Wunsch"},{id:"hast-du-bock",type:"grammar_pattern",german:"Hast du Bock, ___?",meaning:"Are you up for ___-ing? (colloquial invitation)",audio:"tts",introducedInScene:"b1e6s1",tags:["sport","invitation","friends"],cefrLevel:"B1",cloze:"mitzumachen",alt:["mitzuspielen","mitzukommen"],speak:"Hast du Bock, mitzumachen?",note:"Bock haben = ugs. Lust haben — unter Freunden völlig normal"},{id:"das-training",type:"word",german:"das Training",meaning:"the practice / training session",image:"ziel",audio:"tts",introducedInScene:"b1e6s1",tags:["sport","time"],cefrLevel:"B1",note:"das, Plural: die Trainings — auch Verb: trainieren"},{id:"der-spieler",type:"word",german:"der Spieler",meaning:"the player (m)",image:"kunde",audio:"tts",introducedInScene:"b1e6s2",tags:["sport","people"],cefrLevel:"B1",note:"der, Plural: die Spieler; weiblich: die Spielerin"},{id:"das-tor",type:"word",german:"das Tor",meaning:"the goal",image:"ziel",audio:"tts",introducedInScene:"b1e6s2",tags:["sport"],cefrLevel:"B1",note:"das, Plural: die Tore — auch: das große Tor (gate)"},{id:"gewinnen",type:"sentence",german:"Wir haben 2:1 gewonnen.",meaning:"We won 2:1.",image:"ball",audio:"tts",introducedInScene:"b1e6s2",tags:["sport"],cefrLevel:"B1",note:"gesprochen: „zwei zu eins“"},{id:"verlieren",type:"chunk",german:"Verlieren gehört dazu.",meaning:"Losing is part of it.",image:"ball",audio:"tts",introducedInScene:"b1e6s2",tags:["sport","opinion"],cefrLevel:"B1"},{id:"das-unentschieden",type:"word",german:"das Unentschieden",meaning:"the draw / tie",image:"ball",audio:"tts",introducedInScene:"b1e6s2",tags:["sport"],cefrLevel:"B1",note:"das, Plural: die Unentschieden — „1:1, Unentschieden“"},{id:"der-einsatz",type:"word",german:"der Einsatz",meaning:"the commitment / effort",image:"ziel",audio:"tts",introducedInScene:"b1e6s2",tags:["sport","work"],cefrLevel:"B1",note:'der, Plural: die Einsätze — „voller Einsatz"'},{id:"anfeuern",type:"sentence",german:"Die Fans haben uns angefeuert.",meaning:"The fans cheered us on.",image:"laut",audio:"tts",introducedInScene:"b1e6s3",tags:["sport","friends"],cefrLevel:"B1",note:"anfeuern = an + feuern, trennbar"},{id:"der-fanblock",type:"word",german:"der Fanblock",meaning:"the supporters' section",image:"fest",audio:"tts",introducedInScene:"b1e6s3",tags:["sport","friends"],cefrLevel:"B1"},{id:"sich-steigern",type:"chunk",german:"Wir können uns steigern.",meaning:"We can improve.",image:"idee",audio:"tts",introducedInScene:"b1e6s3",tags:["sport","opinion"],cefrLevel:"B1",note:"sich steigern — höflichste Art zu sagen: das war mittelprächtig"},{id:"der-fairplay",type:"word",german:"der Fairplay",meaning:"fair play",image:"ruhe",audio:"tts",introducedInScene:"b1e6s3",tags:["sport"],cefrLevel:"B1"},{id:"feiern",type:"sentence",german:"Wir feiern heute bis Mitternacht!",meaning:"We're celebrating until midnight tonight!",image:"fest",audio:"tts",introducedInScene:"b1e6s3",tags:["sport","friends"],cefrLevel:"B1"}],Di=[{id:"b1e6s1",episodeId:"b1e6",title:"Jonas' Angebot",titleEn:"Jonas's offer",place:"Werkstatt, Hinterhof",bg:"werkstatt",contextTags:["sport","friends","hobby"],requiredItems:["das-fahrrad"],introducedItems:["der-verein","das-spiel","die-mannschaft","mitspielen","hast-du-bock","das-training"],beats:[{type:"line",speaker:"jonas",text:"Sam, mein Verein sucht Spieler. Wir sind genau elf — aber eins davon bin ich, und ich bin alt und langsam. …Hast du Bock, mitzumachen?",translation:"Sam, my club needs players. We're exactly eleven — but one of them is me, and I'm old and slow. …Are you up for joining?"},{type:"meet",itemIds:["der-verein","hast-du-bock","die-mannschaft"]},{type:"meet",itemIds:["das-spiel","mitspielen","das-training"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Jonas wartet, Schraubenschlüssel in der Hand.",options:[{label:"Ich würde gern mitspielen. Wann ist Training?",line:"Ich würde gern mitspielen! Wann ist Training?"},{label:"Ehrlich? Ich bin schlecht. …Aber ich bin dabei.",line:"Ehrlich? Ich bin nicht gut. …Aber ich bin dabei."}]},{type:"line",speaker:"jonas",text:"Dienstag und Donnerstag, Sportplatz Lindenau. Schlecht ist kein Problem — Einsatz ist alles. …Und die Trinkflasche bring ich mit.",translation:"Tuesdays and Thursdays, Lindenau pitch. Being bad is no problem — effort is everything. …And I'll bring the water bottle."},{type:"check",count:2,mode:"mixed"},{type:"check",count:2,mode:"recall"}]},{id:"b1e6s2",episodeId:"b1e6",title:"Erstes Training",titleEn:"First practice",place:"Sportplatz Lindenau, 19:00",bg:"park",contextTags:["sport","team","hobby"],requiredItems:["der-verein","das-training"],introducedItems:["der-spieler","das-tor","gewinnen","verlieren","das-unentschieden","der-einsatz"],beats:[{type:"narration",text:"Flutlicht, feiner Rasengeruch, ein Trainerpfeiffen, das alles gleichzeitig beendet und beginnt. Elf Menschen, die einander die Hand geben: Jonas, ein Bäcker, zwei Studenten, ein Polizist …"},{type:"line",speaker:"trainer",text:"Du bist der Neue? Gut. Wir heißen dich willkommen. Voller Einsatz, fair spielen, und: Wir reden miteinander, nicht gegeneinander.",translation:"You're the new one? Good. We welcome you. Full effort, play fair, and: we talk with each other, not against each other."},{type:"meet",itemIds:["der-spieler","das-tor","der-einsatz"]},{type:"check",count:2,mode:"mixed"},{type:"line",speaker:"trainer",text:"Samstag spielen wir gegen Lindenau Süd. Letztes Mal: 0:0, Unentschieden. Dieses Mal wollen wir gewinnen — aber wenn wir verlieren, dann gemeinsam.",translation:"Saturday we play Lindenau South. Last time: 0:0, a draw. This time we want to win — but if we lose, then together."},{type:"meet",itemIds:["gewinnen","verlieren","das-unentschieden"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Sie gibt dir die Pfeife… nein, nur einen Ball.",options:[{label:"Ich gebe vollen Einsatz. Versprochen!",line:"Ich gebe vollen Einsatz. Versprochen!"},{label:"Und wenn ich ein Tor schieße, bin ich Held?",line:"Und wenn ich ein Tor schieße — bin ich dann Held?"}]},{type:"line",speaker:"trainer",text:"Dann bist du heldenhaft müde. …Lauf los!",translation:"Then you'll be heroically tired. …Now run!"},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Spielbericht, Kurzversion",text:`Lindenau II — Markkleeberg V    2:1

Briefkasten, dann Küchentisch",bg:"wohnung",contextTags:["admin","paperwork","identity"],requiredItems:["der-pass","die-anmeldung"],introducedItems:["der-aufenthaltstitel","verlaengern","die-gueltigkeit","die-voraussetzung","der-nachweis","fristgerecht"],beats:[{type:"narration",text:"Ein Umschlag mit Wappen. Dein Herz kennt zwei Modi: normal und Behördenbrief. „Ihr aktueller Aufenthaltstitel endet in drei Monaten. Verlängerung nur fristgerecht.«"},{type:"meet",itemIds:["der-aufenthaltstitel","verlaengern","die-gueltigkeit"]},{type:"line",speaker:"tobias",text:"Drei Monate Frist. Das ist beim Amt quasi eine Ewigkeit. …Aber nur, wenn du JETZT anfängst. Voraussetzungen stehen im Brief, oder?",translation:"Three months' deadline. That's practically an eternity at the office. …But only if you start NOW. The requirements are in the letter, right?"},{type:"meet",itemIds:["die-voraussetzung","der-nachweis","fristgerecht"]},{type:"check",count:2,mode:"mixed"},{type:"choice",prompt:"Tobias: „Und? Was brauchen die?“",options:[{label:"Nachweise: Arbeit, Einkommen, Wohnung. Die üblichen.",line:"Nachweise — Arbeit, Einkommen, Wohnung. Die üblichen Verdächtigen."},{label:"Ich muss fristgerecht einreichen. Also: sofort.",line:"Ich muss fristgerecht einreichen. Also: sofort anfangen."}]},{type:"line",speaker:"tobias",text:"Dann machen wir einen Plan. Ordner, Unterlagen, Termine. Ich bring Kaffee, du bringst Disziplin.",translation:"Then we'll make a plan. Folder, documents, appointments. I'll bring coffee, you bring discipline."},{type:"check",count:2,mode:"recall"},{type:"reading",title:"Amtlicher Brief (Auszug)",text:`Landeshauptstadt Leipzig
Ausländerbehörde

Betreff: Verlängerung Ihres Aufenthaltstitels

Sehr geehrter Herr Jones,
die Gültigkeit Ihres Aufenthaltstitels endet am 30.11.2026.
Eine Verlängerung muss fristgerecht beantragt werden.
Voraussetzungen: Nachweis über Einkommen, Krankenversicherung
und Wohnraum. Es gelten die allgemeinen Bestimmungen.

Mit freundlichen Grüßen
Im Auftrag
(Wolter)`,translation:`City of Leipzig
Immigration Office

Re: Renewal of your residence permit

Dear Mr Jones,
the validity of your residence permit ends on 30 Nov 2026.
A renewal must be applied for before the deadline.
